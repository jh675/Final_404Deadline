<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<title>프로젝트 생성</title>

<!-- Toast UI Grid CSS (스타일 변수 활용) -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

<link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
<link rel="stylesheet" th:href="@{/css/management/project-form.css}" />

</head>
<body>
	<span><strong sec:authentication="principal.name"></strong>님</span>
	<div layout:fragment="content">
		<form th:action="@{/management/projectcreate}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" />

			<div class="prj-form-wrap">
				<h3>프로젝트 생성</h3>
				<div class="prj-form-body">

					<!-- 에러 메시지 -->
					<div th:if="${errorMessage}" th:text="${errorMessage}"
						class="prj-error-msg"></div>

					<!-- 이름 -->
					<div class="form-group">
						<span class="fg-label">이름</span> <input type="text"
							class="form-control" name="prjName" required autocomplete="off"
							th:value="${copyProject != null ? copyProject.prjName : ''}">
					</div>

					<!-- 식별자 -->
					<div class="form-group">
						<span class="fg-label">식별자</span> <input type="text"
							class="form-control" name="prjIdentifier" required
							autocomplete="off">
					</div>

					<!-- 프로젝트 매니저 -->
					<div class="form-group">
						<span class="fg-label">프로젝트 매니저</span> <input type="text"
							id="managerSearch" class="form-control" placeholder="이름 입력..."
							autocomplete="off">
						<p class="manager-hint">※ 입력 시 나오는 아이디를 클릭해주세요</p>
						<input type="hidden" name="managerId" id="realUserId">
						<div id="userDropdown"></div>
					</div>

					<!-- 설명 -->
					<div class="form-group">
						<span class="fg-label">설명</span>
						<textarea class="form-control" name="prjDesc"
							th:text="${copyProject != null ? copyProject.prjDesc : ''}"></textarea>
					</div>

					<!-- 상위 프로젝트 (커스텀 드롭다운) -->
					<div class="form-group custom-select-wrap" id="prjParWrap">
						<span class="fg-label">상위 프로젝트</span>
						<!-- 서버 전송용 hidden input -->
						<input type="hidden" name="prjParId" id="prjParId" value="">
						<!-- 트리거 버튼 -->
						<div class="custom-select-trigger" id="prjParTrigger">
							<span id="prjParLabel">=== 선택 ===</span>
							<svg class="custom-select-arrow"
								xmlns="http://www.w3.org/2000/svg" width="14" height="14"
								viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="2.5" stroke-linecap="round"
								stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
						</div>
						<!-- 드롭다운 패널 -->
						<div class="custom-select-dropdown" id="prjParDropdown">
							<div class="custom-select-item selected" data-value="">===
								선택 ===</div>
							<th:block th:each="p : ${projectList}">
								<div class="custom-select-item"
									th:if="${p.bizNo == #authentication.principal.bizNo
                                  and p.prjStatusCd != '04PROSTAT'
                                  and p.prjStatusCd != '05PROSTAT'}"
									th:data-value="${p.id}" th:text="${p.prjName}">프로젝트명</div>
							</th:block>
						</div>
					</div>

					<!-- 날짜 (Flatpickr) -->
					<div class="date-row">
						<div class="date-field">
							<label>예상 프로젝트 시작일</label>
							<div class="date-input-wrap">
								<input type="text" name="startDate" id="startDate"
									placeholder="날짜 선택" autocomplete="off" readonly data-fp-manual="true">
							</div>
						</div>
						<div class="date-field">
							<label>예상 프로젝트 종료일</label>
							<div class="date-input-wrap">
								<input type="text" name="closedDate" id="closedDate"
									placeholder="날짜 선택" autocomplete="off" readonly data-fp-manual="true">
							</div>
						</div>
					</div>

					<!-- 복사 옵션 (복사 시에만 표시) -->
					<div class="form-group" th:if="${copyProject != null}">
						<hr class="form-divider">
						<span class="fg-label">복사할 항목</span>
						<div class="module-container">
							<label><input type="checkbox" name="copyOptions"
								value="GROUPS"> 그룹</label> <label><input type="checkbox"
								name="copyOptions" value="USERS"> 유저</label> <label><input
								type="checkbox" name="copyOptions" value="ROLES"> 권한</label>
						</div>
					</div>

					<hr class="form-divider">

					<!-- 기본 모듈 -->
					<div class="form-group">
						<span class="fg-label">기본 모듈</span>
						<div class="module-container">
							<label><input type="checkbox" name="moduleList"
								value="GANTT" checked> 간트차트</label> <label><input
								type="checkbox" name="moduleList" value="CALENDAR" checked>
								캘린더</label> <label><input type="checkbox" name="moduleList"
								value="BOARD" checked> 게시판</label> <label><input
								type="checkbox" name="moduleList" value="ISSUE" checked>
								이슈</label> <label><input type="checkbox" name="moduleList"
								value="WIKI" checked> 위키</label> <label><input
								type="checkbox" name="moduleList" value="MILESTONE" checked>
								마일스톤</label> <label><input type="checkbox" name="moduleList"
								value="DOCS" checked> 문서</label> <label><input
								type="checkbox" name="moduleList" value="NOTICE" checked>
								공지사항</label>
						</div>
					</div>

					<!-- 버튼 -->
					<div class="form-actions">
						<button type="submit" class="btn-submit">생성</button>
						<a th:href="@{/management/project}" class="btn-cancel">취소</a>
					</div>
				</div>
				<!-- /prj-form-body -->
			</div>
			<!-- /prj-form-wrap -->
		</form>

		<!-- 스크립트 변경 없음 -->
		<script th:inline="javascript">
    // ── 커스텀 셀렉트 초기화 ────────────────────
    (function() {
        const trigger  = document.getElementById('prjParTrigger');
        const dropdown = document.getElementById('prjParDropdown');
        const hidden   = document.getElementById('prjParId');
        const label    = document.getElementById('prjParLabel');
        if (!trigger) return;

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpen = dropdown.classList.toggle('open');
            trigger.classList.toggle('open', isOpen);
        });

        dropdown.addEventListener('click', function(e) {
            const item = e.target.closest('.custom-select-item');
            if (!item) return;
            // 기존 selected 제거
            dropdown.querySelectorAll('.custom-select-item').forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            hidden.value = item.getAttribute('data-value') || '';
            label.textContent = item.textContent.trim();
            dropdown.classList.remove('open');
            trigger.classList.remove('open');
        });

        document.addEventListener('click', function(e) {
            if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('open');
                trigger.classList.remove('open');
            }
        });
    })();

    const managerSearch = document.getElementById('managerSearch');
    const realUserId = document.getElementById('realUserId');
    const dropdown = document.getElementById('userDropdown');

    const today = new Date().toISOString().split('T')[0];

    // ── Flatpickr 날짜 피커 초기화 ──────────────────
    const commonOpts = {
        locale: 'ko',
        dateFormat: 'Y-m-d',
        allowInput: false,
        disableMobile: true
    };

    const startPicker = flatpickr(document.getElementById('startDate'), {
        ...commonOpts,
        defaultDate: today,
        onChange: function(selectedDates) {
            if (selectedDates[0]) {
                endPicker.set('minDate', selectedDates[0]);
            }
        }
    });

    const endPicker = flatpickr(document.getElementById('closedDate'), {
        ...commonOpts,
        minDate: today
    });

    const copyProject = /*[[${copyProject}]]*/ null;
    if (copyProject && copyProject.userId) {
        realUserId.value = copyProject.userId;
        managerSearch.placeholder = '매니저를 다시 검색해주세요';
    }

    function handleSearch(value) {
        const term = value.trim();
        if (term.length < 1) { dropdown.style.display = 'none'; return; }
        const searchUrl = /*[[@{/management/searchUsers}]]*/ '/management/searchUsers';
        fetch(`${searchUrl}?term=${encodeURIComponent(term)}`)
            .then(response => {
                if (!response.ok) throw new Error('서버 에러 발생');
                return response.json();
            })
            .then(data => {
                dropdown.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(user => {
                        const item = document.createElement('div');
                        item.textContent = `${user.name}/${user.login}`;
                        item.style.padding = '8px 12px';
                        item.style.cursor = 'pointer';
                        item.style.borderBottom = '1px solid #eee';
                        item.onmouseover = () => item.style.backgroundColor = '#f8f9fa';
                        item.onmouseout  = () => item.style.backgroundColor = 'white';
                        item.onclick = function() {
                            managerSearch.value = `${user.login}`;
                            realUserId.value = user.id;
                            dropdown.style.display = 'none';
                        };
                        dropdown.appendChild(item);
                    });
                    dropdown.style.display = 'block';
                } else {
                    dropdown.style.display = 'none';
                }
            })
            .catch(err => console.error('검색 중 오류 발생:', err));
    }

    managerSearch.addEventListener('input', function() { handleSearch(this.value); });
    managerSearch.addEventListener('compositionend', function() { handleSearch(this.value); });

    document.addEventListener('click', function(e) {
        if (!managerSearch.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });
</script>
	</div>
</body>
</html>
