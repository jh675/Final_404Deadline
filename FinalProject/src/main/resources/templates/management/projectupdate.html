<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<title>프로젝트 수정</title>

<!-- Toast UI Grid CSS -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

<link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
<link rel="stylesheet" th:href="@{/css/management/project-form.css}" />

</head>
<body>
	<span><strong sec:authentication="principal.name"></strong>님</span>
	<div layout:fragment="content">
		<form th:action="@{/management/projectupdate}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" /> <input type="hidden" name="id"
				th:value="${editProject.id}" />

			<div class="prj-form-wrap">
				<h3>프로젝트 수정</h3>
				<div class="prj-form-body">

					<!-- 에러 메시지 -->
					<div th:if="${errorMessage}" th:text="${errorMessage}"
						class="prj-error-msg"></div>

					<!-- 이름 -->
					<div class="form-group">
						<span class="fg-label">이름</span> <input type="text"
							class="form-control" name="prjName" required autocomplete="off"
							th:value="${editProject.prjName}">
					</div>

					<!-- 식별자 (disabled) -->
					<div class="form-group">
						<span class="fg-label">식별자</span> <input type="text"
							class="form-control" name="prjIdentifier" required
							autocomplete="off" th:value="${editProject.prjIdentifier}"
							disabled>
					</div>

					<!-- 프로젝트 매니저 -->
					<div class="form-group">
						<span class="fg-label">프로젝트 매니저</span> <input type="text"
							id="managerSearch" class="form-control" placeholder="이름 입력..."
							autocomplete="off">
						<p class="manager-hint">※ 입력 시 나오는 아이디를 클릭해주세요</p>
						<input type="hidden" name="managerId" id="realUserId">
						<div id="userDropdown"></div>
					</div>

					<!-- 설명 -->
					<div class="form-group">
						<span class="fg-label">설명</span>
						<textarea class="form-control" name="prjDesc"
							th:text="${editProject.prjDesc}"></textarea>
					</div>

					<!-- 상위 프로젝트 (커스텀 드롭다운) -->
					<div class="form-group custom-select-wrap" id="prjParWrap">
						<span class="fg-label">상위 프로젝트</span> <input type="hidden"
							name="prjParId" id="prjParId" value="">
						<div class="custom-select-trigger" id="prjParTrigger">
							<span id="prjParLabel">=== 없음 ===</span>
							<svg class="custom-select-arrow"
								xmlns="http://www.w3.org/2000/svg" width="14" height="14"
								viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="2.5" stroke-linecap="round"
								stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
						</div>
						<div class="custom-select-dropdown" id="prjParDropdown">
							<div class="custom-select-item" data-value="">=== 없음 ===</div>
							<th:block th:each="p : ${projectList}">
								<div class="custom-select-item"
									th:if="${p.bizNo == #authentication.principal.bizNo
                                      and p.id != editProject.id
                                      and p.prjStatusCd != '04PROSTAT'
                                      and p.prjStatusCd != '05PROSTAT'
                                      and p.prjHide != 'Y'
                                      and not (p.prjLft > editProject.prjLft and p.prjRgt < editProject.prjRgt)}"
									th:data-value="${p.id}"
									th:classappend="${p.id == editProject.prjParId} ? 'selected' : ''"
									th:text="${p.prjName}">프로젝트명</div>
							</th:block>
						</div>
					</div>

					<!-- 날짜 (Flatpickr) -->
					<div class="date-row">
						<div class="date-field">
							<label>예상 프로젝트 시작일</label>
							<div class="date-input-wrap">
								<input type="text" name="startDate" id="startDate"
									placeholder="날짜 선택" autocomplete="off" readonly data-fp-manual="true">
							</div>
						</div>
						<div class="date-field">
							<label>예상 프로젝트 종료일</label>
							<div class="date-input-wrap">
								<input type="text" name="closedDate" id="closedDate"
									placeholder="날짜 선택" autocomplete="off" readonly data-fp-manual="true">
							</div>
						</div>
					</div>

					<!-- 프로젝트 상태 (커스텀 드롭다운) -->
					<div class="form-group custom-select-wrap"
						style="margin-top: 16px;" id="statusWrap">
						<span class="fg-label">프로젝트 상태</span> <input type="hidden"
							name="prjStatusCd" id="prjStatusCd"
							th:value="${editProject.prjStatusCd}">
						<div class="custom-select-trigger" id="statusTrigger">
							<span id="statusLabel">선택</span>
							<svg class="custom-select-arrow"
								xmlns="http://www.w3.org/2000/svg" width="14" height="14"
								viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="2.5" stroke-linecap="round"
								stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
						</div>
						<div class="custom-select-dropdown" id="statusDropdown">
							<div class="custom-select-item" data-value="01PROSTAT">기획</div>
							<div class="custom-select-item" data-value="02PROSTAT">진행중</div>
							<div class="custom-select-item" data-value="03PROSTAT">검수</div>
							<div class="custom-select-item" data-value="04PROSTAT">완료</div>
							<div class="custom-select-item" data-value="05PROSTAT">중단</div>
						</div>
					</div>

					<hr class="form-divider">

					<!-- 기본 모듈 -->
					<div class="form-group">
						<span class="fg-label">기본 모듈</span>
						<div class="module-container">
							<label><input type="checkbox" name="moduleList"
								value="GANTT"> 간트차트</label> <label><input
								type="checkbox" name="moduleList" value="CALENDAR"> 캘린더</label>
							<label><input type="checkbox" name="moduleList"
								value="BOARD"> 게시판</label> <label><input type="checkbox"
								name="moduleList" value="ISSUE"> 이슈</label> <label><input
								type="checkbox" name="moduleList" value="WIKI"> 위키</label> <label><input
								type="checkbox" name="moduleList" value="MILESTONE">
								마일스톤</label> <label><input type="checkbox" name="moduleList"
								value="DOCS"> 문서</label> <label><input type="checkbox"
								name="moduleList" value="NOTICE"> 공지사항</label>
						</div>
					</div>

					<!-- 버튼 -->
					<div class="form-actions">
						<button type="submit" class="btn btn-success">수정</button>
						<a th:href="@{/management/project}" class="btn-cancel">취소</a>
					</div>

				</div>
				<!-- /prj-form-body -->
			</div>
			<!-- /prj-form-wrap -->
		</form>

		<script th:inline="javascript">
    // ── 커스텀 셀렉트 초기화 (상위 프로젝트) ──
    (function() {
        const trigger  = document.getElementById('prjParTrigger');
        const dropdown = document.getElementById('prjParDropdown');
        const hidden   = document.getElementById('prjParId');
        const label    = document.getElementById('prjParLabel');
        if (!trigger) return;

        // 기존 선택값이 있으면 라벨·hidden 세팅
        const preSelected = dropdown.querySelector('.custom-select-item.selected');
        if (preSelected && preSelected.getAttribute('data-value')) {
            hidden.value   = preSelected.getAttribute('data-value');
            label.textContent = preSelected.textContent.trim();
        }

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpen = dropdown.classList.toggle('open');
            trigger.classList.toggle('open', isOpen);
        });

        dropdown.addEventListener('click', function(e) {
            const item = e.target.closest('.custom-select-item');
            if (!item) return;
            dropdown.querySelectorAll('.custom-select-item').forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            hidden.value       = item.getAttribute('data-value') || '';
            label.textContent  = item.textContent.trim();
            dropdown.classList.remove('open');
            trigger.classList.remove('open');
        });

        document.addEventListener('click', function(e) {
            if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('open');
                trigger.classList.remove('open');
            }
        });
    })();

    // ── 커스텀 셀렉트 초기화 (프로젝트 상태) ──
    (function() {
        const trigger  = document.getElementById('statusTrigger');
        const dropdown = document.getElementById('statusDropdown');
        const hidden   = document.getElementById('prjStatusCd');
        const label    = document.getElementById('statusLabel');
        if (!trigger) return;

        const statusMap = {
            '01PROSTAT': '기획',
            '02PROSTAT': '진행중',
            '03PROSTAT': '검수',
            '04PROSTAT': '완료',
            '05PROSTAT': '중단'
        };

        // 기존 값으로 라벨·selected 초기화
        const currentVal = hidden.value;
        if (currentVal && statusMap[currentVal]) {
            label.textContent = statusMap[currentVal];
            dropdown.querySelectorAll('.custom-select-item').forEach(item => {
                if (item.getAttribute('data-value') === currentVal) {
                    item.classList.add('selected');
                }
            });
        }

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpen = dropdown.classList.toggle('open');
            trigger.classList.toggle('open', isOpen);
        });

        dropdown.addEventListener('click', function(e) {
            const item = e.target.closest('.custom-select-item');
            if (!item) return;
            dropdown.querySelectorAll('.custom-select-item').forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            hidden.value      = item.getAttribute('data-value');
            label.textContent = item.textContent.trim();
            dropdown.classList.remove('open');
            trigger.classList.remove('open');
        });

        document.addEventListener('click', function(e) {
            if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('open');
                trigger.classList.remove('open');
            }
        });
    })();
    const managerSearch = document.getElementById('managerSearch');
    const realUserId    = document.getElementById('realUserId');
    const userDropdown  = document.getElementById('userDropdown');

    // 기존 날짜 값 세팅
    const startDateVal  = /*[[${editProject.startDate  != null ? #dates.format(editProject.startDate,  'yyyy-MM-dd') : ''}]]*/ '';
    const closedDateVal = /*[[${editProject.closedDate != null ? #dates.format(editProject.closedDate, 'yyyy-MM-dd') : ''}]]*/ '';

    // ── Flatpickr 날짜 피커 초기화 ──────────
    const commonOpts = {
        locale: 'ko',
        dateFormat: 'Y-m-d',
        allowInput: false,
        disableMobile: true
    };

    const startPicker = flatpickr(document.getElementById('startDate'), {
        ...commonOpts,
        defaultDate: startDateVal || null,
        onChange: function(selectedDates) {
            if (selectedDates[0]) {
                endPicker.set('minDate', selectedDates[0]);
            }
        }
    });

    const endPicker = flatpickr(document.getElementById('closedDate'), {
        ...commonOpts,
        defaultDate: closedDateVal || null,
        minDate: startDateVal || null
    });

    // 기존 매니저 세팅
    const existingUserId      = /*[[${editProject.userId}]]*/ null;
    const existingManagerName = /*[[${editProject.managerName}]]*/ '';
    if (existingUserId) {
        realUserId.value    = existingUserId;
        managerSearch.value = existingManagerName;
    }

    // 기존 모듈 체크 세팅
    const existingModules = /*[[${editProject.enaId != null ? editProject.enaId : ''}]]*/ '';
    if (existingModules) {
        const moduleArr = existingModules.split(',');
        document.querySelectorAll('input[name="moduleList"]').forEach(cb => {
            cb.checked = moduleArr.includes(cb.value);
        });
    }

    function handleSearch(value) {
        const term = value.trim();
        if (term.length < 1) { userDropdown.style.display = 'none'; return; }
        const searchUrl = /*[[@{/management/searchUsers}]]*/ '/management/searchUsers';
        fetch(`${searchUrl}?term=${encodeURIComponent(term)}`)
            .then(res => { if (!res.ok) throw new Error('서버 에러'); return res.json(); })
            .then(data => {
                userDropdown.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(user => {
                        const item = document.createElement('div');
                        item.textContent = `${user.name}/${user.login}`;
                        item.style.cssText = 'padding:8px 12px;cursor:pointer;border-bottom:1px solid #eee;font-size:13px;';
                        item.onmouseover = () => item.style.backgroundColor = '#e8f4fb';
                        item.onmouseout  = () => item.style.backgroundColor = 'white';
                        item.onclick = function() {
                            managerSearch.value = `${user.login}`;
                            realUserId.value    = user.id;
                            userDropdown.style.display = 'none';
                        };
                        userDropdown.appendChild(item);
                    });
                    userDropdown.style.display = 'block';
                } else {
                    userDropdown.style.display = 'none';
                }
            })
            .catch(err => console.error('검색 중 오류 발생:', err));
    }

    managerSearch.addEventListener('input',          function() { handleSearch(this.value); });
    managerSearch.addEventListener('compositionend', function() { handleSearch(this.value); });

    document.addEventListener('click', function(e) {
        if (!managerSearch.contains(e.target) && !userDropdown.contains(e.target)) {
            userDropdown.style.display = 'none';
        }
    });
</script>
	</div>
</body>
</html>
