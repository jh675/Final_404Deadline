<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

			aria-hidden="true">

				<div class="modal-content">
					<form  method="post" onsubmit="console.log('폼 전송됨')">
					  <input type="hidden"
					           th:name="${_csrf.parameterName}"
					           th:value="${_csrf.token}" />
						<input type="hidden" id="reprojectId" name="id" value="" />
						<div class="form-group">
					        식별자를 입력해주세요 : <input type="text" class="form-control" name="prjIdentifier" required autocomplete="off"
					             >
					    </div>
						<div>
							<button type="submit" formaction="/management/restoration">복구</button>
							<button type="button" class="btn btn-secondary"
									data-bs-dismiss="modal">취소</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
