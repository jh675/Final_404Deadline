<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="reproject">

  <style>
    /* ── 복구 모달 스타일 ── */
    #reproject .modal-content {
      border: none;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(27,135,201,0.15);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    /* 상단 파란 헤더 */
    #reproject .modal-header-bar {
      background: #1b87c9;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #reproject .modal-header-bar h5 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    #reproject .modal-header-bar .btn-close-white {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      opacity: 0.85;
      transition: opacity 0.15s;
    }
    #reproject .modal-header-bar .btn-close-white:hover {
      opacity: 1;
    }

    /* 본문 */
    #reproject .modal-body-area {
      padding: 28px 24px 8px;
      background: #fff;
    }

    /* 복구 아이콘 영역 */
    #reproject .restore-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: #e8f4fb;
      border-radius: 50%;
      margin: 0 auto 16px;
    }

    #reproject .restore-title {
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: #1a2f3f;
      margin-bottom: 8px;
    }
    #reproject .restore-desc {
      text-align: center;
      font-size: 13px;
      color: #6b7c8d;
      margin-bottom: 0;
      line-height: 1.6;
    }

    /* 입력 영역 */
    #reproject .restore-input-wrap {
      margin-top: 20px;
    }
    #reproject .restore-input-wrap label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #4a6070;
      margin-bottom: 5px;
    }
    #reproject .restore-input-wrap input {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid #c9e0ef;
      border-radius: 5px;
      font-size: 13px;
      color: #1a2f3f;
      background: #f5fafd;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #reproject .restore-input-wrap input:focus {
      border-color: #1b87c9;
      box-shadow: 0 0 0 3px rgba(27,135,201,0.13);
      background: #fff;
    }

    /* 구분선 */
    #reproject .modal-divider {
      border: none;
      border-top: 1px solid #cce5f5;
      margin: 20px 0 0;
    }

    /* 푸터 버튼 영역 */
    #reproject .modal-footer-area {
      padding: 16px 24px 20px;
      background: #fff;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    /* 취소 버튼 */
    #reproject .btn-modal-cancel {
      padding: 9px 22px;
      background: #fff;
      color: #4a6070;
      border: 1px solid #c9e0ef;
      border-radius: 5px;
      font-size: 13px;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
    }
    #reproject .btn-modal-cancel:hover {
      background: #e8f4fb;
    }

    /* 복구 버튼 */
    #reproject .btn-modal-restore {
      padding: 9px 26px;
      background: #1b87c9;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    #reproject .btn-modal-restore:hover {
      background: #1570aa;
    }
  </style>

  <div class="modal fade" id="reproject" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
      <div class="modal-content">

        <!-- 파란 헤더 -->
        <div class="modal-header-bar">
          <h5>프로젝트 복구</h5>
          <button type="button" class="btn-close-white" data-bs-dismiss="modal" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                 viewBox="0 0 24 24" fill="none" stroke="#fff"
                 stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- 본문 -->
        <div class="modal-body-area">

          <!-- 복구 아이콘 -->
          <div class="restore-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"
                 viewBox="0 0 24 24" fill="none" stroke="#1b87c9"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </div>

          <p class="restore-title">프로젝트를 복구하겠습니까?</p>
          <p class="restore-desc">
            복구할 프로젝트의 식별자를 입력하면<br>
            해당 프로젝트가 다시 활성화됩니다.
          </p>

          <!-- 식별자 입력 -->
          <div class="restore-input-wrap">
            <label for="prjIdentifierInput">식별자</label>
            <input type="text" id="prjIdentifierInput" placeholder="식별자를 입력해주세요" autocomplete="off">
          </div>

          <hr class="modal-divider">
        </div>

        <!-- 푸터 버튼 -->
        <form method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" id="reprojectId" name="id" value="" />
          <!-- 식별자 값을 폼에 포함시키기 위한 hidden input -->
          <input type="hidden" id="prjIdentifierHidden" name="prjIdentifier" value="" />

          <div class="modal-footer-area">
            <button type="submit" class="btn-modal-restore"
                    formaction="/management/restoration"
                    onclick="document.getElementById('prjIdentifierHidden').value = document.getElementById('prjIdentifierInput').value">
              복구
            </button>
            <button type="button" class="btn-modal-cancel" data-bs-dismiss="modal">취소</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</div>
</body>
</html>
