<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
	<div th:fragment="userInsert">
		<div class="modal fade" id="userInsert" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
				<div class="modal-content">
					<div class="modal-header bg-light">
						<h5 class="modal-title fw-bold" id="modalTitle"></h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal">
						</button>
					</div>
					<div class="modal-body p-4">
						<form id="userForm">
							<input type="hidden" id="userId">
							<div class="row">
								
								<div class="col-lg-8 pe-lg-4">
									
									<h6 class="fw-bold mb-3 text-secondary border-bottom pb-2">계정 정보</h6>
									<div class="row mb-3 align-items-center">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 아이디 <span class="text-danger">*</span></label>
										<div class="col-sm-9">
											<input type="text" id="login" class="form-control">
											<div class="invalid-feedback" id="loginError"></div>
										</div>
									</div>
									<div class="row mb-3 align-items-center">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 회원 권한 <span class="text-danger">*</span></label>
										<div class="col-sm-9">
											<select id="adminCd" class="form-select">
												<option value="">선택</option>
												<option value="01ROLE">시스템관리자</option>
												<option value="02ROLE">기업관리자</option>
												<option value="03ROLE">사원</option>
											</select>
											<div class="invalid-feedback">회원 권한을 선택해주세요.</div>
										</div>
									</div>
									<div class="row mb-3 align-items-center" id="bizNoArea">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 소속기업 <span class="text-danger">*</span></label>
										<div class="col-sm-9">
											<select id="bizNo" class="form-select">
												<option value="">선택</option>
											</select>
											<div class="invalid-feedback" id="bizNoError">소속기업을 선택해주세요.</div>
										</div>
									</div>
									<div class="row mb-4 align-items-center">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 기업번호 </label>
										<div class="col-sm-9">
											<input type="text" id="bizNoView" class="form-control bg-light" disabled>
										</div>
									</div>

									<h6 class="fw-bold mb-3 text-secondary border-bottom pb-2 mt-4">개인 정보</h6>
									<div class="row mb-3 align-items-center">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 이름 <span class="text-danger">*</span></label>
										<div class="col-sm-9">
											<input type="text" id="name" class="form-control">
											<div class="invalid-feedback">이름을 입력해주세요.</div>
										</div>
									</div>
									<div class="row mb-3 align-items-center">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 이메일 </label>
										<div class="col-sm-9">
											<input type="email" id="email" class="form-control">
										</div>
									</div>
									<div class="row mb-3 align-items-center">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 전화번호 </label>
										<div class="col-sm-9">
											<input type="text" id="tel" class="form-control" maxlength="13">
										</div>
									</div>
									<div class="row mb-3 align-items-center">
									    <label class="col-sm-3 col-form-label fw-semibold text-muted"> 고용일자 <span class="text-danger">*</span></label>
									    <div class="col-sm-9">
									        <input type="date" id="hireDate" class="form-control">
									        <div class="invalid-feedback">고용일자를 선택해주세요.</div>
									    </div>
									</div>
									<div class="row mb-4 align-items-center">
									    <label class="col-sm-3 col-form-label fw-semibold text-muted"> 성별 </label>
									    <div class="col-sm-9">
									        <div class="d-flex gap-4 mt-1">
									            <div class="form-check">
									                <input class="form-check-input" type="radio" name="genderCd" id="male" value="01GENDER" checked>
									                <label class="form-check-label" for="male">남</label>
									            </div>
									            <div class="form-check">
									                <input class="form-check-input" type="radio" name="genderCd" id="female" value="02GENDER">
									                <label class="form-check-label" for="female">여</label>
									            </div>
									        </div>
									    </div>
									</div>

									<h6 class="fw-bold mb-3 text-secondary border-bottom pb-2 mt-4">상태 및 권한</h6>
									<div class="row mb-3 align-items-center" id="prjManagerArea">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 역할 </label>
										<div class="col-sm-9">
											<div class="d-flex gap-4 mt-1">
												<div class="form-check">
													<input class="form-check-input" type="radio" name="prjManagerCd" id="teamMember" value="02ACTIVE" checked>
													<label class="form-check-label" for="teamMember">사원</label>
												</div>
												<div class="form-check">
													<input class="form-check-input" type="radio" name="prjManagerCd" id="projectManager" value="01ACTIVE">
													<label class="form-check-label" for="projectManager">프로젝트 매니저</label>
												</div>
											</div>
										</div>
									</div>
									<div class="row mb-3 align-items-center">
										<label class="col-sm-3 col-form-label fw-semibold text-muted"> 계정상태 </label>
										<div class="col-sm-9">
											<div class="d-flex gap-4 mt-1">
												<div class="form-check">
													<input class="form-check-input" type="radio" name="statusCd" id="statusActive" value="01ACTIVE" checked>
													<label class="form-check-label" for="statusActive">활성</label>
												</div>
												<div class="form-check">
													<input class="form-check-input" type="radio" name="statusCd" id="statusInactive" value="02ACTIVE">
													<label class="form-check-label" for="statusInactive">비활성</label>
												</div>
											</div>
										</div>
									</div>
									<div class="row mb-3 align-items-center">
									    <label class="col-sm-3 col-form-label fw-semibold text-muted"> 비밀번호 초기화 </label>
									    <div class="col-sm-9">
									        <div class="d-flex gap-4 mt-1">
									            <div class="form-check">
									                <input class="form-check-input" type="radio" name="mcpCd" id="mcpActive" value="01ACTIVE" checked>
									                <label class="form-check-label" for="mcpActive">필요</label>
									            </div>
									            <div class="form-check">
									                <input class="form-check-input" type="radio" name="mcpCd" id="mcpInactive" value="02ACTIVE">
									                <label class="form-check-label" for="mcpInactive">불필요</label>
									            </div>
									        </div>
									    </div>
									</div>
								</div>

								<div class="col-lg-4 border-start ps-lg-4">
									<h6 class="fw-bold mb-3 text-secondary text-center">프로필 이미지</h6>
									<div class="border rounded p-3 text-center bg-white shadow-sm">
										<div class="border d-flex justify-content-center align-items-center mb-3 overflow-hidden rounded"
        									 style="width: 150px; aspect-ratio: 3/4; margin: 0 auto; background-color: #f8f9fa;">
											<img id="profilePreview" src="" class="d-none" style="width: 100%; height: 100%; object-fit: cover;">
											<span id="emptyImageText" class="text-muted small">이미지 없음</span>
										</div>
										<div class="small text-muted mb-3">사진을 가로 3 : 세로 4 비율로<br>조정할 수 있습니다.</div>
										<div id="wrongImageSize" class="small text-danger"></div>
										<input type="file" id="profileImage" class="form-control d-none" accept="image/*">
										<div class="d-flex justify-content-center gap-2">
											<button type="button" class="btn btn-sm btn-outline-success px-3" id="uploadBtn">등록</button>
											<button type="button" class="btn btn-sm btn-outline-danger px-3" id="deleteImageBtn">삭제</button>
										</div>
									</div>
								</div>
							</div>
							
							<div class="modal fade" id="cropModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
							    <div class="modal-dialog modal-dialog-centered">
							        <div class="modal-content border-0 shadow">
							            <div class="modal-header bg-light">
							                <h6 class="modal-title fw-bold">프로필 이미지 편집</h6>
							                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
							            </div>
							            <div class="modal-body text-center p-0">
							                <div style="max-height: 450px; overflow: hidden; background-color: #212529;">
							                    <img id="imageToCrop" src="" style="max-width: 100%; display: block;">
							                </div>
							            </div>
							            <div class="modal-footer justify-content-center border-0">
							                <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">취소</button>
							                <button type="button" id="applyCropBtn" class="btn btn-success px-4">적용</button>
							            </div>
							        </div>
							    </div>
							</div>
						</form>
					</div>
					
					<div class="modal-footer flex-column bg-light">
					    <div class="w-100 text-center mb-1">
					        <span id="generalFeedback" class="small fw-bold"></span>
					    </div>
					    <div class="w-100 text-center mb-2">
					      <span class="small text-muted" style="letter-spacing: -0.5px;">
					          <span class="text-primary fw-bold">↓</span> 스크롤을 내려 모든 항목을 확인해 주세요.
					      </span>
					  	</div>
					    <div class="d-flex justify-content-center w-100 gap-2">
					        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">닫기</button>
					        <button type="button" id="saveBtn" class="btn btn-success px-5 fw-bold">등록</button>
					    </div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
