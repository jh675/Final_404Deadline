<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/sysAdminLayout}">
<head>
<title>회원관리(sysadmin)</title>
	<link rel="stylesheet"
		href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
	<link rel="stylesheet"
		href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
</head>
<body>
	<div layout:fragment="content">
		<h3 class="mb-3">회원 목록</h3>
		<div>
			<form id="searchForm" th:action="@{/admin/userList}" method="get"
				th:object="${filter01}" class="d-flex align-items-end gap-3 mb-3">

				<div>
					<label for="categoryCd" class="form-label">계정 권한</label> 
					<select id="categoryCd" 
							th:field="*{adminCd}" 
							class="form-select">

						<option value="">미선택</option>
						<option value="01ROLE">시스템관리자</option>
						<option value="02ROLE">기업관리자</option>
						<option value="03ROLE">사원</option>
					</select>
				</div>

				<div>
					<button type="submit" class="btn btn-primary">검색</button>
				</div>
			</form>
		</div>

		<div class="d-flex justify-content-end mb-3">
			<button type="button" class="btn btn-primary" data-bs-toggle="modal"
				data-bs-target="#resetPwModal"
				onclick="location.href='/admin/userManage/insert'">회원 등록</button>
		</div>
		<div id="grid"></div>

		<div th:replace="~{login/modal/resetPw :: resetPwModal}"></div>

		<script th:inline="javascript">
			const userData = /*[[${userList}]]*/[];
		</script>

		<!-- pagination JS가 grid JS보다 먼저 -->
		<script
			src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
		<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
		<script th:src="@{/js/management/userManage.js}"></script>
	</div>
</body>
</html>
