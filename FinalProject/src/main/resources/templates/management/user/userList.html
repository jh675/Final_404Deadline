<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">
<head>
<title>회원관리(sysadmin)</title>
<link rel="stylesheet"
	href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<link rel="stylesheet" th:href="@{/css/common/containerSize.css}">
</head>
<body>
	<div layout:fragment="content">
	<div id="wrapper">
		<h3 class="mb-3">회원 목록</h3>
		<div>
			<form id="searchForm"
			      th:action="@{/admin/userList}"
			      method="get"
			      th:object="${filter01}"
			      class="d-flex align-items-end gap-3 mb-3 flex-wrap">

			    <!-- 권한 -->
			    <div>
			        <label for="categoryCd" class="form-label">계정 권한</label>
			
			        <select id="categoryCd"
			                th:field="*{adminCd}"
			                class="form-select">
			            <option value="">전체</option>
			            <option value="01ROLE">시스템관리자</option>
			            <option value="02ROLE">기업관리자</option>
			            <option value="03ROLE">사원</option>
			        </select>
			    </div>
			
			    <!-- 검색 종류 -->
			    <div>
			        <label for="searchType" class="form-label">검색 조건</label>
			        <select id="searchType"
			                th:field="*{searchType}"
			                class="form-select">
			            <option value="">선택</option>
			            <option value="login">아이디</option>
			            <option value="compNm">소속기업</option>
			            <option value="name">이름</option>
			            <option value="email">이메일</option>
			        </select>
			    </div>
			    <!-- 검색어 -->
			    <div>
			        <label for="keyword" class="form-label">검색어</label>
			        <input type="text"
			               id="keyword"
			               th:field="*{keyword}"
			               class="form-control"
			               placeholder="검색어 입력">
			    </div>
			    <!-- 버튼 -->
			    <div class="d-flex gap-2">
				    <button type="submit"
				            class="btn btn-primary">
				        검색
				    </button>
				    <a th:href="@{/admin/userList}"
				       class="btn btn-outline-secondary">
				        초기화
				    </a>
				</div>
				<div id="searchWarning"
				     class="text-danger small mt-1 d-none">
					검색 조건을 선택해주세요.
				</div>
			</form>
		</div>
		
		<div id="grid"></div>
		<div class="d-flex justify-content-between align-items-center mb-2">
		    <div class="d-flex align-items-center gap-2">
		        <button type="button" class="btn btn-sm btn-outline-secondary" id="toggleBulkModeBtn">일괄작업</button>
		
		        <div id="bulkControls" class="d-none d-flex align-items-center gap-2">
		            <select id="bulkActionType" class="form-select form-select-sm" style="width: auto;">
		                <option value="">일괄 작업 선택</option>
		                <option value="status_01ACTIVE">계정 활성화</option>
		                <option value="status_02ACTIVE">계정 비활성화</option>
		                <option value="prjManager_01ACTIVE">PM 역할 부여</option>
		                <option value="prjManager_02ACTIVE">PM 역할 해제</option>
		            </select>
		            <button type="button" class="btn btn-sm btn-secondary" id="bulkApplyBtn">적용</button>
		            <button type="button" class="btn btn-sm btn-light" id="cancelBulkModeBtn">취소</button>
		        </div>
		    </div>
		    
		    <div>
		        <button type="button" class="btn btn-sm btn-primary" onclick="openInsertModal()">회원 등록</button>
		    </div>
		</div>

		</div>
		<div th:replace="~{management/modal/userInsert :: userInsert}"></div>

		<script th:inline="javascript">
			const userData = /*[[${userList}]]*/[];
		</script>

		<!-- pagination JS가 grid JS보다 먼저 -->
		<script
			src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
		<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
		<script th:src="@{/js/management/userManage.js}"></script>
	</div>
</body>
</html>
