<!doctype html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
   	/* 테이블 바디의 번호를 초기화 */
	.numbered-table tbody {
	    counter-reset: myIndex 0;
	}
	
	/* 화면에 보이는(display되지 않는) 행만 숫자를 증가시키도록 수정 */
	.numbered-table tbody tr:not([style*="display: none"]) {
	    counter-increment: myIndex;
	}
	
	/* 3. td 안의 가상 요소에 숫자를 표시 */
	.row-index::before {
	    content: counter(myIndex);
	}
	
	.table td.text-center {
	    vertical-align: middle; /* 높이 중앙 맞춤 */
	}
	
	.btn-group {
	    display: inline-flex;
	    justify-content: center;
	}
    </style>
  </head>
  <body>
    <h2>프로젝트</h2>
    <a th:if="${#authentication.principal.adminCd == '기업관리자'}"
       href="/management/projectcreate" class="btn btn-primary">프로젝트 생성</a>
    
    <!-- 1. id와 onchange 이벤트 추가 -->
    <select id="projectStatusSelect" onchange="filterProjects()">
	    <option value="progress">진행중인 프로젝트</option>
	    <option value="complete">종료된 프로젝트</option>
	</select>
	
    <div style="width: 100%; overflow-x: auto; padding-right: 200px;">
    <table border="1" class="table numbered-table" style="width: calc(100% - 200px);">
      <thead>
        <tr>
          <th>No</th>
          <th>프로젝트명</th>
          <th>식별자</th>
          <th th:if="${#authentication.principal.adminCd != null and #authentication.principal.adminCd == '시스템관리자'}">회사명</th>
          <th>설명</th>
          <th>생성일</th>
          <th>종료일</th>
          <th class="text-center" th:if="${#authentication.principal.adminCd == '시스템관리자' or #authentication.principal.adminCd == '기업관리자'}">설정</th>
        </tr>
      </thead>
      <tbody>
        <!-- 2. data-status 속성을 추가하여 closedDate 여부에 따라 progress 또는 complete 값을 가짐 -->
        <tr th:each="pro : ${projectinfo.list}"
            th:if="${#authentication.principal.adminCd == '시스템관리자' or pro.bizNo == #authentication.principal.bizNo}"
            th:data-status="${pro.closedDate == null ? 'progress' : 'complete'}">
          <td class="row-index"></td>
          <td th:text="${pro.prjName}"></td>
          <td th:text="${pro.prjIdentifier}"></td>
          <td th:if="${#authentication.principal.adminCd != null and #authentication.principal.adminCd == '시스템관리자'}">
			    <th:block th:each="c : ${companyList}">
			        <span th:if="${pro.bizNo == c.bizNo}" th:text="${c.companyName}"></span>
			    </th:block>
			</td>
              
          
          <td th:text="${pro.prjDesc}"></td>
          <td
            th:text="${pro.createdOn != null ? #dates.format(pro.createdOn,'yyyy-MM-dd') : '-'}"
          ></td>
          <td th:text="${pro.closedDate != null ? #dates.format(pro.closedDate,'yyyy-MM-dd') : '진행중'}"></td>
          <td class="text-center" th:if="${#authentication.principal.adminCd == '시스템관리자' or #authentication.principal.adminCd == '기업관리자'}">
           <div class="btn-group dropend">
              <button
				  type="button"
				  class="btn btn-sm btn-outline-secondary"
				  data-bs-toggle="dropdown"
				  data-bs-boundary="viewport" 
				  aria-expanded="false"
				>
				  ...
				</button>
              <ul class="dropdown-menu shadow-sm">
                <li><a class="dropdown-item" href="#">설정</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><button type="button" class="dropdown-item text-danger"
                	href="#" data-bs-toggle="modal" data-bs-target="#deleteproject"
                	th:data-id="${pro.id}" onclick="openDeleteModal(this)"></button></li>
              </ul>
            </div>
            <div th:replace="~{management/modal/deleteprojectmodal :: deleteproject}"></div>
          </td>
        </tr>
      </tbody>
    </table>
	</div>
	
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    
    <!-- 3. 필터링을 위한 자바스크립트 코드 추가 -->
    <script>
      function filterProjects() {
        const selectValue = document.getElementById("projectStatusSelect").value;
        const rows = document.querySelectorAll(".numbered-table tbody tr");

        rows.forEach(row => {
          const status = row.getAttribute("data-status");
          if (status === selectValue) {
            row.style.display = ""; // 보이기
          } else {
            row.style.display = "none"; // 숨기기
          }
        });
      }

      // 페이지가 처음 로드될 때도 필터링을 한 번 실행해줍니다. (기본값: 진행중인 프로젝트)
      window.addEventListener("DOMContentLoaded", filterProjects);
      
      
      function openDeleteModal(button) {
    	    // 1. 버튼에 저장된 프로젝트 ID(숫자)를 가져옵니다.
    	    const projectId = button.getAttribute("data-id");
    	    
    	    // 2. 모달창 내부에 있는 하나뿐인 input 태그를 찾습니다.
    	    const hiddenInput = document.getElementById("projectHide");
    	    
    	    if (hiddenInput) {
    	        // 3. 비어있던 value에 실제 ID 숫자를 대입합니다.
    	        hiddenInput.value = projectId;
    	        console.log("선택된 프로젝트 ID 주입 완료 : ", projectId);
    	    }
    	}
    </script>
  </body>
</html>
