<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/compAdminLayout}">

<head>
<meta charset="UTF-8">
<title>기업정보등록/수정</title>

<!-- Bootstrap 5 -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
.text-danger-custom {
	color: #ff4d4f;
	margin-left: 3px;
}

.form-control::placeholder {
	color: #ced4da;
	font-size: 0.9rem;
}

.form-switch .form-check-input:checked {
	background-color: #495057;
	border-color: #495057;
}
</style>
</head>

<body>

	<div layout:fragment="content"
		class="container py-5 d-flex flex-column align-items-center"
		style="max-width: 500px;">

		<!-- 제목 -->
		<h2 class="text-center mb-5 fw-bold" style="letter-spacing: -0.5px;">

			<span th:if="${company == null}">기업 정보 등록</span> <span
				th:if="${company != null}">기업 정보 수정</span>

		</h2>

		<!-- form -->
		<form th:action="@{/company/form}" method="post" class="w-100">

			<!-- 사업자번호 -->
			<div class="row align-items-center mb-3">

				<label class="col-3 text-end fw-semibold pe-3"> 사업자번호 <span
					class="text-danger-custom">*</span>
				</label>

				<div class="col-9">

					<input type="text" name="bizNo" class="form-control"
						placeholder="사업자번호를 입력해 주세요."
						th:value="${company != null ? company.bizNo : ''}"
						th:readonly="${company != null}">

				</div>

			</div>

			<!-- 기업명 -->
			<div class="row align-items-center mb-3">

				<label class="col-3 text-end fw-semibold pe-3"> 기업명 <span
					class="text-danger-custom">*</span>
				</label>

				<div class="col-9">

					<input type="text" name="companyName" class="form-control"
						placeholder="기업명을 입력해 주세요."
						th:value="${company != null ? company.companyName : ''}">

				</div>

			</div>

			<!-- 전화번호 -->
			<div class="row align-items-center mb-3">

				<label class="col-3 text-end fw-semibold pe-3"> 전화번호 <span
					class="text-danger-custom">*</span>
				</label>

				<div class="col-9">

					<input type="text" name="tel" class="form-control"
						placeholder="전화번호를 입력해 주세요."
						th:value="${company != null ? company.tel : ''}">

				</div>

			</div>

			<!-- 주소 -->
			<div class="row align-items-center mb-3">

				<label class="col-3 text-end fw-semibold pe-3"> 주소 <span
					class="text-danger-custom">*</span>
				</label>

				<div class="col-9">

					<input type="text" name="address" class="form-control"
						placeholder="주소를 입력해 주세요."
						th:value="${company != null ? company.address : ''}">

				</div>

			</div>

			<!-- 관리자ID -->
			<div class="row align-items-center mb-3">

				<label class="col-3 text-end fw-semibold pe-3"> 관리자ID <span
					class="text-danger-custom">*</span></label>

				<div class="col-9">

					<input type="text" class="form-control"
						th:value="${company != null ? company.login : ''}" readonly>

				</div>

			</div>

			<!-- 이메일 -->
			<div class="row align-items-center mb-3">

				<label class="col-3 text-end fw-semibold pe-3"> 이메일 <span
					class="text-danger-custom">*</span></label>

				<div class="col-9">

					<input type="text" class="form-control"
						th:value="${company != null ? company.email : ''}" readonly>

				</div>

			</div>

			<!-- 활성여부 -->
			<div class="row align-items-center mb-5">

				<label class="col-3 text-end fw-semibold pe-3"> 활성여부 <span
					class="text-danger-custom">*</span>
				</label>

				<div class="col-9 d-flex align-items-center gap-4">

					<!-- 사용 -->
					<div class="form-check">

						<input class="form-check-input" type="radio" name="isActiveCd"
							id="activeY" value="01ACTIVE"
							th:checked="${company == null or company.isActiveCd == '01ACTIVE'}">

						<label class="form-check-label" for="activeY"> 활성 </label>

					</div>

					<!-- 미사용 -->
					<div class="form-check">

						<input class="form-check-input" type="radio" name="isActiveCd"
							id="activeN" value="02INACTIVE"
							th:checked="${company != null and company.isActiveCd == '02ACTIVE'}">

						<label class="form-check-label" for="activeN"> 비활성 </label>

					</div>

				</div>

			</div>

			<!-- 버튼 -->
			<div class="d-flex justify-content-center gap-3 mt-4">

				<!-- 등록 -->
				<button type="submit"
					class="btn btn-outline-dark px-5 py-2 fw-semibold"
					style="min-width: 130px; border-radius: 6px;"
					th:if="${company == null}">등록</button>

				<!-- 수정 -->
				<button type="submit"
					class="btn btn-secondary px-5 py-2 fw-semibold"
					style="min-width: 130px; border-radius: 6px; background-color: #6c757d; border: none;"
					th:if="${company != null}">수정</button>

			</div>

		</form>

	</div>

</body>
</html>
