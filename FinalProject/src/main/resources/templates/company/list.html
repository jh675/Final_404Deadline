<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<title>기업정보</title>
<th:block layout:fragment="head-content">
	<link rel="stylesheet"
		href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
	<link rel="stylesheet"
		href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
	<link rel="stylesheet" th:href="@{/css/common/containerSize.css}">
	<script
		src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
	<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
	<script th:src="@{/js/common/gridTheme.js}"></script>
	<style>
#grid {
	width: 100%;
	min-height: 200px;
}

.tui-grid-cell.company-biz-no-cell {
	cursor: pointer;
	color: #0d6efd;
	font-weight: 500;
}

.tui-grid-cell.company-biz-no-cell:hover {
	text-decoration: underline;
}
</style>
</th:block>
</head>

<body>
	<div layout:fragment="content">
		<div id="wrapper">
			<h2>기업리스트</h2>
			<div class="d-flex justify-content-end mb-3">
				<form class="d-flex align-items-center gap-2" th:action="@{/admin/company/list}"
					method="get" th:object="${company}">

					<select class="form-select" th:field="*{isActiveCd}" style="width: 160px;">
						<option value="">활성여부 전체</option>
						<th:block th:each="code : ${activeCodeList}">
							<option th:value="${code.sCode}" th:text="${code.name}"></option>
						</th:block>
					</select>

					<select class="form-select" th:field="*{searchType}" style="width: 150px;">
						<option value="">모두</option>
						<option value="bizNo">사업자번호</option>
						<option value="companyName">기업명</option>
						<option value="tel">전화번호</option>
						<option value="address">주소</option>
					</select>

					<input class="form-control" type="search" th:field="*{keyword}"
						placeholder="검색" style="width: 200px;">

					<button class="btn btn-success text-nowrap" type="submit">검색</button>
				</form>
			</div>

			<div id="grid"></div>


			<div class="d-flex justify-content-end my-3">
				<button class="btn btn-primary" data-bs-toggle="modal"
					data-bs-target="#registerModal">등록</button>
			</div>

			<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

			<script th:inline="javascript">
	const activeCodeList = /*[[${activeCodeList}]]*/ [];
	const activeCodeMap = (activeCodeList || []).reduce((acc, code) => {
		if (!code || !code.sCode) return acc;
		acc[code.sCode] = code.name;
		return acc;
	}, {});

	function getCsrfHeaders() {
		const headerElement = document.querySelector('meta[name="_csrf_header"]');
		const tokenElement = document.querySelector('meta[name="_csrf"]');
		const csrfHeader = headerElement ? headerElement.getAttribute('content') : 'X-CSRF-TOKEN';
		const csrfToken = tokenElement ? tokenElement.getAttribute('content') : '';
		return { [csrfHeader]: csrfToken };
	}

	function fetchCompanyDetail(bizNo) {
		return fetch('/admin/company/detail?bizNo=' + encodeURIComponent(bizNo), {
			method: 'POST',
			headers: getCsrfHeaders()
		}).then(response => {
			if (!response.ok) throw new Error('서버 응답 실패 (상태코드: ' + response.status + ')');
			return response.json();
		});
	}

	function fillEditModal(data) {
		document.getElementById('edit-bizNo').value = data.bizNo || '';
		document.getElementById('edit-companyName').value = data.companyName || '';
		document.getElementById('edit-tel').value = data.tel || '';
		document.getElementById('edit-address').value = data.address || '';
		document.getElementById('edit-login').value = data.login || '';
		document.getElementById('edit-email').value = data.email || '';
		if (data.isActiveCd === '01ACTIVE') {
			document.getElementById('editActiveY').checked = true;
		} else {
			document.getElementById('editActiveN').checked = true;
		}
	}

	function fillViewModal(data) {
		document.getElementById('view-bizNo').textContent = data.bizNo || '';
		document.getElementById('view-companyName').textContent = data.companyName || '';
		document.getElementById('view-tel').textContent = data.tel || '-';
		document.getElementById('view-address').textContent = data.address || '-';
		document.getElementById('view-login').textContent = data.login || '-';
		document.getElementById('view-email').textContent = data.email || '-';
		document.getElementById('view-isActive').textContent =
			activeCodeMap[data.isActiveCd] || data.isActiveCd || '-';
		document.getElementById('view-createdOn').textContent = data.createdOn
			? dayjs(data.createdOn).format('YYYY.MM.DD')
			: '-';
	}

	const gridColumns = [
		{ header: '사업자번호', name: 'bizNo', align: 'center', sortable: true,
			className: 'company-biz-no-cell'
		},
		{ header: '기업명', name: 'companyName', align: 'center', sortable: true },
		{ header: '전화번호', name: 'tel', align: 'center', sortable: true },
		{ header: '주소', name: 'address', minWidth: 250, align: 'left', sortable: true },
		{ header: '관리자ID', name: 'login', align: 'center', sortable: true },
		{ header: '이메일', name: 'email', align: 'center', sortable: true },
		{ header: '활성여부', name: 'isActiveCd', align: 'center', sortable: true,
			formatter: ({ value }) => activeCodeMap[value] || value || ''
		},
		{ header: '생성일', name: 'createdOn', align: 'center', sortable: true,
			formatter: ({ value }) => {
				if (!value) return '';
				return dayjs(value).format('YYYY.MM.DD');
			}
		},
		{ header: '수정', name: 'edit', align: 'center', sortable: false,
			formatter: () => '<button type="button" class="btn btn-secondary btn-sm">수정</button>'
		}
	];

	let grid;

	function bindGridClick() {
		grid.on('click', (ev) => {
		if (ev.rowKey == null) return;

		// 사업자번호 클릭 → 상세보기 모달
		if (ev.columnName === 'bizNo') {
			const row = grid.getRow(ev.rowKey);
			const bizNo = row && row.bizNo;
			if (!bizNo) return;

			const viewModalEl = document.getElementById('companyViewModal');
			if (!viewModalEl) {
				alert('상세보기 모달을 찾을 수 없습니다. 페이지를 새로고침해 주세요.');
				return;
			}

			fetchCompanyDetail(bizNo)
				.then(data => {
					fillViewModal(data);
					bootstrap.Modal.getOrCreateInstance(viewModalEl).show();
				})
				.catch(err => {
					console.error('기업 상세조회 실패:', err);
					alert('데이터를 불러오지 못했습니다.');
				});
			return;
		}

		// 수정 버튼 클릭 → 수정 모달
		if (ev.columnName === 'edit') {
			const isButton = ev.nativeEvent && ev.nativeEvent.target.closest('button');
			if (!isButton) return;

			const row = grid.getRow(ev.rowKey);
			if (!row || !row.bizNo) return;

			const editModalEl = document.getElementById('editModal');
			if (!editModalEl) {
				alert('수정 모달을 찾을 수 없습니다. 페이지를 새로고침해 주세요.');
				return;
			}

			fetchCompanyDetail(row.bizNo)
				.then(data => {
					fillEditModal(data);
					bootstrap.Modal.getOrCreateInstance(editModalEl).show();
				})
				.catch(err => {
					console.error('기업 상세조회 실패:', err);
					alert('데이터를 불러오지 못했습니다.');
				});
		}
		});
	}

	const listDataUrl = /*[[@{/admin/company/list-data}]]*/ '/admin/company/list-data';
	fetch(listDataUrl + window.location.search)
		.then(response => {
			if (!response.ok) throw new Error('목록 조회 실패: ' + response.status);
			return response.json();
		})
		.then(companyData => {
			const gridEl = document.getElementById('grid');
			if (!gridEl) return;

			grid = new tui.Grid({
				el: gridEl,
				autowidth: true,
				scrollX: false,
				scrollY: false,
				bodyHeight: 'auto',
				rowHeight: 40,
				columnOptions: { resizable: true },
				minBodyHeight: 100,
				data: Array.isArray(companyData) ? companyData : [],
				columns: gridColumns,
				rowHeaders: ['rowNum'],
				pageOptions: { useClient: true, perPage: 10 }
			});
			bindGridClick();
		})
		.catch(err => {
			console.error('기업 목록 로드 실패:', err);
			alert('기업 목록을 불러오지 못했습니다. 서버 로그를 확인해 주세요.');
		});

</script>
		</div>
		<div th:replace="~{company/modal/register :: registerModal}"></div>
		<div th:replace="~{company/modal/edit :: editModal}"></div>
		<div th:replace="~{company/modal/view :: companyViewModal}"></div>
	</div>
	

	
</body>
</html>
