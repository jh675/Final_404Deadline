<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<div th:fragment="editModal">

	<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">

				<!-- 폼 전송 주소는 아까 개설한 모달 통합 저장 주소입니다. -->
				<form th:action="@{/admin/company/save}" method="post">
					<input type="hidden" th:name="${_csrf.parameterName}"
						th:value="${_csrf.token}">

					<div class="modal-header">
						<h5 class="modal-title">기업 정보 수정</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>

					<div class="modal-body">

						<!-- 사업자번호 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label text-end fw-semibold">사업자번호
								</label>
							<div class="col-sm-9">
								<!-- ⭕ [수정] name을 'bizNo'로 명확히 타겟팅합니다. -->
								<input type="text" name="bizNo" id="edit-bizNo"
									class="form-control-plaintext fw-bold px-2" readonly>
							</div>
						</div>

						<!-- 기업명 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label text-end fw-semibold">기업명
								</label>
							<div class="col-sm-9">
								<!-- ⭕ [수정] name을 'companyName'으로 매핑합니다. -->
								<input type="text" name="companyName" id="edit-companyName"
									class="form-control" required>
							</div>
						</div>

						<!-- 전화번호 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label text-end fw-semibold">전화번호</label>
							<div class="col-sm-9">
								<!-- ⭕ [수정] name을 'tel'로 매핑합니다. -->
								<input type="text" name="tel" id="edit-tel" class="form-control"
									maxlength="11">
							</div>
						</div>

						<!-- 주소 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label text-end fw-semibold">주소</label>
							<div class="col-sm-9">
								<!-- ⭕ [수정] name을 'address'로 매핑합니다. -->
								<input type="text" name="address" id="edit-address"
									class="form-control">
							</div>
						</div>

						<!-- 관리자ID -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label text-end fw-semibold">관리자ID
								</label>
							<div class="col-sm-9">
								<!-- ⭕ [수정] name을 'login'으로 매핑합니다. -->
								<input type="text" name="login" id="edit-login"
									class="form-control-plaintext fw-bold px-2" readonly>
							</div>
						</div>

						<!-- 이메일 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label text-end fw-semibold">이메일
								</label>
							<div class="col-sm-9">
								<!-- ⭕ [수정] name을 'email'로 매핑합니다. -->
								<input type="text" name="email" id="edit-email"
									class="form-control" required>
							</div>
						</div>

						<!-- 활성여부 -->
						<div class="mb-3 row">
							<label class="col-sm-3 col-form-label text-end fw-semibold">활성여부
								</label>
							<div class="col-sm-9 d-flex align-items-center gap-3">
								<div class="form-check">
									<!-- ⭕ [수정] name을 'isActiveCd'로 매핑합니다. -->
									<input class="form-check-input" type="radio" name="isActiveCd"
										id="editActiveY" value="01ACTIVE"> <label
										class="form-check-label" for="editActiveY">활성</label>
								</div>
								<div class="form-check">
									<!-- ⭕ [수정] name을 'isActiveCd'로 매핑합니다. -->
									<input class="form-check-input" type="radio" name="isActiveCd"
										id="editActiveN" value="02ACTIVE"> <label
										class="form-check-label" for="editActiveN">비활성</label>
								</div>
							</div>
						</div>

					</div>

					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">취소</button>
						<button type="submit" class="btn btn-primary">수정</button>
					</div>

				</form>

			</div>
		</div>
	</div>

</div>

</html>
