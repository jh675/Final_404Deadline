<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<title>내 프로젝트</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>
<body>
	<div layout:fragment="content">
	
		<div class="container py-4">
			<h4 class="fw-bold mb-4">내 참가 프로젝트</h4>
			<!-- 프로젝트 목록 테이블 -->
			<div class="table-responsive">
				<table
					class="table table-bordered table-hover text-center align-middle"
					style="font-size: 14px;">
					<thead class="table-dark">
						<tr>
							<th>프로젝트명</th>
							<th>설명</th>
							<th>진행상태</th>
							<th>시작일</th>
							<th>종료일</th>
							<th>생성일</th>
							<th>참가인원</th>
							<th>상세페이지</th>
						</tr>
					</thead>
					<tbody>
						<!-- 목록이 없을 때 -->
						<tr th:if="${#lists.isEmpty(list)}">
							<td colspan="5" class="text-muted py-4">참가중인 프로젝트가 없습니다.</td>
						</tr>
						<!-- 목록 -->
						<tr th:each="p : ${list}" class="project-card">
							<td th:text="${p.prjName}"></td>
							<td class="text-truncate" style="max-width: 200px;"
								th:text="${p.prjDesc != null ? p.prjDesc : '-'}"></td>
							<td></td>
							<td></td>
							<td
								th:text="${p.closedDate != null ? #dates.format(p.closedDate, 'yyyy-MM-dd') : '-'}"></td>
							<td
								th:text="${p.createdOn != null ? #dates.format(p.createdOn, 'yyyy-MM-dd') : '-'}"></td>
							<td></td>
							<td><a th:href="@{/project/{id}(id=${p.id})}"
								class="btn btn-outline-primary btn-sm">이동하기</a></td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>
</body>
</html>
