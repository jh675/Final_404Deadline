<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<title>마이페이지</title>

<!-- Toast UI -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />
<script
	src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>

<!-- DHTMLX Gantt -->
<link rel="stylesheet"
	href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css">
<script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>

<!-- container 공통 크기 -->
<link rel="stylesheet" th:href="@{/css/common/containerSize.css}">

<style>
.status-new.gantt_task_line {
	background-color: #3498db;
	border-color: #2980b9;
}

.status-progress.gantt_task_line {
	background-color: #e67e22;
	border-color: #d35400;
}

.status-review.gantt_task_line {
	background-color: #9b59b6;
	border-color: #8e44ad;
}

.status-done.gantt_task_line {
	background-color: #27ae60;
	border-color: #1e8449;
}
</style>



</head>
<body>
	<div layout:fragment="content">
		<div id="wrapper">
			<!-- ===== 개인 영역 ===== -->
			<h2 class="mb-2">마이페이지</h2>
			<div class="card mb-4 p-3">
				<div class="d-flex justify-content-between align-items-center">
					<div class="d-flex align-items-center gap-4">

						<!-- 이름 / 역할 / 상태 -->
						<div class="d-flex align-items-center gap-2 flex-wrap">
							<strong class="fs-5" sec:authentication="principal.name"></strong>
							<span class="badge bg-secondary"
								sec:authentication="principal.adminNm"></span> <span
								class="badge bg-warning text-dark"
								sec:authentication="principal.statusNm"></span> <span
								class="text-muted small ms-2"> 📞 <span
								th:text="${#authentication.principal.tel}"></span>
							</span> <span class="text-muted small ms-2"> 📧 <span
								th:text="${#authentication.principal.email}"></span>
							</span>

							<!-- 구분선 -->
							<div class="vr mx-2"></div>

							<!-- 소속 프로젝트 -->
							<span th:if="${#lists.isEmpty(projectList)}" class="text-muted small">참여 중인 프로젝트 없음</span>
							<!-- 최대 3개만 표시 -->
							<span th:each="p, iterStat : ${projectList}"
							      th:if="${iterStat.index < 3}"
							      class="badge bg-primary me-1"
							      th:text="${p.prjName}"></span>
							
							<!-- 3개 초과 시 +N개 표시 -->
							<span th:if="${#lists.size(projectList) > 3}"
							      class="badge bg-secondary me-1"
							      th:text="'+ ' + (${#lists.size(projectList)} - 3) + '개'"></span>
						</div>

					</div>

					<!-- 정보 수정 버튼 -->
					<button type="button" class="btn btn-outline-secondary btn-sm"
						data-bs-toggle="modal" data-bs-target="#mypageEditModal">
						정보 수정</button>
				</div>
			</div>
			<!-- ===== 캘린더 / 간트차트 영역 ===== -->
			<h5 class="fw-bold mb-3">일정</h5>
			<div class="card mb-4 p-3">

				<!-- 탭 버튼 -->
				<ul class="nav nav-tabs mb-3" id="scheduleTabs">
					<li class="nav-item">
						<button class="nav-link active" data-bs-toggle="tab"
							data-bs-target="#calendarTab">캘린더</button>
					</li>
					<li class="nav-item">
						<button class="nav-link" data-bs-toggle="tab"
							data-bs-target="#ganttTab">간트차트</button>
					</li>
				</ul>

				<!-- 탭 내용 -->
				<div class="tab-content">

					<!-- 캘린더 탭 -->
					<div class="tab-pane fade show active" id="calendarTab">
						<div class="d-flex align-items-center gap-2 mb-3">
							<div class="btn-group">
								<button type="button"
									class="btn btn-outline-primary btn-sm view-btn active"
									onclick="showSchedule('week')">이번주</button>
								<button type="button"
									class="btn btn-outline-primary btn-sm view-btn"
									onclick="showSchedule('day')">오늘</button>
							</div>
							<select class="form-select form-select-sm ms-auto"
								id="mypageTypeCd" onchange="filterMypageEvents()"
								style="width: 100px;">
								<option value="">전체</option>
								<option value="01CALTYPE">개인일정</option>
								<option value="02CALTYPE">그룹일정</option>
								<option value="03CALTYPE">회사일정</option>
							</select>
						</div>
						<!-- 일정 목록 렌더링 영역 -->
						<div id="scheduleList"></div>
					</div>

					<!-- 간트차트 탭 -->
					<div class="tab-pane fade" id="ganttTab">
						<!-- 색상 범례 -->
						<div class="d-flex align-items-center gap-3 mb-2"
							style="font-size: 13px;">
							<span class="fw-bold">이슈상태 :</span> <span><span
								style="display: inline-block; width: 12px; height: 12px; background: #3498db; margin-right: 4px; border-radius: 2px; vertical-align: middle;"></span>신규</span>
							<span><span
								style="display: inline-block; width: 12px; height: 12px; background: #e67e22; margin-right: 4px; border-radius: 2px; vertical-align: middle;"></span>진행중</span>
							<span><span
								style="display: inline-block; width: 12px; height: 12px; background: #9b59b6; margin-right: 4px; border-radius: 2px; vertical-align: middle;"></span>검토</span>
							<span><span
								style="display: inline-block; width: 12px; height: 12px; background: #27ae60; margin-right: 4px; border-radius: 2px; vertical-align: middle;"></span>완료</span>
						</div>
						<!-- 간트차트 렌더링 영역 -->
						<div id="mypageGantt" style="width: 100%; height: 400px;"></div>
					</div>

				</div>
			</div>

			<hr class="my-4">

			<!-- ===== 참여 프로젝트 영역 ===== -->
			<h5 class="fw-bold mb-3">참여 프로젝트</h5>
			<div class="table-responsive mb-4">
				<table
					class="table table-bordered table-hover text-center align-middle"
					style="font-size: 14px;">
					<thead class="table-dark">
						<tr>
							<th>프로젝트명</th>
							<th>설명</th>
							<th>진행상태</th>
							<th>시작일</th>
							<th>종료일</th>
							<th>생성일</th>
							<th>상세페이지</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(projectList)}">
							<td colspan="8" class="text-muted py-4">참가중인 프로젝트가 없습니다.</td>
						</tr>
						<tr th:each="p : ${projectList}">
							<td th:text="${p.prjName}"></td>
							<!-- 프로젝트 이름 -->
							<td class="text-truncate" style="max-width: 200px;"
								th:text="${p.prjDesc != null ? p.prjDesc : '-'}"></td>
							<!-- 프로젝트 설명 -->
							<td th:text="${p.prjStatusCd != null ? p.prjStatusCd : '-'}"></td>
							<!-- 프로젝트 진행상태 -->
							<td
								th:text="${p.startDate != null ? #dates.format(p.startDate, 'yyyy-MM-dd') : '-'}"></td>
							<!-- 프로젝트 시작일 -->
							<td
								th:text="${p.closedDate != null ? #dates.format(p.closedDate, 'yyyy-MM-dd') : '-'}"></td>
							<!-- 프로젝트 종료일 -->
							<td
								th:text="${p.createdOn != null ? #dates.format(p.createdOn, 'yyyy-MM-dd') : '-'}"></td>
							<!-- 프로젝트 생성일 -->
							<td><a th:href="@{/project/{id}(id=${p.id})}"
								class="btn btn-outline-primary btn-sm">이동하기</a></td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- ===== 담당 이슈 영역 ===== -->
			<h5 class="fw-bold mb-3">내 담당 이슈</h5>
			<div class="card mb-4 p-3">
				<div class="table-responsive">
					<table
						class="table table-bordered table-hover text-center align-middle"
						style="font-size: 14px;">
						<thead class="table-dark">
							<tr>
								<th>이슈명</th>
								<th>상태</th>
								<th>우선순위</th>
								<th>시작예정일</th>
								<th>마감예정일</th>
								<th>진척도</th>
							</tr>
						</thead>
						<tbody id="myIssueList">
							<tr>
								<td colspan="6" class="text-muted py-3">로딩 중...</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<!-- ===== 전체 이슈 영역 (추후 작업) ===== -->
			<h5 class="fw-bold mb-3">이번주 마감 전체이슈</h5>
			<div class="table-responsive">
				<table
					class="table table-bordered table-hover text-center align-middle"
					style="font-size: 14px;">
					<thead class="table-dark">
						<tr>
							<th>이슈명</th>
							<th>담당자</th>
							<th>상태</th>
							<th>우선순위</th>
							<th>마감예정일</th>
							<th>진척도</th>
						</tr>
					</thead>
					<tbody id="weekWeeklyIssueList">
						<tr>
							<td colspan="6" class="text-muted py-3">로딩 중...</td>
						</tr>
					</tbody>
				</table>
			</div>

		<!-- ===== 내 정보 수정 모달 ===== -->
		<div th:replace="~{mypage/modal/myPageUserEdit :: mypageEditModal}"></div></div>
		<script th:src="@{/js/mypage/mypage.js}"></script>
		<script>
	
	// =============================================
	// 1. 마이페이지 캘린더 (조회 전용)
	// =============================================

	let allEvents = [];

	function loadcalendarEvents(typeCd = '') {
	    fetch(`/calendar/listJson?typeCd=${typeCd}`, {
	        headers: { 'X-Requested-With': 'XMLHttpRequest' }
	    })
	    .then(res => res.json())
	    .then(data => {
	        if (!Array.isArray(data)) return;

	        const year = new Date().getFullYear();
	        fetch(`/holiday/list?year=${year}`, {
	            headers: { 'X-Requested-With': 'XMLHttpRequest' }
	        })
	        .then(res => res.json())
	        .then(holidays => {
	            const holidayEvents = holidays.map(h => ({
	                calStart: `${h.year}-${String(h.month).padStart(2,'0')}-${String(h.day).padStart(2,'0')}T00:00:00`,
	                calEnd:   `${h.year}-${String(h.month).padStart(2,'0')}-${String(h.day).padStart(2,'0')}T23:59:00`,
	                calText: h.holidayName,
	                place: '',
	                typeCd: 'holiday'
	            }));

	            // 전체 선택 시 공휴일 보이는 설정 
	            if (typeCd === '') {
	                allEvents = [...data, ...holidayEvents]; // 전체: 공휴일 포함
	            } else {
	                allEvents = [...data]; // 특정 유형 선택: 공휴일 제외
	            }
	            showSchedule('week');
	        });
	    });
	}

	function showSchedule(mode) {
	    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
	    const btnIndex = mode === 'week' ? 0 : 1;
	    document.querySelectorAll('.view-btn')[btnIndex].classList.add('active');

	    const today = new Date();
	    today.setHours(0, 0, 0, 0);

	    const dayOfWeek = today.getDay();
	    const weekStart = new Date(today);
	    weekStart.setDate(today.getDate() - dayOfWeek);
	    const weekEnd = new Date(weekStart);
	    weekEnd.setDate(weekStart.getDate() + 6);
	    weekEnd.setHours(23, 59, 59, 999);

	    let filtered = [];
	    if (mode === 'day') {
	        filtered = allEvents.filter(item => {
	            const start = new Date(item.calStart);
	            return start.getFullYear() === today.getFullYear() &&
	                   start.getMonth() === today.getMonth() &&
	                   start.getDate() === today.getDate();
	        });
	    } else {
	        filtered = allEvents.filter(item => {
	            const start = new Date(item.calStart);
	            return start >= weekStart && start <= weekEnd;
	        });
	    }

	    filtered.sort((a, b) => new Date(a.calStart) - new Date(b.calStart));
	    renderScheduleList(filtered, mode);
	}

	function renderScheduleList(events, mode) {
	    const container = document.getElementById('scheduleList');

	    if (events.length === 0) {
	        container.innerHTML = `
	            <div class="text-center text-muted py-5">
	                <div style="font-size: 40px;">📅</div>
	                <p class="mt-2">${mode === 'day' ? '오늘' : '이번주'} 일정이 없습니다.</p>
	            </div>`;
	        return;
	    }

	    const grouped = {};
	    events.forEach(item => {
	        const startObj = new Date(item.calStart);
	        const dateKey = `${startObj.getFullYear()}-${String(startObj.getMonth()+1).padStart(2,'0')}-${String(startObj.getDate()).padStart(2,'0')}`;
	        if (!grouped[dateKey]) grouped[dateKey] = [];
	        grouped[dateKey].push(item);
	    });

	    let html = '';
	    Object.keys(grouped).forEach((dateKey, groupIndex) => {
	        const dateObj = new Date(dateKey);
	        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
	        const isToday = dateObj.getFullYear() === new Date().getFullYear() &&
	                        dateObj.getMonth() === new Date().getMonth() &&
	                        dateObj.getDate() === new Date().getDate();
	        const dateLabel = `${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일 (${dayNames[dateObj.getDay()]})`;
	        const items = grouped[dateKey];
	        const showMore = items.length > 3;

	        html += `
	            <div class="mb-3">
	                <div class="fw-bold mb-2" style="font-size:14px; color: ${isToday ? '#185FA5' : '#333'};">
	                    ${isToday ? '📌 ' : ''}${dateLabel}
	                    ${isToday ? '<span class="badge bg-primary ms-1" style="font-size:11px;">오늘</span>' : ''}
	                </div>`;

	        items.forEach((item, idx) => {
	            const startObj2 = new Date(item.calStart);
	            const endObj2 = new Date(item.calEnd);
	            const startTime = `${String(startObj2.getHours()).padStart(2,'0')}:${String(startObj2.getMinutes()).padStart(2,'0')}`;
	            const endTime = `${String(endObj2.getHours()).padStart(2,'0')}:${String(endObj2.getMinutes()).padStart(2,'0')}`;

	            let typeLabel = '개인';
	            let typeColor = '#ff6b6b';
	            if (item.typeCd === 'holiday') { typeLabel = '공휴일'; typeColor = '#ff4d4d'; }
	            else if (item.typeCd === '01CALTYPE') { typeLabel = '개인'; typeColor = '#ff6b6b'; }
	            else if (item.typeCd === '02CALTYPE') { typeLabel = '그룹'; typeColor = '#51cf66'; }
	            else if (item.typeCd === '03CALTYPE') { typeLabel = '회사'; typeColor = '#339af0'; }

	            // 3개 초과분은 숨김 처리
	            const hideClass = (showMore && idx >= 3) ? `class="extra-item-${groupIndex}" style="display:none;"` : '';

	            html += `
	                <div ${hideClass}>
	                    <div class="p-2 mb-1 rounded" style="background:#f8f9fa; border-left: 4px solid ${typeColor};">
	                        <div class="d-flex align-items-center gap-2">
	                            <span style="font-size: 13px; color: #555;">🕐 ${startTime} ~ ${endTime}</span>
	                            <span class="fw-bold" style="font-size: 14px;">${item.calText || '제목없음'}</span>
	                            <span class="badge ms-1" style="background-color:${typeColor}; font-size:11px;">${typeLabel}</span>
	                        </div>
	                        ${item.place ? `<div class="text-muted ms-4" style="font-size: 12px;">📍 ${item.place}</div>` : ''}
	                    </div>
	                </div>`;
	        });

	        // 더보기 버튼
	        if (showMore) {
	            html += `
	                <button class="btn btn-outline-secondary btn-sm mt-1"
	                    onclick="toggleMore(${groupIndex}, ${items.length - 3}, this)">
	                    ▼ 더보기 (${items.length - 3}개)
	                </button>`;
	        }

	        html += `</div>`;
	    });

	    container.innerHTML = html;
	}

	// 더보기 토글 함수
	function toggleMore(groupIndex, count, btn) {
	    const extras = document.querySelectorAll(`.extra-item-${groupIndex}`);
	    const isHidden = extras[0].style.display === 'none';

	    extras.forEach(el => el.style.display = isHidden ? 'block' : 'none');
	    btn.textContent = isHidden ? `▲ 접기` : `▼ 더보기 (${count}개)`;
	}


	

	    //=========================================================================================
	    // 2. 간트차트 불러오기
		//=========================================================================================	
		
	    let mypageGantt = false;
	    
			function loadMypageGantt() {
			if(mypageGantt)	return; 
			
			
			gantt.config.columns = [
				    { name: "text",        label: "이슈명",   width: 200, tree: true },
			        { name: "status_cd",   label: "이슈상태", width: 80 },
			        { name: "assignee",    label: "담당자",   width: 80 },
			        { name: "due_date",    label: "마감예정일",   width: 100 },
			        { name: "progress",    label: "진척도",   width: 60, template: task => task.progress_text }
			];
			
			 	gantt.config.row_height = 30;
			    gantt.config.bar_height = 18;
			    gantt.config.min_column_width = 30;
			    gantt.config.grid_width = 550;
			    gantt.config.readonly = true;

			    gantt.config.scales = [
			        { unit: "month", step: 1, format: "%Y-%m" },
			        { unit: "day",   step: 1, format: "%d" }
			    ];
			    
			    gantt.templates.task_class = function(start, end, task) {
					switch(task.status_cd) {

					
						case "신규":  return "status-new";
						case "진행중": return "status-progress";
						case "검토":  return "status-review";
						case "완료":  return "status-done";
						default:     return "";
					} 
			    
			    }
			    
		gantt.init("mypageGantt");
		mypageGantt = true;
		
		// 내 담당 이슈 가져오기 
		
		fetch(`/mypage/gantt/list`)
		 .then(res => res.json())
		 .then(data => {
				allTasks = data
				.filter(issue => {
					const startVal = issue.startDate || issue.estStartDate;
					if(!startVal || !issue.dueDate) return false;
					const start = new Date(startVal);
					const end = new Date(issue.dueDate);
					
					if(isNaN(start.getTime())|| isNaN(end.getTime())) return false;
					if(start.getFullYear() === 1970) return false; 
					if(end <= start) return false;
					if(issue.statusCd == '완료') return false;
					return true;
				
				})
				.map(issue => ({
				    text:           issue.subject, // 이슈명 
				    status_cd:      issue.statusCd, // 이슈상태 
				    priority_cd:    issue.priorityCd, // 우선순위 
				    assignee:       issue.memName, // 담당자 
				    est_start_date: formatDate(issue.estStartDate), // 시작예정일(template용)
				    due_date:       formatDate(issue.dueDate), // 마감예정일
				    start_date:     formatDate(issue.startDate || issue.estStartDate), // 시작일(막대용)
				    start_date_str: formatDate(issue.startDate), // 시작일
				    end_date:       formatDate(issue.closedDate || issue.dueDate), // 막대 종료(완료일 또는 마감예정일)
				    end_date_str:   formatDate(issue.closedDate), // 완료일
				    progress:       (issue.doneRatio ?? 0) / 100, // 진척도 (막대 그래프용)
				    progress_text:  (issue.doneRatio ?? 0) + "%" // 진척도 (막대 그래프용)
				}));	
				gantt.clearAll();
				gantt.parse({data: allTasks});
			
		 	});

	};
	
	// 날짜 포멧데이터 
	 function formatDate(dateStr) {
			const day = new Date(dateStr);
			const dd = String(day.getDate()).padStart(2, '0'); 
			const month = String (day.getMonth() +1) .padStart(2, '0');
			const years = day.getFullYear();
			return `${day.getFullYear()}-${month}-${dd}`;			
		  } 
	
	// 간트차트 탭 클릭 시 불러오기 
	 document.querySelector('[data-bs-target="#ganttTab"]')
			 .addEventListener('click', function() {
			  setTimeout(loadMypageGantt, 300);
	 });
	
	function filterMypageEvents() {
		const typeCd = document.getElementById('mypageTypeCd').value;
		loadcalendarEvents(typeCd);
	}

		//=========================================================================================
	    // 3. 내 담당 이슈 불러오기
		//=========================================================================================	

			function loadMyIssues() {
				fetch(`/mypage/gantt/list`)
				.then(res => res.json())
				.then(data => {
					const tbody = document.getElementById('myIssueList');
					if(!Array.isArray(data) || data.length === 0) {
						tbody.innerHTML = '<tr><td colspan="6" class="text-muted py-3">담당 이슈가 없습니다.</td></tr>';
						return;
					}
					
					const statusColor = {
					   '신규': 'primary', '진행중': 'warning',
					   '검토': 'secondary', '완료': 'success'
					};
					
					 const priorityColor = {
					            '최상': 'danger', '상': 'warning',
					            '중': 'info', '하': 'secondary'
					        };

					        tbody.innerHTML = data
					        
					        .filter(issue => issue.statusCd != '완료')
					        .map(issue => {
					            const estStart = issue.estStartDate ? new Date(issue.estStartDate).toLocaleDateString('ko-KR') : '-';
					            const dueDate = issue.dueDate ? new Date(issue.dueDate).toLocaleDateString('ko-KR') : '-';
					            const status = issue.statusCd || '-';
					            const priority = issue.priorityCd || '-';
					            const doneRatio = issue.doneRatio ?? 0;

					            return `
					                <tr>
					                    <td class="text-start">${issue.subject || '-'}</td>
					                    <td><span class="badge bg-${statusColor[status] || 'secondary'}">${status}</span></td>
					                    <td><span class="badge bg-${priorityColor[priority] || 'secondary'}">${priority}</span></td>
					                    <td>${estStart}</td>
					                    <td>${dueDate}</td>
					                    <td>
					                        <div class="progress" style="height: 16px;">
					                            <div class="progress-bar" style="width:${doneRatio}%">${doneRatio}%</div>
					                        </div>
					                    </td>
					                </tr>`;
					        }).join('');
				})
		
		}
		
			document.addEventListener('DOMContentLoaded', function() {
			    loadcalendarEvents();
			    loadMyIssues(); 
			    loadAllIssues();
			});
			
			
			//=========================================================================================
			// 4. 이번주 마감 전체 이슈 불러오기
			//=========================================================================================
			function loadAllIssues() {
			    const tbody = document.getElementById('weekWeeklyIssueList'); // ← getElementById 오타 수정
			    tbody.innerHTML = '<tr><td colspan="6" class="text-muted py-3">로딩 중...</td></tr>';

			    const statusColor = { '신규': 'primary', '진행중': 'warning', '검토': 'secondary', '완료': 'success' };
			    const priorityColor = { '최상': 'danger', '상': 'warning', '중': 'info', '하': 'secondary' };

			    fetch('/mypage/issue/week', {
			        headers: { 'X-Requested-With': 'XMLHttpRequest' }
			    })
			    .then(res => res.json())
			    .then(data => {
			        if (!Array.isArray(data) || data.length === 0) {
			            tbody.innerHTML = '<tr><td colspan="6" class="text-muted py-3">이번주 마감 이슈가 없습니다.</td></tr>';
			            return;
			        }

			        tbody.innerHTML = data.map(issue => {
			            const status = issue.statusCd || '-';
			            const priority = issue.priorityCd || '-';
			            const doneRatio = issue.doneRatio ?? 0;

			            return `
			                <tr>
			                    <td class="text-start">${issue.subject || '-'}</td>
			                    <td>${issue.memName || '-'}</td>
			                    <td><span class="badge bg-${statusColor[status] || 'secondary'}">${status}</span></td>
			                    <td><span class="badge bg-${priorityColor[priority] || 'secondary'}">${priority}</span></td>
			                    <td>${issue.dueDate || '-'}</td>
			                    <td>
			                        <div class="progress" style="height: 16px;">
			                            <div class="progress-bar" style="width:${doneRatio}%">${doneRatio}%</div>
			                        </div>
			                    </td>
			                </tr>`;
			        }).join('');
			    })
			    .catch(() => {
			        tbody.innerHTML = '<tr><td colspan="6" class="text-danger py-3">데이터 로딩 실패</td></tr>';
			    });
			}
			
	</script>
	</div>
	
</body>
</html>
