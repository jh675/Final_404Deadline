<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<title>마이페이지</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Toast UI -->
<link rel="stylesheet"
	href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />
<script
	src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>

<!-- DHTMLX Gantt -->
<link rel="stylesheet"
	href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css">
<script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>


<style>
.status-new.gantt_task_line {
	background-color: #3498db;
	border-color: #2980b9;
}

.status-progress.gantt_task_line {
	background-color: #e67e22;
	border-color: #d35400;
}

.status-review.gantt_task_line {
	background-color: #9b59b6;
	border-color: #8e44ad;
}

.status-done.gantt_task_line {
	background-color: #27ae60;
	border-color: #1e8449;
}
</style>



</head>
<body>
	<div layout:fragment="content">
		<div class="container py-4">

			<!-- ===== 개인 영역 ===== -->
			<h4 class="fw-bold mb-4">마이페이지</h4>
			<div class="card mb-4 p-3">
				<div class="d-flex justify-content-between align-items-center">
					<div class="d-flex align-items-center gap-4">

						<!-- 이름 / 역할 / 상태 -->
						<div class="d-flex align-items-center gap-2 flex-wrap">
							<strong class="fs-5" sec:authentication="principal.name"></strong>
							<span class="badge bg-secondary"
								sec:authentication="principal.adminNm"></span> <span
								class="badge bg-warning text-dark"
								sec:authentication="principal.statusNm"></span> <span
								class="text-muted small ms-2"> 📞 <span
								th:text="${#authentication.principal.tel}"></span>
							</span> <span class="text-muted small ms-2"> 📧 <span
								th:text="${#authentication.principal.email}"></span>
							</span>

							<!-- 구분선 -->
							<div class="vr mx-2"></div>

							<!-- 소속 프로젝트 -->
							<span class="text-muted small fw-bold me-1">소속 프로젝트</span> <span
								th:if="${#lists.isEmpty(projectList)}" class="text-muted small">참여
								중인 프로젝트 없음</span> <span th:each="p : ${projectList}"
								class="badge bg-primary me-1" th:text="${p.prjName}"></span>
						</div>

					</div>

					<!-- 정보 수정 버튼 -->
					<button type="button" class="btn btn-outline-secondary btn-sm"
						data-bs-toggle="modal" data-bs-target="#mypageEditModal">
						정보 수정</button>
				</div>
			</div>
			<!-- ===== 캘린더 / 간트차트 영역 ===== -->
			<h5 class="fw-bold mb-3">일정</h5>
			<div class="card mb-4 p-3">

				<!-- 탭 버튼 -->
				<ul class="nav nav-tabs mb-3" id="scheduleTabs">
					<li class="nav-item">
						<button class="nav-link active" data-bs-toggle="tab"
							data-bs-target="#calenderTab">캘린더</button>
					</li>
					<li class="nav-item">
						<button class="nav-link" data-bs-toggle="tab"
							data-bs-target="#ganttTab">간트차트</button>
					</li>
				</ul>

				<!-- 탭 내용 -->
				<div class="tab-content">

					<!-- 캘린더 탭 -->
					<div class="tab-pane fade show active" id="calenderTab">
						<!-- 월/주/일 뷰 전환 + 이전/다음 버튼 -->
						<div class="d-flex align-items-center gap-2 mb-3">
							<div class="btn-group">
								<button type="button"
									class="btn btn-outline-primary btn-sm view-btn active"
									onclick="changeView('month')">월간</button>
								<button type="button"
									class="btn btn-outline-primary btn-sm view-btn"
									onclick="changeView('week')">주간</button>
								<button type="button"
									class="btn btn-outline-primary btn-sm view-btn"
									onclick="changeView('day')">일일</button>
							</div>
							<div class="d-flex align-items-center gap-1">
								<button type="button" class="btn btn-outline-secondary btn-sm"
									onclick="mypageCalendar.prev(); updateDateLabel()">&lt;</button>
								<span class="fw-bold px-2" id="currentDate"
									style="min-width: 90px; font-size: 14px;"></span>
								<button type="button" class="btn btn-outline-secondary btn-sm"
									onclick="mypageCalendar.next(); updateDateLabel()">&gt;</button>
							</div>
							<!-- 일정 유형 필터 -->
							<select class="form-select form-select-sm ms-auto"
								id="mypageTypeCd" onchange="filterMypageEvents()"
								style="width: 100px;">
								<option value="">전체</option>
								<option value="01CALTYPE">개인일정</option>
								<option value="02CALTYPE">그룹일정</option>
								<option value="03CALTYPE">회사일정</option>
							</select>
						</div>
						<!-- 캘린더 렌더링 영역 -->
						<div id="mypageCalendar" style="height: 500px;"></div>
					</div>

					<!-- 간트차트 탭 -->
					<div class="tab-pane fade" id="ganttTab">
						<!-- 색상 범례 -->
						<div class="d-flex align-items-center gap-3 mb-2"
							style="font-size: 13px;">
							<span class="fw-bold">이슈상태 :</span> <span><span
								style="display: inline-block; width: 12px; height: 12px; background: #3498db; margin-right: 4px; border-radius: 2px; vertical-align: middle;"></span>신규</span>
							<span><span
								style="display: inline-block; width: 12px; height: 12px; background: #e67e22; margin-right: 4px; border-radius: 2px; vertical-align: middle;"></span>진행중</span>
							<span><span
								style="display: inline-block; width: 12px; height: 12px; background: #9b59b6; margin-right: 4px; border-radius: 2px; vertical-align: middle;"></span>검토</span>
							<span><span
								style="display: inline-block; width: 12px; height: 12px; background: #27ae60; margin-right: 4px; border-radius: 2px; vertical-align: middle;"></span>완료</span>
						</div>
						<!-- 간트차트 렌더링 영역 -->
						<div id="mypageGantt" style="width: 100%; height: 400px;"></div>
					</div>

				</div>
			</div>

			<hr class="my-4">

			<!-- ===== 참여 프로젝트 영역 ===== -->
			<h5 class="fw-bold mb-3">참여 프로젝트</h5>
			<div class="table-responsive mb-4">
				<table
					class="table table-bordered table-hover text-center align-middle"
					style="font-size: 14px;">
					<thead class="table-dark">
						<tr>
							<th>프로젝트명</th>
							<th>설명</th>
							<th>진행상태</th>
							<th>시작일</th>
							<th>종료일</th>
							<th>생성일</th>
							<th>참가인원</th>
							<th>상세페이지</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(projectList)}">
							<td colspan="8" class="text-muted py-4">참가중인 프로젝트가 없습니다.</td>
						</tr>
						<tr th:each="p : ${projectList}">
							<td th:text="${p.prjName}"></td>
							<td class="text-truncate" style="max-width: 200px;"
								th:text="${p.prjDesc != null ? p.prjDesc : '-'}"></td>
							<td></td>
							<td></td>
							<td
								th:text="${p.closedDate != null ? #dates.format(p.closedDate, 'yyyy-MM-dd') : '-'}"></td>
							<td
								th:text="${p.createdOn != null ? #dates.format(p.createdOn, 'yyyy-MM-dd') : '-'}"></td>
							<td></td>
							<td><a th:href="@{/project/{id}(id=${p.id})}"
								class="btn btn-outline-primary btn-sm">이동하기</a></td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- ===== 담당 이슈 영역 (추후 작업) ===== -->
			<h5 class="fw-bold mb-3">내 담당 이슈</h5>
			<div class="card mb-4 p-3">
				<p class="text-muted mb-0">담당 이슈 영역 (추후 작업)</p>
			</div>

			<!-- ===== 전체 이슈 영역 (추후 작업) ===== -->
			<h5 class="fw-bold mb-3">이번주 마감 전체이슈</h5>
			<div class="card mb-4 p-3">
				<p class="text-muted mb-0">전체 이슈 영역 (추후 작업)</p>
			</div>

		</div>

		<!-- ===== 내 정보 수정 모달 ===== -->
		<div th:replace="~{mypage/modal/mypageUserEdit :: mypageEditModal}"></div>

		
	
							<!-- 오른쪽 이미지 영역 (추후 작업) -->
							<div
								class="col-md-4 d-flex align-items-start justify-content-center pt-2">
								<div
									class="border d-flex align-items-center justify-content-center text-muted"
									style="width: 120px; height: 160px;">이미지</div>
							</div>

						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" id="btnUpdateInfo">수정</button>
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">닫기</button>
					</div>
				</div>
			</div>
		</div>
<script th:src="@{/js/mypage/mypage.js}"></script>
		<script>
	
	// =============================================
	// 1. 마이페이지 캘린더 (조회 전용)
	// =============================================
		
	const Calendar = tui.Calendar;
	
    const calendar = new Calendar('#mypagecalendar', {
        defaultView: 'month',
        language: 'ko',
        useFormPopup: false,   
        useDetailPopup: true,
        
        week: {
		  dayNames: ['일', '월', '화', '수', '목', '금', '토'],
        },
        month: {
		  dayNames: ['일', '월', '화', '수', '목', '금', '토'],
		  visibleEventCount: 5,
        },
        calendars: [
        	{ id: 'holiday', name: '공휴일', color: '#fff', backgroundColor: '#ff4d4d', borderColor: '#ff4d4d' },
            { id: 'personal', name: '개인일정', color: '#fff', backgroundColor: '#ff6b6b', borderColor: '#ff6b6b' },
            { id: 'group',    name: '그룹일정', color: '#fff', backgroundColor: '#51cf66', borderColor: '#51cf66' },
            { id: 'company',  name: '회사일정', color: '#fff', backgroundColor: '#339af0', borderColor: '#339af0' },
        ],
        template: {
            time(event) {
                return `<span>${event.title}</span>`;
            }     
        }
    });
    
 // =============================================
	// 1) 캘린더 일정 불러오기
	// =============================================
    function loadcalenderEvents(typeCd = '') {
    	fetch(`/calendar/listJson?typeCd=${typeCd}`, { 
            headers: { 'X-Requested-With': 'XMLHttpRequest' } 
        })
        .then(res => res.json())
        .then(data => {
            calendar.clear(); // 캘린더 초기화 
            
            const events = data.map(item => ({
                id: String(item.id),
                calendarId: item.typeCd === '01CALTYPE' ? 'personal' 
                          : item.typeCd === '02CALTYPE' ? 'group' 
                          : item.typeCd === '03CALTYPE' ? 'company' : 'personal',
                title: item.calText || '제목없음',
                start: new Date(item.calStart),
                end: new Date(item.calEnd),
            	isReadOnly: true 
            }));
            mypagecalendar.createEvents(events);
            
            // 캘린더에 공휴일 불러오기 
            loadMypageHoliday(mypageCalendar.getDate().getFullYear());
        });
    }
	
    //=========================================================================================
    // 2. 공휴일 불러오기
	//=========================================================================================	

	  function loadMypageHoliday(year) {
		
    	fetch(`/calendar/holiday/list?year=${year}`, {
    		 headers: { 'X-Requested-With': 'XMLHttpRequest' }   	
    	})
    	.then(res => res.json())
    	.then(data => {

		  const holiday = data.map(h => ({
				id: 'holiday_' + h.id,
				calendarId: 'holiday',
				title: h.holidayName,
				start: `${h.year}-${String(h.month).padStart(2,'0')}-${String(h.day).padStart(2,'0')}`,
	            end:   `${h.year}-${String(h.month).padStart(2,'0')}-${String(h.day).padStart(2,'0')}`,
	            isAllday:true,
	            category: 'allday',
	            isReadOnly: true,
	            color: '#ff4d4d',            
	            backgroundColor: 'transparent', 
	            borderColor: 'transparent'   
		  }));
    		MypageCalendar.createEvents(holiday);
    	});
    	
      }
  
	  // 날짜 표시 업데이트
	    function updateDateLabel() {
	        const date = calendar.getDate();
	        const year = date.getFullYear();
	        const month = date.getMonth() + 1;
	        document.getElementById('currentDate').textContent = `${year}년 ${month}월`;
	    }
	
	  
	  
	    //=========================================================================================
	    // 3. 간트차트 불러오기
		//=========================================================================================	
		
	    let mypageGantt = false;
	    
			function loadMypageGantt() {
			if(mypageGantt)	return; 
			
			
			gantt.config.columns = [
				    { name: "text",        label: "이슈명",   width: 200, tree: true },
			        { name: "status_cd",   label: "이슈상태", width: 80 },
			        { name: "assignee",    label: "담당자",   width: 80 },
			        { name: "due_date",    label: "마감일",   width: 100 },
			        { name: "progress",    label: "진척도",   width: 60, template: task => task.progress_text }
			];
			
			 	gantt.config.row_height = 30;
			    gantt.config.bar_height = 18;
			    gantt.config.min_column_width = 30;
			    gantt.config.grid_width = 550;
			    gantt.config.readonly = true;

			    gantt.config.scales = [
			        { unit: "month", step: 1, format: "%Y-%m" },
			        { unit: "day",   step: 1, format: "%d" }
			    ];
			    
			    gantt.templates.task_class = function(start, end, task) {
					switch(task.status_cd) {

					
						case "신규":  return "status-new";
						case "진행중": return "status-progress";
						case "검토":  return "status-review";
						case "완료":  return "status-done";
						default:     return "";
					} 
			    
			    }
			    
		gantt.init("mypageGantt");
		mypageGantt = true;
		
		// 내 담당 이슈 가져오기 
		
		fetch(`/project/gantt/listget?filter=my`)
		 .then(res => res.json())
		 .then(data => {
				allTasks = data
				.filter(issue => {
					const startVal = issue.startDate || issue.estStartDate;
					if(!startVal || !issue.dueDate) return false;
					const start = new Date(startVal);
					const end = new Date(issue.dueDate);
					
					if(isNaN(start.getTime())|| isNaN(end.getTime())) return false;
					if(start.getFullYear() === 1970) return false; 
					if(end <= start) return false;
					return true;
				
				})
				.map(issue => ({
				    text:           issue.subject, // 이슈명 
				    status_cd:      issue.statusCd, // 이슈상태 
				    priority_cd:    issue.priorityCd, // 우선순위 
				    assignee:       issue.memName, // 담당자 
				    est_start_date: formatDate(issue.estStartDate), // 시작예정일(template용)
				    due_date:       formatDate(issue.dueDate), // 이슈 마감일 
				    start_date:     formatDate(issue.startDate || issue.estStartDate), // 실제 시작일
				    start_date_str: formatDate(issue.startDate || issue.estStartDate), // 실제 시작일
				    end_date:       formatDate(issue.dueDate), //실제 완료일 
				    end_date_str:   formatDate(issue.dueDate), //실제 완료일 
				    progress:       (issue.doneRatio ?? 0) / 100, // 진척도 (막대 그래프용)
				    progress_text:  (issue.doneRatio ?? 0) + "%" // 진척도 (막대 그래프용)
				}));	
				gantt.clearAll();
				gantt.parse({data: allTasks});
			
		 	});

	};
	
	// 날짜 포멧데이터 
	 function formatMypageDate(dateStr) {
			const day = new Date(dateStr);
			const dd = String(day.getDate()).padStart(2, '0'); 
			const month = String (day.getMonth() +1) .padStart(2, '0');
			const years = day.getFullYear();
			return `${day.getFullYear()}-${month}-${dd}`;			
		  } 
	
	// 간트차트 탭 클릭 시 불러오기 
	 document.querySelector('[data-bs-target="#ganttTab"]')
			 .addEventListener('click', function() {
			  setTimeout(loadMypageGantt, 300);

	 });
		

	</script>

	</div>
</body>
</html>
