<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/projectLayout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>구성원 등록</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.grid/latest/tui-grid.css" />
    <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
    <script src="https://uicdn.toast.com/tui.grid/latest/tui-grid.js"></script>
    <style>
      .mem-join-page__back {
        display: inline-block;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: #1976d2;
        text-decoration: none;
      }
      .mem-join-page__back:hover {
        text-decoration: underline;
      }
      .mem-join-page__head {
        margin-bottom: 1.25rem;
      }
      .mem-join-page__title {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #222;
      }
      .mem-join-page__rule {
        height: 3px;
        background: #333;
        border: 0;
        margin: 0;
      }
      .mem-join-section {
        margin-bottom: 2rem;
      }
      .mem-join-section__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #222;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .mem-join-section__body {
        padding-top: 0.85rem;
      }
      .mem-join-search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 0.85rem;
        margin-bottom: 0.65rem;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #fafafa;
      }
      .mem-join-search select,
      .mem-join-search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .mem-join-search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
        max-width: 8rem;
      }
      .mem-join-search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .mem-join-search .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .mem-join-grid-host {
        min-height: 120px;
        background: #fff;
      }
      .mem-join-form {
        --mem-label-w: 9.75rem;
        --mem-input-w: 18rem;
        --mem-font-size: 0.8125rem;
        --mem-input-bg: #f5f5f5;
        --mem-input-border: #d0d0d0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .mem-join-form .mem-field-row {
        display: grid;
        grid-template-columns: var(--mem-label-w) var(--mem-input-w);
        align-items: center;
        column-gap: 0.75rem;
        row-gap: 0.25rem;
      }
      .mem-join-form .mem-field-row > label {
        font-size: var(--mem-font-size);
        color: #333;
        text-align: right;
        white-space: nowrap;
        line-height: 1.35;
      }
      .mem-join-form .mem-field-row > label .req {
        color: #c62828;
      }
      .mem-join-form .mem-field-row input[type="text"],
      .mem-join-form .mem-field-row input[type="date"],
      .mem-join-form .mem-period-inputs input[type="date"] {
        width: 100%;
        max-width: var(--mem-input-w);
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--mem-input-border);
        border-radius: 4px;
        background: var(--mem-input-bg);
        font-size: var(--mem-font-size);
        color: #333;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .mem-join-form .mem-field-row input.mem-input--editable {
        background: #fff;
      }
      .mem-join-form .mem-field-row input.mem-input--picker {
        cursor: pointer;
      }
      .mem-join-form .mem-field-row input::placeholder,
      .mem-join-form .mem-period-inputs input::placeholder {
        color: #aaa;
        font-size: var(--mem-font-size);
      }
      .mem-join-form .mem-period-inputs {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        width: 100%;
        max-width: var(--mem-input-w);
      }
      .mem-join-form .mem-period-inputs input {
        flex: 1 1 0;
        min-width: 0;
      }
      .mem-join-form .mem-period-inputs .mem-period-tilde {
        flex: 0 0 auto;
        color: #555;
        font-size: var(--mem-font-size);
        line-height: 1;
        padding: 0 0.1rem;
      }
      .mem-join-hint {
        margin: 0;
        font-size: 0.75rem;
        color: #666;
        line-height: 1.35;
      }
      .mem-join-hint--warn {
        color: #c62828;
      }
      .mem-join-actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem 0 0.5rem;
      }
      .mem-join-actions__btn {
        min-width: 5.5rem;
        padding: 0.45rem 1.5rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: #666;
        color: #fff;
        font-size: 0.875rem;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .mem-join-actions__btn:hover {
        background: #555;
        color: #fff;
      }
      .mem-join-actions__btn--secondary {
        background: #fff;
        color: #333;
      }
      .mem-join-actions__btn--secondary:hover {
        background: #f5f5f5;
        color: #333;
      }
      .mem-join-picker-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .mem-join-picker-overlay.is-open {
        display: flex;
      }
      .mem-join-picker {
        width: min(32rem, 92vw);
        max-height: 70vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .mem-join-picker__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .mem-join-picker__search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .mem-join-picker__search select,
      .mem-join-picker__search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        background: #fff;
        box-sizing: border-box;
      }
      .mem-join-picker__search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
      }
      .mem-join-picker__search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .mem-join-picker__list {
        overflow: auto;
        padding: 0.5rem 1rem;
        flex: 1 1 auto;
      }
      .mem-join-picker__item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.5rem 0.65rem;
        margin: 0.15rem 0;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        font-size: 0.8125rem;
        color: #333;
        cursor: pointer;
        line-height: 1.4;
      }
      .mem-join-picker__item:hover {
        background: #f0f4f8;
        border-color: #d0d0d0;
      }
      .mem-join-picker__item-sub {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.75rem;
        color: #777;
      }
      .mem-join-picker__empty {
        margin: 0;
        padding: 0.5rem 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .mem-join-picker__actions {
        display: flex;
        justify-content: flex-end;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .mem-join-picker__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
    </style>

    <script th:inline="javascript">
/*<![CDATA[*/
const memJoinPrjId = /*[[${session.currentProjectId}]]*/ 0;
      const memJoinPrjName = /*[[${session.project != null ? session.project.prjName : ''}]]*/ "";
      const memJoinPrjStartDate = /*[[${session.project != null && session.project.startDate != null ? #dates.format(session.project.startDate, 'yyyy-MM-dd') : ''}]]*/ "";
      const memJoinPrjClosedDate = /*[[${session.project != null && session.project.closedDate != null ? #dates.format(session.project.closedDate, 'yyyy-MM-dd') : ''}]]*/ "";
/*]]>*/
</script>
  </head>
  <body>
    <div layout:fragment="content">
      <a class="mem-join-page__back" th:href="@{/project/member/list}">← 구성원 목록으로</a>

      <header class="mem-join-page__head">
        <h1 class="mem-join-page__title">구성원 등록</h1>
        <hr class="mem-join-page__rule" />
      </header>

      <section class="mem-join-section" aria-labelledby="mem-join-basic-heading">
        <h2 class="mem-join-section__title" id="mem-join-basic-heading">기본정보</h2>
        <div class="mem-join-section__body">
          <div class="mem-join-search" role="search">
            <label class="visually-hidden" for="memJoinSearchType">검색 항목</label>
            <select id="memJoinSearchType" aria-label="검색 항목">
              <option value="login">아이디</option>
              <option value="userName" selected>이름</option>
              <option value="tel">연락처</option>
              <option value="email">이메일</option>
            </select>
            <label class="visually-hidden" for="memJoinSearchKeyword">검색어</label>
            <input type="text" autocomplete="off" id="memJoinSearchKeyword" placeholder="검색어를 입력하세요" />
          </div>
          <div id="memJoinMemberGrid" class="mem-join-grid-host" role="region" aria-label="등록 가능한 구성원 목록"></div>
        </div>
      </section>

      <section class="mem-join-section" aria-labelledby="mem-join-project-heading">
        <h2 class="mem-join-section__title" id="mem-join-project-heading">프로젝트 정보</h2>
        <div class="mem-join-section__body">
          <div class="mem-join-form">
            <div class="mem-field-row">
              <label for="memJoinPrjName">프로젝트명 <span class="req">*</span></label>
              <input type="text" id="memJoinPrjName" readonly th:value="${session.project != null ? session.project.prjName : ''}" />
            </div>
            <div class="mem-field-row">
              <label for="memJoinPrjStart">프로젝트 투입기간 <span class="req">*</span></label>
              <div class="mem-period-inputs">
                <input
                  type="date"
                  id="memJoinPrjStart"
                  class="mem-input--editable"
                  placeholder="연도-월-일"
                />
                <span class="mem-period-tilde" aria-hidden="true">~</span>
                <input
                  type="date"
                  id="memJoinPrjEnd"
                  class="mem-input--editable"
                  placeholder="연도-월-일"
                />
              </div>
            </div>
            <div class="mem-field-row">
              <label></label>
              <p class="mem-join-hint" id="memJoinPeriodHint"></p>
            </div>
            <div class="mem-field-row">
              <label for="memJoinGrpName">소속 그룹 <span class="req">*</span></label>
              <input
                type="text"
                id="memJoinGrpName"
                class="mem-input--editable mem-input--picker"
                placeholder="클릭하여 그룹을 선택하세요."
                autocomplete="off"
                readonly
              />
              <input type="hidden" id="memJoinSelectedGrpId" />
            </div>
          </div>
        </div>
      </section>

      <div class="mem-join-actions">
        <button type="button" class="mem-join-actions__btn" id="btnMemberJoinRegister">등록</button>
        <a class="mem-join-actions__btn mem-join-actions__btn--secondary" th:href="@{/project/member/list}">취소</a>
      </div>

      <div class="mem-join-picker-overlay" id="memJoinGroupOverlay" aria-hidden="true">
        <div class="mem-join-picker" role="dialog" aria-modal="true" aria-labelledby="memJoinGroupPickTitle">
          <div class="mem-join-picker__head" id="memJoinGroupPickTitle">소속 그룹 선택</div>
          <div class="mem-join-picker__search">
            <label class="visually-hidden" for="memJoinGroupSearchType">검색 항목</label>
            <select id="memJoinGroupSearchType" aria-label="검색 항목">
              <option value="id">그룹아이디</option>
              <option value="grpName" selected>그룹명</option>
            </select>
            <label class="visually-hidden" for="memJoinGroupSearchKeyword">검색어</label>
            <input type="text" autocomplete="off" id="memJoinGroupSearchKeyword" placeholder="검색어를 입력하세요" />
          </div>
          <div class="mem-join-picker__list" id="memJoinGroupPickList"></div>
          <div class="mem-join-picker__actions">
            <button type="button" id="btnMemJoinGroupPickCancel">닫기</button>
          </div>
        </div>
      </div>

      <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModal}"></th:block>
      <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModalScript}"></th:block>

      <script th:src="@{/js/member/memberJoin.js}"></script>
    </div>
  </body>
</html>
