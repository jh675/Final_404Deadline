<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/projectLayout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>구성원 등록</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.grid/latest/tui-grid.css" />
    <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
    <script src="https://uicdn.toast.com/tui.grid/latest/tui-grid.js"></script>
    <style>
      .mem-join-page__back {
        display: inline-block;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: #1976d2;
        text-decoration: none;
      }
      .mem-join-page__back:hover {
        text-decoration: underline;
      }
      .mem-join-page__head {
        margin-bottom: 1.25rem;
      }
      .mem-join-page__title {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #222;
      }
      .mem-join-page__rule {
        height: 3px;
        background: #333;
        border: 0;
        margin: 0;
      }
      .mem-join-section {
        margin-bottom: 2rem;
      }
      .mem-join-section__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #222;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .mem-join-section__body {
        padding-top: 0.85rem;
      }
      .mem-join-search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 0.85rem;
        margin-bottom: 0.65rem;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #fafafa;
      }
      .mem-join-search select,
      .mem-join-search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .mem-join-search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
        max-width: 8rem;
      }
      .mem-join-search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .mem-join-search .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .mem-join-grid-host {
        min-height: 120px;
        background: #fff;
      }
      .mem-join-form {
        --mem-label-w: 9.75rem;
        --mem-input-w: 18rem;
        --mem-font-size: 0.8125rem;
        --mem-input-bg: #f5f5f5;
        --mem-input-border: #d0d0d0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .mem-join-form .mem-field-row {
        display: grid;
        grid-template-columns: var(--mem-label-w) var(--mem-input-w);
        align-items: center;
        column-gap: 0.75rem;
        row-gap: 0.25rem;
      }
      .mem-join-form .mem-field-row > label {
        font-size: var(--mem-font-size);
        color: #333;
        text-align: right;
        white-space: nowrap;
        line-height: 1.35;
      }
      .mem-join-form .mem-field-row > label .req {
        color: #c62828;
      }
      .mem-join-form .mem-field-row input[type="text"],
      .mem-join-form .mem-field-row input[type="date"],
      .mem-join-form .mem-period-inputs input[type="date"] {
        width: 100%;
        max-width: var(--mem-input-w);
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--mem-input-border);
        border-radius: 4px;
        background: var(--mem-input-bg);
        font-size: var(--mem-font-size);
        color: #333;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .mem-join-form .mem-field-row input.mem-input--editable {
        background: #fff;
      }
      .mem-join-form .mem-field-row input.mem-input--picker {
        cursor: pointer;
      }
      .mem-join-form .mem-field-row input::placeholder,
      .mem-join-form .mem-period-inputs input::placeholder {
        color: #aaa;
        font-size: var(--mem-font-size);
      }
      .mem-join-form .mem-period-inputs {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        width: 100%;
        max-width: var(--mem-input-w);
      }
      .mem-join-form .mem-period-inputs input {
        flex: 1 1 0;
        min-width: 0;
      }
      .mem-join-form .mem-period-inputs .mem-period-tilde {
        flex: 0 0 auto;
        color: #555;
        font-size: var(--mem-font-size);
        line-height: 1;
        padding: 0 0.1rem;
      }
      .mem-join-hint {
        margin: 0;
        font-size: 0.75rem;
        color: #666;
        line-height: 1.35;
      }
      .mem-join-hint--warn {
        color: #c62828;
      }
      .mem-join-actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem 0 0.5rem;
      }
      .mem-join-actions__btn {
        min-width: 5.5rem;
        padding: 0.45rem 1.5rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: #666;
        color: #fff;
        font-size: 0.875rem;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .mem-join-actions__btn:hover {
        background: #555;
        color: #fff;
      }
      .mem-join-actions__btn--secondary {
        background: #fff;
        color: #333;
      }
      .mem-join-actions__btn--secondary:hover {
        background: #f5f5f5;
        color: #333;
      }
      .mem-join-picker-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .mem-join-picker-overlay.is-open {
        display: flex;
      }
      .mem-join-picker {
        width: min(32rem, 92vw);
        max-height: 70vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .mem-join-picker__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .mem-join-picker__search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .mem-join-picker__search select,
      .mem-join-picker__search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        background: #fff;
        box-sizing: border-box;
      }
      .mem-join-picker__search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
      }
      .mem-join-picker__search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .mem-join-picker__list {
        overflow: auto;
        padding: 0.5rem 1rem;
        flex: 1 1 auto;
      }
      .mem-join-picker__item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.5rem 0.65rem;
        margin: 0.15rem 0;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        font-size: 0.8125rem;
        color: #333;
        cursor: pointer;
        line-height: 1.4;
      }
      .mem-join-picker__item:hover {
        background: #f0f4f8;
        border-color: #d0d0d0;
      }
      .mem-join-picker__item-sub {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.75rem;
        color: #777;
      }
      .mem-join-picker__empty {
        margin: 0;
        padding: 0.5rem 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .mem-join-picker__actions {
        display: flex;
        justify-content: flex-end;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .mem-join-picker__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
    </style>

    <script th:inline="javascript">
      /*<![CDATA[*/
      const memJoinPrjId = /*[[${prjId}]]*/ 0;
      const memJoinPrjName = /*[[${prjName}]]*/ "";
      const memJoinPrjStartDate = /*[[${prjStartDate}]]*/ "";
      const memJoinPrjClosedDate = /*[[${prjClosedDate}]]*/ "";
      /*]]>*/
    </script>
  </head>
  <body>
    <div layout:fragment="content">
      <a class="mem-join-page__back" th:href="@{/project/member/list}">← 구성원 목록으로</a>

      <header class="mem-join-page__head">
        <h1 class="mem-join-page__title">구성원 등록</h1>
        <hr class="mem-join-page__rule" />
      </header>

      <section class="mem-join-section" aria-labelledby="mem-join-basic-heading">
        <h2 class="mem-join-section__title" id="mem-join-basic-heading">기본정보</h2>
        <div class="mem-join-section__body">
          <div class="mem-join-search" role="search">
            <label class="visually-hidden" for="memJoinSearchType">검색 항목</label>
            <select id="memJoinSearchType" aria-label="검색 항목">
              <option value="login">아이디</option>
              <option value="userName" selected>이름</option>
              <option value="tel">연락처</option>
              <option value="email">이메일</option>
            </select>
            <label class="visually-hidden" for="memJoinSearchKeyword">검색어</label>
            <input type="text" autocomplete="off" id="memJoinSearchKeyword" placeholder="검색어를 입력하세요" />
          </div>
          <div id="memJoinMemberGrid" class="mem-join-grid-host" role="region" aria-label="등록 가능한 구성원 목록"></div>
        </div>
      </section>

      <section class="mem-join-section" aria-labelledby="mem-join-project-heading">
        <h2 class="mem-join-section__title" id="mem-join-project-heading">프로젝트 정보</h2>
        <div class="mem-join-section__body">
          <div class="mem-join-form">
            <div class="mem-field-row">
              <label for="memJoinPrjName">프로젝트명 <span class="req">*</span></label>
              <input type="text" id="memJoinPrjName" readonly th:value="${prjName}" />
            </div>
            <div class="mem-field-row">
              <label for="memJoinPrjStart">프로젝트 투입기간 <span class="req">*</span></label>
              <div class="mem-period-inputs">
                <input
                  type="date"
                  id="memJoinPrjStart"
                  class="mem-input--editable"
                  placeholder="연도-월-일"
                />
                <span class="mem-period-tilde" aria-hidden="true">~</span>
                <input
                  type="date"
                  id="memJoinPrjEnd"
                  class="mem-input--editable"
                  placeholder="연도-월-일"
                />
              </div>
            </div>
            <div class="mem-field-row">
              <label></label>
              <p class="mem-join-hint" id="memJoinPeriodHint"></p>
            </div>
            <div class="mem-field-row">
              <label for="memJoinGrpName">소속 그룹 <span class="req">*</span></label>
              <input
                type="text"
                id="memJoinGrpName"
                class="mem-input--editable mem-input--picker"
                placeholder="클릭하여 그룹을 선택하세요."
                autocomplete="off"
                readonly
              />
              <input type="hidden" id="memJoinSelectedGrpId" />
            </div>
          </div>
        </div>
      </section>

      <div class="mem-join-actions">
        <button type="button" class="mem-join-actions__btn" id="btnMemberJoinRegister">등록</button>
        <a class="mem-join-actions__btn mem-join-actions__btn--secondary" th:href="@{/project/member/list}">취소</a>
      </div>

      <div class="mem-join-picker-overlay" id="memJoinGroupOverlay" aria-hidden="true">
        <div class="mem-join-picker" role="dialog" aria-modal="true" aria-labelledby="memJoinGroupPickTitle">
          <div class="mem-join-picker__head" id="memJoinGroupPickTitle">소속 그룹 선택</div>
          <div class="mem-join-picker__search">
            <label class="visually-hidden" for="memJoinGroupSearchType">검색 항목</label>
            <select id="memJoinGroupSearchType" aria-label="검색 항목">
              <option value="id">그룹아이디</option>
              <option value="grpName" selected>그룹명</option>
            </select>
            <label class="visually-hidden" for="memJoinGroupSearchKeyword">검색어</label>
            <input type="text" autocomplete="off" id="memJoinGroupSearchKeyword" placeholder="검색어를 입력하세요" />
          </div>
          <div class="mem-join-picker__list" id="memJoinGroupPickList"></div>
          <div class="mem-join-picker__actions">
            <button type="button" id="btnMemJoinGroupPickCancel">닫기</button>
          </div>
        </div>
      </div>

      <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModal}"></th:block>
      <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModalScript}"></th:block>

      <script>
        (function () {
          const prjId = Number(memJoinPrjId);
          const prjStartDateYmd = String(memJoinPrjStartDate || "");
          const prjClosedDateYmd = String(memJoinPrjClosedDate || "");

          const gridEl = document.getElementById("memJoinMemberGrid");
          const searchType = document.getElementById("memJoinSearchType");
          const searchKeyword = document.getElementById("memJoinSearchKeyword");
          const startInput = document.getElementById("memJoinPrjStart");
          const endInput = document.getElementById("memJoinPrjEnd");
          const periodHint = document.getElementById("memJoinPeriodHint");
          const grpInput = document.getElementById("memJoinGrpName");
          const grpIdInput = document.getElementById("memJoinSelectedGrpId");
          const groupOverlay = document.getElementById("memJoinGroupOverlay");
          const groupPickList = document.getElementById("memJoinGroupPickList");
          const groupSearchType = document.getElementById("memJoinGroupSearchType");
          const groupSearchKeyword = document.getElementById("memJoinGroupSearchKeyword");
          const groupPickCancel = document.getElementById("btnMemJoinGroupPickCancel");
          const registerBtn = document.getElementById("btnMemberJoinRegister");

          let allMembers = [];
          let allGroups = [];
          let grid = null;
          const selectedUserIds = new Set();
          let isSyncingCheck = false;

          function buildCsrfHeaders() {
            const headers = { "Content-Type": "application/json" };
            const tokenMeta = document.querySelector('meta[name="_csrf"]');
            const headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if (tokenMeta && headerMeta && tokenMeta.content && headerMeta.content) {
              headers[headerMeta.content] = tokenMeta.content;
            }
            return headers;
          }

          function alertMsg(msg, title) {
            if (window.MemberQuestionModal && window.MemberQuestionModal.alert) {
              return window.MemberQuestionModal.alert(msg, title || "알림");
            }
            return Promise.resolve();
          }

          function todayYmd() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return y + "-" + m + "-" + day;
          }

          function normalizeYmd(value) {
            if (value == null) return "";
            const s = String(value).trim();
            if (!s) return "";
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            const d = new Date(s);
            if (isNaN(d.getTime())) return "";
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return y + "-" + m + "-" + day;
          }

          function maxYmd(a, b) {
            if (!a) return b || "";
            if (!b) return a;
            return a >= b ? a : b;
          }

          function getSelectedMembers() {
            if (selectedUserIds.size === 0) return [];
            return allMembers.filter(function (m) {
              return selectedUserIds.has(Number(m.userId));
            });
          }

          /** 선택된 직원들 중 가장 늦은 입사일 (없으면 빈 문자열) */
          function getSelectedMaxHireYmd() {
            let max = "";
            getSelectedMembers().forEach(function (m) {
              const ymd = m && m.hireDate ? normalizeYmd(m.hireDate) : "";
              if (ymd && (!max || ymd > max)) {
                max = ymd;
              }
            });
            return max;
          }

          function renderPeriodHint() {
            if (!periodHint) return;
            const hireYmd = getSelectedMaxHireYmd();
            const minStart = maxYmd(hireYmd, prjStartDateYmd);
            const lines = [];
            const count = selectedUserIds.size;
            if (count === 0) {
              lines.push("직원을 선택하면 투입일 가능 범위가 갱신됩니다.");
            } else {
              if (count > 1) {
                lines.push("선택된 직원 " + count + "명을 일괄 등록합니다.");
              }
              if (minStart) {
                lines.push("투입일은 " + minStart + " 이후로 지정할 수 있습니다.");
              }
            }
            if (prjClosedDateYmd) {
              lines.push("종료일은 " + prjClosedDateYmd + " 이전이어야 합니다.");
            }
            periodHint.textContent = lines.join(" ");
            periodHint.classList.toggle("mem-join-hint--warn", count === 0);
          }

          function applyDateConstraints() {
            const hireYmd = getSelectedMaxHireYmd();
            const minStart = maxYmd(hireYmd, prjStartDateYmd);

            if (minStart) {
              startInput.min = minStart;
            } else {
              startInput.removeAttribute("min");
            }
            if (prjClosedDateYmd) {
              startInput.max = prjClosedDateYmd;
            } else {
              startInput.removeAttribute("max");
            }

            let curStart = normalizeYmd(startInput.value);
            if (curStart && minStart && curStart < minStart) {
              curStart = minStart;
              startInput.value = curStart;
            }
            if (curStart && prjClosedDateYmd && curStart > prjClosedDateYmd) {
              curStart = prjClosedDateYmd;
              startInput.value = curStart;
            }

            if (curStart) {
              endInput.min = curStart;
            } else if (minStart) {
              endInput.min = minStart;
            } else {
              endInput.removeAttribute("min");
            }
            if (prjClosedDateYmd) {
              endInput.max = prjClosedDateYmd;
            } else {
              endInput.removeAttribute("max");
            }

            let curEnd = normalizeYmd(endInput.value);
            if (curEnd && curStart && curEnd < curStart) {
              curEnd = curStart;
              endInput.value = curEnd;
            }
            if (curEnd && prjClosedDateYmd && curEnd > prjClosedDateYmd) {
              endInput.value = prjClosedDateYmd;
            }
          }

          function initDefaultStartDate() {
            const hireYmd = getSelectedMaxHireYmd();
            const minStart = maxYmd(hireYmd, prjStartDateYmd);
            const today = todayYmd();
            let initStart = startInput.value ? normalizeYmd(startInput.value) : "";
            if (!initStart) {
              initStart = maxYmd(minStart, today);
              if (prjClosedDateYmd && initStart > prjClosedDateYmd) {
                initStart = prjClosedDateYmd;
              }
              if (initStart) startInput.value = initStart;
            }
          }

          function includesKeyword(value, keyword) {
            if (!keyword) return true;
            const text = value == null ? "" : String(value).trim().toLowerCase();
            return text.indexOf(keyword) !== -1;
          }

          function filterMembers(rows) {
            const type = searchType ? searchType.value : "userName";
            const keyword = searchKeyword
              ? searchKeyword.value.trim().toLowerCase()
              : "";
            if (!keyword) return rows;
            return rows.filter(function (r) {
              if (type === "login") return includesKeyword(r.login, keyword);
              if (type === "tel") return includesKeyword(r.tel, keyword);
              if (type === "email") return includesKeyword(r.email, keyword);
              return includesKeyword(r.userName, keyword);
            });
          }

          function memberGenderText(code) {
            const c = (code || "").toUpperCase();
            if (c === "01GENDER") return "남";
            if (c === "02GENDER") return "여";
            return "-";
          }

          function memberToGridRow(m) {
            return {
              userId: m.userId,
              login: m.login || "-",
              userName: m.userName || "-",
              hireDate: m.hireDate || "-",
              gender: memberGenderText(m.genderCd),
              tel: m.tel || "-",
              email: m.email || "-",
            };
          }

          function refreshGridData() {
            if (!grid) return;
            const rows = filterMembers(allMembers).map(memberToGridRow);
            grid.resetData(rows);
            applyCheckedRowFromSelected();
          }

          function applyCheckedRowFromSelected() {
            if (!grid || typeof grid.getData !== "function") return;
            isSyncingCheck = true;
            try {
              grid.getData().forEach(function (row) {
                if (row.rowKey == null) return;
                const uid = Number(row.userId);
                if (!isNaN(uid) && selectedUserIds.has(uid)) {
                  grid.check(row.rowKey);
                } else if (typeof grid.uncheck === "function") {
                  grid.uncheck(row.rowKey);
                }
              });
            } finally {
              isSyncingCheck = false;
            }
          }

          function onSelectionChanged() {
            applyDateConstraints();
            renderPeriodHint();
          }

          function createGrid() {
            if (!gridEl || typeof tui === "undefined" || !tui.Grid) return;
            if (grid) {
              grid.destroy();
              grid = null;
            }
            grid = new tui.Grid({
              el: gridEl,
              data: filterMembers(allMembers).map(memberToGridRow),
              rowHeaders: [{ type: "checkbox", header: "선택" }],
              scrollX: false,
              scrollY: false,
              bodyHeight: "auto",
              rowHeight: 36,
              minBodyHeight: 100,
              columns: [
                { header: "아이디", name: "login", width: 120, align: "center", sortable: true },
                { header: "이름", name: "userName", width: 130, align: "center", sortable: true },
                { header: "입사일", name: "hireDate", width: 130, align: "center", sortable: true },
                { header: "성별", name: "gender", width: 70, align: "center", sortable: false },
                { header: "연락처", name: "tel", width: 140, align: "center", sortable: false },
                { header: "이메일", name: "email", align: "center", sortable: false },
              ],
              pageOptions: {
                useClient: true,
                perPage: 10,
              },
            });

            grid.on("check", function (ev) {
              if (isSyncingCheck) return;
              const row = grid.getRow(ev.rowKey);
              if (!row || row.userId == null) return;
              selectedUserIds.add(Number(row.userId));
              onSelectionChanged();
            });
            grid.on("uncheck", function (ev) {
              if (isSyncingCheck) return;
              const row = grid.getRow(ev.rowKey);
              if (!row || row.userId == null) return;
              selectedUserIds.delete(Number(row.userId));
              onSelectionChanged();
            });
            grid.on("checkAll", function () {
              if (isSyncingCheck) return;
              const data = grid.getData() || [];
              data.forEach(function (row) {
                if (row && row.userId != null) {
                  selectedUserIds.add(Number(row.userId));
                }
              });
              onSelectionChanged();
            });
            grid.on("uncheckAll", function () {
              if (isSyncingCheck) return;
              const data = grid.getData() || [];
              data.forEach(function (row) {
                if (row && row.userId != null) {
                  selectedUserIds.delete(Number(row.userId));
                }
              });
              onSelectionChanged();
            });
            applyCheckedRowFromSelected();
          }

          async function loadMembers() {
            try {
              const res = await fetch("/project/member/companyMembers?excludeRegistered=true", {
                credentials: "same-origin",
              });
              const data = await res.json().catch(function () {
                return {};
              });
              allMembers = data && Array.isArray(data.content) ? data.content : [];
            } catch (e) {
              allMembers = [];
            }
            createGrid();
            renderPeriodHint();
          }

          function resetGroupSearch() {
            if (groupSearchType) groupSearchType.value = "grpName";
            if (groupSearchKeyword) groupSearchKeyword.value = "";
          }

          function filterGroups(rows) {
            const type = groupSearchType ? groupSearchType.value : "grpName";
            const keyword = groupSearchKeyword
              ? groupSearchKeyword.value.trim().toLowerCase()
              : "";
            if (!keyword) return rows;
            return rows.filter(function (r) {
              if (type === "id") return includesKeyword(r.id, keyword);
              return includesKeyword(r.grpName, keyword);
            });
          }

          function resolveGroupId(row) {
            if (!row) return null;
            const raw =
              row.id != null && row.id !== ""
                ? row.id
                : row.grpId != null && row.grpId !== ""
                  ? row.grpId
                  : null;
            if (raw == null) return null;
            const n = Number(raw);
            return isNaN(n) ? null : n;
          }

          function renderGroupList(rows, emptyMessage) {
            if (!groupPickList) return;
            groupPickList.innerHTML = "";
            if (!rows.length) {
              const p = document.createElement("p");
              p.className = "mem-join-picker__empty";
              p.textContent = emptyMessage || "선택할 그룹이 없습니다.";
              groupPickList.appendChild(p);
              return;
            }
            rows.forEach(function (r) {
              const gid = resolveGroupId(r);
              if (gid == null) return;
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "mem-join-picker__item";
              const main = document.createElement("span");
              main.textContent = r.grpName || "(이름 없음)";
              btn.appendChild(main);
              const sub = document.createElement("span");
              sub.className = "mem-join-picker__item-sub";
              sub.textContent = "그룹 ID: " + String(gid);
              btn.appendChild(sub);
              btn.addEventListener("click", function () {
                grpInput.value = r.grpName != null ? String(r.grpName) : "";
                grpIdInput.value = String(gid);
                closeGroupPicker();
              });
              groupPickList.appendChild(btn);
            });
          }

          function refreshGroupListView() {
            renderGroupList(
              filterGroups(allGroups),
              allGroups.length
                ? "검색 결과가 없습니다."
                : "선택할 그룹이 없습니다.",
            );
          }

          async function openGroupPicker() {
            if (!groupOverlay || !groupPickList) return;
            resetGroupSearch();
            groupPickList.innerHTML = "불러오는 중…";
            groupOverlay.classList.add("is-open");
            groupOverlay.setAttribute("aria-hidden", "false");
            try {
              const res = await fetch("/project/member/projectGroups", {
                credentials: "same-origin",
              });
              const data = await res.json().catch(function () {
                return {};
              });
              allGroups = data && Array.isArray(data.content) ? data.content : [];
              refreshGroupListView();
            } catch (e) {
              allGroups = [];
              groupPickList.innerHTML = "";
              const p = document.createElement("p");
              p.className = "mem-join-picker__empty";
              p.textContent = "그룹 목록을 불러오지 못했습니다.";
              groupPickList.appendChild(p);
            }
          }

          function closeGroupPicker() {
            if (!groupOverlay) return;
            groupOverlay.classList.remove("is-open");
            groupOverlay.setAttribute("aria-hidden", "true");
          }

          if (searchType) {
            searchType.addEventListener("change", refreshGridData);
          }
          if (searchKeyword) {
            searchKeyword.addEventListener("input", refreshGridData);
          }

          if (startInput) {
            startInput.addEventListener("change", applyDateConstraints);
            startInput.addEventListener("input", applyDateConstraints);
          }
          if (endInput) {
            endInput.addEventListener("change", applyDateConstraints);
            endInput.addEventListener("input", applyDateConstraints);
          }

          if (grpInput) {
            grpInput.addEventListener("click", openGroupPicker);
          }
          if (groupPickCancel) {
            groupPickCancel.addEventListener("click", closeGroupPicker);
          }
          if (groupOverlay) {
            groupOverlay.addEventListener("click", function (e) {
              if (e.target === groupOverlay) {
                closeGroupPicker();
              }
            });
          }
          if (groupSearchType) {
            groupSearchType.addEventListener("change", refreshGroupListView);
          }
          if (groupSearchKeyword) {
            groupSearchKeyword.addEventListener("input", refreshGroupListView);
          }

          if (registerBtn) {
            registerBtn.addEventListener("click", async function () {
              if (isNaN(prjId)) {
                await alertMsg("프로젝트 ID가 올바르지 않습니다.");
                return;
              }
              if (selectedUserIds.size === 0) {
                await alertMsg("등록할 직원을 선택하세요.");
                return;
              }
              const start = normalizeYmd(startInput.value);
              const end = normalizeYmd(endInput.value);
              if (!start) {
                await alertMsg("프로젝트 투입일을 입력하세요.");
                return;
              }

              const hireYmd = getSelectedMaxHireYmd();
              const minStart = maxYmd(hireYmd, prjStartDateYmd);
              if (minStart && start < minStart) {
                await alertMsg(
                  "프로젝트 투입일은 " + minStart + " 이후로만 지정할 수 있습니다.",
                );
                return;
              }
              if (prjClosedDateYmd && end && end > prjClosedDateYmd) {
                await alertMsg(
                  "프로젝트 종료일은 " + prjClosedDateYmd + " 이전이어야 합니다.",
                );
                return;
              }
              if (end && start && end < start) {
                await alertMsg("프로젝트 종료일은 투입일 이후여야 합니다.");
                return;
              }

              const gidRaw = grpIdInput && grpIdInput.value ? grpIdInput.value.trim() : "";
              if (!gidRaw) {
                await alertMsg("소속 그룹을 선택하세요.");
                return;
              }
              const gid = Number(gidRaw);
              if (isNaN(gid)) {
                await alertMsg("소속 그룹 정보가 올바르지 않습니다.");
                return;
              }

              const userIds = Array.from(selectedUserIds);
              const payload = {
                userIds: userIds,
                grpId: gid,
                prjStartDate: start,
                prjEndDate: end || null,
              };

              registerBtn.disabled = true;
              try {
                const res = await fetch("/project/member/registerMembers", {
                  method: "POST",
                  headers: buildCsrfHeaders(),
                  credentials: "same-origin",
                  body: JSON.stringify(payload),
                });
                const data = await res.json().catch(function () {
                  return {};
                });
                if (!res.ok || !data || data.ok !== true) {
                  const errText =
                    (data && data.message) ||
                    (res.status === 403
                      ? "권한이 없거나 보안 토큰이 만료되었습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요."
                      : "구성원 등록 중 오류가 발생했습니다.");
                  await alertMsg(errText, "오류");
                  return;
                }
                const okMsg = userIds.length === 1
                  ? "구성원이 등록되었습니다."
                  : "구성원 " + userIds.length + "명이 등록되었습니다.";
                await alertMsg(okMsg);
                window.location.href = "/project/member/list";
              } catch (e) {
                await alertMsg("구성원 등록 중 오류가 발생했습니다.", "오류");
              } finally {
                registerBtn.disabled = false;
              }
            });
          }

          initDefaultStartDate();
          applyDateConstraints();
          renderPeriodHint();
          loadMembers();
        })();
      </script>
    </div>
  </body>
</html>
