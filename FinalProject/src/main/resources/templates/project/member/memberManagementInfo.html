<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/projectLayout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${editMode} ? '구성원 수정' : '구성원 상세'">구성원 상세</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.grid/latest/tui-grid.css" />
    <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
    <script src="https://uicdn.toast.com/tui.grid/latest/tui-grid.js"></script>
    <style>
      .mem-detail-form {
        --mem-label-w: 7rem;
        --mem-input-w: 16rem;
        --mem-font-size: 0.8125rem;
        --mem-input-bg: #f5f5f5;
        --mem-input-border: #d0d0d0;
      }
      .mem-info-page__back {
        display: inline-block;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: #1976d2;
        text-decoration: none;
      }
      .mem-info-page__back:hover {
        text-decoration: underline;
      }
      .mem-info-page__head {
        margin-bottom: 1.25rem;
      }
      .mem-info-page__title {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #222;
      }
      .mem-info-page__rule {
        height: 3px;
        background: #333;
        border: 0;
        margin: 0;
      }
      .mem-section {
        margin-bottom: 2rem;
      }
      .mem-section__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #222;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .mem-section__head-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.5rem;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .mem-section__head-row .mem-section__title {
        margin: 0;
        padding-bottom: 0;
        border-bottom: none;
      }
      .mem-section__head-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .mem-section__head-actions .mem-actions__btn {
        min-width: 4.5rem;
        padding: 0.35rem 1rem;
        font-size: 0.8125rem;
      }
      .mem-section__body {
        padding-top: 0.85rem;
      }
      .mem-basic-layout {
        display: flex;
        gap: 0.45rem;
        align-items: flex-start;
      }
      .mem-profile-slot {
        flex: 0 0 9.5rem;
        width: 9.5rem;
        height: 12rem;
        margin-left: 0.6rem;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aaa;
        font-size: 0.8125rem;
        text-align: center;
        line-height: 1.4;
      }
      .mem-basic-fields {
        flex: 0 1 auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .mem-detail-form .mem-field-row {
        display: grid;
        grid-template-columns: var(--mem-label-w) var(--mem-input-w);
        align-items: center;
        column-gap: 0.75rem;
        row-gap: 0.25rem;
      }
      .mem-detail-form .mem-field-row > label {
        font-size: var(--mem-font-size);
        color: #333;
        text-align: right;
        white-space: nowrap;
        line-height: 1.35;
      }
      .mem-detail-form .mem-field-row > label .req {
        color: #c62828;
      }
      .mem-detail-form .mem-field-row input[type="text"],
      .mem-detail-form .mem-field-row input[type="password"],
      .mem-detail-form .mem-period-inputs input[type="text"] {
        width: 100%;
        max-width: var(--mem-input-w);
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--mem-input-border);
        border-radius: 4px;
        background: var(--mem-input-bg);
        font-size: var(--mem-font-size);
        color: #333;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .mem-detail-form .mem-field-row input.mem-input--editable {
        background: #fff;
      }
      .mem-detail-form .mem-period-inputs input[type="text"] {
        max-width: none;
      }
      .mem-detail-form .mem-field-row input::placeholder,
      .mem-detail-form .mem-period-inputs input::placeholder {
        color: #aaa;
        font-size: var(--mem-font-size);
      }
      .mem-period-inputs {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        width: 100%;
        max-width: var(--mem-input-w);
      }
      .mem-period-inputs input {
        flex: 1 1 0;
        min-width: 0;
        max-width: 7.25rem;
      }
      .mem-period-inputs .mem-period-tilde {
        flex: 0 0 auto;
        color: #555;
        font-size: var(--mem-font-size);
        line-height: 1;
        padding: 0 0.1rem;
      }
      .mem-gender-group {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-size: var(--mem-font-size);
        color: #333;
        max-width: var(--mem-input-w);
      }
      .mem-gender-group label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        text-align: left;
        font-weight: normal;
        font-size: var(--mem-font-size);
      }
      .mem-account-inline {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1.75rem;
      }
      .mem-account-inline .mem-field-row {
        grid-template-columns: auto var(--mem-input-w);
        column-gap: 0.5rem;
      }
      .mem-account-inline .mem-field-row > label {
        white-space: nowrap;
        text-align: right;
      }
      .mem-section[aria-labelledby="mem-account-heading"] .mem-section__body,
      .mem-section[aria-labelledby="mem-project-heading"] .mem-section__body {
        padding-left: 1rem;
      }
      .mem-issue-grid {
        border: 1px solid #cfcfcf;
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
      }
      .mem-empty-msg {
        margin: 0.5rem 0 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .mem-actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem 0 0.5rem;
      }
      .mem-actions__btn {
        min-width: 5.5rem;
        padding: 0.45rem 1.5rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: #666;
        color: #fff;
        font-size: 0.875rem;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .mem-actions__btn:hover {
        background: #555;
        color: #fff;
      }
      .mem-actions__btn--secondary {
        background: #fff;
        color: #333;
      }
      .mem-actions__btn--secondary:hover {
        background: #f5f5f5;
        color: #333;
      }
      .mem-detail-form .mem-field-row input.mem-input--picker {
        cursor: pointer;
        background: #fff;
      }
      .mem-picker-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .mem-picker-overlay.is-open {
        display: flex;
      }
      .mem-picker {
        width: min(32rem, 92vw);
        max-height: 70vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .mem-picker__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .mem-picker__search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .mem-picker__search select,
      .mem-picker__search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .mem-picker__search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
        max-width: 7.5rem;
      }
      .mem-picker__search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .mem-picker__search .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .mem-picker__list {
        overflow: auto;
        padding: 0.5rem 1rem;
        flex: 1 1 auto;
      }
      .mem-picker__item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.5rem 0.65rem;
        margin: 0.15rem 0;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        font-size: 0.8125rem;
        color: #333;
        cursor: pointer;
        line-height: 1.4;
      }
      .mem-picker__item:hover {
        background: #f0f4f8;
        border-color: #d0d0d0;
      }
      .mem-picker__item-sub {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.75rem;
        color: #777;
      }
      .mem-picker__empty {
        margin: 0;
        padding: 0.5rem 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .mem-picker__actions {
        display: flex;
        justify-content: flex-end;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .mem-picker__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div layout:fragment="content">
      <a class="mem-info-page__back" th:href="@{/project/member/list}">← 구성원 목록으로</a>

      <header class="mem-info-page__head">
        <h1 class="mem-info-page__title" th:text="${editMode} ? '구성원 수정' : '구성원 상세'">구성원 상세</h1>
        <hr class="mem-info-page__rule" />
      </header>

      <th:block th:if="${!memberNotFound}">
        <section class="mem-section" aria-labelledby="mem-basic-heading">
          <h2 class="mem-section__title" id="mem-basic-heading">기본정보</h2>
          <div class="mem-section__body">
            <div class="mem-basic-layout">
              <div class="mem-profile-slot" title="프로필 이미지 영역">
                <img
                  th:if="${profileImageAttachId != null}"
                  th:src="@{/download/{id}(id=${profileImageAttachId})}"
                  alt="프로필 이미지"
                  style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px"
                />
                <span th:if="${profileImageAttachId == null}" aria-hidden="true">이미지</span>
              </div>
              <div class="mem-basic-fields mem-detail-form">
                <div class="mem-field-row">
                  <label for="detailUserName">이름 <span class="req">*</span></label>
                  <input type="text" id="detailUserName" readonly th:value="${detail.userName}" autocomplete="off" />
                </div>
                <div class="mem-field-row">
                  <label for="detailHireDate">입사일 <span class="req">*</span></label>
                  <input type="text" id="detailHireDate" readonly th:value="${detail.hireDate}" />
                </div>
                <div class="mem-field-row">
                  <label>성별 <span class="req">*</span></label>
                  <div class="mem-gender-group">
                    <label>
                      <input
                        type="radio"
                        name="gender"
                        value="01GENDER"
                        disabled
                        th:checked="${#strings.equalsIgnoreCase(detail.genderCd, '01GENDER')}"
                      />
                      남
                    </label>
                    <label>
                      <input type="radio" name="gender" value="02GENDER" disabled th:checked="${#strings.equalsIgnoreCase(detail.genderCd, '02GENDER')}" />
                      여
                    </label>
                  </div>
                </div>
                <div class="mem-field-row">
                  <label for="detailEmail">이메일 <span class="req">*</span></label>
                  <input type="text" id="detailEmail" readonly placeholder="aaa@aaa.com" th:value="${detail.email}" />
                </div>
                <div class="mem-field-row">
                  <label for="detailTel">연락처 <span class="req">*</span></label>
                  <input type="text" id="detailTel" readonly placeholder="010-xxxx-xxxx" th:value="${detail.tel}" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="mem-section" aria-labelledby="mem-account-heading">
          <h2 class="mem-section__title" id="mem-account-heading">계정 정보</h2>
          <div class="mem-section__body">
            <div class="mem-account-inline mem-detail-form">
              <div class="mem-field-row">
                <label for="detailLogin">아이디</label>
                <input type="text" id="detailLogin" readonly th:value="${detail.login != null and !#strings.isEmpty(detail.login) ? detail.login : '-'}" />
              </div>
              <div class="mem-field-row">
                <label for="detailLastLogin">마지막 접속일자</label>
                <input
                  type="text"
                  id="detailLastLogin"
                  readonly
                  placeholder="-"
                  th:value="${lastLoginOnYmd != null and !#strings.isEmpty(lastLoginOnYmd) ? lastLoginOnYmd : '-'}"
                />
              </div>
              <div class="mem-field-row">
                <label for="detailPwExpiry">패스워드 유효만료일</label>
                <input
                  type="text"
                  id="detailPwExpiry"
                  readonly
                  placeholder="-"
                  th:value="${pwUpdatedOnYmd != null and !#strings.isEmpty(pwUpdatedOnYmd) ? pwUpdatedOnYmd : '-'}"
                />
              </div>
            </div>
          </div>
        </section>


        <section class="mem-section" aria-labelledby="mem-project-heading">
          <div class="mem-section__head-row">
            <h2 class="mem-section__title" id="mem-project-heading">프로젝트 정보</h2>
            <div class="mem-section__head-actions" th:if="${viewMode}">
              <a class="mem-actions__btn" th:href="@{/project/member/info(userId=${userId}, grpId=${grpId}, edit=true)}">수정</a>
            </div>
            <div class="mem-section__head-actions" th:if="${editMode}">
              <button type="button" class="mem-actions__btn" id="btnMemberSave">저장</button>
              <a class="mem-actions__btn mem-actions__btn--secondary" th:href="@{/project/member/info(userId=${userId}, grpId=${grpId})}">취소</a>
            </div>
          </div>
          <div class="mem-section__body">
            <div class="mem-basic-fields mem-detail-form">
              <div class="mem-field-row">
                <label for="detailPrjName">프로젝트명 <span class="req">*</span></label>
                <input type="text" id="detailPrjName" readonly th:value="${detail.prjName}" />
              </div>
              <div class="mem-field-row">
                <label for="detailPrjStart">프로젝트 투입기간 <span class="req">*</span></label>
                <div class="mem-period-inputs">
                  <input
                    type="date"
                    id="detailPrjStart"
                    th:readonly="${viewMode}"
                    th:classappend="${editMode} ? 'mem-input--editable' : ''"
                    placeholder="연도-월-일"
                    th:value="${detail.prjStartDate}"
                  />
                  <span class="mem-period-tilde" aria-hidden="true">~</span>
                  <input
                    type="date"
                    id="detailPrjEnd"
                    th:readonly="${viewMode}"
                    th:classappend="${editMode} ? 'mem-input--editable' : ''"
                    placeholder="연도-월-일"
                    th:value="${detail.prjEndDate}"
                  />
                </div>
              </div>
              <div class="mem-field-row">
                <label for="detailGrpName">소속 그룹 <span class="req">*</span></label>
                <input
                  type="text"
                  id="detailGrpName"
                  th:readonly="${viewMode}"
                  th:classappend="${editMode} ? 'mem-input--editable mem-input--picker' : ''"
                  th:attr="placeholder=${editMode} ? '클릭하여 그룹을 선택하세요.' : ''"
                  th:value="${detail.grpName}"
                  autocomplete="off"
                />
                <input type="hidden" id="detailSelectedGrpId" name="grpId" th:if="${editMode}" th:value="${detail.grpId}" />
              </div>
            </div>
          </div>
        </section>

        <section th:if="${viewMode}" class="mem-section" aria-labelledby="mem-issues-heading">
          <h2 class="mem-section__title" id="mem-issues-heading">담당 이슈 정보</h2>
          <div class="mem-section__body">
            <div id="memberIssueGrid" class="mem-issue-grid" aria-label="담당 이슈 목록"></div>
            <script th:inline="javascript">
              window.memberIssueGridRows = /*[[${issues}]]*/ [];
            </script>
          </div>
        </section>

        <th:block th:if="${editMode}" th:replace="~{project/member/modal/memberGroupModal :: memberGroupPickOverlay}" />

        <th:block th:if="${editMode}">
          <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModal}"></th:block>
          <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModalScript}"></th:block>
        </th:block>

        <div
          th:if="${editMode}"
          id="memPageConfig"
          style="display: none"
          th:attr="data-prj-id=${prjId},data-user-id=${userId},data-old-grp-id=${grpId},data-initial-end=${detail != null ? detail.prjEndDate : ''},data-initial-grp-id=${detail != null ? detail.grpId : ''},data-initial-start=${detail != null ? detail.prjStartDate : ''},data-hire-date=${detail != null ? detail.hireDate : ''},data-prj-open=${session.project != null && session.project.startDate != null ? #dates.format(session.project.startDate, 'yyyy-MM-dd') : ''},data-prj-closed=${prjClosedDate != null ? prjClosedDate : (session.project != null && session.project.closedDate != null ? #dates.format(session.project.closedDate, 'yyyy-MM-dd') : '')}"
        ></div>

        <script th:if="${editMode}" th:src="@{/js/member/memberManagementInfo.js}"></script>
        <script th:if="${viewMode}" th:src="@{/js/member/memberIssueGrid.js}"></script>
      </th:block>
    </div>
  </body>
</html>
