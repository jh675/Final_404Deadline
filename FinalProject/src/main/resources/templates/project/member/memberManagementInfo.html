<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/projectLayout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${registerMode} ? '구성원 등록' : (${editMode} ? '구성원 수정' : '구성원 상세')">구성원 상세</title>
    <style>
      .mem-detail-form {
        --mem-label-w: 9.75rem;
        --mem-input-w: 16rem;
        --mem-font-size: 0.8125rem;
        --mem-input-bg: #f5f5f5;
        --mem-input-border: #d0d0d0;
      }
      .mem-info-page__back {
        display: inline-block;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: #1976d2;
        text-decoration: none;
      }
      .mem-info-page__back:hover {
        text-decoration: underline;
      }
      .mem-info-page__head {
        margin-bottom: 1.25rem;
      }
      .mem-info-page__title {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #222;
      }
      .mem-info-page__rule {
        height: 3px;
        background: #333;
        border: 0;
        margin: 0;
      }
      .mem-section {
        margin-bottom: 2rem;
      }
      .mem-section__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #222;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .mem-section__head-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.5rem;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .mem-section__head-row .mem-section__title {
        margin: 0;
        padding-bottom: 0;
        border-bottom: none;
      }
      .mem-section__head-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .mem-section__head-actions .mem-actions__btn {
        min-width: 4.5rem;
        padding: 0.35rem 1rem;
        font-size: 0.8125rem;
      }
      .mem-section__body {
        padding-top: 0.85rem;
      }
      .mem-basic-layout {
        display: flex;
        gap: 1.5rem;
        align-items: flex-start;
      }
      .mem-profile-slot {
        flex: 0 0 9.5rem;
        width: 9.5rem;
        height: 9.5rem;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aaa;
        font-size: 0.8125rem;
        text-align: center;
        line-height: 1.4;
      }
      .mem-basic-fields {
        flex: 0 1 auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .mem-detail-form .mem-field-row {
        display: grid;
        grid-template-columns: var(--mem-label-w) var(--mem-input-w);
        align-items: center;
        column-gap: 0.75rem;
        row-gap: 0.25rem;
      }
      .mem-detail-form .mem-field-row > label {
        font-size: var(--mem-font-size);
        color: #333;
        text-align: right;
        white-space: nowrap;
        line-height: 1.35;
      }
      .mem-detail-form .mem-field-row > label .req {
        color: #c62828;
      }
      .mem-detail-form .mem-field-row input[type="text"],
      .mem-detail-form .mem-field-row input[type="password"],
      .mem-detail-form .mem-period-inputs input[type="text"] {
        width: 100%;
        max-width: var(--mem-input-w);
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--mem-input-border);
        border-radius: 4px;
        background: var(--mem-input-bg);
        font-size: var(--mem-font-size);
        color: #333;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .mem-detail-form .mem-field-row input.mem-input--editable {
        background: #fff;
      }
      .mem-detail-form .mem-period-inputs input[type="text"] {
        max-width: none;
      }
      .mem-detail-form .mem-field-row input::placeholder,
      .mem-detail-form .mem-period-inputs input::placeholder {
        color: #aaa;
        font-size: var(--mem-font-size);
      }
      .mem-period-inputs {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        width: 100%;
        max-width: var(--mem-input-w);
      }
      .mem-period-inputs input {
        flex: 1 1 0;
        min-width: 0;
        max-width: 7.25rem;
      }
      .mem-period-inputs .mem-period-tilde {
        flex: 0 0 auto;
        color: #555;
        font-size: var(--mem-font-size);
        line-height: 1;
        padding: 0 0.1rem;
      }
      .mem-gender-group {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-size: var(--mem-font-size);
        color: #333;
        max-width: var(--mem-input-w);
      }
      .mem-gender-group label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        text-align: left;
        font-weight: normal;
        font-size: var(--mem-font-size);
      }
      .mem-account-inline {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1.75rem;
      }
      .mem-account-inline .mem-field-row {
        grid-template-columns: auto var(--mem-input-w);
        column-gap: 0.5rem;
      }
      .mem-account-inline .mem-field-row > label {
        white-space: nowrap;
        text-align: right;
      }
      .mem-data-table-wrap {
        overflow-x: auto;
        border: 1px solid #cfcfcf;
        border-radius: 4px;
        background: #fff;
      }
      .mem-data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8125rem;
        min-width: 72rem;
      }
      .mem-data-table th,
      .mem-data-table td {
        border: 1px solid #d8d8d8;
        padding: 0.45rem 0.5rem;
        text-align: center;
        vertical-align: middle;
        color: #333;
        white-space: nowrap;
      }
      .mem-data-table thead th {
        background: #f0f0f0;
        font-weight: 600;
      }
      .mem-data-table tbody tr:nth-child(even) {
        background: #fafafa;
      }
      .mem-data-table tbody td.empty {
        color: #999;
      }
      .mem-empty-msg {
        margin: 0.5rem 0 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .mem-actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem 0 0.5rem;
      }
      .mem-actions__btn {
        min-width: 5.5rem;
        padding: 0.45rem 1.5rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: #666;
        color: #fff;
        font-size: 0.875rem;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .mem-actions__btn:hover {
        background: #555;
        color: #fff;
      }
      .mem-actions__btn--secondary {
        background: #fff;
        color: #333;
      }
      .mem-actions__btn--secondary:hover {
        background: #f5f5f5;
        color: #333;
      }
      .mem-detail-form .mem-field-row input.mem-input--picker {
        cursor: pointer;
        background: #fff;
      }
      .mem-picker-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .mem-picker-overlay.is-open {
        display: flex;
      }
      .mem-picker {
        width: min(32rem, 92vw);
        max-height: 70vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .mem-picker__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .mem-picker__search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .mem-picker__search select,
      .mem-picker__search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .mem-picker__search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
        max-width: 7.5rem;
      }
      .mem-picker__search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .mem-picker__search .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .mem-picker__list {
        overflow: auto;
        padding: 0.5rem 1rem;
        flex: 1 1 auto;
      }
      .mem-picker__item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.5rem 0.65rem;
        margin: 0.15rem 0;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        font-size: 0.8125rem;
        color: #333;
        cursor: pointer;
        line-height: 1.4;
      }
      .mem-picker__item:hover {
        background: #f0f4f8;
        border-color: #d0d0d0;
      }
      .mem-picker__item-sub {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.75rem;
        color: #777;
      }
      .mem-picker__empty {
        margin: 0;
        padding: 0.5rem 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .mem-picker__actions {
        display: flex;
        justify-content: flex-end;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .mem-picker__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div layout:fragment="content">
      <a class="mem-info-page__back" th:href="@{/project/member/list}">← 구성원 목록으로</a>

      <header class="mem-info-page__head">
        <h1 class="mem-info-page__title" th:text="${registerMode} ? '구성원 등록' : (${editMode} ? '구성원 수정' : '구성원 상세')">구성원 상세</h1>
        <hr class="mem-info-page__rule" />
      </header>

      <th:block th:if="${registerMode or !memberNotFound}">
        <section class="mem-section" aria-labelledby="mem-basic-heading">
          <h2 class="mem-section__title" id="mem-basic-heading">기본정보</h2>
          <div class="mem-section__body">
            <div class="mem-basic-layout">
              <div class="mem-profile-slot" aria-hidden="true" title="프로필 이미지 영역">이미지</div>
              <div class="mem-basic-fields mem-detail-form">
                <input type="hidden" id="detailSelectedUserId" th:if="${registerMode or editMode}" th:value="${detail.userId}" />
                <div class="mem-field-row">
                  <label for="detailUserName">이름 <span class="req">*</span></label>
                  <input
                    type="text"
                    id="detailUserName"
                    th:readonly="${!registerMode}"
                    th:classappend="${registerMode} ? 'mem-input--editable mem-input--picker' : ''"
                    th:attr="placeholder=${registerMode} ? '클릭하여 직원을 선택하세요.' : ''"
                    th:value="${detail.userName}"
                    autocomplete="off"
                  />
                </div>
                <div class="mem-field-row">
                  <label for="detailHireDate">입사일 <span class="req">*</span></label>
                  <input
                    type="text"
                    id="detailHireDate"
                    readonly
                    th:attr="placeholder=${registerMode or editMode} ? '직원 선택 시 자동 입력' : ''"
                    th:value="${detail.hireDate}"
                  />
                </div>
                <div class="mem-field-row">
                  <label>성별 <span class="req">*</span></label>
                  <div class="mem-gender-group">
                    <label>
                      <input
                        type="radio"
                        name="gender"
                        value="01GENDER"
                        disabled
                        th:checked="${#strings.equalsIgnoreCase(detail.genderCd, '01GENDER') or (registerMode and detail.genderCd == null)}"
                      />
                      남
                    </label>
                    <label>
                      <input type="radio" name="gender" value="02GENDER" disabled th:checked="${#strings.equalsIgnoreCase(detail.genderCd, '02GENDER')}" />
                      여
                    </label>
                  </div>
                </div>
                <div class="mem-field-row">
                  <label for="detailEmail">이메일 <span class="req">*</span></label>
                  <input type="text" id="detailEmail" readonly placeholder="aaa@aaa.com" th:value="${detail.email}" />
                </div>
                <div class="mem-field-row">
                  <label for="detailTel">연락처 <span class="req">*</span></label>
                  <input type="text" id="detailTel" readonly placeholder="010-xxxx-xxxx" th:value="${detail.tel}" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <section th:if="${viewMode or editMode}" class="mem-section" aria-labelledby="mem-account-heading">
          <h2 class="mem-section__title" id="mem-account-heading">계정 정보</h2>
          <div class="mem-section__body">
            <div class="mem-account-inline mem-detail-form">
              <div class="mem-field-row">
                <label for="detailLogin">아이디</label>
                <input type="text" id="detailLogin" readonly th:value="${detail.login != null and !#strings.isEmpty(detail.login) ? detail.login : '-'}" />
              </div>
              <div class="mem-field-row">
                <label for="detailLastLogin">마지막 접속일자</label>
                <input
                  type="text"
                  id="detailLastLogin"
                  readonly
                  placeholder="-"
                  th:value="${lastLoginOnYmd != null and !#strings.isEmpty(lastLoginOnYmd) ? lastLoginOnYmd : '-'}"
                />
              </div>
              <div class="mem-field-row">
                <label for="detailPwExpiry">패스워드 유효만료일</label>
                <input
                  type="text"
                  id="detailPwExpiry"
                  readonly
                  placeholder="-"
                  th:value="${pwUpdatedOnYmd != null and !#strings.isEmpty(pwUpdatedOnYmd) ? pwUpdatedOnYmd : '-'}"
                />
              </div>
            </div>
          </div>
        </section>


        <section class="mem-section" aria-labelledby="mem-project-heading">
          <div class="mem-section__head-row">
            <h2 class="mem-section__title" id="mem-project-heading">프로젝트 정보</h2>
            <div class="mem-section__head-actions" th:if="${viewMode}">
              <a class="mem-actions__btn" th:href="@{/project/member/info(userId=${userId}, grpId=${grpId}, edit=true)}">수정</a>
            </div>
            <div class="mem-section__head-actions" th:if="${editMode}">
              <button type="button" class="mem-actions__btn" id="btnMemberSave">저장</button>
              <a class="mem-actions__btn mem-actions__btn--secondary" th:href="@{/project/member/info(userId=${userId}, grpId=${grpId})}">취소</a>
            </div>
          </div>
          <div class="mem-section__body">
            <div class="mem-basic-fields mem-detail-form">
              <div class="mem-field-row">
                <label for="detailPrjName">프로젝트명 <span class="req">*</span></label>
                <input
                  type="text"
                  id="detailPrjName"
                  readonly
                  th:attr="placeholder=${registerMode} ? '텍스트를 입력해 주세요.' : ''"
                  th:value="${detail.prjName}"
                />
              </div>
              <div class="mem-field-row">
                <label for="detailPrjStart">프로젝트 투입기간 <span class="req">*</span></label>
                <div class="mem-period-inputs">
                  <input
                    type="date"
                    id="detailPrjStart"
                    th:readonly="${viewMode or editMode}"
                    th:classappend="${registerMode} ? 'mem-input--editable' : ''"
                    placeholder="연도-월-일"
                    th:value="${registerMode and (detail.prjStartDate == null or #strings.isEmpty(detail.prjStartDate)) ? #dates.format(#dates.createToday(), 'yyyy-MM-dd') : detail.prjStartDate}"
                  />
                  <span class="mem-period-tilde" aria-hidden="true">~</span>
                  <input
                    type="date"
                    id="detailPrjEnd"
                    th:readonly="${viewMode}"
                    th:classappend="${registerMode or editMode} ? 'mem-input--editable' : ''"
                    placeholder="연도-월-일"
                    th:value="${detail.prjEndDate}"
                  />
                </div>
              </div>
              <div class="mem-field-row">
                <label for="detailGrpName">소속 그룹 <span class="req">*</span></label>
                <input
                  type="text"
                  id="detailGrpName"
                  th:readonly="${viewMode}"
                  th:classappend="${registerMode or editMode} ? 'mem-input--editable mem-input--picker' : ''"
                  th:attr="placeholder=${registerMode or editMode} ? '클릭하여 그룹을 선택하세요.' : ''"
                  th:value="${detail.grpName}"
                  autocomplete="off"
                />
                <input type="hidden" id="detailSelectedGrpId" name="grpId" th:if="${registerMode or editMode}" th:value="${detail.grpId}" />
              </div>
            </div>
          </div>
        </section>

        <section th:if="${viewMode}" class="mem-section" aria-labelledby="mem-issues-heading">
          <h2 class="mem-section__title" id="mem-issues-heading">담당 이슈 정보</h2>
          <div class="mem-section__body">
            <div class="mem-data-table-wrap">
              <table class="mem-data-table" aria-label="담당 이슈 목록">
                <thead>
                  <tr>
                    <th scope="col">우선순위</th>
                    <th scope="col">이슈명</th>
                    <th scope="col">이슈 타입</th>
                    <th scope="col">이슈 상태</th>
                    <th scope="col">이슈 신청자</th>
                    <th scope="col">이슈 담당자</th>
                    <th scope="col">시작예정일</th>
                    <th scope="col">마감희망일</th>
                    <th scope="col">시작일</th>
                    <th scope="col">마감일</th>
                    <th scope="col">진척율(%)</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="issue, stat : ${issues}">
                    <td th:text="${issue.priorityCd} ?: '-'">-</td>
                    <td th:text="${issue.subject} ?: '-'">-</td>
                    <td th:text="${issue.categoryCd} ?: '-'">-</td>
                    <td th:text="${issue.statusCd} ?: '-'">-</td>
                    <td th:text="${issue.requesterName != null and !#strings.isEmpty(issue.requesterName)} ? issue.requesterName : '-'">
                      -
                    </td>
                    <td th:text="${issue.assigneeName} ?: '-'">-</td>
                    <td th:text="${issue.estStartDate != null ? #dates.format(issue.estStartDate, 'yyyy-MM-dd') : '-'}">
                      -
                    </td>
                    <td th:text="${issue.dueDate != null ? #dates.format(issue.dueDate, 'yyyy-MM-dd') : '-'}">
                      -
                    </td>
                    <td th:text="${issue.startDate != null ? #dates.format(issue.startDate, 'yyyy-MM-dd') : '-'}">
                      -
                    </td>
                    <td th:text="${issue.closedDate != null ? #dates.format(issue.closedDate, 'yyyy-MM-dd') : '-'}">
                      -
                    </td>
                    <td th:text="${issue.doneRatio != null ? issue.doneRatio : '-'}">
                      -
                    </td>
                  </tr>
                  <tr th:if="${issues == null or issues.isEmpty()}">
                    <td colspan="11" class="empty">담당 이슈가 없습니다.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <div class="mem-actions" th:if="${registerMode}">
          <button type="button" class="mem-actions__btn" id="btnMemberRegister">등록</button>
          <a class="mem-actions__btn mem-actions__btn--secondary" th:href="@{/project/member/list}">취소</a>
        </div>

        <th:block th:if="${registerMode}" th:replace="~{project/member/modal/memberInfoModal :: memberInfoPickOverlay}" />
        <th:block th:if="${registerMode or editMode}" th:replace="~{project/member/modal/memberGroupModal :: memberGroupPickOverlay}" />

        <th:block th:if="${registerMode or editMode}">
          <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModal}"></th:block>
          <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModalScript}"></th:block>
        </th:block>

        <div
          th:if="${registerMode or editMode}"
          id="memPageConfig"
          style="display: none"
          th:attr="data-prj-id=${prjId},data-register-mode=${registerMode},data-edit-mode=${editMode},data-user-id=${userId},data-old-grp-id=${grpId},data-initial-end=${detail != null ? detail.prjEndDate : ''},data-initial-grp-id=${detail != null ? detail.grpId : ''}"
        ></div>

        <script th:if="${registerMode or editMode}">
          (function () {
            const cfg = document.getElementById("memPageConfig");
            if (!cfg) return;

            const prjId = Number(cfg.dataset.prjId || 0);
            const registerMode = cfg.dataset.registerMode === "true";
            const editMode = cfg.dataset.editMode === "true";
            const pageUserId = cfg.dataset.userId
              ? Number(cfg.dataset.userId)
              : null;
            const pageOldGrpId = cfg.dataset.oldGrpId
              ? Number(cfg.dataset.oldGrpId)
              : null;

            function mountPickerOverlay(el) {
              if (el && el.parentElement !== document.body) {
                document.body.appendChild(el);
              }
            }

            function attachPickerOpen(inputEl, openFn) {
              if (!inputEl || typeof openFn !== "function") return;
              inputEl.addEventListener("click", function (e) {
                e.preventDefault();
                openFn();
              });
            }

            const nameInput = document.getElementById("detailUserName");
            const hireInput = document.getElementById("detailHireDate");
            const prjStartInput = document.getElementById("detailPrjStart");
            const prjEndInput = document.getElementById("detailPrjEnd");
            const emailInput = document.getElementById("detailEmail");
            const telInput = document.getElementById("detailTel");
            const userIdInput = document.getElementById("detailSelectedUserId");
            const grpInput = document.getElementById("detailGrpName");
            const grpIdInput = document.getElementById("detailSelectedGrpId");
            let pickOverlay = document.getElementById("memMemberPickOverlay");
            const pickList = document.getElementById("memMemberPickList");
            const pickCancel = document.getElementById("btnMemberPickCancel");
            const memberSearchType = document.getElementById(
              "memMemberSearchType",
            );
            const memberSearchKeyword = document.getElementById(
              "memMemberSearchKeyword",
            );
            let groupOverlay = document.getElementById("memGroupPickOverlay");
            const groupPickList = document.getElementById("memGroupPickList");
            const groupPickCancel = document.getElementById("btnGroupPickCancel");

            mountPickerOverlay(pickOverlay);
            mountPickerOverlay(groupOverlay);
            const groupSearchType = document.getElementById("memGroupSearchType");
            const groupSearchKeyword = document.getElementById(
              "memGroupSearchKeyword",
            );
            let allCompanyMembers = [];
            let allGroups = [];

            function includesKeyword(value, keyword) {
              if (!keyword) return true;
              const text =
                value == null ? "" : String(value).trim().toLowerCase();
              return text.indexOf(keyword) !== -1;
            }

            function filterCompanyMembers(rows) {
              const type = memberSearchType
                ? memberSearchType.value
                : "userName";
              const keyword = memberSearchKeyword
                ? memberSearchKeyword.value.trim().toLowerCase()
                : "";
              if (!keyword) return rows;
              return rows.filter(function (r) {
                if (type === "userId") {
                  return includesKeyword(r.userId, keyword);
                }
                if (type === "tel") {
                  return includesKeyword(r.tel, keyword);
                }
                if (type === "email") {
                  return includesKeyword(r.email, keyword);
                }
                return includesKeyword(r.userName, keyword);
              });
            }

            function filterGroups(rows) {
              const type = groupSearchType ? groupSearchType.value : "grpName";
              const keyword = groupSearchKeyword
                ? groupSearchKeyword.value.trim().toLowerCase()
                : "";
              if (!keyword) return rows;
              return rows.filter(function (r) {
                if (type === "id") {
                  return includesKeyword(r.id, keyword);
                }
                return includesKeyword(r.grpName, keyword);
              });
            }

            function resetMemberSearch() {
              if (memberSearchType) memberSearchType.value = "userName";
              if (memberSearchKeyword) memberSearchKeyword.value = "";
            }

            function resetGroupSearch() {
              if (groupSearchType) groupSearchType.value = "grpName";
              if (groupSearchKeyword) groupSearchKeyword.value = "";
            }

            function todayYmd() {
              const d = new Date();
              const y = d.getFullYear();
              const m = String(d.getMonth() + 1).padStart(2, "0");
              const day = String(d.getDate()).padStart(2, "0");
              return y + "-" + m + "-" + day;
            }

            function normalizeYmd(value) {
              if (value == null) return "";
              const s = String(value).trim();
              if (!s) return "";
              if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
              const d = new Date(s);
              if (isNaN(d.getTime())) return "";
              const y = d.getFullYear();
              const m = String(d.getMonth() + 1).padStart(2, "0");
              const day = String(d.getDate()).padStart(2, "0");
              return y + "-" + m + "-" + day;
            }

            const initialPrjEndYmd = editMode
              ? normalizeYmd(cfg.dataset.initialEnd || "")
              : "";
            const initialGrpId =
              editMode && cfg.dataset.initialGrpId
                ? Number(cfg.dataset.initialGrpId)
                : null;

            function maxYmd(a, b) {
              if (!a) return b || "";
              if (!b) return a;
              return a >= b ? a : b;
            }

            function syncPrjStartConstraints() {
              if (!prjStartInput) return;
              const hireYmd = hireInput
                ? normalizeYmd(hireInput.value)
                : "";
              if (hireYmd) {
                prjStartInput.min = hireYmd;
              } else {
                prjStartInput.removeAttribute("min");
              }
              let current = normalizeYmd(prjStartInput.value);
              if (!current && registerMode) {
                current = todayYmd();
              }
              if (hireYmd && current && current < hireYmd) {
                current = hireYmd;
              }
              if (current) {
                prjStartInput.value = current;
              }
              syncPrjEndConstraints();
            }

            function syncPrjEndConstraints() {
              if (!prjEndInput) return;
              const start = prjStartInput
                ? normalizeYmd(prjStartInput.value)
                : "";
              if (start) {
                prjEndInput.min = start;
              } else {
                prjEndInput.removeAttribute("min");
              }
              let end = normalizeYmd(prjEndInput.value);
              if (start && end && end < start) {
                end = start;
              }
              if (end) {
                prjEndInput.value = end;
              }
            }

            function initPrjStartDate() {
              if (!prjStartInput) return;
              if (registerMode && !normalizeYmd(prjStartInput.value)) {
                prjStartInput.value = todayYmd();
              }
              syncPrjStartConstraints();
            }

            function setGender(genderCd) {
              const radios = document.querySelectorAll('input[name="gender"]');
              if (!radios.length) return;
              const code = (genderCd || "").toUpperCase();
              let matched = false;
              radios.forEach(function (radio) {
                const on =
                  code && (radio.value || "").toUpperCase() === code;
                radio.checked = on;
                if (on) matched = true;
              });
              if (!matched && radios[0]) {
                radios[0].checked = true;
              }
            }

            function applyCompanyMember(member) {
              if (!member) return;
              if (member.userName != null) {
                nameInput.value = member.userName;
              }
              if (hireInput && member.hireDate != null) {
                hireInput.value = member.hireDate;
              }
              if (emailInput && member.email != null) {
                emailInput.value = member.email;
              }
              if (telInput && member.tel != null) {
                telInput.value = member.tel;
              }
              if (userIdInput && member.userId != null) {
                userIdInput.value = String(member.userId);
              }
              setGender(member.genderCd);
              syncPrjStartConstraints();
            }

            function resolveGroupId(row) {
              if (!row) return null;
              const raw =
                row.id != null && row.id !== ""
                  ? row.id
                  : row.grpId != null && row.grpId !== ""
                    ? row.grpId
                    : null;
              if (raw == null) return null;
              const n = Number(raw);
              return isNaN(n) ? null : n;
            }

            function applyGroup(row) {
              if (!row) return;
              const gid = resolveGroupId(row);
              if (grpInput) {
                grpInput.value = row.grpName != null ? String(row.grpName) : "";
              }
              if (grpIdInput) {
                grpIdInput.value = gid != null ? String(gid) : "";
              }
            }

            function closeMemberPicker() {
              if (!pickOverlay) return;
              pickOverlay.classList.remove("is-open");
              pickOverlay.setAttribute("aria-hidden", "true");
            }

            function renderCompanyMemberList(rows, emptyMessage) {
              if (!pickList) return;
              pickList.innerHTML = "";
              if (!rows.length) {
                const p = document.createElement("p");
                p.className = "mem-picker__empty";
                p.textContent =
                  emptyMessage || "선택할 직원이 없습니다.";
                pickList.appendChild(p);
                return;
              }
              rows.forEach(function (r) {
                if (r.userId == null) return;
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "mem-picker__item";
                const main = document.createElement("span");
                main.textContent = r.userName || "(이름 없음)";
                btn.appendChild(main);
                const subParts = [];
                if (r.email) subParts.push(r.email);
                if (r.tel) subParts.push(r.tel);
                if (subParts.length) {
                  const sub = document.createElement("span");
                  sub.className = "mem-picker__item-sub";
                  sub.textContent = subParts.join(" · ");
                  btn.appendChild(sub);
                }
                btn.addEventListener("click", function () {
                  applyCompanyMember(r);
                  closeMemberPicker();
                });
                pickList.appendChild(btn);
              });
            }

            function refreshCompanyMemberListView() {
              const filtered = filterCompanyMembers(allCompanyMembers);
              renderCompanyMemberList(
                filtered,
                allCompanyMembers.length
                  ? "검색 결과가 없습니다."
                  : registerMode
                    ? "등록 가능한 구성원이 없습니다."
                    : "선택할 구성원이 없습니다.",
              );
            }

            async function openMemberPicker() {
              if (!pickOverlay || !pickList) return;
              const pid = Number(prjId);
              if (isNaN(pid)) return;
              resetMemberSearch();
              pickList.innerHTML = "불러오는 중…";
              pickOverlay.classList.add("is-open");
              pickOverlay.setAttribute("aria-hidden", "false");
              try {
                let membersUrl = "/project/member/companyMembers";
                if (registerMode) {
                  membersUrl += "?excludeRegistered=true";
                }
                const res = await fetch(membersUrl, {
                  credentials: "same-origin",
                });
                const data = await res.json().catch(function () {
                  return {};
                });
                allCompanyMembers =
                  data && Array.isArray(data.content) ? data.content : [];
                refreshCompanyMemberListView();
              } catch (e) {
                allCompanyMembers = [];
                pickList.innerHTML = "";
                const p = document.createElement("p");
                p.className = "mem-picker__empty";
                p.textContent = "구성원 목록을 불러오지 못했습니다.";
                pickList.appendChild(p);
              }
            }

            if (registerMode && pickList) {
              if (memberSearchType) {
                memberSearchType.addEventListener(
                  "change",
                  refreshCompanyMemberListView,
                );
              }
              if (memberSearchKeyword) {
                memberSearchKeyword.addEventListener(
                  "input",
                  refreshCompanyMemberListView,
                );
              }

              attachPickerOpen(nameInput, openMemberPicker);

              if (pickCancel) {
                pickCancel.addEventListener("click", closeMemberPicker);
              }

              if (pickOverlay) {
                pickOverlay.addEventListener("click", function (e) {
                  if (e.target === pickOverlay) {
                    closeMemberPicker();
                  }
                });
              }
            }

            /* ----- 프로젝트 내 그룹 선택 ----- */
            function closeGroupPicker() {
              if (!groupOverlay) return;
              groupOverlay.classList.remove("is-open");
              groupOverlay.setAttribute("aria-hidden", "true");
            }

            function renderGroupList(rows, emptyMessage) {
              if (!groupPickList) return;
              groupPickList.innerHTML = "";
              if (!rows.length) {
                const p = document.createElement("p");
                p.className = "mem-picker__empty";
                p.textContent = emptyMessage || "선택할 그룹이 없습니다.";
                groupPickList.appendChild(p);
                return;
              }
              let rendered = 0;
              rows.forEach(function (r) {
                const gid = resolveGroupId(r);
                if (gid == null) return;
                rendered += 1;
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "mem-picker__item";
                btn.dataset.grpId = String(gid);
                btn.dataset.grpName = r.grpName || "";
                const main = document.createElement("span");
                main.textContent = r.grpName || "(이름 없음)";
                btn.appendChild(main);
                const sub = document.createElement("span");
                sub.className = "mem-picker__item-sub";
                sub.textContent = "그룹 ID: " + String(gid);
                btn.appendChild(sub);
                btn.addEventListener("click", function () {
                  applyGroup(r);
                  closeGroupPicker();
                });
                groupPickList.appendChild(btn);
              });
              if (rendered === 0) {
                const p = document.createElement("p");
                p.className = "mem-picker__empty";
                p.textContent = "표시할 그룹 정보가 없습니다.";
                groupPickList.appendChild(p);
              }
            }

            function refreshGroupListView() {
              const filtered = filterGroups(allGroups);
              renderGroupList(
                filtered,
                allGroups.length
                  ? "검색 결과가 없습니다."
                  : "선택할 그룹이 없습니다.",
              );
            }

            async function openGroupPicker() {
              if (!groupOverlay || !groupPickList) return;
              const pid = Number(prjId);
              if (isNaN(pid)) return;
              resetGroupSearch();
              groupPickList.innerHTML = "불러오는 중…";
              groupOverlay.classList.add("is-open");
              groupOverlay.setAttribute("aria-hidden", "false");
              try {
                const res = await fetch(
                  "/project/member/projectGroups",
                  { credentials: "same-origin" },
                );
                const data = await res.json().catch(function () {
                  return {};
                });
                allGroups =
                  data && Array.isArray(data.content) ? data.content : [];
                refreshGroupListView();
              } catch (e) {
                allGroups = [];
                groupPickList.innerHTML = "";
                const p = document.createElement("p");
                p.className = "mem-picker__empty";
                p.textContent = "그룹 목록을 불러오지 못했습니다.";
                groupPickList.appendChild(p);
              }
            }

            if (groupSearchType) {
              groupSearchType.addEventListener("change", refreshGroupListView);
            }
            if (groupSearchKeyword) {
              groupSearchKeyword.addEventListener("input", refreshGroupListView);
            }

            if ((registerMode || editMode) && groupPickList) {
              attachPickerOpen(grpInput, openGroupPicker);
            }

            if (groupPickCancel) {
              groupPickCancel.addEventListener("click", closeGroupPicker);
            }

            if (groupOverlay) {
              groupOverlay.addEventListener("click", function (e) {
                if (e.target === groupOverlay) {
                  closeGroupPicker();
                }
              });
            }

            initPrjStartDate();

            if (registerMode && prjStartInput) {
              prjStartInput.addEventListener("change", syncPrjStartConstraints);
              prjStartInput.addEventListener("input", syncPrjStartConstraints);
            }

            if (prjEndInput) {
              prjEndInput.addEventListener("change", syncPrjEndConstraints);
              prjEndInput.addEventListener("input", syncPrjEndConstraints);
            }

            function buildCsrfHeaders() {
              const headers = { "Content-Type": "application/json" };
              const tokenMeta = document.querySelector('meta[name="_csrf"]');
              const headerMeta = document.querySelector(
                'meta[name="_csrf_header"]',
              );
              if (
                tokenMeta &&
                headerMeta &&
                tokenMeta.content &&
                headerMeta.content
              ) {
                headers[headerMeta.content] = tokenMeta.content;
              }
              return headers;
            }

            function alertMsg(msg, title) {
              if (window.MemberQuestionModal && window.MemberQuestionModal.alert) {
                return window.MemberQuestionModal.alert(msg, title || "알림");
              }
              return Promise.resolve();
            }

            function confirmMsg(msg, title) {
              if (window.MemberQuestionModal && window.MemberQuestionModal.confirm) {
                return window.MemberQuestionModal.confirm(msg, title || "확인");
              }
              return Promise.resolve(false);
            }

            function isEditEndChanged(currentEndYmd) {
              return normalizeYmd(currentEndYmd) !== normalizeYmd(initialPrjEndYmd);
            }

            function isEditGrpChanged(currentGrpId) {
              const init =
                initialGrpId != null && initialGrpId !== ""
                  ? Number(initialGrpId)
                  : NaN;
              const cur = Number(currentGrpId);
              if (isNaN(init) || isNaN(cur)) {
                return false;
              }
              return init !== cur;
            }

            function buildEditConfirmMessage(endYmd, grpName, endChanged, grpChanged) {
              const lines = ["변경사항은 다음과 같습니다."];
              if (endChanged) {
                const display = endYmd ? endYmd : "(없음)";
                lines.push("- 종료일자: " + display);
              }
              if (grpChanged) {
                const name =
                  grpName && String(grpName).trim()
                    ? String(grpName).trim()
                    : "(이름 없음)";
                lines.push("- 소속그룹: " + name);
              }
              return lines.join("\n");
            }

            const registerBtn = document.getElementById("btnMemberRegister");
            if (registerMode && registerBtn) {
              registerBtn.addEventListener("click", async function () {
                const pid = Number(prjId);
                const uid = userIdInput
                  ? Number(userIdInput.value)
                  : NaN;
                const gid = grpIdInput ? Number(grpIdInput.value) : NaN;
                const start = prjStartInput
                  ? normalizeYmd(prjStartInput.value)
                  : "";
                const end = prjEndInput
                  ? normalizeYmd(prjEndInput.value)
                  : "";

                if (isNaN(pid)) {
                  await alertMsg("프로젝트 ID가 올바르지 않습니다.", "알림");
                  return;
                }
                if (isNaN(uid) || !userIdInput || !userIdInput.value.trim()) {
                  await alertMsg("직원을 선택하세요.", "알림");
                  return;
                }
                if (isNaN(gid) || !grpIdInput || !grpIdInput.value.trim()) {
                  await alertMsg("소속 그룹을 선택하세요.", "알림");
                  return;
                }
                if (!start) {
                  await alertMsg("프로젝트 투입일을 입력하세요.", "알림");
                  return;
                }
                const hireYmd = hireInput
                  ? normalizeYmd(hireInput.value)
                  : "";
                if (hireYmd && start < hireYmd) {
                  await alertMsg(
                    "프로젝트 투입일은 입사일 이후여야 합니다.",
                    "알림",
                  );
                  return;
                }
                if (end && end < start) {
                  await alertMsg(
                    "프로젝트 종료일은 투입일 이후여야 합니다.",
                    "알림",
                  );
                  return;
                }

                const payload = {
                  userId: uid,
                  grpId: gid,
                  prjStartDate: start,
                  prjEndDate: end || null,
                };

                registerBtn.disabled = true;
                try {
                  const res = await fetch("/project/member/registerMember", {
                    method: "POST",
                    headers: buildCsrfHeaders(),
                    credentials: "same-origin",
                    body: JSON.stringify(payload),
                  });
                  const data = await res.json().catch(function () {
                    return {};
                  });
                  if (!res.ok || !data || data.ok !== true) {
                    const errText =
                      (data && data.message) ||
                      (res.status === 403
                        ? "권한이 없거나 보안 토큰이 만료되었습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요."
                        : "구성원 등록 중 오류가 발생했습니다.");
                    await alertMsg(errText, "오류");
                    return;
                  }
                  await alertMsg("구성원이 등록되었습니다.", "알림");
                  window.location.href = "/project/member/list";
                } catch (e) {
                  await alertMsg("구성원 등록 중 오류가 발생했습니다.", "오류");
                } finally {
                  registerBtn.disabled = false;
                }
              });
            }

            const saveBtn = document.getElementById("btnMemberSave");
            if (editMode && saveBtn) {
              saveBtn.addEventListener("click", async function () {
                const pid = Number(prjId);
                const uid = Number(pageUserId);
                const oldGid = Number(pageOldGrpId);
                const gid = grpIdInput ? Number(grpIdInput.value) : NaN;
                const start = prjStartInput
                  ? normalizeYmd(prjStartInput.value)
                  : "";
                const end = prjEndInput
                  ? normalizeYmd(prjEndInput.value)
                  : "";

                if (isNaN(pid)) {
                  await alertMsg("프로젝트 ID가 올바르지 않습니다.", "알림");
                  return;
                }
                if (isNaN(uid)) {
                  await alertMsg("구성원 정보가 올바르지 않습니다.", "알림");
                  return;
                }
                if (isNaN(oldGid)) {
                  await alertMsg("기존 그룹 정보가 올바르지 않습니다.", "알림");
                  return;
                }
                if (isNaN(gid) || !grpIdInput || !grpIdInput.value.trim()) {
                  await alertMsg("소속 그룹을 선택하세요.", "알림");
                  return;
                }
                if (!start) {
                  await alertMsg("프로젝트 투입 시작일 정보가 없습니다.", "알림");
                  return;
                }
                if (end && end < start) {
                  await alertMsg(
                    "프로젝트 종료일은 투입 시작일 이후여야 합니다.",
                    "알림",
                  );
                  return;
                }

                const grpName = grpInput
                  ? String(grpInput.value || "").trim()
                  : "";
                const endChanged = isEditEndChanged(end);
                const grpChanged = isEditGrpChanged(gid);
                if (!endChanged && !grpChanged) {
                  await alertMsg("변경된 내용이 없습니다.", "알림");
                  return;
                }

                const confirmed = await confirmMsg(
                  buildEditConfirmMessage(end, grpName, endChanged, grpChanged),
                  "확인",
                );
                if (!confirmed) {
                  return;
                }

                const payload = {
                  userId: uid,
                  oldGrpId: oldGid,
                  grpId: gid,
                  prjEndDate: end || null,
                };

                saveBtn.disabled = true;
                try {
                  const res = await fetch("/project/member/updateMember", {
                    method: "POST",
                    headers: buildCsrfHeaders(),
                    credentials: "same-origin",
                    body: JSON.stringify(payload),
                  });
                  const data = await res.json().catch(function () {
                    return {};
                  });
                  if (!res.ok || !data || data.ok !== true) {
                    const errText =
                      (data && data.message) ||
                      (res.status === 403
                        ? "권한이 없거나 보안 토큰이 만료되었습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요."
                        : "구성원 수정 중 오류가 발생했습니다.");
                    await alertMsg(errText, "오류");
                    return;
                  }
                  await alertMsg("구성원 정보가 수정되었습니다.", "알림");
                  window.location.href =
                    "/project/member/info?userId=" +
                    encodeURIComponent(String(uid)) +
                    "&grpId=" +
                    encodeURIComponent(String(gid));
                } catch (e) {
                  await alertMsg("구성원 수정 중 오류가 발생했습니다.", "오류");
                } finally {
                  saveBtn.disabled = false;
                }
              });
            }
          })();
        </script>
      </th:block>
    </div>
  </body>
</html>
