<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/projectLayout}">
  <head>
    <meta charset="UTF-8" />
    <title>프로젝트 구성원 관리</title>
    <th:block layout:fragment="head-content">
      <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
      <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
      <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
      <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
      <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
      <link rel="stylesheet" th:href="@{/css/project/issue.css}" />
      <link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
      <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
      <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
      <script th:src="@{/js/common/gridTheme.js}"></script>
      <script th:inline="javascript">
        /*<![CDATA[*/
        window.memberListPageData = {
          prjId: /*[[${session.currentProjectId}]]*/ null,
          rows: /*[[${rows}]]*/ [],
          panelUrl: /*[[@{/project/member/panel}]]*/ "/project/member/panel"
        };
        /*]]>*/
      </script>
    </th:block>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="issue-shell issue-shell--list">
        <div id="wrapper" class="issue-list">
          <header class="issue-list__header">
            <h1 class="issue-list__title">프로젝트 구성원 관리</h1>
          </header>

          <section class="issue-section issue-section--filter" aria-label="구성원 검색">
            <form id="memberSearchForm" method="get" th:action="@{/project/member/list}" class="issue-filter-form">
              <div class="issue-field">
                <label for="memberName">이름</label>
                <input type="text" id="memberName" name="memberName" th:value="${memberName}" placeholder="이름" autocomplete="off"/>
              </div>
              <div class="issue-field">
                <label for="grpName">소속</label>
                <input type="text" id="grpName" name="grpName" th:value="${grpName}" placeholder="소속 그룹명" autocomplete="off"/>
              </div>
              <div class="issue-filter-buttons">
                <button type="submit" class="btn btn-primary">검색</button>
                <a th:href="@{/project/member/list}" class="btn btn-secondary">초기화</a>
              </div>
            </form>
          </section>

          <section class="issue-section issue-section--grid role-list-split-section" aria-label="프로젝트 구성원 목록">
            <div class="role-list-split">
              <div class="role-list-split__grid">
                <div id="memberGrid" role="region" aria-label="프로젝트 구성원 그리드"></div>
              </div>
              <aside
                id="memberDetailAside"
                class="role-list-split__detail role-list-split__detail--member is-hidden"
                aria-label="구성원 상세"
              >
                <div class="role-list-split__detail-head">
                  <h2 class="role-list-split__detail-title">구성원 상세</h2>
                  <button
                    type="button"
                    id="memberDetailCloseBtn"
                    class="role-list-split__detail-close"
                    aria-label="상세 닫기"
                  >
                    ×
                  </button>
                </div>
                <iframe
                  id="memberDetailPanelFrame"
                  class="role-list-split__detail-frame is-hidden"
                  title="구성원 상세"
                ></iframe>
              </aside>
            </div>
          </section>
        </div>
      </div>

      <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModal}"></th:block>
      <th:block th:replace="~{project/member/modal/questionModal :: memberQuestionModalScript}"></th:block>
      <script th:src="@{/js/member/memberManagement.js}"></script>
    </div>
  </body>
</html>
