<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- 구성원 등록·수정 — 기업 소속 사용자 선택 오버레이 (스타일은 memberManagementInfo.html) -->
    <th:block th:fragment="memberInfoPickOverlay">
      <div class="mem-picker-overlay" id="memMemberPickOverlay" aria-hidden="true">
        <div
          class="mem-picker"
          role="dialog"
          aria-modal="true"
          aria-labelledby="memMemberPickTitle"
        >
          <div class="mem-picker__head" id="memMemberPickTitle">
            기업 구성원 선택
          </div>
          <div class="mem-picker__search">
            <label class="visually-hidden" for="memMemberSearchType">
              검색 항목
            </label>
            <select id="memMemberSearchType" aria-label="검색 항목">
              <option value="userId">사번(ID)</option>
              <option value="userName" selected>이름</option>
              <option value="tel">연락처</option>
              <option value="email">이메일</option>
            </select>
            <label class="visually-hidden" for="memMemberSearchKeyword">
              검색어
            </label>
            <input
              type="text"
              autocomplete="off"
              id="memMemberSearchKeyword"
              placeholder="검색어를 입력하세요"
            />
          </div>
          <div class="mem-picker__list" id="memMemberPickList"></div>
          <div class="mem-picker__actions">
            <button type="button" id="btnMemberPickCancel">닫기</button>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
