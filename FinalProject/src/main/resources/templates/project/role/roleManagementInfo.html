<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/projectLayout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta
      th:if="${_csrf != null}"
      name="_csrf_header"
      th:content="${_csrf.headerName}"
    />
    <title>역할 상세</title>
    <link
      rel="stylesheet"
      href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css"
    />
    <link
      rel="stylesheet"
      href="https://uicdn.toast.com/grid/latest/tui-grid.css"
    />
    <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <style>
      .role-page-head {
        margin-bottom: 1rem;
      }
      .role-page-head__title {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #222;
      }
      .role-page-head__rule {
        height: 3px;
        background: #333;
        border: 0;
        margin: 0;
      }
      .role-back-link {
        display: inline-block;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: #1976d2;
        text-decoration: none;
      }
      .role-back-link:hover {
        text-decoration: underline;
      }
      .role-section {
        margin-bottom: 1.75rem;
      }
      .role-section__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #222;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .role-section__head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.75rem;
        margin: 0 0 0.5rem;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .role-section__head .role-section__title {
        margin: 0;
        padding-bottom: 0;
        border-bottom: none;
      }
      .role-section__body {
        padding-top: 0.75rem;
      }
      .role-section__divider {
        height: 1px;
        background: #ddd;
        margin: 1rem 0;
        border: 0;
      }
      .role-detail-form {
        --role-label-w: 9.75rem;
        --role-input-w: 16rem;
        --role-font-size: 0.8125rem;
        --role-input-bg: #f5f5f5;
        --role-input-border: #d0d0d0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .role-detail-form .role-info-fields__row {
        display: grid;
        grid-template-columns: var(--role-label-w) var(--role-input-w);
        align-items: center;
        column-gap: 0.75rem;
      }
      .role-detail-form .role-info-fields__row label {
        font-size: var(--role-font-size);
        color: #333;
        text-align: right;
        white-space: nowrap;
        line-height: 1.35;
      }
      .role-detail-form .role-info-fields__row input {
        width: 100%;
        max-width: var(--role-input-w);
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--role-input-border);
        border-radius: 4px;
        background: var(--role-input-bg);
        font-size: var(--role-font-size);
        color: #333;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .perm-sub__head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.75rem;
        margin-bottom: 0.5rem;
      }
      .perm-sub__head .perm-sub__title {
        margin: 0;
      }
      .perm-toggle-btn {
        padding: 0.3rem 0.7rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: #1976d2;
        background: #fff;
        border: 1px solid #90caf9;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      .perm-toggle-btn:hover:not(:disabled) {
        background: #e3f2fd;
      }
      .perm-toggle-btn[aria-pressed="true"] {
        color: #0d47a1;
        background: #e3f2fd;
        border-color: #42a5f5;
      }
      .perm-toggle-btn:disabled {
        color: #9e9e9e;
        border-color: #e0e0e0;
        background: #f5f5f5;
        cursor: not-allowed;
      }
      .perm-toggle-btn.is-hidden {
        display: none !important;
      }
      .perm-sub {
        margin-bottom: 1.25rem;
      }
      .perm-sub--view-only .perm-crud-row {
        justify-content: flex-start;
      }
      .perm-list {
        max-height: 24rem;
        overflow-y: auto;
        overflow-x: hidden;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        background: #fff;
        padding: 0.85rem 1rem;
      }
      .perm-list .perm-sub:last-child {
        margin-bottom: 0;
      }
      .perm-list::-webkit-scrollbar {
        width: 8px;
      }
      .perm-list::-webkit-scrollbar-thumb {
        background: #cfd8dc;
        border-radius: 4px;
      }
      .perm-list::-webkit-scrollbar-thumb:hover {
        background: #b0bec5;
      }
      .perm-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .perm-full-block {
        margin-bottom: 1rem;
      }
      .perm-subblock-title {
        margin: 0 0 0.4rem;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #555;
      }
      .perm-crud-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem 1.25rem;
        align-items: center;
        padding: 0.35rem 0 0.5rem;
      }
      .perm-crud-row .perm-grid__cell {
        min-width: 4.5rem;
      }
      .perm-sub__title {
        margin: 0 0 0.5rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #333;
      }
      .perm-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
        gap: 0.5rem 1rem;
        align-items: start;
      }
      .perm-grid__cell {
        display: grid;
        grid-template-columns: 1.125rem minmax(0, 1fr);
        column-gap: 0.5rem;
        align-items: start;
        font-size: 0.8125rem;
        color: #444;
        cursor: default;
        min-width: 0;
      }
      .perm-grid__cell:has(input:not(:disabled)) {
        cursor: pointer;
      }
      .perm-grid__cell span {
        line-height: 1.35;
        word-break: keep-all;
      }
      .perm-grid__cell input {
        width: 1rem;
        height: 1rem;
        margin: 0.2em 0 0;
        justify-self: start;
      }
      .perm-empty {
        margin: 0.25rem 0 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .role-groups-panel {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #fafafa;
        padding: 0.75rem 0.75rem 0.5rem;
      }
      .role-groups-panel__hint {
        margin: 0 0 0.65rem;
        font-size: 0.8125rem;
        color: #555;
        line-height: 1.45;
      }
      .role-groups-panel__grid-host {
        min-height: 120px;
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
        overflow: hidden;
      }
      .role-group-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-top: 0.65rem;
      }
      .role-group-toolbar.is-hidden {
        display: none;
      }
      .role-group-toolbar__btn {
        padding: 0.35rem 0.95rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        color: #333;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .role-group-toolbar__btn:hover:not(:disabled) {
        background: #f5f5f5;
      }
      .role-group-pick-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .role-group-pick-overlay.is-open {
        display: flex;
      }
      .role-group-pick {
        width: min(44rem, 94vw);
        max-height: 82vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .role-group-pick__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .role-group-pick__search {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .role-group-pick__search select,
      .role-group-pick__search input[type="text"],
      .role-group-pick__search input[type="date"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .role-group-pick__search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
      }
      .role-group-pick__search input[type="text"] {
        flex: 1 1 8rem;
        min-width: 6rem;
      }
      .role-group-pick__search input[type="date"] {
        flex: 0 0 auto;
        min-width: 8.5rem;
      }
      .role-group-pick__search-sep {
        font-size: 0.8125rem;
        color: #666;
      }
      .role-group-pick__search .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .role-group-pick__grid-host {
        flex: 1 1 auto;
        min-height: 12rem;
        max-height: 50vh;
        overflow: auto;
        margin: 0.5rem 1rem;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        background: #fff;
      }
      .role-group-pick__actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .role-group-pick__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .role-group-pick__actions button.primary {
        background: #555;
        color: #fff;
        border-color: #555;
      }
      .btn-revoke {
        padding: 0.2rem 0.65rem;
        font-size: 0.75rem;
        border-radius: 6px;
        border: 1px solid #f8bbd0;
        background: #fce4ec;
        color: #ad1457;
        cursor: pointer;
      }
      .btn-revoke:hover {
        background: #f8bbd0;
      }
      .role-detail-form input.role-input--editable {
        background: #fff;
      }
      .role-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.75rem;
        margin: 2rem 0 1rem;
        padding-top: 0.5rem;
      }
      .role-actions__btn {
        min-width: 5.5rem;
        padding: 0.45rem 1.25rem;
        font-size: 0.875rem;
        border-radius: 6px;
        border: 1px solid #555;
        background: #555;
        color: #fff;
        cursor: pointer;
      }
      .role-actions__btn:hover {
        background: #444;
        border-color: #444;
      }
      .role-actions__btn--secondary {
        background: #fff;
        color: #333;
        border-color: #bbb;
      }
      .role-actions__btn--secondary:hover {
        background: #f5f5f5;
        border-color: #999;
      }
      .role-actions .is-hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div layout:fragment="content">
      <a class="role-back-link" th:href="@{/project/role/list}">← 역할 목록으로</a>

      <div class="role-page-head">
        <h1 class="role-page-head__title" th:text="${registerMode} ? '역할 등록' : '역할 상세'">역할 상세</h1>
        <hr class="role-page-head__rule" />
      </div>

      <th:block th:if="${roleNotFound}">
        <p class="perm-empty">
          요청한 역할(<span th:text="${roleCd}">-</span>)을 이 프로젝트에서 찾을
          수 없습니다.
        </p>
      </th:block>

      <th:block th:if="${registerMode or currentRole != null}">
        <section class="role-section">
          <h2 class="role-section__title">역할 정보</h2>
          <div class="role-section__body">
            <div class="role-info-fields role-detail-form">
              <div class="role-info-fields__row" th:if="${registerMode}">
                <label for="detailPrjName">프로젝트명</label>
                <input type="text" id="detailPrjName" readonly th:value="${session.project != null ? session.project.prjName : ''}" />
              </div>
              <div class="role-info-fields__row" th:if="${!registerMode}">
                <label for="detailRoleCd">역할 코드</label>
                <input type="text" id="detailRoleCd" readonly th:value="${currentRole.roleCd}" />
              </div>
              <div class="role-info-fields__row">
                <label for="detailRoleName">역할명</label>
                <input th:if="${registerMode}" type="text" id="detailRoleName" class="role-input--editable" placeholder="역할명을 입력해 주세요." autocomplete="off" />
                <input th:unless="${registerMode}" type="text" id="detailRoleName" readonly th:value="${currentRole.roleName}" />
              </div>
              <div class="role-info-fields__row" th:if="${!registerMode}">
                <label for="detailCreatedOn">권한 생성일</label>
                <input type="text" id="detailCreatedOn" readonly th:value="${roleCreatedOnYmd}" />
              </div>
            </div>
          </div>
        </section>

        <section class="role-section">
          <div class="role-section__head">
            <h2 class="role-section__title">메뉴 권한 연결</h2>
            <button
              th:if="${menuSections != null and !menuSections.isEmpty()}"
              type="button"
              class="perm-toggle-btn perm-toggle-btn--global"
              id="permToggleGlobal"
              aria-pressed="false"
              th:classappend="${!registerMode} ? ' is-hidden' : ''"
              th:disabled="${!registerMode}"
            >
              전체 구역 선택
            </button>
          </div>
          <div class="role-section__body">
            <div class="perm-list" th:if="${menuSections != null and !menuSections.isEmpty()}">
              <div
                class="perm-sub"
                th:each="sec, secStat : ${menuSections}"
                th:classappend="${#strings.equalsIgnoreCase(sec.sectionTitle, 'HISTORY') or #strings.equalsIgnoreCase(sec.sectionTitle, 'GANTT') or sec.sectionTitle == '간트차트'} ? ' perm-sub--view-only' : ''"
                th:attr="data-section-key=${sec.sectionTitle}"
              >
                <div class="perm-sub__head">
                  <h3 class="perm-sub__title" th:text="${sec.sectionTitle}">구분</h3>
                  <button
                    type="button"
                    class="perm-toggle-btn perm-toggle-btn--section"
                    aria-pressed="false"
                    th:classappend="${!registerMode} ? ' is-hidden' : ''"
                    th:disabled="${!registerMode}"
                  >
                    전체 선택
                  </button>
                </div>
                <hr class="role-section__divider" />
                <div class="perm-full-block" th:if="${sec.crudSlots != null and !sec.crudSlots.isEmpty()}">
                  <div class="perm-crud-row">
                    <label
                      class="perm-grid__cell"
                      th:each="c, cStat : ${sec.crudSlots}"
                      th:for="|cb-crud-${secStat.index}-${cStat.index}|"
                    >
                      <input
                        type="checkbox"
                        class="perm-menu-cb perm-menu-cb--crud"
                        th:disabled="${!registerMode}"
                        th:id="|cb-crud-${secStat.index}-${cStat.index}|"
                        th:checked="${c.checked}"
                        th:attr="data-role-id=${c.roleId}"
                      />
                      <span th:text="${c.label}">조회</span>
                    </label>
                  </div>
                </div>
                <th:block th:if="${sec.extraSlots != null and !sec.extraSlots.isEmpty()}">
                  <div class="perm-full-block">
                    <h4 class="perm-subblock-title">기타 권한</h4>
                    <div class="perm-grid">
                      <label
                        class="perm-grid__cell"
                        th:each="ex, exStat : ${sec.extraSlots}"
                        th:for="|cb-extra-${secStat.index}-${exStat.index}|"
                      >
                        <input
                          type="checkbox"
                          class="perm-menu-cb perm-menu-cb--extra"
                          th:disabled="${!registerMode}"
                          th:id="|cb-extra-${secStat.index}-${exStat.index}|"
                          th:checked="${ex.checked}"
                          th:attr="data-role-id=${ex.roleId}"
                        />
                        <span th:text="${ex.label}">권한</span>
                      </label>
                    </div>
                  </div>
                </th:block>
              </div>
            </div>
            <p class="perm-empty" th:if="${menuSections == null or menuSections.isEmpty()}">
              메뉴 권한 데이터가 없습니다.
            </p>
          </div>
        </section>

        <section th:if="${registerMode or currentRole != null}" class="role-section" aria-labelledby="role-groups-heading">
          <h2 class="role-section__title" id="role-groups-heading">이 역할을 보유한 그룹</h2>
          <div class="role-section__body">
            <div class="role-groups-panel">
              <div
                id="roleGroupsGrid"
                class="role-groups-panel__grid-host"
                th:attr="data-prj-id=${session.currentProjectId},data-page-mode=${registerMode ? 'register' : 'detail'},data-role-cd=${registerMode ? '' : roleCd}"
                role="region"
                aria-label="역할 보유 그룹 목록"
              ></div>
              <div id="roleGroupToolbar" class="role-group-toolbar" th:classappend="${registerMode} ? '' : ' is-hidden'">
                <button type="button" class="role-group-toolbar__btn" id="btnManageRoleGroups">그룹 관리</button>
              </div>
            </div>
          </div>
        </section>
        <div class="role-actions" th:if="${registerMode}">
          <button type="button" class="role-actions__btn" id="btnRoleSave">저장</button>
          <button type="button" class="role-actions__btn role-actions__btn--secondary" id="btnRoleCancel">취소</button>
        </div>

        <div class="role-actions" th:if="${!registerMode and currentRole != null}">
          <button type="button" class="role-actions__btn" id="btnRoleEdit" data-label-edit="수정" data-label-save="저장">수정</button>
          <button type="button" class="role-actions__btn role-actions__btn--secondary is-hidden" id="btnRoleCancelEdit">취소</button>
        </div>

      </th:block>

      <th:block th:if="${registerMode or currentRole != null}">
        <th:block th:replace="~{project/role/modal/questionModal :: roleQuestionModal}"></th:block>
        <th:block th:replace="~{project/role/modal/questionModal :: roleQuestionModalScript}"></th:block>
      </th:block>

      <th:block th:if="${registerMode or currentRole != null}">
        <div th:replace="~{project/role/modal/roleGroupModal :: roleGroupPickOverlay}"></div>
      </th:block>

      <script
        th:if="${menuSections != null and !menuSections.isEmpty() and (registerMode or currentRole != null)}"
        th:inline="javascript"
      >
        /*<![CDATA[*/
        window.roleManagementInfoPageConfig = {
          registerMode: /*[[${registerMode}]]*/ false,
          prjId: /*[[${session.currentProjectId}]]*/ 0,
          roleCd: /*[[${roleCd}]]*/ null
        };
        /*]]>*/
      </script>
      <script
        th:if="${menuSections != null and !menuSections.isEmpty() and (registerMode or currentRole != null)}"
        th:src="@{/js/role/roleManagementInfo.js}"
      ></script>
    </div>
  </body>
</html>
