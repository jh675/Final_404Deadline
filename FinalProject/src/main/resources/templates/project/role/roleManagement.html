<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/projectLayout}">
  <head>
    <meta charset="UTF-8" />
    <title>프로젝트 권한 관리</title>
    <th:block layout:fragment="head-content">
      <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
      <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
      <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
      <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
      <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
      <link rel="stylesheet" th:href="@{/css/project/issue.css}" />
      <link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
      <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
      <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
      <script th:src="@{/js/common/gridTheme.js}"></script>
      <script th:inline="javascript">
        /*<![CDATA[*/
        window.roleListPageData = {
          prjId: /*[[${session.currentProjectId}]]*/ null,
          rows: /*[[${rows}]]*/ [],
          panelUrl: /*[[@{/project/role/panel}]]*/ "/project/role/panel"
        };
        /*]]>*/
      </script>
    </th:block>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="issue-shell issue-shell--list">
        <div id="wrapper" class="issue-list">
          <header class="issue-list__header">
            <h1 class="issue-list__title">프로젝트 권한 관리</h1>
          </header>

          <section class="issue-section issue-section--filter" aria-label="권한 검색">
            <form id="roleSearchForm" th:action="@{/project/role/list}" method="get" class="issue-filter-form">
              <div class="issue-field">
                <label for="permissionKey">권한 코드</label>
                <input type="text" id="permissionKey" name="permissionKey" th:value="${permissionKey}" placeholder="권한 코드" autocomplete="off" />
              </div>
              <div class="issue-field">
                <label for="permissionName">권한명</label>
                <input type="text" id="permissionName" name="permissionName" th:value="${permissionName}" placeholder="권한명" autocomplete="off" />
              </div>
              <div class="issue-field issue-field--range">
                <label for="createdFrom">권한 생성일</label>
                <input type="date" id="createdFrom" name="createdFrom" th:value="${createdFrom}" />
                <span class="issue-field-sep">~</span>
                <input type="date" id="createdTo" name="createdTo" th:value="${createdTo}" aria-label="권한 생성일 종료" />
              </div>
              <div class="issue-filter-buttons">
                <button type="submit" class="btn btn-primary">검색</button>
                <a th:href="@{/project/role/list}" class="btn btn-secondary">초기화</a>
              </div>
            </form>
          </section>

          <section class="issue-section issue-section--grid role-list-split-section" aria-label="프로젝트 권한 목록">
            <div class="role-list-split">
              <div class="role-list-split__grid">
                <div id="menuRoleGrid" role="region" aria-label="프로젝트 권한 그리드"></div>
              </div>
              <aside
                id="roleDetailAside"
                class="role-list-split__detail role-list-split__detail--role is-hidden"
                aria-label="권한 상세">
                <div class="role-list-split__detail-head">
                  <h2 class="role-list-split__detail-title">권한 상세</h2>
                  <button
                    type="button"
                    id="roleDetailCloseBtn"
                    class="role-list-split__detail-close"
                    aria-label="상세 닫기">
                    ×
                  </button>
                </div>
                <iframe
                  id="roleDetailPanelFrame"
                  class="role-list-split__detail-frame is-hidden"
                  title="권한 상세"></iframe>
              </aside>
            </div>
          </section>
        </div>
      </div>

      <th:block th:replace="~{project/role/modal/questionModal :: roleQuestionModal}"></th:block>
      <th:block th:replace="~{project/role/modal/questionModal :: roleQuestionModalScript}"></th:block>
      <script th:src="@{/js/role/roleManagement.js}"></script>
    </div>
  </body>
</html>
