<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="roleQuestionModal">
      <div class="modal fade" id="roleQuestionModal" tabindex="-1" aria-labelledby="roleQuestionModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="roleQuestionModalTitle">알림</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
              <p class="mb-0 text-break" id="roleQuestionModalMessage" style="white-space: pre-wrap"></p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" id="roleQuestionModalCancelBtn">취소</button>
              <button type="button" class="btn btn-primary" id="roleQuestionModalConfirmBtn">확인</button>
            </div>
          </div>
        </div>
      </div>
    </th:block>
    <th:block th:fragment="roleQuestionModalScript">
      <script th:src="@{/js/role/modal/questionModal.js(v=2)}"></script>
    </th:block>
  </body>
</html>
