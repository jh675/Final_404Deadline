<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- 역할 상세 — 프로젝트 그룹 선택 오버레이 (스타일·스크립트는 roleManagementInfo.html) -->
    <th:block th:fragment="roleGroupPickOverlay">
      <div class="role-group-pick-overlay" id="roleGroupPickOverlay" aria-hidden="true">
        <div class="role-group-pick" role="dialog" aria-modal="true" aria-labelledby="roleGroupPickTitle">
          <div class="role-group-pick__head" id="roleGroupPickTitle">그룹 선택</div>
          <div class="role-group-pick__search">
            <label class="visually-hidden" for="roleGroupSearchType">검색 항목</label>
            <select id="roleGroupSearchType" aria-label="검색 항목">
              <option value="id">그룹아이디</option>
              <option value="grpName" selected>그룹명</option>
            </select>
            <label class="visually-hidden" for="roleGroupSearchKeyword">검색어</label>
            <input type="text" autocomplete="off" id="roleGroupSearchKeyword" placeholder="검색어를 입력하세요" />
            <label class="visually-hidden" for="roleGroupCreatedFrom">생성일 시작</label>
            <input type="date" id="roleGroupCreatedFrom" aria-label="그룹 생성일 시작" />
            <span class="role-group-pick__search-sep" aria-hidden="true">~</span>
            <label class="visually-hidden" for="roleGroupCreatedTo">생성일 종료</label>
            <input type="date" id="roleGroupCreatedTo" aria-label="그룹 생성일 종료" />
          </div>
          <div id="roleGroupPickGrid" class="role-group-pick__grid-host" role="region" aria-label="그룹 선택 목록"></div>
          <div class="role-group-pick__actions">
            <button type="button" id="btnRoleGroupPickCancel">취소</button>
            <button type="button" class="primary" id="btnRoleGroupPickOk">저장</button>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
