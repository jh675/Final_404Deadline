<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- 권한 상세 — 프로젝트 그룹 선택 오버레이 -->
    <th:block th:fragment="roleGroupPickOverlay">
      <div class="issue-quick-modal-backdrop role-group-pick-overlay" id="roleGroupPickOverlay" aria-hidden="true">
        <div class="issue-quick-modal issue-quick-modal--wide-lg" role="dialog" aria-modal="true"
          aria-labelledby="roleGroupPickTitle" tabindex="-1">
          <div class="issue-quick-modal-head">
            <h2 id="roleGroupPickTitle">그룹 선택</h2>
            <button type="button" class="issue-quick-modal-close" id="btnRoleGroupPickClose"
              aria-label="닫기">&times;</button>
          </div>
          <div class="issue-quick-modal-body issue-quick-modal-body--pick">
            <div class="issue-quick-modal-search role-group-pick__search">
              <label class="visually-hidden" for="roleGroupSearchType">검색 항목</label>
              <select id="roleGroupSearchType" aria-label="검색 항목">
                <option value="id">그룹아이디</option>
                <option value="grpName" selected>그룹명</option>
              </select>
              <label class="visually-hidden" for="roleGroupSearchKeyword">검색어</label>
              <input type="text" autocomplete="off" id="roleGroupSearchKeyword" placeholder="검색어를 입력하세요" />
              <label class="visually-hidden" for="roleGroupCreatedFrom">생성일 시작</label>
              <input type="date" id="roleGroupCreatedFrom" aria-label="그룹 생성일 시작" />
              <span class="role-group-pick__search-sep" aria-hidden="true">~</span>
              <label class="visually-hidden" for="roleGroupCreatedTo">생성일 종료</label>
              <input type="date" id="roleGroupCreatedTo" aria-label="그룹 생성일 종료" />
            </div>
            <div id="roleGroupPickGrid" class="issue-quick-modal-grid-host role-group-pick__grid-host"
              role="region" aria-label="그룹 선택 목록"></div>
          </div>
          <div class="issue-quick-modal-foot">
            <button type="button" class="issue-btn issue-btn--secondary issue-bulk-btn issue-bulk-btn-ghost"
              id="btnRoleGroupPickCancel">초기화</button>
            <button type="button" class="issue-btn issue-btn--primary issue-bulk-btn issue-bulk-btn-primary"
              id="btnRoleGroupPickOk">저장</button>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
