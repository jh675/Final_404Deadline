<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/projectLayout}">
  <head>
    <meta charset="UTF-8" />
    <title>작업내역</title>
    <th:block layout:fragment="head-content">
      <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
      <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
      <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
      <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
      <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
      <link rel="stylesheet" th:href="@{/css/project/issue.css}" />
      <link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
      <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
      <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
      <script th:src="@{/js/common/gridTheme.js}"></script>
    </th:block>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="issue-shell issue-shell--list">
        <div id="wrapper" class="issue-list">
          <header class="issue-list__header">
            <h1 class="issue-list__title">작업내역</h1>
          </header>

          <section class="issue-section issue-section--filter" aria-label="작업내역 검색">
            <form id="historySearchForm" th:action="@{/project/history/list}" method="get" class="issue-filter-form">
              <div class="issue-field issue-field--range">
                <label for="updatedFrom">일시</label>
                <input type="date" id="updatedFrom" name="updatedFrom" th:value="${updatedFrom}" />
                <span class="issue-field-sep">~</span>
                <input type="date" id="updatedTo" name="updatedTo" th:value="${updatedTo}" aria-label="일시 종료"/>
              </div>
              <div class="issue-field">
                <label for="modifierName">수정자</label>
                <input type="text" id="modifierName" name="modifierName" th:value="${modifierName}" placeholder="이름" autocomplete="off"/>
              </div>
              <div class="issue-field">
                <label for="tableName">항목명</label>
                <select id="tableName" name="tableName">
                  <option value="" th:selected="${tableName == null or tableName == ''}">전체</option>
                  <option value="ISSUE" th:selected="${tableName == 'ISSUE'}">이슈</option>
                  <option value="PROJECT" th:selected="${tableName == 'PROJECT'}">프로젝트</option>
                </select>
              </div>
              <div class="issue-field issue-field--wide">
                <label for="historyDetail">내용</label>
                <input type="text" id="historyDetail" name="detail" th:value="${detail}" placeholder="내용 검색" autocomplete="off"/>
              </div>
              <div class="issue-filter-buttons">
                <button type="submit" class="btn btn-primary">검색</button>
                <a th:href="@{/project/history/list}" class="btn btn-secondary">취소</a>
              </div>
            </form>
          </section>

          <section class="issue-section issue-section--grid" aria-label="작업내역 목록">
            <div id="historyGrid" role="region" aria-label="작업내역 그리드"></div>
          </section>
        </div>
      </div>

      <th:block th:replace="~{project/history/modal/historyDetail :: historyDetailModal}"></th:block>
      <th:block th:replace="~{project/history/modal/historyDetail :: historyDetailModalScript}"></th:block>

      <script th:inline="javascript">
        /*<![CDATA[*/
        const historyRows = /*[[${rows}]]*/ [];
        /*]]>*/
      </script>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          (function historySearchDates() {
            const start = document.getElementById("updatedFrom");
            const end = document.getElementById("updatedTo");
            if (!start || !end) return;

            const pad = (n) => String(n).padStart(2, "0");
            const todayStr = () => {
              const d = new Date();
              return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
            };

            const compare = (a, b) => {
              if (!a || !b) return 0;
              return a < b ? -1 : a > b ? 1 : 0;
            };

            function minYmd(a, b) {
              if (!a) return b;
              if (!b) return a;
              return compare(a, b) <= 0 ? a : b;
            }

            function syncDateBounds() {
              const max = todayStr();
              start.max = max;
              end.max = max;
              if (start.value && compare(start.value, max) > 0) start.value = max;
              if (end.value && compare(end.value, max) > 0) end.value = max;
              if (start.value && end.value && compare(start.value, end.value) > 0) {
                end.value = start.value;
              }
              if (start.value) end.min = start.value;
              else end.removeAttribute("min");
              if (end.value) start.max = minYmd(max, end.value);
              else start.max = max;
            }

            start.addEventListener("change", function () {
              if (start.value && end.value && compare(start.value, end.value) > 0) {
                end.value = start.value;
              }
              syncDateBounds();
            });
            end.addEventListener("change", function () {
              if (start.value && end.value && compare(start.value, end.value) > 0) {
                start.value = end.value;
              }
              syncDateBounds();
            });
            syncDateBounds();
          })();

          function formatDate(value) {
            if (!value) return "";
            const d = new Date(value);
            if (isNaN(d.getTime())) return value;
            const pad = (n) => String(n).padStart(2, "0");
            return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
              " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
          }

          function tableNameLabel(code) {
            if (!code) return "";
            const key = String(code).trim().toUpperCase();
            if (key === "ISSUE") return "이슈";
            if (key === "PROJECT") return "프로젝트";
            return code;
          }

          const gridEl = document.getElementById("historyGrid");
          if (!gridEl || typeof tui === "undefined" || !tui.Grid) return;

          function resolveHistoryId(row) {
            if (!row) return null;
            const raw = row.historyId != null ? row.historyId : row.id;
            if (raw == null || raw === "") return null;
            const n = Number(raw);
            return Number.isFinite(n) ? n : null;
          }

          const gridData = (Array.isArray(historyRows) ? historyRows : []).map(function (row) {
            return Object.assign({}, row, { historyId: resolveHistoryId(row) });
          });

          const historyGrid = new tui.Grid({
            el: gridEl,
            data: gridData,
            scrollX: true,
            scrollY: false,
            bodyHeight: "auto",
            rowHeight: 36,
            minBodyHeight: 100,
            columns: [
              { header: "ID", name: "historyId", hidden: true },
              {
                header: "일시", name: "updatedOn", width: 160, align: "center", sortable: true,
                formatter: ({ value }) => formatDate(value),
              },
              { header: "수정자", name: "modifierName", width: 110, align: "center", sortable: true },
              {
                header: "항목명", name: "tableName", width: 100, align: "center", sortable: true,
                formatter: ({ value }) => tableNameLabel(value),
              },
              {
                header: "내용", name: "detail", minWidth: 280, sortable: true,
                formatter: ({ row, value }) => {
                  const text = value == null ? "" : String(value);
                  const historyId = resolveHistoryId(row);
                  if (!text || historyId == null) return text;
                  return '<span class="history-detail-link" role="button" tabindex="0" data-history-id="' +
                    historyId + '">' +
                    text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</span>";
                },
              },
            ],
            pageOptions: { useClient: true, perPage: 15 },
          });

          function openHistoryDetailModal(historyId, row) {
            if (historyId == null) return;
            const itemLabel = tableNameLabel(row && row.tableName);
            const summaryParts = [];
            if (row && row.updatedOn) summaryParts.push(formatDate(row.updatedOn));
            if (row && row.modifierName) summaryParts.push(row.modifierName);
            if (itemLabel) summaryParts.push(itemLabel);
            if (row && row.detail) summaryParts.push(row.detail);
            if (window.HistoryDetailModal && typeof window.HistoryDetailModal.open === "function") {
              window.HistoryDetailModal.open({ historyId: historyId, summary: summaryParts.join(" · ") });
            }
          }

          historyGrid.on("click", function (ev) {
            if (ev.rowKey == null) return;
            const row = historyGrid.getRow(ev.rowKey);
            const nativeTarget = ev.nativeEvent && ev.nativeEvent.target ? ev.nativeEvent.target : null;
            const linkEl = nativeTarget && nativeTarget.closest ? nativeTarget.closest("[data-history-id]") : null;
            const fromAttr = linkEl ? Number(linkEl.getAttribute("data-history-id")) : null;
            if (ev.columnName !== "detail" && !linkEl) return;
            const historyId = Number.isFinite(fromAttr) && fromAttr > 0 ? fromAttr : resolveHistoryId(row);
            openHistoryDetailModal(historyId, row);
          });
        });
      </script>
    </div>
  </body>
</html>
