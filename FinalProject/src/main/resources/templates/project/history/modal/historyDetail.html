<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="historyDetailModal">
      <div
        class="modal fade"
        id="historyDetailModal"
        tabindex="-1"
        aria-labelledby="historyDetailModalTitle"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
          <div class="modal-content history-detail-modal">
            <div class="modal-header">
              <h5 class="modal-title" id="historyDetailModalTitle">변경 상세</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="닫기"
              ></button>
            </div>
            <div class="modal-body">
              <p
                class="history-detail-modal__summary text-muted small mb-3"
                id="historyDetailSummary"
                hidden
              ></p>
              <p
                class="history-detail-modal__empty text-muted mb-0"
                id="historyDetailEmpty"
                hidden
              >
                변경 필드 상세가 없습니다.
              </p>
              <p
                class="history-detail-modal__loading text-muted mb-0"
                id="historyDetailLoading"
                hidden
              >
                불러오는 중…
              </p>
              <div id="historyDetailList" class="history-detail-list"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                닫기
              </button>
            </div>
          </div>
        </div>
      </div>

      <style>
        .history-detail-list {
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }
        .history-detail-item {
          border: 1px solid #e0e0e0;
          border-radius: 8px;
          overflow: hidden;
          background: #fff;
        }
        .history-detail-item__field {
          padding: 0.6rem 1rem;
          font-size: 0.9375rem;
          font-weight: 600;
          color: #222;
          background: #f5f7fa;
          border-bottom: 1px solid #e8e8e8;
          word-break: break-word;
        }
        .history-detail-item__compare {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0;
        }
        .history-detail-item__col {
          padding: 0.75rem 1rem;
          min-width: 0;
        }
        .history-detail-item__col--old {
          border-right: 1px solid #eee;
          background: #fffbfb;
        }
        .history-detail-item__col--new {
          background: #f8fffb;
        }
        .history-detail-item__label {
          display: block;
          margin-bottom: 0.35rem;
          font-size: 0.75rem;
          font-weight: 600;
          color: #666;
        }
        .history-detail-item__col--old .history-detail-item__label {
          color: #a04040;
        }
        .history-detail-item__col--new .history-detail-item__label {
          color: #2e7d52;
        }
        .history-detail-item__value {
          font-size: 0.875rem;
          color: #333;
          white-space: pre-wrap;
          word-break: break-word;
          min-height: 1.25rem;
        }
        .history-detail-item__value:empty::before {
          content: "(없음)";
          color: #999;
        }
        @media (max-width: 576px) {
          .history-detail-item__compare {
            grid-template-columns: 1fr;
          }
          .history-detail-item__col--old {
            border-right: 0;
            border-bottom: 1px solid #eee;
          }
        }
      </style>
    </th:block>

    <th:block th:fragment="historyDetailModalScript">
      <script>
        window.HistoryDetailModal = (function () {
          var modalEl,
            titleEl,
            summaryEl,
            listEl,
            emptyEl,
            loadingEl;

          function cacheElements() {
            if (!modalEl) {
              modalEl = document.getElementById("historyDetailModal");
              if (!modalEl) return false;
              titleEl = document.getElementById("historyDetailModalTitle");
              summaryEl = document.getElementById("historyDetailSummary");
              listEl = document.getElementById("historyDetailList");
              emptyEl = document.getElementById("historyDetailEmpty");
              loadingEl = document.getElementById("historyDetailLoading");
            }
            return true;
          }

          function getInstance() {
            if (!cacheElements() || typeof bootstrap === "undefined" || !bootstrap.Modal) {
              return null;
            }
            return bootstrap.Modal.getOrCreateInstance(modalEl);
          }

          function escapeHtml(text) {
            if (text == null) return "";
            return String(text)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");
          }

          function renderItems(items) {
            if (!listEl) return;
            if (!items || !items.length) {
              listEl.innerHTML = "";
              if (emptyEl) emptyEl.hidden = false;
              return;
            }
            if (emptyEl) emptyEl.hidden = true;
            listEl.innerHTML = items
              .map(function (item) {
                var field = escapeHtml(item.fieldName || "");
                var oldVal = escapeHtml(item.oldValues || "");
                var newVal = escapeHtml(item.newValues || "");
                return (
                  '<article class="history-detail-item">' +
                  '<div class="history-detail-item__field">' +
                  field +
                  "</div>" +
                  '<div class="history-detail-item__compare">' +
                  '<div class="history-detail-item__col history-detail-item__col--old">' +
                  '<span class="history-detail-item__label">변경 전</span>' +
                  '<div class="history-detail-item__value">' +
                  oldVal +
                  "</div></div>" +
                  '<div class="history-detail-item__col history-detail-item__col--new">' +
                  '<span class="history-detail-item__label">변경 후</span>' +
                  '<div class="history-detail-item__value">' +
                  newVal +
                  "</div></div></div></article>"
                );
              })
              .join("");
          }

          function setLoading(loading) {
            if (loadingEl) loadingEl.hidden = !loading;
            if (loading && listEl) listEl.innerHTML = "";
            if (loading && emptyEl) emptyEl.hidden = true;
          }

          function open(opts) {
            if (!cacheElements()) return;
            opts = opts || {};
            var historyId = opts.historyId;
            var summary = opts.summary || "";

            if (titleEl) titleEl.textContent = "변경 상세";
            if (summaryEl) {
              if (summary) {
                summaryEl.textContent = summary;
                summaryEl.hidden = false;
              } else {
                summaryEl.textContent = "";
                summaryEl.hidden = true;
              }
            }

            renderItems([]);
            setLoading(true);

            var instance = getInstance();
            if (instance) instance.show();

            if (!historyId) {
              setLoading(false);
              if (emptyEl) emptyEl.hidden = false;
              return;
            }

            var idNum = Number(historyId);
            if (!Number.isFinite(idNum) || idNum <= 0) {
              setLoading(false);
              if (listEl) {
                listEl.innerHTML =
                  '<p class="text-danger mb-0">히스토리 ID가 올바르지 않습니다. (전달값: ' +
                  escapeHtml(String(historyId)) +
                  ")</p>";
              }
              return;
            }

            var url =
              "/project/history/detail?historyId=" + encodeURIComponent(idNum);
            var csrfMeta = document.querySelector('meta[name="_csrf"]');
            var fetchPromise =
              typeof csrfFetch === "function" && csrfMeta && csrfMeta.content
                ? csrfFetch(url, {
                    method: "GET",
                    headers: { Accept: "application/json" },
                  })
                : fetch(url, {
                    method: "GET",
                    headers: { Accept: "application/json" },
                  });

            fetchPromise
              .then(function (res) {
                return res.json().then(function (data) {
                  return { res: res, data: data };
                });
              })
              .then(function (payload) {
                setLoading(false);
                if (!payload.res.ok) {
                  var msg =
                    (payload.data && payload.data.message) ||
                    "HTTP " + payload.res.status;
                  if (listEl) {
                    listEl.innerHTML =
                      '<p class="text-danger mb-0">상세 내역을 불러오지 못했습니다. (' +
                      escapeHtml(msg) +
                      ")</p>";
                  }
                  console.error("[history] detail API 실패", idNum, msg);
                  return;
                }
                var items =
                  payload.data && payload.data.content
                    ? payload.data.content
                    : [];
                renderItems(items);
              })
              .catch(function (err) {
                setLoading(false);
                if (listEl) {
                  listEl.innerHTML =
                    '<p class="text-danger mb-0">상세 내역을 불러오지 못했습니다. (요청 ID: ' +
                    escapeHtml(String(idNum)) +
                    ")</p>";
                }
                console.error("[history] detail fetch 오류", idNum, err);
              });
          }

          return { open: open, getInstance: getInstance };
        })();
      </script>
    </th:block>
  </body>
</html>
