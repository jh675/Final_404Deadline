<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/projectLayout}">
  <head>
    <meta charset="UTF-8" />
    <title>공지사항 관리</title>
    <th:block layout:fragment="head-content">
      <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
      <link rel="stylesheet" th:href="@{/css/project/issue.css}" />
      <link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
    </th:block>
  </head>
  <body>
    <div layout:fragment="content">
      <div id="noticeListArea">
        <div class="issue-shell issue-shell--list">
          <div id="wrapper" class="issue-list issue-list--notice">
            <header class="issue-list__header">
              <h1 class="issue-list__title">공지사항 관리</h1>
            </header>

            <section class="issue-section issue-section--filter" aria-label="공지사항 검색">
              <form id="noticeSearchForm" th:action="@{/project/notice/list}" method="get" class="issue-filter-form">
                <div class="issue-field issue-field--subject">
                  <label for="noticeKeyword">제목</label>
                  <input
                    type="text"
                    id="noticeKeyword"
                    name="keyword"
                    th:value="${param.keyword}"
                    placeholder="제목 검색"
                    autocomplete="off"
                  />
                </div>
                <div class="issue-filter-buttons">
                  <button type="submit" class="btn btn-primary">검색</button>
                  <a th:href="@{/project/notice/list}" class="btn btn-secondary">초기화</a>
                </div>
              </form>
            </section>

            <section class="issue-section issue-section--grid" aria-label="공지사항 목록">
              <div class="notice-table-wrap">
                <table class="data-table notice-table" id="noticeTable">
                  <thead>
                    <tr>
                      <th class="notice-table__col-no">번호</th>
                      <th class="notice-table__col-title">제목</th>
                      <th class="notice-table__col-author">작성자</th>
                      <th class="notice-table__col-date">작성일</th>
                      <th class="notice-table__col-actions">관리</th>
                    </tr>
                  </thead>
                  <tbody id="noticeTbody">
                    <tr
                      th:each="notice : ${list}"
                      th:classappend="${notice.isFixed == '01ACTIVE'} ? 'notice-row--fixed' : ''"
                      th:data-id="${notice.id}"
                      th:data-fixed="${notice.isFixed}"
                      th:data-title="${notice.title}"
                      th:data-memid="${notice.memName}"
                      th:data-date="${#dates.format(notice.createdOn, 'yyyy-MM-dd')}"
                      th:data-description="${notice.description ?: '내용이 없습니다.'}"
                      class="notice-row"
                    >
                      <td class="notice-table__cell-no">
                        <span th:if="${notice.isFixed == '01ACTIVE'}" class="notice-pin" aria-hidden="true">📌</span>
                        <span class="num-text"></span>
                      </td>
                      <td>
                        <button
                          type="button"
                          class="notice-click-title"
                          th:classappend="${notice.isFixed == '01ACTIVE'} ? 'notice-click-title--fixed' : ''"
                          th:text="${notice.title}"
                          onclick="openNoticeDetail(this)"
                        ></button>
                      </td>
                      <td class="notice-table__cell-muted" th:text="${notice.memName != null && notice.memName.contains('(') ? notice.memName.substring(0, notice.memName.indexOf('(')) : notice.memName}"></td>
                      <td class="notice-table__cell-muted" th:text="${#dates.format(notice.createdOn, 'yyyy-MM-dd')}"></td>
                      <td class="notice-table__cell-actions">
                        <div class="notice-row-actions">
                          <a
                            class="btn btn-success"
                            th:href="@{/project/notice/modify(id=${notice.id})}"
                          >수정</a>
                          <button
                            type="button"
                            class="btn btn-danger"
                            th:onclick="|if(confirm('정말로 삭제하시겠습니까?')) location.href='@{/project/notice/delete(id=${notice.id})}'|"
                          >삭제</button>
                        </div>
                      </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(list)}" id="emptyNoticeRow">
                      <td colspan="5" class="notice-table__empty">등록된 공지사항이 없습니다.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <section class="issue-section issue-section--footer" aria-label="공지사항 목록 하단">
              <div class="issue-list-footer">
                <div class="issue-list-footer__pagination">
                  <nav aria-label="공지사항 페이지">
                    <ul class="notice-pagination pagination mb-0" id="pagination"></ul>
                  </nav>
                </div>
                <div class="issue-list-footer__actions">
                  <a th:href="@{/project/notice/register}" class="btn btn-primary">작성</a>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>

      <div id="noticeDetailArea" class="notice-detail is-hidden">
        <div class="issue-shell">
          <div id="wrapper">
            <div class="issue-page-head">
              <button type="button" class="issue-page-back notice-detail__back" onclick="closeNoticeDetail()">← 공지사항 목록</button>
              <h1 class="issue-page-head__title">공지사항 상세</h1>
            </div>

            <section class="issue-page-section notice-detail__head-row">
              <h2 id="viewTitle" class="notice-detail__head-title"></h2>
              <div class="notice-detail__head-meta">
                <span class="notice-detail__label">작성자</span>
                <span id="viewMemId" class="notice-detail__value"></span>
                <span class="notice-detail__meta-sep" aria-hidden="true">|</span>
                <span class="notice-detail__label">등록일</span>
                <span id="viewDate" class="notice-detail__value"></span>
              </div>
            </section>

            <section class="issue-page-section notice-detail__content-section">
              <h2 class="notice-detail__section-title">내용</h2>
              <div id="viewDescription" class="notice-detail__body"></div>
            </section>

            <section class="issue-page-section notice-detail__attach-section">
              <h2 class="notice-detail__section-title">첨부파일</h2>
              <div class="notice-detail__attach">
                <ul id="fileListContainer" class="notice-detail__file-list">
                  <li class="notice-detail__file-empty">조회 중...</li>
                </ul>
              </div>
            </section>

            <div class="issue-register-actions">
              <button type="button" class="btn btn-secondary" onclick="closeNoticeDetail()">닫기</button>
            </div>
          </div>
        </div>
      </div>

      <script th:inline="javascript">
        function openNoticeDetail(element) {
          const row = element.closest(".notice-row");
          const title = row.getAttribute("data-title");
          const fullMemName = row.getAttribute("data-memid");
          const date = row.getAttribute("data-date");
          const description = row.getAttribute("data-description");
          const memName = fullMemName.includes("(")
            ? fullMemName.substring(0, fullMemName.indexOf("("))
            : fullMemName;
          const id = row.getAttribute("data-id");

          document.getElementById("viewTitle").textContent = title;
          document.getElementById("viewMemId").textContent = memName;
          document.getElementById("viewDate").textContent = date;
          document.getElementById("viewDescription").textContent = description;

          document.getElementById("noticeListArea").style.display = "none";
          document.getElementById("noticeDetailArea").classList.remove("is-hidden");
          window.scrollTo(0, 0);

          const container = document.getElementById("fileListContainer");
          container.innerHTML = '<li class="notice-detail__file-empty">첨부파일을 불러오는 중입니다</li>';

          fetch("/project/notice/attach?id=" + id)
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              container.innerHTML = "";
              if (!data || data.length === 0) {
                container.innerHTML = '<li class="notice-detail__file-empty">첨부된 파일이 없습니다.</li>';
                return;
              }
              data.forEach(function (file) {
                const fileName = file.atchName || file.fileName || "이름 없음";
                const sizeKB = file.fileSize ? (file.fileSize / 1024).toFixed(1) : "0.0";
                const li = document.createElement("li");
                li.className = "notice-detail__file-item";
                li.innerHTML =
                  '<span class="notice-detail__file-name">' +
                  fileName +
                  '</span><a class="notice-detail__file-link" href="/download/' +
                  file.id +
                  '">다운로드</a><span class="notice-detail__file-size">(' +
                  sizeKB +
                  " KB)</span>";
                container.appendChild(li);
              });
            })
            .catch(function () {
              container.innerHTML = '<li class="notice-detail__file-empty notice-detail__file-empty--error">오류가 발생했습니다.</li>';
            });
        }

        function closeNoticeDetail() {
          document.getElementById("noticeDetailArea").classList.add("is-hidden");
          document.getElementById("noticeListArea").style.display = "block";
          window.scrollTo(0, 0);
        }

        document.addEventListener("DOMContentLoaded", function () {
          const tbody = document.getElementById("noticeTbody");
          let rows = Array.from(document.querySelectorAll(".notice-row"));

          rows.sort(function (a, b) {
            const aFixed = a.getAttribute("data-fixed") === "01ACTIVE" ? 1 : 0;
            const bFixed = b.getAttribute("data-fixed") === "01ACTIVE" ? 1 : 0;
            return bFixed - aFixed;
          });
          rows.forEach(function (row) {
            tbody.appendChild(row);
          });

          const rowsPerPage = 10;
          const paginationUl = document.getElementById("pagination");
          let filteredRows = rows.slice();

          function displayPage(page) {
            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;

            rows.forEach(function (row) {
              row.style.display = "none";
            });

            filteredRows.forEach(function (row, index) {
              if (index >= start && index < end) {
                row.style.display = "";
                const numSpan = row.querySelector(".num-text");
                if (numSpan) {
                  numSpan.textContent = index - start + 1;
                }
              }
            });

            const pageCount = Math.ceil(filteredRows.length / rowsPerPage);
            renderPagination(page, pageCount);
          }

          function renderPagination(currentPage, pageCount) {
            paginationUl.innerHTML = "";
            if (pageCount <= 0) {
              return;
            }

            const prevLi = document.createElement("li");
            prevLi.className = "page-item" + (currentPage === 1 ? " disabled" : "");
            prevLi.innerHTML = '<a class="page-link" href="javascript:void(0);">&lt;</a>';
            prevLi.onclick = function () {
              if (currentPage > 1) {
                displayPage(currentPage - 1);
              }
            };
            paginationUl.appendChild(prevLi);

            for (let i = 1; i <= pageCount; i++) {
              const li = document.createElement("li");
              li.className = "page-item" + (i === currentPage ? " active" : "");
              li.innerHTML = '<a class="page-link" href="javascript:void(0);">' + i + "</a>";
              li.onclick = (function (page) {
                return function () {
                  displayPage(page);
                };
              })(i);
              paginationUl.appendChild(li);
            }

            const nextLi = document.createElement("li");
            nextLi.className = "page-item" + (currentPage === pageCount ? " disabled" : "");
            nextLi.innerHTML = '<a class="page-link" href="javascript:void(0);">&gt;</a>';
            nextLi.onclick = function () {
              if (currentPage < pageCount) {
                displayPage(currentPage + 1);
              }
            };
            paginationUl.appendChild(nextLi);
          }

          const searchForm = document.getElementById("noticeSearchForm");
          const searchInput = document.getElementById("noticeKeyword");

          if (searchForm && searchInput) {
            searchForm.addEventListener("submit", function (e) {
              e.preventDefault();
              const keyword = searchInput.value.trim().toLowerCase();
              filteredRows = rows.filter(function (row) {
                const title = (row.getAttribute("data-title") || "").toLowerCase();
                return title.includes(keyword);
              });

              const emptyRow = document.getElementById("emptyNoticeRow");
              if (filteredRows.length === 0) {
                if (emptyRow) {
                  emptyRow.style.display = "";
                  emptyRow.cells[0].textContent = "검색된 결과가 없습니다.";
                }
              } else if (emptyRow) {
                emptyRow.style.display = "none";
              }

              displayPage(1);
            });
          }

          if (rows.length > 0) {
            displayPage(1);
          }
        });
      </script>
    </div>
  </body>
</html>
