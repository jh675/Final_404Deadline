<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/projectLayout}">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${notice.id != null} ? '공지사항 수정' : '공지사항 등록'">공지사항 등록</title>
    <th:block layout:fragment="head-content">
      <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
      <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
      <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
      <link rel="stylesheet" th:href="@{/css/project/issue.css}" />
      <link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
    </th:block>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="issue-shell">
        <div id="wrapper">
          <div class="issue-page-head">
            <a class="issue-page-back" th:href="@{/project/notice/list}">← 공지사항 목록</a>
            <h1 class="issue-page-head__title" th:text="${notice.id != null} ? '공지사항 수정' : '공지사항 등록'">
              공지사항 등록
            </h1>
          </div>

          <form
            class="notice-register-form"
            th:action="${notice.id != null} ? @{/project/notice/modify} : @{/project/notice/insert}"
            method="post"
            enctype="multipart/form-data"
          >
            <input type="hidden" name="id" th:value="${notice.id}" />
            <input type="hidden" name="prjId" th:value="${session.currentProjectId}" />

            <div class="issue-page-section">
              <div class="issue-form-row">
                <div class="search-item search-item--grow">
                  <div class="notice-form-fixed">
                    <label class="notice-form-fixed__label" for="isFixed">
                      <input
                        class="notice-form-fixed__input"
                        type="checkbox"
                        id="isFixed"
                        name="isFixed"
                        th:checked="${notice.isFixed == '01ACTIVE'}"
                        value="01ACTIVE"
                      />
                      <span>이 공지사항을 목록 상단에 항상 고정합니다.</span>
                    </label>
                  </div>
                </div>
              </div>

              <div class="issue-form-row">
                <div class="search-item search-item--grow">
                  <label for="noticeTitle">제목 <span class="req">*</span></label>
                  <div class="field-wrap">
                    <input
                      type="text"
                      id="noticeTitle"
                      name="title"
                      class="form-control"
                      th:value="${notice.title}"
                      placeholder="공지사항 제목을 입력하세요"
                      required
                      autocomplete="off"
                    />
                  </div>
                </div>
              </div>

              <div class="issue-form-row">
                <div class="search-item search-item--grow">
                  <label for="noticeDescription">내용</label>
                  <div class="field-wrap">
                    <textarea
                      id="noticeDescription"
                      name="description"
                      class="form-control"
                      rows="10"
                      placeholder="공지사항 상세 내용을 작성하세요"
                      th:text="${notice.description}"
                    ></textarea>
                  </div>
                </div>
              </div>

              <div class="issue-form-row">
                <div class="search-item search-item--grow">
                  <label for="noticeAttachments">첨부파일</label>
                  <div class="field-wrap">
                    <input
                      type="file"
                      id="noticeAttachments"
                      name="attachments"
                      class="form-control"
                      multiple="multiple"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="issue-register-actions notice-register-actions">
              <div class="notice-register-actions__left">
                <button
                  type="button"
                  th:if="${notice.id != null}"
                  class="btn btn-danger"
                  th:onclick="|if(confirm('정말 삭제하시겠습니까?')) location.href='@{/project/notice/delete(id=${notice.id})}'|"
                >
                  삭제하기
                </button>
              </div>
              <div class="notice-register-actions__primary">
                <a th:href="@{/project/notice/list}" class="btn btn-secondary">취소</a>
                <button type="submit" class="btn btn-primary" th:text="${notice.id != null} ? '수정 완료' : '등록 완료'">
                  등록 완료
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
