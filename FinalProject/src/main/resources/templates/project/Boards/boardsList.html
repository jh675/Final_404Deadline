<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>프로젝트 게시판</title>
<th:block layout:fragment="head-content">
	<link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
	<link rel="stylesheet" th:href="@{/css/project/issue.css}" />
	<link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
</th:block>
</head>
<body>
	<div layout:fragment="content">
		<div class="issue-shell issue-shell--list">
			<div id="wrapper" class="issue-list issue-list--boards">
				<header class="issue-list__header">
					<h1 class="issue-list__title">프로젝트 게시판 목록</h1>
				</header>

				<section class="issue-section issue-section--grid" aria-label="게시판 목록">
					<div class="boards-table-wrap">
						<table class="data-table boards-table">
							<thead>
								<tr>
									<th class="boards-table__col-no">순번</th>
									<th class="boards-table__col-title">제목</th>
									<th class="boards-table__col-desc">내용</th>
									<th class="boards-table__col-topics">토픽수</th>
									<th class="boards-table__col-actions">관리</th>
								</tr>
							</thead>
							<tbody>
								<th:block
									th:with="
										currentPage=${param.pageNo != null ? T(java.lang.Integer).parseInt(param.pageNo) : 1},
										startIdx=${(currentPage - 1) * 10},
										endIdx=${currentPage * 10}
									">
									<tr th:each="board, stat : ${list}"
										th:if="${stat.index >= startIdx and stat.index < endIdx}">
										<td class="boards-table__cell-no" th:text="${stat.index + 1}">1</td>
										<td class="boards-table__cell-title">
											<a class="boards-title-link"
												th:href="@{/project/messages/list(boardId=${board.id})}"
												th:text="${board.name}">제목</a>
										</td>
										<td class="boards-table__cell-desc" th:text="${board.description}">설명 내용</td>
										<td class="boards-table__cell-topics">
											<span
												th:classappend="${board.topicsCount > 0} ? 'boards-topics-badge boards-topics-badge--active' : 'boards-topics-badge boards-topics-badge--empty'"
												class="boards-topics-badge"
												th:text="${board.topicsCount} + '건'">0건</span>
										</td>
										<td class="boards-table__cell-actions">
											<div class="boards-row-actions">
												<button type="button" class="btn btn-success"
													th:onclick="|location.href='@{/project/boards/modify(id=${board.id})}'|">수정</button>
												<button type="button" class="btn btn-danger"
													th:onclick="|if(confirm('이 게시판을 삭제하시겠습니까?')) { location.href='@{/project/boards/delete(id=${board.id})}' }|">삭제</button>
											</div>
										</td>
									</tr>
								</th:block>
								<tr th:if="${#lists.isEmpty(list)}">
									<td colspan="5" class="boards-table__empty">등록된 게시판이 없습니다.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</section>

				<section class="issue-section issue-section--footer" aria-label="게시판 목록 하단">
					<div class="issue-list-footer"
						th:with="
							currentPage=${param.pageNo != null ? T(java.lang.Integer).parseInt(param.pageNo) : 1},
							totalItems=${#lists.size(list)},
							totalPages=${totalItems % 10 == 0 ? totalItems / 10 : (totalItems / 10) + 1}
						">
						<div class="issue-list-footer__pagination">
							<nav aria-label="게시판 페이지" th:if="${totalPages > 0}">
								<ul class="notice-pagination pagination mb-0">
									<li th:classappend="${currentPage <= 1} ? 'page-item disabled' : 'page-item'">
										<a class="page-link"
											th:href="@{/project/boards/list(pageNo=${currentPage - 1})}">&lt;</a>
									</li>
									<li th:each="i : ${#numbers.sequence(1, totalPages)}"
										th:classappend="${i == currentPage} ? 'page-item active' : 'page-item'">
										<a class="page-link" th:href="@{/project/boards/list(pageNo=${i})}" th:text="${i}">1</a>
									</li>
									<li th:classappend="${currentPage >= totalPages} ? 'page-item disabled' : 'page-item'">
										<a class="page-link"
											th:href="@{/project/boards/list(pageNo=${currentPage + 1})}">&gt;</a>
									</li>
								</ul>
							</nav>
						</div>
						<div class="issue-list-footer__actions">
							<button type="button" class="btn btn-primary"
								onclick="location.href='/project/boards/register'">게시판 등록</button>
						</div>
					</div>
				</section>
			</div>
		</div>
	</div>
</body>
</html>
