<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>프로젝트 게시판</title>
<style>
.content-container {
	max-width: 1100px;
	margin: 0 auto;
}
.text-success-dark {
	color: #106699 !important;
}

.bg-light-green {
	background-color: #f5fbff !important;
}

.btn-green-sm {
	background-color: #20a0e0;
	color: white;
	border: none;
	border-radius: 4px;
	font-size: 0.85rem;
	font-weight: 500;
	padding: 6px 14px;
}

.btn-green-sm:hover {
	background-color: #1a8cc8;
	color: white;
}

.table-card {
	border-radius: 0px;
	border: 1px solid #dee2e6;
	background-color: white;
}

.table {
	font-size: 0.85rem;
}

.table thead th {
	font-weight: 600;
	padding: 8px 10px;
	background-color: #f8f9fa;
	border-bottom: 1px solid #dee2e6;
	color: #495057;
}

.table tbody td {
	padding: 12px 10px;
	vertical-align: middle;
	border-bottom: 1px solid #eee;
}

.btn-action-modify {
	font-size: 0.8rem;
	padding: 2px 8px;
	border: 1px solid #20a0e0;
	color: #20a0e0;
	background-color: transparent;
	border-radius: 4px;
}

.btn-action-modify:hover {
	background-color: #20a0e0;
	color: white;
}

.btn-action-delete {
	font-size: 0.8rem;
	padding: 2px 8px;
	border: 1px solid #dc3545;
	color: #dc3545;
	background-color: transparent;
	border-radius: 4px;
}

.btn-action-delete:hover {
	background-color: #dc3545;
	color: white;
}

.custom-pagination {
	display: flex;
	gap: 4px;
	justify-content: center;
	align-items: center;
	margin-top: 1rem;
}

.custom-pagination .btn-page {
	border: 1px solid #dee2e6;
	color: #555;
	background-color: #fff;
	border-radius: 3px !important;
	min-width: 30px;
	height: 30px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 0.8rem;
	padding: 0;
}

.custom-pagination .btn-nav {
	padding: 0 10px;
}

.custom-pagination .btn-page:hover:not(:disabled) {
	background-color: #f5fbff;
	color: #20a0e0;
}
.custom-pagination .btn-page.active {
	background-color: #20a0e0 !important;
	border-color: #20a0e0 !important;
	color: white !important;
	font-weight: bold;
}

.custom-pagination .btn-page:disabled {
	background-color: #f8f9fa;
	color: #ccc;
	cursor: not-allowed;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div id="wrapper">

			<h5 class="fw-bold text-dark mb-3">프로젝트 게시판 목록</h5>

			<div class="d-flex justify-content-end mb-2">
				<button type="button" class="btn btn-green-sm shadow-sm"
					onclick="location.href='/project/boards/register'">게시판 등록</button>
			</div>

			<div class="table-card overflow-hidden">
				<div class="table-responsive">
					<table class="table table-bordered table-hover text-center mb-0">
						<thead>
							<tr class="bg-light">
								<th style="width: 60px;">순번</th>
								<th style="width: 150px;">제목</th>
								<th>내용</th>
								<th style="width: 100px;">토픽수</th>
								<th style="width: 140px;">관리</th>
							</tr>
						</thead>
						<tbody>
							<th:block
								th:with="
                        currentPage=${param.pageNo != null ? T(java.lang.Integer).parseInt(param.pageNo) : 1},
                        startIdx=${(currentPage - 1) * 10},
                        endIdx=${currentPage * 10}
                    ">
								<tr th:each="board, stat : ${list}"
									th:if="${stat.index >= startIdx and stat.index < endIdx}">

									<td class="text-muted" th:text="${stat.index + 1}">1</td>

									<td class="text-start fw-bold text-success-dark"><a
										th:href="@{/project/messages/list(boardId=${board.id})}"
										th:text="${board.name}"
										style="color: inherit; text-decoration: none;">제목</a></td>

									<td class="text-start text-muted"
										th:text="${board.description}">설명 내용</td>

									<td><span
										th:classappend="${board.topicsCount > 0} ? 'bg-light-green text-primary border border-primary-subtle' : 'bg-light text-muted border'"
										class="badge px-2 py-0.5" th:text="${board.topicsCount} + '건'">0건</span>
									</td>

									<td>
										<div class="d-flex gap-1 justify-content-center">
											<button type="button" class="btn-action-modify"
												th:onclick="|location.href='@{/project/boards/modify(id=${board.id})}'|">수정</button>
											<button type="button" class="btn-action-delete"
												th:onclick="|if(confirm('이 게시판을 삭제하시겠습니까?')) { location.href='@{/project/boards/delete(id=${board.id})}' }|">삭제</button>
										</div>
									</td>
								</tr>
							</th:block>

							<tr th:if="${#lists.isEmpty(list)}">
								<td colspan="5" class="text-center py-4 text-muted">등록된
									게시판이 없습니다.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div class="custom-pagination"
				th:with="
        currentPage=${param.pageNo != null ? T(java.lang.Integer).parseInt(param.pageNo) : 1},
        totalItems=${#lists.size(list)},
        totalPages=${totalItems % 10 == 0 ? totalItems / 10 : (totalItems / 10) + 1}
    ">
				<button type="button" class="btn-page btn-nav"
					th:onclick="|location.href='@{/project/boards/list(pageNo=${currentPage - 1})}'|"
					th:disabled="${currentPage <= 1}"><</button>
				<th:block th:if="${totalPages > 0}"
					th:each="i : ${#numbers.sequence(1, totalPages)}">
					<button type="button" class="btn-page" th:text="${i}"
						th:onclick="|location.href='@{/project/boards/list(pageNo=${i})}'|"
						th:classappend="${i == currentPage} ? 'active' : ''">1</button>
				</th:block>
				<button type="button" class="btn-page btn-nav"
					th:onclick="|location.href='@{/project/boards/list(pageNo=${currentPage + 1})}'|"
					th:disabled="${currentPage >= totalPages or totalPages == 0}">></button>
			</div>
		</div>
	</div>
</body>
</html>
