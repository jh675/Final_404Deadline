<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- 그룹 등록 — 프로젝트 구성원 선택 오버레이 (스타일·스크립트는 groupManagementInfo.html) -->
    <th:block th:fragment="groupMemberPickOverlay">
      <div class="grp-member-pick-overlay" id="grpMemberPickOverlay" aria-hidden="true">
        <div class="grp-member-pick" role="dialog" aria-modal="true" aria-labelledby="grpMemberPickTitle">
          <div class="grp-member-pick__head" id="grpMemberPickTitle">
            구성원 선택
          </div>
          <div class="grp-member-pick__search">
            <label class="visually-hidden" for="grpMemberSearchType">
              검색 항목
            </label>
            <select id="grpMemberSearchType" aria-label="검색 항목">
              <option value="memberId">사번</option>
              <option value="userName" selected>이름</option>
            </select>
            <label class="visually-hidden" for="grpMemberSearchKeyword">
              검색어
            </label>
            <input
              type="text"
              autocomplete="off"
              id="grpMemberSearchKeyword"
              placeholder="검색어를 입력하세요"
            />
          </div>
          <div
            id="grpMemberPickGrid"
            class="grp-member-pick__grid-host"
            role="region"
            aria-label="구성원 선택 목록"
          ></div>
          <div class="grp-member-pick__actions">
            <button type="button" id="btnMemberPickCancel">취소</button>
            <button type="button" class="primary" id="btnMemberPickOk">
              저장
            </button>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
