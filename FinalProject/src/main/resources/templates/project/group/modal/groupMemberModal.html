<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- 그룹 등록 — 프로젝트 구성원 선택 오버레이 -->
    <th:block th:fragment="groupMemberPickOverlay">
      <div class="issue-quick-modal-backdrop grp-member-pick-overlay" id="grpMemberPickOverlay" aria-hidden="true">
        <div class="issue-quick-modal issue-quick-modal--wide" role="dialog" aria-modal="true"
          aria-labelledby="grpMemberPickTitle" tabindex="-1">
          <div class="issue-quick-modal-head">
            <h2 id="grpMemberPickTitle">구성원 선택</h2>
            <button type="button" class="issue-quick-modal-close" id="btnMemberPickClose"
              aria-label="닫기">&times;</button>
          </div>
          <div class="issue-quick-modal-body issue-quick-modal-body--pick">
            <div class="issue-quick-modal-search grp-member-pick__search">
              <label class="visually-hidden" for="grpMemberSearchType">검색 항목</label>
              <select id="grpMemberSearchType" aria-label="검색 항목">
                <option value="memberId">사번</option>
                <option value="userName" selected>이름</option>
              </select>
              <label class="visually-hidden" for="grpMemberSearchKeyword">검색어</label>
              <input type="text" autocomplete="off" id="grpMemberSearchKeyword" placeholder="검색어를 입력하세요" />
            </div>
            <div id="grpMemberPickGrid" class="issue-quick-modal-grid-host grp-member-pick__grid-host"
              role="region" aria-label="구성원 선택 목록"></div>
          </div>
          <div class="issue-quick-modal-foot">
            <button type="button" class="issue-btn issue-btn--secondary issue-bulk-btn issue-bulk-btn-ghost"
              id="btnMemberPickCancel">초기화</button>
            <button type="button" class="issue-btn issue-btn--primary issue-bulk-btn issue-bulk-btn-primary"
              id="btnMemberPickOk">저장</button>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
