<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- 그룹 상세 — 권한별 메뉴 매트릭스 오버레이 -->
    <th:block th:fragment="groupRoleMenusOverlay">
      <div class="issue-quick-modal-backdrop grp-role-menus-overlay" id="grpRoleMenusOverlay" aria-hidden="true">
        <div class="issue-quick-modal issue-quick-modal--menus" role="dialog" aria-modal="true"
          aria-labelledby="grpRoleMenusTitle" tabindex="-1">
          <div class="issue-quick-modal-head">
            <h2 id="grpRoleMenusTitle">메뉴 권한</h2>
            <button type="button" class="issue-quick-modal-close" id="btnGrpRoleMenusCloseTop"
              aria-label="닫기">&times;</button>
          </div>
          <div class="issue-quick-modal-body">
            <p class="grp-role-menus-modal__sub" id="grpRoleMenusRoleCaption" aria-live="polite"></p>
            <table class="grp-role-menus-table" id="grpRoleMenusTable" hidden>
              <thead>
                <tr>
                  <th scope="col" class="grp-role-menus-table__menu-col">메뉴</th>
                  <th scope="col">조회</th>
                  <th scope="col">등록</th>
                  <th scope="col">수정</th>
                  <th scope="col">삭제</th>
                </tr>
              </thead>
              <tbody id="grpRoleMenusTableBody"></tbody>
            </table>
            <p class="grp-role-menus-empty" id="grpRoleMenusEmpty" hidden>
              연결된 메뉴가 없습니다.
            </p>
            <p class="grp-role-menus-loading" id="grpRoleMenusLoading" hidden>
              불러오는 중…
            </p>
          </div>
          <div class="issue-quick-modal-foot">
            <button type="button" class="issue-btn issue-btn--primary issue-bulk-btn issue-bulk-btn-primary"
              id="btnGrpRoleMenusClose">닫기</button>
          </div>
        </div>
      </div>
    </th:block>

    <!-- 그룹 상세 — 프로젝트 권한(ROLE) 선택 오버레이 -->
    <th:block th:fragment="groupRolePickOverlay">
      <div class="issue-quick-modal-backdrop grp-role-pick-overlay" id="grpRolePickOverlay" aria-hidden="true">
        <div class="issue-quick-modal issue-quick-modal--wide" role="dialog" aria-modal="true"
          aria-labelledby="grpRolePickTitle" tabindex="-1">
          <div class="issue-quick-modal-head">
            <h2 id="grpRolePickTitle">권한 선택</h2>
            <button type="button" class="issue-quick-modal-close" id="btnRolePickClose"
              aria-label="닫기">&times;</button>
          </div>
          <div class="issue-quick-modal-body issue-quick-modal-body--pick">
            <div class="issue-quick-modal-search grp-role-pick__search">
              <label class="visually-hidden" for="grpRoleSearchType">검색 항목</label>
              <select id="grpRoleSearchType" aria-label="검색 항목">
                <option value="roleCd">권한코드</option>
                <option value="roleName" selected>권한명</option>
              </select>
              <label class="visually-hidden" for="grpRoleSearchKeyword">검색어</label>
              <input type="text" autocomplete="off" id="grpRoleSearchKeyword" placeholder="검색어를 입력하세요" />
            </div>
            <div id="grpRolePickGrid" class="issue-quick-modal-grid-host grp-role-pick__grid-host"
              role="region" aria-label="권한 선택 목록"></div>
          </div>
          <div class="issue-quick-modal-foot">
            <button type="button" class="issue-btn issue-btn--secondary issue-bulk-btn issue-bulk-btn-ghost"
              id="btnRolePickCancel">초기화</button>
            <button type="button" class="issue-btn issue-btn--primary issue-bulk-btn issue-bulk-btn-primary"
              id="btnRolePickOk">저장</button>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
