<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- 그룹 상세 — 권한별 메뉴 목록 오버레이 (스타일은 groupManagementInfo.html) -->
    <th:block th:fragment="groupRoleMenusOverlay">
      <div class="grp-role-menus-overlay" id="grpRoleMenusOverlay" aria-hidden="true">
        <div class="grp-role-menus-modal" role="dialog" aria-modal="true" aria-labelledby="grpRoleMenusTitle" tabindex="-1">
          <div class="grp-role-menus-modal__head">
            <span id="grpRoleMenusTitle">메뉴 목록</span>
          </div>
          <div class="grp-role-menus-modal__sub" id="grpRoleMenusRoleCaption" aria-live="polite"></div>
          <div class="grp-role-menus-modal__body">
            <ul class="grp-role-menus-list" id="grpRoleMenusList"></ul>
            <p class="grp-role-menus-empty" id="grpRoleMenusEmpty" hidden>
              연결된 메뉴가 없습니다.
            </p>
            <p class="grp-role-menus-loading" id="grpRoleMenusLoading" hidden>
              불러오는 중…
            </p>
          </div>
          <div class="grp-role-menus-modal__actions">
            <button type="button" id="btnGrpRoleMenusClose">닫기</button>
          </div>
        </div>
      </div>
    </th:block>

    <!-- 그룹 상세 — 프로젝트 권한(ROLE) 선택 오버레이 -->
    <th:block th:fragment="groupRolePickOverlay">
      <div
        class="grp-role-pick-overlay"
        id="grpRolePickOverlay"
        aria-hidden="true"
      >
        <div
          class="grp-role-pick"
          role="dialog"
          aria-modal="true"
          aria-labelledby="grpRolePickTitle"
        >
          <div class="grp-role-pick__head" id="grpRolePickTitle">권한 선택</div>
          <div class="grp-role-pick__search">
            <label class="visually-hidden" for="grpRoleSearchType">검색 항목</label>
            <select id="grpRoleSearchType" aria-label="검색 항목">
              <option value="roleCd">권한코드</option>
              <option value="roleName" selected>권한명</option>
            </select>
            <label class="visually-hidden" for="grpRoleSearchKeyword">검색어</label>
            <input
              type="text"
              autocomplete="off"
              id="grpRoleSearchKeyword"
              placeholder="검색어를 입력하세요"
            />
          </div>
          <div
            id="grpRolePickGrid"
            class="grp-role-pick__grid-host"
            role="region"
            aria-label="권한 선택 목록"
          ></div>
          <div class="grp-role-pick__actions">
            <button type="button" id="btnRolePickCancel">취소</button>
            <button type="button" class="primary" id="btnRolePickOk">저장</button>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
