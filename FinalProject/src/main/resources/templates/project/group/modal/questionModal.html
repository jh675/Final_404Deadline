<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="groupQuestionModal">
      <div
        class="modal fade"
        id="groupQuestionModal"
        tabindex="-1"
        aria-labelledby="groupQuestionModalTitle"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="groupQuestionModalTitle">알림</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
              <p class="mb-0 text-break" id="groupQuestionModalMessage" style="white-space: pre-wrap"></p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" id="groupQuestionModalCancelBtn">취소</button>
              <button type="button" class="btn btn-primary" id="groupQuestionModalConfirmBtn">확인</button>
            </div>
          </div>
        </div>
      </div>
    </th:block>
    <th:block th:fragment="groupQuestionModalScript">
      <script>
        window.GroupQuestionModal = (function () {
          var modalEl, titleEl, msgEl, btnCancel, btnConfirm;
          function cacheElements() {
            if (!modalEl) {
              modalEl = document.getElementById("groupQuestionModal");
              if (!modalEl) return false;
              titleEl = document.getElementById("groupQuestionModalTitle");
              msgEl = document.getElementById("groupQuestionModalMessage");
              btnCancel = document.getElementById("groupQuestionModalCancelBtn");
              btnConfirm = document.getElementById("groupQuestionModalConfirmBtn");
            }
            return true;
          }
          function getInstance() {
            if (!cacheElements() || typeof bootstrap === "undefined" || !bootstrap.Modal) return null;
            return bootstrap.Modal.getOrCreateInstance(modalEl);
          }
          function open(opts) {
            var mode = opts.mode || "alert";
            return new Promise(function (resolve) {
              var inst = getInstance();
              if (!inst || !titleEl || !msgEl) {
                resolve(mode === "confirm" ? false : undefined);
                return;
              }
              var settled = false;
              function settle(value) {
                if (settled) return;
                settled = true;
                modalEl.removeEventListener("hidden.bs.modal", onModalHidden);
                resolve(value);
              }
              function onModalHidden() {
                if (mode === "confirm") settle(false);
                else settle(undefined);
              }
              titleEl.textContent =
                opts.title != null && opts.title !== ""
                  ? opts.title
                  : mode === "confirm" ? "확인" : "알림";
              msgEl.textContent = opts.message != null ? String(opts.message) : "";
              if (mode === "alert") btnCancel.classList.add("d-none");
              else btnCancel.classList.remove("d-none");
              modalEl.addEventListener("hidden.bs.modal", onModalHidden);
              btnCancel.onclick = function () {
                if (mode === "confirm") settle(false);
                inst.hide();
              };
              btnConfirm.onclick = function () {
                if (mode === "confirm") settle(true);
                else settle(undefined);
                inst.hide();
              };
              inst.show();
            });
          }
          return {
            alert: function (message, title) {
              return open({ message: message, title: title, mode: "alert" });
            },
            confirm: function (message, title) {
              return open({ message: message, title: title, mode: "confirm" });
            },
          };
        })();
      </script>
    </th:block>
  </body>
</html>
