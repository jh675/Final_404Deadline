<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="groupQuestionModal">
      <div id="groupQuestionModal" class="issue-quick-modal-backdrop" role="dialog"
        aria-modal="true" aria-labelledby="groupQuestionModalTitle" hidden>
        <div class="issue-quick-modal">
          <div class="issue-quick-modal-head">
            <h2 id="groupQuestionModalTitle">알림</h2>
            <button type="button" class="issue-quick-modal-close" id="groupQuestionModalCloseBtn"
              aria-label="닫기">&times;</button>
          </div>
          <div class="issue-quick-modal-body">
            <p class="issue-quick-confirm-message" id="groupQuestionModalMessage"></p>
          </div>
          <div class="issue-quick-modal-foot">
            <button type="button" class="issue-btn issue-btn--secondary issue-bulk-btn issue-bulk-btn-ghost"
              id="groupQuestionModalCancelBtn">취소</button>
            <button type="button" class="issue-btn issue-btn--primary issue-bulk-btn issue-bulk-btn-primary"
              id="groupQuestionModalConfirmBtn">확인</button>
          </div>
        </div>
      </div>
    </th:block>
    <th:block th:fragment="groupQuestionModalScript">
      <script th:src="@{/js/group/modal/questionModal.js(v=2)}"></script>
    </th:block>
  </body>
</html>
