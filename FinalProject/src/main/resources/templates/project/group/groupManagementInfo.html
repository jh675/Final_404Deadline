<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/projectLayout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${registerMode} ? '그룹 등록' : '그룹 상세'">그룹 상세</title>
    <th:block th:if="${!groupNotFound}">
      <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
      <link rel="stylesheet" href="https://uicdn.toast.com/tui.grid/latest/tui-grid.css" />
      <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
      <script src="https://uicdn.toast.com/tui.grid/latest/tui-grid.js"></script>
    </th:block>
    <style>
      .grp-info-page__back {
        display: inline-block;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: #1976d2;
        text-decoration: none;
      }
      .grp-info-page__back:hover {
        text-decoration: underline;
      }
      .grp-info-page__head {
        margin-bottom: 1.25rem;
      }
      .grp-info-page__title {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #222;
      }
      .grp-info-page__rule {
        height: 3px;
        background: #333;
        border: 0;
        margin: 0;
      }
      .grp-section {
        margin-bottom: 2rem;
      }
      .grp-section__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #222;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .grp-section__body {
        padding-top: 0.85rem;
      }
      .grp-detail-form {
        --grp-label-w: 9.75rem;
        --grp-input-w: 16rem;
        --grp-font-size: 0.8125rem;
        --grp-input-bg: #f5f5f5;
        --grp-input-border: #d0d0d0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .grp-detail-form .grp-basic-form__row {
        display: grid;
        grid-template-columns: var(--grp-label-w) var(--grp-input-w);
        align-items: start;
        column-gap: 0.75rem;
      }
      .grp-detail-form .grp-basic-form__row label {
        font-size: var(--grp-font-size);
        color: #333;
        text-align: right;
        white-space: nowrap;
        line-height: 1.35;
        padding-top: 0.4rem;
      }
      .grp-detail-form .grp-basic-form__row label .req {
        color: #c62828;
      }
      .grp-detail-form .grp-basic-form__field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: var(--grp-input-w);
      }
      .grp-detail-form .grp-basic-form__row input {
        width: 100%;
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--grp-input-border);
        border-radius: 4px;
        background: var(--grp-input-bg);
        font-size: var(--grp-font-size);
        color: #333;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .grp-detail-form .grp-basic-form__row input.grp-input--editable {
        background: #fff;
      }
      .grp-detail-form .grp-basic-form__row input::placeholder {
        color: #aaa;
        font-size: var(--grp-font-size);
      }
      .grp-field-hint {
        margin: 0;
        font-size: 0.75rem;
        color: #c62828;
        line-height: 1.35;
      }
      .grp-grid-panel {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #fafafa;
        padding: 0.75rem 0.75rem 0.5rem;
      }
      .grp-grid-host {
        min-height: 120px;
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
        overflow: hidden;
      }
      .grp-data-table-wrap {
        overflow-x: auto;
        border: 1px solid #cfcfcf;
        border-radius: 4px;
        background: #fff;
      }
      .grp-data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8125rem;
        min-width: 40rem;
      }
      .grp-data-table th,
      .grp-data-table td {
        border: 1px solid #d8d8d8;
        padding: 0.45rem 0.5rem;
        text-align: center;
        vertical-align: middle;
        color: #333;
        white-space: nowrap;
      }
      .grp-data-table thead th {
        background: #f0f0f0;
        font-weight: 600;
      }
      .grp-data-table tbody tr:nth-child(even) {
        background: #fafafa;
      }
      .grp-data-table tbody td.empty {
        color: #999;
      }
      .grp-member-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-top: 0.65rem;
      }
      .grp-member-toolbar.is-hidden {
        display: none;
      }
      .grp-member-toolbar__btn {
        padding: 0.35rem 0.95rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        color: #333;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .grp-member-toolbar__btn:hover:not(:disabled):not(.is-disabled) {
        background: #f5f5f5;
      }
      .grp-member-toolbar__btn:disabled,
      .grp-member-toolbar__btn.is-disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .grp-empty-msg {
        margin: 0.5rem 0 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .grp-actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem 0 0.5rem;
      }
      .grp-actions__btn {
        min-width: 5.5rem;
        padding: 0.45rem 1.5rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: #666;
        color: #fff;
        font-size: 0.875rem;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .grp-actions__btn:hover {
        background: #555;
      }
      .grp-actions__btn--secondary {
        background: #fff;
        color: #333;
      }
      .grp-actions__btn--secondary:hover {
        background: #f5f5f5;
      }
      .grp-actions__btn.is-hidden {
        display: none;
      }
      .grp-role-pick-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .grp-role-pick-overlay.is-open {
        display: flex;
      }
      .grp-role-pick {
        width: min(42rem, 94vw);
        max-height: 80vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .grp-role-pick__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .grp-role-pick__search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .grp-role-pick__search select,
      .grp-role-pick__search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .grp-role-pick__search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
      }
      .grp-role-pick__search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .grp-role-pick__grid-host {
        flex: 1 1 auto;
        min-height: 12rem;
        max-height: 50vh;
        overflow: auto;
        margin: 0.5rem 1rem;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        background: #fff;
      }
      .grp-role-pick__actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .grp-role-pick__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .grp-role-pick__actions button.primary {
        background: #666;
        color: #fff;
        border-color: #555;
      }
      .grp-member-pick-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .grp-member-pick-overlay.is-open {
        display: flex;
      }
      .grp-member-pick {
        width: min(42rem, 94vw);
        max-height: 80vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .grp-member-pick__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .grp-member-pick__search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .grp-member-pick__search select,
      .grp-member-pick__search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .grp-member-pick__search select {
        flex: 0 0 auto;
        min-width: 5.5rem;
        max-width: 6.5rem;
      }
      .grp-member-pick__search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .grp-member-pick__search .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .grp-member-pick__grid-host {
        flex: 1 1 auto;
        min-height: 12rem;
        max-height: 50vh;
        overflow: auto;
        margin: 0.5rem 1rem;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        background: #fff;
      }
      .grp-member-pick__actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .grp-member-pick__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .grp-member-pick__actions button.primary {
        background: #666;
        color: #fff;
        border-color: #555;
      }
      .grp-role-name-link {
        color: #1976d2;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .grp-role-name-link:hover {
        color: #0d47a1;
      }
      .grp-role-menus-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1001;
      }
      .grp-role-menus-overlay.is-open {
        display: flex;
      }
      .grp-role-menus-modal {
        width: min(34rem, 94vw);
        max-height: 80vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      }
      .grp-role-menus-modal__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .grp-role-menus-modal__sub {
        padding: 0.5rem 1rem 0;
        font-size: 0.8125rem;
        color: #444;
      }
      .grp-role-menus-modal__body {
        padding: 0.65rem 1rem 0.75rem;
        overflow: auto;
        max-height: 56vh;
      }
      .grp-role-menus-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8125rem;
        color: #333;
        background: #fff;
      }
      .grp-role-menus-table th,
      .grp-role-menus-table td {
        border: 1px solid #d8d8d8;
        padding: 0.45rem 0.55rem;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
      }
      .grp-role-menus-table thead th {
        background: #f0f0f0;
        font-weight: 600;
      }
      .grp-role-menus-table tbody tr:nth-child(even) {
        background: #fafafa;
      }
      .grp-role-menus-table__menu-col {
        text-align: left;
        width: 40%;
      }
      .grp-role-menus-table tbody td:first-child {
        text-align: left;
        font-weight: 500;
      }
      .grp-role-menus-table .grp-role-menus-cell--check {
        color: #1976d2;
        font-weight: 600;
      }
      .grp-role-menus-table .grp-role-menus-cell--dash {
        color: #bbb;
      }
      .grp-role-menus-empty,
      .grp-role-menus-loading {
        margin: 0.35rem 0 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .grp-role-menus-modal__actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .grp-role-menus-modal__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #666;
        color: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .grp-role-menus-modal__actions button:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div layout:fragment="content">
      <a class="grp-info-page__back" th:href="@{/project/group/list}">← 그룹 목록으로</a>

      <header class="grp-info-page__head">
        <h1 class="grp-info-page__title" th:text="${registerMode} ? '그룹 등록' : '그룹 상세'">그룹 상세</h1>
        <hr class="grp-info-page__rule" />
      </header>

      <th:block th:if="${registerMode or !groupNotFound}">
        <section class="grp-section" aria-labelledby="grp-basic-heading">
          <h2 class="grp-section__title" id="grp-basic-heading">기본정보</h2>
          <div class="grp-section__body">
            <div class="grp-basic-form grp-detail-form">
              <div class="grp-basic-form__row">
                <label for="detailPrjName"> 프로젝트명 <span class="req">*</span></label>
                <div class="grp-basic-form__field">
                  <input type="text" id="detailPrjName" readonly th:value="${session.project != null ? session.project.prjName : detail.prjName}" />
                </div>
              </div>
              <div class="grp-basic-form__row">
                <label for="detailGrpName">그룹명 <span class="req">*</span></label>
                <div class="grp-basic-form__field">
                  <input th:if="${registerMode}" type="text" id="detailGrpName" placeholder="그룹명을 입력해 주세요." class="grp-input--editable" th:value="${detail.grpName}" autocomplete="off" />
                  <input th:unless="${registerMode}" type="text" id="detailGrpName" placeholder="텍스트를 입력해 주세요." readonly th:value="${detail.grpName}" />
                  <p class="grp-field-hint" th:if="${registerMode}">한 번 정해진 그룹명은 변경할 수 없습니다.</p>
                </div>
              </div>
              <div class="grp-basic-form__row" th:if="${!registerMode}">
                <label for="detailGrpCreatedOn">그룹생성일 <span class="req">*</span></label>
                <div class="grp-basic-form__field">
                  <input type="text" id="detailGrpCreatedOn" readonly th:value="${detail.createdOn != null ? #dates.format(detail.createdOn, 'yyyy-MM-dd') : ''}" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="grp-section" aria-labelledby="grp-members-heading">
          <h2 class="grp-section__title" id="grp-members-heading">구성원 정보</h2>
          <div class="grp-section__body">
            <div class="grp-grid-panel">
              <div id="grpMembersGrid" class="grp-grid-host" role="region" aria-label="구성원 목록"></div>
              <div id="grpMemberToolbar" class="grp-member-toolbar" th:if="${registerMode or !groupNotFound}" th:classappend="${!registerMode} ? 'is-hidden' : ''">
                <button type="button" class="grp-member-toolbar__btn" id="btnAddMember">구성원 관리</button>
              </div>
            </div>
          </div>
        </section>

        <section th:if="${!registerMode}" class="grp-section" aria-labelledby="grp-roles-heading">
          <h2 class="grp-section__title" id="grp-roles-heading">보유 권한</h2>
          <div class="grp-section__body">
            <div class="grp-grid-panel">
              <div id="grpRolesGrid" class="grp-grid-host" role="region" aria-label="보유 권한 목록"></div>
              <div id="grpRoleToolbar" class="grp-member-toolbar is-hidden">
                <button type="button" id="btnManageRoles" class="grp-member-toolbar__btn">권한 관리</button>
              </div>
            </div>
          </div>
        </section>

        <div class="grp-actions" th:if="${registerMode}">
          <button type="button" class="grp-actions__btn" id="btnGroupSave">등록</button>
          <a class="grp-actions__btn grp-actions__btn--secondary" th:href="@{/project/group/list}">취소</a>
        </div>
        <div class="grp-actions" th:unless="${registerMode}">
          <button type="button" class="grp-actions__btn" id="btnGroupEdit">수정</button>
          <button type="button" id="btnGroupSave" class="grp-actions__btn is-hidden">저장</button>
          <button type="button" id="btnGroupCancel" class="grp-actions__btn grp-actions__btn--secondary is-hidden">취소</button>
        </div>
      </th:block>

      <th:block th:if="${!groupNotFound}">
        <th:block th:replace="~{project/group/modal/questionModal :: groupQuestionModal}"></th:block>
        <th:block th:replace="~{project/group/modal/questionModal :: groupQuestionModalScript}"></th:block>
      </th:block>

      <th:block th:if="${!groupNotFound}">
        <div th:replace="~{project/group/modal/groupMemberModal :: groupMemberPickOverlay}"></div>
        <div th:replace="~{project/group/modal/groupRoleModal :: groupRoleMenusOverlay}"></div>
        <div th:replace="~{project/group/modal/groupRoleModal :: groupRolePickOverlay}"></div>
      </th:block>

      <script th:if="${registerMode or !groupNotFound}" th:inline="javascript">
        /*<![CDATA[*/
        window.groupManagementInfoPageConfig = {
          prjId: /*[[${session.currentProjectId}]]*/ 0,
          registerMode: /*[[${registerMode}]]*/ false,
          grpId: /*[[${grpId}]]*/ null,
          serverMembers: /*[[${members}]]*/ [],
          serverRoles: /*[[${roles}]]*/ []
        };
        /*]]>*/
      </script>
      <script th:if="${registerMode or !groupNotFound}" th:src="@{/js/group/groupManagementInfo.js}"></script>
    </div>
  </body>
</html>
