<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/projectLayout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta
      th:if="${_csrf != null}"
      name="_csrf_header"
      th:content="${_csrf.headerName}"
    />
    <title th:text="${registerMode} ? '그룹 등록' : '그룹 상세'">그룹 상세</title>
    <th:block th:if="${!groupNotFound}">
      <link
        rel="stylesheet"
        href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css"
      />
      <link
        rel="stylesheet"
        href="https://uicdn.toast.com/tui.grid/latest/tui-grid.css"
      />
      <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
      <script src="https://uicdn.toast.com/tui.grid/latest/tui-grid.js"></script>
    </th:block>
    <style>
      .grp-info-page__back {
        display: inline-block;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: #1976d2;
        text-decoration: none;
      }
      .grp-info-page__back:hover {
        text-decoration: underline;
      }
      .grp-info-page__head {
        margin-bottom: 1.25rem;
      }
      .grp-info-page__title {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #222;
      }
      .grp-info-page__rule {
        height: 3px;
        background: #333;
        border: 0;
        margin: 0;
      }
      .grp-section {
        margin-bottom: 2rem;
      }
      .grp-section__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #222;
        padding-bottom: 0.35rem;
        border-bottom: 3px solid #333;
      }
      .grp-section__body {
        padding-top: 0.85rem;
      }
      .grp-detail-form {
        --grp-label-w: 9.75rem;
        --grp-input-w: 16rem;
        --grp-font-size: 0.8125rem;
        --grp-input-bg: #f5f5f5;
        --grp-input-border: #d0d0d0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .grp-detail-form .grp-basic-form__row {
        display: grid;
        grid-template-columns: var(--grp-label-w) var(--grp-input-w);
        align-items: start;
        column-gap: 0.75rem;
      }
      .grp-detail-form .grp-basic-form__row label {
        font-size: var(--grp-font-size);
        color: #333;
        text-align: right;
        white-space: nowrap;
        line-height: 1.35;
        padding-top: 0.4rem;
      }
      .grp-detail-form .grp-basic-form__row label .req {
        color: #c62828;
      }
      .grp-detail-form .grp-basic-form__field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: var(--grp-input-w);
      }
      .grp-detail-form .grp-basic-form__row input {
        width: 100%;
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--grp-input-border);
        border-radius: 4px;
        background: var(--grp-input-bg);
        font-size: var(--grp-font-size);
        color: #333;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .grp-detail-form .grp-basic-form__row input.grp-input--editable {
        background: #fff;
      }
      .grp-detail-form .grp-basic-form__row input::placeholder {
        color: #aaa;
        font-size: var(--grp-font-size);
      }
      .grp-field-hint {
        margin: 0;
        font-size: 0.75rem;
        color: #c62828;
        line-height: 1.35;
      }
      .grp-grid-panel {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #fafafa;
        padding: 0.75rem 0.75rem 0.5rem;
      }
      .grp-grid-host {
        min-height: 120px;
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
        overflow: hidden;
      }
      .grp-data-table-wrap {
        overflow-x: auto;
        border: 1px solid #cfcfcf;
        border-radius: 4px;
        background: #fff;
      }
      .grp-data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8125rem;
        min-width: 40rem;
      }
      .grp-data-table th,
      .grp-data-table td {
        border: 1px solid #d8d8d8;
        padding: 0.45rem 0.5rem;
        text-align: center;
        vertical-align: middle;
        color: #333;
        white-space: nowrap;
      }
      .grp-data-table thead th {
        background: #f0f0f0;
        font-weight: 600;
      }
      .grp-data-table tbody tr:nth-child(even) {
        background: #fafafa;
      }
      .grp-data-table tbody td.empty {
        color: #999;
      }
      .grp-member-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-top: 0.65rem;
      }
      .grp-member-toolbar.is-hidden {
        display: none;
      }
      .grp-member-toolbar__btn {
        padding: 0.35rem 0.95rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        color: #333;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .grp-member-toolbar__btn:hover:not(:disabled):not(.is-disabled) {
        background: #f5f5f5;
      }
      .grp-member-toolbar__btn:disabled,
      .grp-member-toolbar__btn.is-disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .grp-empty-msg {
        margin: 0.5rem 0 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .grp-actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem 0 0.5rem;
      }
      .grp-actions__btn {
        min-width: 5.5rem;
        padding: 0.45rem 1.5rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: #666;
        color: #fff;
        font-size: 0.875rem;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        line-height: 1.35;
        box-sizing: border-box;
      }
      .grp-actions__btn:hover {
        background: #555;
      }
      .grp-actions__btn--secondary {
        background: #fff;
        color: #333;
      }
      .grp-actions__btn--secondary:hover {
        background: #f5f5f5;
      }
      .grp-actions__btn.is-hidden {
        display: none;
      }
      .grp-role-pick-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .grp-role-pick-overlay.is-open {
        display: flex;
      }
      .grp-role-pick {
        width: min(42rem, 94vw);
        max-height: 80vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .grp-role-pick__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .grp-role-pick__search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .grp-role-pick__search select,
      .grp-role-pick__search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .grp-role-pick__search select {
        flex: 0 0 auto;
        min-width: 6.5rem;
      }
      .grp-role-pick__search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .grp-role-pick__grid-host {
        flex: 1 1 auto;
        min-height: 12rem;
        max-height: 50vh;
        overflow: auto;
        margin: 0.5rem 1rem;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        background: #fff;
      }
      .grp-role-pick__actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .grp-role-pick__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .grp-role-pick__actions button.primary {
        background: #666;
        color: #fff;
        border-color: #555;
      }
      .grp-member-pick-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .grp-member-pick-overlay.is-open {
        display: flex;
      }
      .grp-member-pick {
        width: min(42rem, 94vw);
        max-height: 80vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
      }
      .grp-member-pick__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .grp-member-pick__search {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #e8e8e8;
        background: #fafafa;
      }
      .grp-member-pick__search select,
      .grp-member-pick__search input[type="text"] {
        font-size: 0.8125rem;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        line-height: 1.35;
        box-sizing: border-box;
        background: #fff;
      }
      .grp-member-pick__search select {
        flex: 0 0 auto;
        min-width: 5.5rem;
        max-width: 6.5rem;
      }
      .grp-member-pick__search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .grp-member-pick__search .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .grp-member-pick__grid-host {
        flex: 1 1 auto;
        min-height: 12rem;
        max-height: 50vh;
        overflow: auto;
        margin: 0.5rem 1rem;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        background: #fff;
      }
      .grp-member-pick__actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .grp-member-pick__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .grp-member-pick__actions button.primary {
        background: #666;
        color: #fff;
        border-color: #555;
      }
      .grp-role-name-link {
        color: #1976d2;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .grp-role-name-link:hover {
        color: #0d47a1;
      }
      .grp-role-menus-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1001;
      }
      .grp-role-menus-overlay.is-open {
        display: flex;
      }
      .grp-role-menus-modal {
        width: min(28rem, 92vw);
        max-height: 78vh;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      }
      .grp-role-menus-modal__head {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e0e0e0;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .grp-role-menus-modal__sub {
        padding: 0.5rem 1rem 0;
        font-size: 0.8125rem;
        color: #444;
      }
      .grp-role-menus-modal__body {
        padding: 0.65rem 1rem 0.75rem;
        overflow: auto;
        max-height: 48vh;
      }
      .grp-role-menus-list {
        margin: 0;
        padding-left: 1.15rem;
        font-size: 0.8125rem;
        color: #333;
        line-height: 1.55;
      }
      .grp-role-menus-empty,
      .grp-role-menus-loading {
        margin: 0.35rem 0 0;
        font-size: 0.8125rem;
        color: #777;
      }
      .grp-role-menus-modal__actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-top: 1px solid #e0e0e0;
      }
      .grp-role-menus-modal__actions button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #555;
        border-radius: 4px;
        background: #666;
        color: #fff;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .grp-role-menus-modal__actions button:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div layout:fragment="content">
      <a class="grp-info-page__back"
        th:href="@{/project/group/list}">
        ← 그룹 목록으로
      </a>

      <header class="grp-info-page__head">
        <h1 class="grp-info-page__title"
          th:text="${registerMode} ? '그룹 등록' : '그룹 상세'">
          그룹 상세
        </h1>
        <hr class="grp-info-page__rule" />
      </header>

      <th:block th:if="${registerMode or !groupNotFound}">
        <section class="grp-section" aria-labelledby="grp-basic-heading">
          <h2 class="grp-section__title" id="grp-basic-heading">기본정보</h2>
          <div class="grp-section__body">
            <div class="grp-basic-form grp-detail-form">
              <div class="grp-basic-form__row">
                <label for="detailPrjName"> 프로젝트명 <span class="req">*</span>
                </label>
                <div class="grp-basic-form__field">
                  <input type="text" id="detailPrjName" readonly th:value="${detail.prjName}"/>
                </div>
              </div>
              <div class="grp-basic-form__row">
                <label for="detailGrpName">그룹명 <span class="req">*</span>
                </label>
                <div class="grp-basic-form__field">
                  <input th:if="${registerMode}" type="text" id="detailGrpName" placeholder="그룹명을 입력해 주세요." class="grp-input--editable" th:value="${detail.grpName}" autocomplete="off" />
                  <input th:unless="${registerMode}" type="text" id="detailGrpName" placeholder="텍스트를 입력해 주세요." readonly th:value="${detail.grpName}"/>
                  <p class="grp-field-hint" th:if="${registerMode}">
                    한 번 정해진 그룹명은 변경할 수 없습니다.
                  </p>
                </div>
              </div>
              <div class="grp-basic-form__row" th:if="${!registerMode}">
                <label for="detailGrpCreatedOn">그룹생성일 <span class="req">*</span>
                </label>
                <div class="grp-basic-form__field">
                  <input type="text" id="detailGrpCreatedOn" readonly th:value="${detail.createdOn != null ? #dates.format(detail.createdOn, 'yyyy-MM-dd') : ''}" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="grp-section" aria-labelledby="grp-members-heading">
          <h2 class="grp-section__title" id="grp-members-heading">구성원 정보</h2>
          <div class="grp-section__body">
            <div class="grp-grid-panel">
              <div id="grpMembersGrid" class="grp-grid-host" role="region" aria-label="구성원 목록">
              </div>
              <div id="grpMemberToolbar" class="grp-member-toolbar" 
                   th:if="${registerMode or !groupNotFound}" th:classappend="${!registerMode} ? 'is-hidden' : ''">
                <button type="button" class="grp-member-toolbar__btn" id="btnAddMember">
                  구성원 관리
                </button>
              </div>
            </div>
          </div>
        </section>

        <section
          th:if="${!registerMode}"
          class="grp-section"
          aria-labelledby="grp-roles-heading">
          <h2 class="grp-section__title" id="grp-roles-heading">보유 권한</h2>
          <div class="grp-section__body">
            <div class="grp-grid-panel">
              <div id="grpRolesGrid" class="grp-grid-host" role="region" aria-label="보유 권한 목록"></div>
              <div id="grpRoleToolbar" class="grp-member-toolbar is-hidden">
                <button type="button" id="btnManageRoles" class="grp-member-toolbar__btn">
                  권한 관리
                </button>
              </div>
            </div>
          </div>
        </section>

        <div class="grp-actions" th:if="${registerMode}">
          <button type="button" class="grp-actions__btn" id="btnGroupSave">
            등록
          </button>
          <a class="grp-actions__btn grp-actions__btn--secondary"
            th:href="@{/project/group/list}">
            취소
          </a>
        </div>
        <div class="grp-actions" th:unless="${registerMode}">
          <button type="button" class="grp-actions__btn" id="btnGroupEdit">
            수정
          </button>
          <button type="button" id="btnGroupSave" class="grp-actions__btn is-hidden">
            저장
          </button>
          <button type="button" id="btnGroupCancel" class="grp-actions__btn grp-actions__btn--secondary is-hidden">
            취소
          </button>
        </div>
      </th:block>

      <th:block th:if="${!groupNotFound}">
        <th:block th:replace="~{project/group/modal/questionModal :: groupQuestionModal}"></th:block>
        <th:block th:replace="~{project/group/modal/questionModal :: groupQuestionModalScript}"></th:block>
      </th:block>

      <th:block th:if="${!groupNotFound}">
        <div th:replace="~{project/group/modal/groupMemberModal :: groupMemberPickOverlay}"></div>
        <div th:replace="~{project/group/modal/groupRoleModal :: groupRoleMenusOverlay}"></div>
        <div th:replace="~{project/group/modal/groupRoleModal :: groupRolePickOverlay}"></div>
      </th:block>

      <script th:if="${!groupNotFound}" th:inline="javascript">
        /*<![CDATA[*/
        (function () {
          const prjId = /*[[${prjId}]]*/ 0;
          const registerMode = /*[[${registerMode}]]*/ false;
          const grpId = /*[[${grpId}]]*/ null;
          const serverMembers = /*[[${members}]]*/ [];
          const serverRoles = /*[[${roles}]]*/ [];
          let groupEditMode = registerMode;
          const grpNameInput = document.getElementById("detailGrpName");
          const editBtn = document.getElementById("btnGroupEdit");
          const saveBtn = document.getElementById("btnGroupSave");
          const cancelBtn = document.getElementById("btnGroupCancel");
          const addMemberBtn = document.getElementById("btnAddMember");
          const manageRolesBtn = document.getElementById("btnManageRoles");
          const memberToolbar = document.getElementById("grpMemberToolbar");
          const roleToolbar = document.getElementById("grpRoleToolbar");
          const membersGridEl = document.getElementById("grpMembersGrid");
          const rolesGridEl = document.getElementById("grpRolesGrid");
          const pickOverlay = document.getElementById("grpMemberPickOverlay");
          const pickGridEl = document.getElementById("grpMemberPickGrid");
          const pickSearchType = document.getElementById("grpMemberSearchType");
          const pickSearchKeyword = document.getElementById("grpMemberSearchKeyword");
          const pickCancel = document.getElementById("btnMemberPickCancel");
          const pickOk = document.getElementById("btnMemberPickOk");
          const roleMenusOverlay = document.getElementById("grpRoleMenusOverlay");
          const btnGrpRoleMenusClose = document.getElementById("btnGrpRoleMenusClose");
          const grpRoleMenusList = document.getElementById("grpRoleMenusList");
          const grpRoleMenusEmpty = document.getElementById("grpRoleMenusEmpty");
          const grpRoleMenusLoading = document.getElementById("grpRoleMenusLoading");
          const grpRoleMenusRoleCaption = document.getElementById("grpRoleMenusRoleCaption");
          const rolePickOverlay = document.getElementById("grpRolePickOverlay");
          const rolePickGridEl = document.getElementById("grpRolePickGrid");
          const rolePickSearchType = document.getElementById("grpRoleSearchType");
          const rolePickSearchKeyword = document.getElementById("grpRoleSearchKeyword");
          const rolePickCancel = document.getElementById("btnRolePickCancel");
          const rolePickOk = document.getElementById("btnRolePickOk");
          if (!grpNameInput) return;

          const pendingMembers = [];
          const pendingRoles = [];
          let serverMemberIds = [];
          let serverRoleCds = [];

          function setMemberToolbarVisible(visible) {
            if (!memberToolbar) return;
            memberToolbar.classList.toggle("is-hidden", !visible);
          }

          function setRoleToolbarVisible(visible) {
            if (!roleToolbar) return;
            roleToolbar.classList.toggle("is-hidden", !visible);
          }

          function sortedIdList(ids) {
            return ids
              .filter(function (id) { return id != null && !isNaN(Number(id)); })
              .map(function (id) { return Number(id); })
              .sort(function (a, b) { return a - b; });
          }

          function membersChanged() {
            const current = sortedIdList(
              pendingMembers.map(function (m) { return m.userId; }),
            );
            return ( JSON.stringify(current) !== JSON.stringify(serverMemberIds) );
          }

          function rolesChanged() {
            const current = sortedIdList(
              pendingRoles.map(function (r) { return r.roleCd; }),
            );
            return JSON.stringify(current) !== JSON.stringify(serverRoleCds);
          }

          function setEditActionButtonsVisible(editing) {
            if (editBtn) editBtn.classList.toggle("is-hidden", editing);
            if (saveBtn && !registerMode) saveBtn.classList.toggle("is-hidden", !editing);
            if (cancelBtn) cancelBtn.classList.toggle("is-hidden", !editing);
          }

          function enterEditMode() {
            groupEditMode = true;
            setMemberToolbarVisible(true);
            setRoleToolbarVisible(true);

          function formatGridDate(value) {
            if (value == null || value === "") return "-";
            if (Array.isArray(value) && value.length >= 3) {
              const y = value[0];
              const m = String(value[1]).padStart(2, "0");
              const d = String(value[2]).padStart(2, "0");
              return y + "-" + m + "-" + d;
            }
            const dt = new Date(value);
            if (isNaN(dt.getTime())) return String(value);
            const pad = function (n) {
              return String(n).padStart(2, "0");
            };
            return ( dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate()) )
          }

          function closeGroupRoleMenusModal() {
            if (!roleMenusOverlay) return;

          async function openGroupRoleMenusModal(fallbackRoleName, pid, gid, rc) {
            if (
              !roleMenusOverlay ||
              !grpRoleMenusList ||
              !grpRoleMenusEmpty ||
              !grpRoleMenusLoading ||
              !grpRoleMenusRoleCaption
            ) {
              return;
            }
            grpRoleMenusRoleCaption.textContent =
              fallbackRoleName && fallbackRoleName !== "-"
                ? "권한: " + fallbackRoleName
                : "권한 코드: " + rc;
            grpRoleMenusList.innerHTML = "";
            grpRoleMenusEmpty.hidden = true;
            grpRoleMenusLoading.hidden = false;
            roleMenusOverlay.classList.add("is-open");
            roleMenusOverlay.setAttribute("aria-hidden", "false");
            try {
              var url =
                "/project/group/groupRoleMenus?grpId=" +
                encodeURIComponent(String(gid)) +
                "&roleCd=" +
                encodeURIComponent(String(rc));
              var res = await fetch(url, { credentials: "same-origin" });
              var data = await res.json().catch(function () {
                return {};
              });
              grpRoleMenusLoading.hidden = true;
              if (!res.ok || !data || data.ok !== true) {
                var msg =
                  (data && data.message) ||
                  "메뉴 목록을 불러오지 못했습니다.";
                await alertMsg(msg, "오류");
                closeGroupRoleMenusModal();
                return;
              }
              var name = data.roleName || fallbackRoleName || "";
              if (name && name !== "-") {
                grpRoleMenusRoleCaption.textContent = "권한: " + name;
              }
              var menus = data.menus || [];
              if (!menus.length) {
                grpRoleMenusEmpty.hidden = false;
                return;
              }
              menus.forEach(function (label) {
                var li = document.createElement("li");
                li.textContent = label == null || label === "" ? "-" : String(label);
                grpRoleMenusList.appendChild(li);
              });
            } catch (err) {
              grpRoleMenusLoading.hidden = true;
              await alertMsg( "메뉴 목록을 불러오지 못했습니다.", "오류" ); 
              closeGroupRoleMenusModal();
            }
          }

          function buildCsrfHeaders() {
            const headers = { "Content-Type": "application/json" };
            const tokenMeta = document.querySelector('meta[name="_csrf"]');
            const headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if ( tokenMeta && headerMeta && tokenMeta.content && headerMeta.content)
              headers[headerMeta.content] = tokenMeta.content;
            return headers;
          }

          function alertMsg(msg, title) {

          function getCheckedPickRows() {
            if (!pickGrid) return [];
            if (typeof pickGrid.getCheckedRowKeys === "function") {
              const keys = pickGrid.getCheckedRowKeys();
              if (Array.isArray(keys) && typeof pickGrid.getRow === "function") {
                return keys
                  .map(function (k) {
                    return pickGrid.getRow(k);
                  })
                  .filter(Boolean);
              }
            }
            if (typeof pickGrid.getCheckedRows === "function") {
              const arr = pickGrid.getCheckedRows();
              return Array.isArray(arr) ? arr : [];
            }
            return [];

          function captureModalDraftFromGrid() {
            if (!pickGrid || typeof pickGrid.getData !== "function") return;
            const checkedKeys = new Set();
            if (typeof pickGrid.getCheckedRowKeys === "function") {
              pickGrid.getCheckedRowKeys().forEach(function (k) {
                checkedKeys.add(k);
              });
            }
            pickGrid.getData().forEach(function (row) {
              const uid = Number(row.userId);
              if (isNaN(uid)) return;
              if (checkedKeys.has(row.rowKey)) {
                modalCheckedUserIds.add(uid);
              } else {
                modalCheckedUserIds.delete(uid);
              }
            });
          }

            pendingMembers.length = 0;

                pendingMembers.push(rowToPendingMember(row));
              }

            refreshMembersTable();

          function includesKeyword(val, keyword) {
            if (val == null) return false;
            return String(val).toLowerCase().includes(keyword);
          }

            const type = pickSearchType ? pickSearchType.value : "userName";

            return rows.filter(function (r) {

              return includesKeyword(r.userName, keyword);

                  pickGrid.check(row.rowKey);

                  pickGrid.uncheck(row.rowKey);

            });
          }
          if (pickSearchKeyword) {
            pickSearchKeyword.addEventListener("input", function () {
              if (!pickOverlay || !pickOverlay.classList.contains("is-open")) {
                return;
              }
              recreatePickGrid();
            });
          }

          if (addMemberBtn) {
            addMemberBtn.addEventListener("click", openMemberPicker);
          }
          if (pickCancel) {
            pickCancel.addEventListener("click", closeMemberPicker);
          }
          if (pickOverlay) {
            pickOverlay.addEventListener("click", function (e) {
              if (e.target === pickOverlay) {
                closeMemberPicker();
              }
            });
          }
          if (pickOk) {
            pickOk.addEventListener("click", function () {
              if (pickGrid) {
                captureModalDraftFromGrid();
              }
              commitModalSelection();
              closeMemberPicker();
            });
          }

          if (btnGrpRoleMenusClose) {
            btnGrpRoleMenusClose.addEventListener(
              "click",
              closeGroupRoleMenusModal,
            );
          }
          if (roleMenusOverlay) {
            roleMenusOverlay.addEventListener("click", function (e) {
              if (e.target === roleMenusOverlay) {
                closeGroupRoleMenusModal();
              }
            });
          }

          if (editBtn) {
            editBtn.addEventListener("click", function () {
              enterEditMode();
            });
          }
          if (cancelBtn) {
            cancelBtn.addEventListener("click", function () {
              exitEditMode();
            });
          }
          if (manageRolesBtn) {
            manageRolesBtn.addEventListener("click", openRolePicker);
          }
          if (rolePickCancel) {
            rolePickCancel.addEventListener("click", closeRolePicker);
          }
          if (rolePickOk) {
            rolePickOk.addEventListener("click", function () {
              commitRoleModalSelection();
              closeRolePicker();
            });
          }
          if (rolePickOverlay) {
            rolePickOverlay.addEventListener("click", function (e) {
              if (e.target === rolePickOverlay) {
                closeRolePicker();
              }
            });
          }
          if (rolePickSearchType) {
            rolePickSearchType.addEventListener("change", function () {
              if (
                !rolePickOverlay ||
                !rolePickOverlay.classList.contains("is-open")
              ) {
                return;
              }
              recreateRolePickGrid();
            });
          }
          if (rolePickSearchKeyword) {
            rolePickSearchKeyword.addEventListener("input", function () {
              if (
                !rolePickOverlay ||
                !rolePickOverlay.classList.contains("is-open")
              ) {
                return;
              }
              recreateRolePickGrid();
            });
          }

          if (saveBtn) {
            saveBtn.addEventListener("click", async function () {
              if (!registerMode) {
                const pid = Number(prjId);
                const gid = Number(grpId);
                if (!groupEditMode) {
                  return;
                }
                if (isNaN(pid) || isNaN(gid)) {
                  await alertMsg("그룹 정보가 올바르지 않습니다.", "알림");
                  return;
                }
                const memberDirty = membersChanged();
                const roleDirty = rolesChanged();
                if (!memberDirty && !roleDirty) {
                  await alertMsg("변경된 내용이 없습니다.", "알림");
                  return;
                }

                saveBtn.disabled = true;
                try {
                  if (memberDirty) {
                    const memberPayload = {
                      grpId: gid,
                      userIds: pendingMembers.map(function (m) {
                        return m.userId;
                      }),
                    };
                    const memberRes = await fetch("/project/group/updateGroup", {
                      method: "POST",
                      headers: buildCsrfHeaders(),
                      credentials: "same-origin",
                      body: JSON.stringify(memberPayload),
                    });
                    const memberData = await memberRes.json().catch(function () {
                      return {};
                    });
                    if (!memberRes.ok || !memberData || memberData.ok !== true) {
                      const errText =
                        (memberData && memberData.message) ||
                        (memberRes.status === 403
                          ? "권한이 없거나 보안 토큰이 만료되었습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요."
                          : "그룹 구성원 수정 중 오류가 발생했습니다.");
                      await alertMsg(errText, "오류");
                      return;
                    }
                  }
                  if (roleDirty) {
                    const rolePayload = {
                      grpId: gid,
                      roleCds: pendingRoles.map(function (r) {
                        return r.roleCd;
                      }),
                    };
                    const roleRes = await fetch("/project/group/updateGroupRoles", {
                      method: "POST",
                      headers: buildCsrfHeaders(),
                      credentials: "same-origin",
                      body: JSON.stringify(rolePayload),
                    });
                    const roleData = await roleRes.json().catch(function () {
                      return {};
                    });
                    if (!roleRes.ok || !roleData || roleData.ok !== true) {
                      const errText =
                        (roleData && roleData.message) ||
                        (roleRes.status === 403
                          ? "권한이 없거나 보안 토큰이 만료되었습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요."
                          : "그룹 권한 수정 중 오류가 발생했습니다.");
                      await alertMsg(errText, "오류");
                      return;
                    }
                  }

                  const okMsg =
                    memberDirty && roleDirty ? "그룹 구성원과 권한이 수정되었습니다." : memberDirty ? "그룹 구성원이 수정되었습니다." : "그룹 권한이 수정되었습니다.";
                  await alertMsg(okMsg, "알림");
                  window.location.href =
                    "/project/group/info?grpId=" +
                    encodeURIComponent(String(gid));
                } catch (e) {
                  await alertMsg("그룹 수정 중 오류가 발생했습니다.", "오류");
                } finally {
                  saveBtn.disabled = false;
                }
                return;
              }

              const pid = Number(prjId);
              const name = grpNameInput.value.trim();
              if (isNaN(pid)) {
                await alertMsg("프로젝트 ID가 올바르지 않습니다.", "알림");
                return;
              }
              if (!name) {
                await alertMsg("그룹명을 입력하세요.", "알림");
                return;
              }

              const payload = { grpName: name };
              if (pendingMembers.length > 0) {
                payload.userIds = pendingMembers.map(function (m) {
                  return m.userId;
                });
              }

              saveBtn.disabled = true;
              try {
                const res = await fetch("/project/group/registerGroup", {
                  method: "POST",
                  headers: buildCsrfHeaders(),
                  credentials: "same-origin",
                  body: JSON.stringify(payload),
                });
                const data = await res.json().catch(function () {
                  return {};
                });
                if (!res.ok || !data || data.ok !== true) {
                  const errText =
                    (data && data.message) ||
                    (res.status === 403
                      ? "권한이 없거나 보안 토큰이 만료되었습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요."
                      : "그룹 등록 중 오류가 발생했습니다.");
                  await alertMsg(errText, "오류");
                  return;
                }
                await alertMsg("그룹이 등록되었습니다.", "알림");
                window.location.href = "/project/group/list";
              } catch (e) {
                await alertMsg("그룹 등록 중 오류가 발생했습니다.", "오류");
              } finally {
                saveBtn.disabled = false;
              }
            });
          }
        })();
        /*]]>*/
      </script>
    </div>
  </body>
</html>
