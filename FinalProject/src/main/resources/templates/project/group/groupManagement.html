<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/projectLayout}">
  <head>
    <meta charset="UTF-8" />
    <title>프로젝트 그룹 관리</title>
    <th:block layout:fragment="head-content">
      <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
      <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
      <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
      <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
      <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
      <link rel="stylesheet" th:href="@{/css/project/issue.css}" />
      <link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
      <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
      <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
      <script th:src="@{/js/common/gridTheme.js}"></script>
      <script th:inline="javascript">
        /*<![CDATA[*/
        const prjId = /*[[${session.currentProjectId}]]*/ "";
        const projectGroupRows = /*[[${rows}]]*/ [];
        /*]]>*/
      </script>
    </th:block>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="issue-shell issue-shell--list">
        <div id="wrapper" class="issue-list">
          <header class="issue-list__header">
            <h1 class="issue-list__title">프로젝트 그룹 관리</h1>
          </header>

          <section class="issue-section issue-section--filter" aria-label="그룹 검색">
            <form id="groupSearchForm" th:action="@{/project/group/list}" method="get" class="issue-filter-form">
              <div class="issue-field">
                <label for="grpName">그룹명</label>
                <input type="text" id="grpName" name="grpName" th:value="${grpName}" placeholder="그룹명" autocomplete="off" />
              </div>
              <div class="issue-field issue-field--range">
                <label for="createdFrom">그룹 생성일</label>
                <input type="date" id="createdFrom" name="createdFrom" th:value="${createdFrom}" />
                <span class="issue-field-sep">~</span>
                <input type="date" id="createdTo" name="createdTo" th:value="${createdTo}" aria-label="그룹 생성일 종료" />
              </div>
              <div class="issue-filter-buttons">
                <button type="submit" class="btn btn-primary">검색</button>
                <a th:href="@{/project/group/list}" class="btn btn-secondary">초기화</a>
              </div>
            </form>
          </section>

          <section class="issue-section issue-section--grid" aria-label="프로젝트 그룹 목록">
            <div id="groupGrid" role="region" aria-label="프로젝트 그룹 그리드"></div>
          </section>
        </div>
      </div>

      <th:block th:replace="~{project/group/modal/questionModal :: groupQuestionModal}"></th:block>
      <th:block th:replace="~{project/group/modal/questionModal :: groupQuestionModalScript}"></th:block>
      <script th:src="@{/js/group/groupManagement.js}"></script>
    </div>
  </body>
</html>
