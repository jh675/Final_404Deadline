<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="groupDetailContent">
      <th:block th:if="${groupNotFound}">
        <p class="perm-empty">
          요청한 그룹(<span th:text="${grpId}">-</span>)을 이 프로젝트에서 찾을 수 없습니다.
        </p>
      </th:block>

      <th:block th:if="${registerMode or !groupNotFound}">
        <section class="grp-section" aria-labelledby="grp-basic-heading">
          <h2 class="grp-section__title" id="grp-basic-heading">기본정보</h2>
          <div class="grp-section__body">
            <div class="grp-basic-form grp-detail-form">
              <div class="grp-basic-form__row">
                <label for="detailPrjName"> 프로젝트명 <span class="req">*</span></label>
                <div class="grp-basic-form__field">
                  <input type="text" id="detailPrjName" readonly th:value="${session.project != null ? session.project.prjName : detail.prjName}" />
                </div>
              </div>
              <div class="grp-basic-form__row">
                <label for="detailGrpName">그룹명 <span class="req">*</span></label>
                <div class="grp-basic-form__field">
                  <input th:if="${registerMode}" type="text" id="detailGrpName" placeholder="그룹명을 입력해 주세요." class="grp-input--editable" th:value="${detail.grpName}" autocomplete="off" />
                  <input th:unless="${registerMode}" type="text" id="detailGrpName" placeholder="텍스트를 입력해 주세요." readonly th:value="${detail.grpName}" />
                  <p class="grp-field-hint" th:if="${registerMode}">한 번 정해진 그룹명은 변경할 수 없습니다.</p>
                </div>
              </div>
              <div class="grp-basic-form__row" th:if="${!registerMode}">
                <label for="detailGrpCreatedOn">그룹생성일 <span class="req">*</span></label>
                <div class="grp-basic-form__field">
                  <input type="text" id="detailGrpCreatedOn" readonly th:value="${detail.createdOn != null ? #dates.format(detail.createdOn, 'yyyy-MM-dd') : ''}" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="grp-section" aria-labelledby="grp-members-heading">
          <h2 class="grp-section__title" id="grp-members-heading">구성원 정보</h2>
          <div class="grp-section__body">
            <div class="grp-grid-panel">
              <div id="grpMembersGrid" class="grp-grid-host" role="region" aria-label="구성원 목록"></div>
              <div id="grpMemberToolbar" class="grp-member-toolbar" th:if="${registerMode or !groupNotFound}" th:classappend="${!registerMode} ? 'is-hidden' : ''">
                <button type="button" class="btn btn-secondary btn-sm" id="btnAddMember">구성원 관리</button>
              </div>
            </div>
          </div>
        </section>

        <section class="grp-section" aria-labelledby="grp-roles-heading">
          <h2 class="grp-section__title" id="grp-roles-heading">보유 권한</h2>
          <div class="grp-section__body">
            <div class="grp-grid-panel">
              <div id="grpRolesGrid" class="grp-grid-host" role="region" aria-label="보유 권한 목록"></div>
              <div id="grpRoleToolbar" class="grp-member-toolbar" th:classappend="${!registerMode} ? 'is-hidden' : ''">
                <button type="button" id="btnManageRoles" class="btn btn-secondary btn-sm">권한 관리</button>
              </div>
            </div>
          </div>
        </section>

        <div class="issue-register-actions grp-actions" th:if="${registerMode}">
          <button type="button" class="btn btn-primary" id="btnGroupSave">등록</button>
          <a class="btn btn-secondary" th:href="@{/project/group/list}">초기화</a>
        </div>
        <div class="issue-register-actions grp-actions" th:unless="${registerMode}">
          <button type="button" class="btn btn-primary" id="btnGroupEdit">수정</button>
          <button type="button" id="btnGroupSave" class="btn btn-primary is-hidden">저장</button>
          <button type="button" id="btnGroupCancel" class="btn btn-secondary is-hidden">초기화</button>
        </div>
      </th:block>
    </th:block>
  </body>
</html>
