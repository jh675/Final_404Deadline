<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
  <title>마일스톤 타임라인</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/vis-timeline@8.5.1/styles/vis-timeline-graph2d.min.css"
    crossorigin="anonymous"
  />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #172b4d;
    }
    header {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #dfe1e6;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 1.1rem;
    }
    header p {
      margin: 0;
      font-size: 0.85rem;
      color: #5e6c84;
    }
    .page-body {
      display: flex;
      align-items: stretch;
      min-height: calc(100vh - 72px);
      margin: 16px;
      gap: 0;
      background: #fff;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      overflow: hidden;
    }
    .milestone-sidebar {
      flex: 0 0 240px;
      border-right: 1px solid #dfe1e6;
      background: #fafbfc;
      display: flex;
      flex-direction: column;
    }
    .milestone-sidebar h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #5e6c84;
      border-bottom: 1px solid #ebecf0;
    }
    .milestone-list {
      list-style: none;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      flex: 1;
    }
    .milestone-add-wrap {
      border-top: 1px solid #ebecf0;
      padding: 8px;
      background: #fafbfc;
      display: flex;
      gap: 6px;
    }
    .milestone-add-wrap .btn {
      flex: 1;
      font-size: 0.8rem;
    }
    .timeline-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .timeline-actions .btn {
      font-size: 0.8rem;
    }
    .milestone-list li {
      margin-bottom: 4px;
    }
    .milestone-btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .milestone-btn:hover {
      background: #ebecf0;
    }
    .milestone-btn.active {
      background: #deebff;
      border-color: #4c9aff;
    }
    .milestone-btn .name {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .milestone-btn .period {
      display: block;
      font-size: 0.75rem;
      color: #5e6c84;
    }
    .timeline-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .timeline-header {
      padding: 12px 16px;
      border-bottom: 1px solid #ebecf0;
    }
    .timeline-header h3 {
      margin: 0 0 4px;
      font-size: 1rem;
    }
    .timeline-header p {
      margin: 0;
      font-size: 0.8rem;
      color: #5e6c84;
    }
    #timeline {
      flex: 1;
      min-height: 280px;
    }
    .vis-custom-time.milestone-start {
      background-color: #0747a6;
    }
    .vis-custom-time.milestone-end {
      background-color: #de350b;
    }
    .vis-custom-time.milestone-start::after,
    .vis-custom-time.milestone-end::after {
      content: attr(data-label);
      position: absolute;
      top: 4px;
      left: 6px;
      white-space: nowrap;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      color: #fff;
      pointer-events: none;
    }
    .vis-custom-time.milestone-start::after {
      background-color: #0747a6;
    }
    .vis-custom-time.milestone-end::after {
      background-color: #de350b;
    }
    #log {
      margin: 0 16px 16px;
      padding: 12px;
      background: #fff;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      font-size: 0.85rem;
      min-height: 2.5em;
    }
    .pill {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      background: #deebff;
      color: #0747a6;
    }
    .empty-hint {
      padding: 24px 16px;
      color: #5e6c84;
      font-size: 0.9rem;
    }
    .vis-item.milestone-range {
      background-color: #deebff;
      border-color: #0747a6;
      color: #0747a6;
    }
    .vis-item.issue-event {
      background-color: transparent;
      border: none;
      color: #403294;
    }
    .vis-item.issue-event .vis-item-content {
      padding: 0 0 0 4px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .vis-item.issue-event-multi {
      color: #7f1d1d;
    }
    .vis-item.issue-event-multi .vis-item-content {
      background: #de350b;
      color: #fff;
      padding: 1px 6px;
      border-radius: 999px;
    }
    .vis-item.issue-event .vis-dot {
      width: 12px;
      height: 12px;
      border-width: 2px;
      border-radius: 50%;
      background: #6554c0;
      border-color: #403294;
    }
    .vis-item.issue-event-multi:not([class*="type-"]) .vis-dot {
      width: 16px;
      height: 16px;
      background: #de350b;
      border-color: #7f1d1d;
    }
    .vis-item.type-01 .vis-dot {
      width: 14px;
      height: 14px;
      border-width: 2px;
      border-style: solid;
      border-radius: 50%;
      background: #36b37e;
      border-color: #006644;
      transform: none;
      clip-path: none;
    }
    .vis-item.type-02 .vis-dot {
      width: 12px;
      height: 12px;
      border-width: 2px;
      border-style: solid;
      border-radius: 2px;
      transform: rotate(45deg);
      background: #00b8d9;
      border-color: #006c80;
      clip-path: none;
    }
    .vis-item.type-03 .vis-dot {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 0;
      transform: none;
      background: #ffab00;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
  </style>
</head>
<body>
  <header>
    <h1>마일스톤 / 이슈 타임라인</h1>
    <p>
      왼쪽에서 <strong>마일스톤 선택</strong> → 오른쪽에 해당 마일스톤 기간·등록 이슈·이벤트 표시 ·
      마일스톤=<code>list</code> (Thymeleaf) · 이슈=<code>GET /api/milestone/{id}/issues</code>
      <span class="pill">API 없으면 더미 이슈</span>
    </p>
  </header>

  <div class="page-body">
    <aside class="milestone-sidebar">
      <h2>마일스톤</h2>
      <ul class="milestone-list" id="milestoneList"></ul>
      <div class="milestone-add-wrap">
        <button type="button" class="btn btn-outline-primary btn-sm"
                data-bs-toggle="modal" data-bs-target="#milestoneAddModal"
                data-mode="add">마일스톤 추가</button>
        <button type="button" class="btn btn-outline-secondary btn-sm"
                id="milestoneManageBtn"
                data-bs-toggle="modal" data-bs-target="#milestoneAddModal"
                data-mode="edit">마일스톤 관리</button>
      </div>
    </aside>
    <section class="timeline-panel">
      <div class="timeline-header" id="timelineHeader">
        <div class="timeline-header-text" id="timelineHeaderText">
          <h3>마일스톤을 선택하세요</h3>
          <p>왼쪽 목록에서 마일스톤을 클릭하면 이슈 타임라인이 표시됩니다.</p>
        </div>
        <div class="timeline-actions">
          <button type="button" class="btn btn-primary btn-sm"
                  data-bs-toggle="modal" data-bs-target="#timelineAddModal">
            타임라인 추가
          </button>
          <button type="button" class="btn btn-outline-primary btn-sm"
                  data-bs-toggle="modal" data-bs-target="#issueRegistModal">
            이슈 등록
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm"
                  data-bs-toggle="modal" data-bs-target="#issueDelistModal">
            이슈 해제
          </button>
        </div>
      </div>
      
      <div id="timeline"></div>
      <p class="empty-hint" id="emptyHint" hidden>이 마일스톤에 등록된 이슈가 없습니다.</p>
    </section>
  </div>

  <div id="log">이슈 행의 이벤트를 클릭하면 상세가 표시됩니다.</div>

  <div th:replace="~{project/milestone/modal/milestoneAdd :: milestoneAddModal}"></div>
  <div th:replace="~{project/milestone/modal/timelineAdd :: timelineAddModal}"></div>
  <div th:replace="~{project/milestone/modal/issueRegist :: issueRegistModal}"></div>
  <div th:replace="~{project/milestone/modal/issueDelist :: issueDelistModal}"></div>
  <div th:replace="~{project/milestone/modal/timelineView :: timelineViewModal}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/vis-timeline@8.5.1/standalone/umd/vis-timeline-graph2d.min.js" crossorigin="anonymous"></script>
  <script>
    // ────────────────────────────────────────────────
    // [API ①] 페이지 로드용 마일스톤 목록 (REST 조회)
    //   - URL    : GET /api/milestone/{prjId}
    //   - 컨트롤러: MilestoneRestController#selectMilestoneList
    //   - 응답   : List<MilestoneVO> [ { id, prjId, name, startDate, endDate }, ... ]
    //   - prjId  : URL 경로(/milestone/{prjId})에서 추출, 없으면 3 fallback
    // ────────────────────────────────────────────────
    var prjId = (function () {
      var m = location.pathname.match(/\/milestone\/(\d+)/);
      return m ? Number(m[1]) : 3;
    })();
  </script>
  <script>
    (function () {
      var sidebarEl = document.getElementById("milestoneList");
      var headerEl = document.getElementById("timelineHeader");
      var headerTextEl = document.getElementById("timelineHeaderText");
      var container = document.getElementById("timeline");
      var emptyHint = document.getElementById("emptyHint");
      var logEl = document.getElementById("log");


      var milestones = [];
      var selectedMilestoneId = null;
      var currentIssues = [];
      var timeline = null;
      var groups = new vis.DataSet([]);
      var items = new vis.DataSet([]);
      var hasStartMarker = false;
      var hasEndMarker = false;

      function openTimelineViewModal(it) {
        var modalEl = document.getElementById("timelineViewModal");
        if (!modalEl) return;
        var whenEl = modalEl.querySelector("[data-tv-when]");
        var issueEl = modalEl.querySelector("[data-tv-issue]");
        var listEl = modalEl.querySelector("[data-tv-list]");
        var when = toDate(it.start);
        if (whenEl) whenEl.textContent = when ? when.toLocaleString("ko-KR") : "-";
        if (issueEl) issueEl.textContent = it._issueLabel || "";
        if (listEl) {
          listEl.innerHTML = "";
          it._events.forEach(function (e, i) {
            var tr = document.createElement("tr");
            tr.innerHTML =
              '<td class="text-center">' + (i + 1) + '</td>' +
              '<td>' + (e.typeCd || "-") + '</td>' +
              '<td>' + ((e.content || e.contents || "이벤트")
                .replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; })) + '</td>';
            listEl.appendChild(tr);
          });
        }
        var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.show();
      }

      function typeCodePrefix(code) {
        if (!code) return "";
        var m = String(code).match(/^\d+/);
        return m ? m[0] : "";
      }

      function typeCodeRank(code) {
        var p = typeCodePrefix(code);
        return p ? parseInt(p, 10) : -1;
      }

      function toDate(value) {
        if (value == null || value === "") return null;
        if (value instanceof Date) return value;
        if (typeof value === "number") return new Date(value);
        if (typeof value === "string") return new Date(value);
        if (Array.isArray(value)) {
          return new Date(value[0], (value[1] || 1) - 1, value[2] || 1, value[3] || 0, value[4] || 0, value[5] || 0);
        }
        return null;
      }

      function formatPeriod(ms) {
        var s = toDate(ms.startDate);
        var e = toDate(ms.endDate);
        if (!s || !e) return "기간 미설정";
        return s.toLocaleDateString("ko-KR") + " ~ " + e.toLocaleDateString("ko-KR");
      }

      function milestoneKey(ms) {
        return String(ms.id != null ? ms.id : ms.name);
      }

      function findMilestone(id) {
        return milestones.find(function (ms) {
          return milestoneKey(ms) === String(id);
        });
      }

      // ────────────────────────────────────────────────
      // [API ②] 선택된 마일스톤의 이슈 + 타임라인 이벤트 조회
      //   - URL    : GET /api/milestone/list/{milestoneId}
      //   - 컨트롤러: MilestoneRestController#getMilestoneIssueList
      //   - 응답   : List<MilestoneIssueVO>
      //     [
      //       {
      //         id, milestoneId, issueId, issueSubject,
      //         events: [
      //           { id, contents, entryDate, typeCd }   ← MilestoneTimelineVO
      //         ]
      //       }, ...
      //     ]
      //   - data.list / data.issues 형태로 감싸서 와도 자동으로 풀어서 배열로 반환
      //   - 실패 시 빈 배열 반환 (호출부에서 "이슈 없음" 으로 처리)
      // ────────────────────────────────────────────────
      function fetchIssues(milestoneId) {
        return fetch("/api/milestone/list/" + encodeURIComponent(milestoneId), {
          headers: { Accept: "application/json" },
        })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (data) {
            if (Array.isArray(data)) return data;
            if (data && Array.isArray(data.list)) return data.list;
            if (data && Array.isArray(data.issues)) return data.issues;
            return [];
          })
          .catch(function () {
            return [];
          });
      }

      function computeWindow(ms, issues) {
        var start = toDate(ms.startDate);
        var end = toDate(ms.endDate);
        var min = start ? new Date(start) : null;
        var max = end ? new Date(end) : null;

        function touch(d) {
          if (!d) return;
          if (!min || d < min) min = new Date(d);
          if (!max || d > max) max = new Date(d);
        }

        issues.forEach(function (issue) {
          (issue.events || []).forEach(function (ev) {
            touch(toDate(ev.start || ev.entryDate));
          });
        });

        if (!min || !max) {
          min = new Date(2026, 4, 1);
          max = new Date(2026, 4, 22);
        } else {
          min = new Date(min.getTime() - 1000 * 60 * 60 * 24 * 2);
          max = new Date(max.getTime() + 1000 * 60 * 60 * 24 * 2);
        }
        return { start: min, end: max };
      }

      function buildTimelineForMilestone(ms, issues) {
        var nextGroups = [];
        var nextItems = [];

        issues.forEach(function (issue, index) {
          var groupId = "issue-" + (issue.id != null ? issue.id : issue.issueId || index);
          var label = issue.name+ "#"+ issue.issueId;
          nextGroups.push({ id: groupId, content: label });

          var buckets = {};
          (issue.events || []).forEach(function (ev) {
            var at = toDate(ev.start || ev.entryDate);
            if (!at) return;
            var hourStart = new Date(
              at.getFullYear(), at.getMonth(), at.getDate(), at.getHours(), 0, 0, 0
            );
            var key = hourStart.getTime();
            if (!buckets[key]) buckets[key] = { at: hourStart, events: [] };
            buckets[key].events.push(ev);
          });

          Object.keys(buckets).forEach(function (key) {
            var bucket = buckets[key];
            var sorted = bucket.events.slice().sort(function (a, b) {
              return typeCodeRank(b.typeCd) - typeCodeRank(a.typeCd);
            });
            var rep = sorted[0];
            var count = bucket.events.length;
            var displayText = count > 1 ? "+" + (count - 1) : "";
            var titleText = bucket.events
              .map(function (e) { return e.content || e.contents || "이벤트"; })
              .join(", ");
            var typeKey = typeCodePrefix(rep.typeCd);
            var typeClass = typeKey ? " type-" + typeKey : "";

            nextItems.push({
              id: groupId + "-ev-" + key,
              group: groupId,
              content: displayText,
              start: bucket.at,
              type: "point",
              className: "issue-event" + (count > 1 ? " issue-event-multi" : "") + typeClass,
              title: label + " · " + titleText,
              _events: sorted,
              _issueLabel: label,
            });
          });
        });

        return { groups: nextGroups, items: nextItems };
      }

      function ensureTimeline() {
        if (timeline) return;
        timeline = new vis.Timeline(container, items, groups, {
          stack: true,
          zoomMin: 1000 * 60 * 60 * 6,
          zoomMax: 1000 * 60 * 60 * 24 * 31 * 6,
          editable: false,
          selectable: true,
          showCurrentTime: true,
        });
        timeline.on("click", function (props) {
          if (!props.item) {
            logEl.textContent = "빈 영역 클릭";
            return;
          }
          var it = items.get(props.item);
          if (it && Array.isArray(it._events) && it._events.length) {
            openTimelineViewModal(it);
          }
        });
      }

      function formatYmd(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }

      function updatePeriodMarkers(ms) {
        var s = toDate(ms.startDate);
        var e = toDate(ms.endDate);

        if (hasStartMarker) { try { timeline.removeCustomTime("ms-start"); } catch (_) {} hasStartMarker = false; }
        if (hasEndMarker)   { try { timeline.removeCustomTime("ms-end");   } catch (_) {} hasEndMarker = false; }

        if (s) {
          timeline.addCustomTime(s, "ms-start");
          timeline.setCustomTimeMarker("시작 " + formatYmd(s), "ms-start", false);
          hasStartMarker = true;
        }
        if (e) {
          timeline.addCustomTime(e, "ms-end");
          timeline.setCustomTimeMarker("마감 " + formatYmd(e), "ms-end", false);
          hasEndMarker = true;
        }

        requestAnimationFrame(function () {
          var startBar = container.querySelector('.vis-custom-time[data-id="ms-start"]');
          var endBar   = container.querySelector('.vis-custom-time[data-id="ms-end"]');
          if (startBar) { startBar.classList.add("milestone-start"); if (s) startBar.setAttribute("data-label", "시작 " + formatYmd(s)); }
          if (endBar)   { endBar.classList.add("milestone-end");     if (e) endBar.setAttribute("data-label", "마감 " + formatYmd(e)); }
        });
      }

      function renderTimeline(ms, issues) {
        ensureTimeline();
        var built = buildTimelineForMilestone(ms, issues);
        var win = computeWindow(ms, issues);

        groups.clear();
        items.clear();
        groups.add(built.groups);
        items.add(built.items);

        var rowCount = built.groups.length;
        container.style.height = Math.max(240, rowCount * 48) + "px";
        emptyHint.hidden = issues.length > 0;
        container.hidden = issues.length === 0 && !built.items.length;

        timeline.setOptions({ start: win.start, end: win.end });
        updatePeriodMarkers(ms);
        timeline.redraw();
      }

      function setHeader(ms, issueCount) {
        headerTextEl.innerHTML =
          "<h3>" + (ms.name || "마일스톤") + "</h3>" +
          "<p>" + formatPeriod(ms) + " · 등록 이슈 " + issueCount + "건</p>";
      }

      function setActiveSidebar(id) {
        sidebarEl.querySelectorAll(".milestone-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.dataset.id === String(id));
        });
      }

      // 사이드바에서 마일스톤 클릭 → [API ②] 호출 → vis-timeline 다시 그리기
      function selectMilestone(id) {
        var ms = findMilestone(id);
        if (!ms) return;
        selectedMilestoneId = String(id);
        setActiveSidebar(id);
        setHeader(ms, "…");
        logEl.textContent = "이슈 목록을 불러오는 중…";

        fetchIssues(id).then(function (issues) {
          currentIssues = issues || [];
          setHeader(ms, issues.length);
          renderTimeline(ms, issues);
          logEl.textContent = issues.length
            ? "마일스톤 \"" + (ms.name || id) + "\" · 이슈 " + issues.length + "건"
            : "등록된 이슈가 없습니다.";
        });
      }

      function renderSidebar() {
        sidebarEl.innerHTML = "";
        milestones.forEach(function (ms) {
          var id = milestoneKey(ms);
          var li = document.createElement("li");
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "milestone-btn";
          btn.dataset.id = id;
          btn.innerHTML =
            '<span class="name">' + (ms.name || "마일스톤") + "</span>" +
            '<span class="period">' + formatPeriod(ms) + "</span>";
          btn.addEventListener("click", function () {
            selectMilestone(id);
          });
          li.appendChild(btn);
          sidebarEl.appendChild(li);
        });

        if (milestones.length) {
          selectMilestone(milestoneKey(milestones[0]));
        }
      }

      function fetchMilestones() {
        return fetch("/api/milestone/" + encodeURIComponent(prjId), {
          headers: { Accept: "application/json" },
        })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (data) {
            if (Array.isArray(data)) return data;
            if (data && Array.isArray(data.list)) return data.list;
            return [];
          })
          .catch(function () { return []; });
      }

      fetchMilestones().then(function (list) {
        milestones = list || [];
        renderSidebar();
      });

      // ────────────────────────────────────────────────
      // [API 브리지] window.MilestoneTimeline
      //   - 외부(모달 fragment)에서 호출하는 전역 API
      //   - 모달이 자체 fetch 로 백엔드에 저장/수정/삭제한 뒤,
      //     아래 메서드를 호출해 화면 상태를 동기화함
      //
      //   사용 예 (모달 쪽):
      //     fetch('/api/milestone', { method:'POST', ... })
      //       .then(res => res.json())
      //       .then(ms => MilestoneTimeline.addMilestoneLocal(ms));
      //
      //   메서드 목록:
      //   ┌──────────────────────────┬─────────────────────────────────────────┐
      //   │ getPrjId()               │ 타임라인 페이지의 프로젝트 id (URL → 없으면 4) │
      //   │ getMilestones()          │ 현재 마일스톤 배열 (복사본)             │
      //   │ getSelectedMilestone()   │ 선택된 마일스톤 객체                    │
      //   │ getSelectedMilestoneId() │ 선택된 마일스톤 id (모달 API 호출용)    │
      //   │ addMilestoneLocal(ms)    │ 추가 후 화면 반영                       │
      //   │ updateMilestoneLocal(ms) │ 수정 후 화면 반영 (id 기준 머지)        │
      //   │ removeMilestoneLocal(id) │ 삭제 후 화면 반영                       │
      //   │ refreshSelected()        │ 현재 마일스톤 재조회 (이슈/이벤트 갱신) │
      //   └──────────────────────────┴─────────────────────────────────────────┘
      // ────────────────────────────────────────────────
      window.MilestoneTimeline = {
        getCurrentIssues: function () { return currentIssues.slice(); },
        getPrjId: function () {
          if (typeof window.prjId !== "undefined" && window.prjId !== "" && window.prjId != null) {
            return Number(window.prjId);
          }
          return 3;
        },
        getMilestones: function () { return milestones.slice(); },
        getSelectedMilestone: function () {
          return findMilestone(selectedMilestoneId);
        },
        getSelectedMilestoneId: function () { return selectedMilestoneId; },
        addMilestoneLocal: function (ms) {
          if (!ms) return;
          milestones.push(ms);
          renderSidebar();
          selectMilestone(milestoneKey(ms));
        },
        updateMilestoneLocal: function (ms) {
          if (!ms || ms.id == null) return;
          var idx = milestones.findIndex(function (m) { return String(m.id) === String(ms.id); });
          if (idx >= 0) {
            milestones[idx] = Object.assign({}, milestones[idx], ms);
            renderSidebar();
            selectMilestone(milestoneKey(milestones[idx]));
          }
        },
        removeMilestoneLocal: function (id) {
          milestones = milestones.filter(function (m) { return String(m.id) !== String(id); });
          renderSidebar();
          if (milestones.length) selectMilestone(milestoneKey(milestones[0]));
        },
        refreshSelected: function () {
          if (selectedMilestoneId != null) selectMilestone(selectedMilestoneId);
        },
      };
    })();
  </script>
</body>
</html>
