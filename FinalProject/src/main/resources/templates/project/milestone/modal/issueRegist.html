<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
<div th:fragment="issueRegistModal">
	<div class="modal fade" id="issueRegistModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">이슈 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<form id="issueRegistForm" autocomplete="off">
						<div class="mb-3">
							<label class="form-label">등록할 이슈</label>
							<select class="form-select" name="issueId" required>
								<option value="">이슈를 선택하세요</option>
							</select>
							<small class="form-text text-muted">현재 마일스톤에 아직 등록되지 않은 이슈만 표시됩니다.</small>
						</div>
						<small class="text-danger d-none" data-ir-err></small>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
					<button type="button" class="btn btn-primary" data-ir-save>등록</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		(function () {
			var modalEl = document.getElementById("issueRegistModal");
			if (!modalEl) return;
			var form = modalEl.querySelector("#issueRegistForm");
			var errEl = modalEl.querySelector("[data-ir-err]");
			var saveBtn = modalEl.querySelector("[data-ir-save]");
			var selectEl = form.querySelector('[name="issueId"]');

			function getCsrfHeaders() {
				if (window.MilestoneTimeline && window.MilestoneTimeline.getCsrfHeaders) {
					return window.MilestoneTimeline.getCsrfHeaders();
				}
				var headers = {};
				var tokenMeta = document.querySelector('meta[name="_csrf"]');
				var headerMeta = document.querySelector('meta[name="_csrf_header"]');
				if (tokenMeta && headerMeta && tokenMeta.content && headerMeta.content) {
					headers[headerMeta.content] = tokenMeta.content;
				}
				return headers;
			}

			function getApiJsonHeaders() {
				if (window.MilestoneTimeline && window.MilestoneTimeline.getApiJsonHeaders) {
					return window.MilestoneTimeline.getApiJsonHeaders();
				}
				return Object.assign(
					{ "Content-Type": "application/json", Accept: "application/json" },
					getCsrfHeaders()
				);
			}

			function setErr(msg) {
				if (!errEl) return;
				if (msg) { errEl.textContent = msg; errEl.classList.remove("d-none"); }
				else     { errEl.textContent = ""; errEl.classList.add("d-none"); }
			}

			function getPrjId() {
				if (window.MilestoneTimeline && typeof window.MilestoneTimeline.getPrjId === "function") {
					return window.MilestoneTimeline.getPrjId();
				}
				if (typeof window.prjId !== "undefined" && window.prjId !== "" && window.prjId != null) {
					return Number(window.prjId);
				}
				return null;
			}

			function loadAvailableIssues(prjId) {
				selectEl.innerHTML = '<option value="">불러오는 중…</option>';
				return fetch("/api/milestone/notinissue/" + encodeURIComponent(prjId), {
					headers: { Accept: "application/json" },
				})
					.then(function (r) { return r.ok ? r.json() : []; })
					.then(function (data) {
						var list = Array.isArray(data) ? data : [];
						selectEl.innerHTML = '<option value="">이슈를 선택하세요</option>';
						list.forEach(function (it) {
							var opt = document.createElement("option");
							opt.value = it.id;
							opt.textContent = (it.subject || ("이슈 #" + it.id))
								+ (it.id ? " (#" + it.id + ")" : "");
							selectEl.appendChild(opt);
						});
						if (!list.length) {
							selectEl.innerHTML = '<option value="">등록 가능한 이슈가 없습니다</option>';
						}
					})
					.catch(function () {
						selectEl.innerHTML = '<option value="">이슈 목록 로드 실패</option>';
					});
			}

			modalEl.addEventListener("show.bs.modal", function () {
				setErr("");
				form.reset();
				var msId = (window.MilestoneTimeline && window.MilestoneTimeline.getSelectedMilestoneId)
					? window.MilestoneTimeline.getSelectedMilestoneId() : null;
				var prjId = getPrjId();
				if (!msId) {
					selectEl.innerHTML = '<option value="">마일스톤을 먼저 선택하세요</option>';
					return;
				}
				if (!prjId) {
					selectEl.innerHTML = '<option value="">프로젝트 정보를 찾을 수 없습니다</option>';
					return;
				}
				loadAvailableIssues(prjId);
			});

			saveBtn.addEventListener("click", function () {
				setErr("");
				var msId = (window.MilestoneTimeline && window.MilestoneTimeline.getSelectedMilestoneId)
					? window.MilestoneTimeline.getSelectedMilestoneId() : null;
				if (!msId) { setErr("마일스톤을 먼저 선택하세요."); return; }
				var fd = new FormData(form);
				var issueId = fd.get("issueId");
				if (!issueId) { setErr("이슈를 선택하세요."); return; }
				var payload = {
					milestoneId: Number(msId),
					issueId: Number(issueId),
				};
				
				saveBtn.disabled = true;
				fetch("/api/milestone/issue", {
					method: "POST",
					headers: getApiJsonHeaders(),
					body: JSON.stringify(payload),
				})
					.then(function (res) {
						if (!res.ok) throw new Error("HTTP " + res.status);
						return res.json().catch(function () { return null; });
					})
					.then(function () {
						if (window.MilestoneTimeline) window.MilestoneTimeline.refreshSelected();
						bootstrap.Modal.getInstance(modalEl).hide();
					})
					.catch(function (err) {
						setErr("등록 실패: " + (err && err.message ? err.message : err));
					})
					.finally(function () { saveBtn.disabled = false; });
			});
		})();
	</script>
</div>
</body>
</html>
