<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
<div th:fragment="timelineViewModal">
	<div class="modal fade" id="timelineViewModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">타임라인 조회</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<div class="row g-2 mb-3">
						<div class="col-sm-6">
							<label class="form-label small text-muted mb-1">이슈</label>
							<div class="form-control bg-light" data-tv-issue>-</div>
						</div>
						<div class="col-sm-6">
							<label class="form-label small text-muted mb-1">기준 시각</label>
							<div class="form-control bg-light" data-tv-when>-</div>
						</div>
					</div>
					<div class="table-responsive">
						<table class="table table-sm align-middle mb-0">
							<thead class="table-light">
								<tr>
									<th class="text-center" style="width: 60px">#</th>
									<th style="width: 140px">유형</th>
									<th>설명</th>
								</tr>
							</thead>
							<tbody data-tv-list></tbody>
						</table>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
