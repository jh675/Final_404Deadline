<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/projectLayout}">
<head>
    <meta charset="UTF-8">
    <title>메시지 등록</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; color: #333; }
        h2 { margin-bottom: 20px; }
        .btn { padding: 8px 16px; border: 1px solid #ccc; background-color: #fff; border-radius: 4px; cursor: pointer; }
        .btn-submit { background-color: #7cb1cd; color: white; border: none; }
        .btn-submit:hover { background-color: #69a0bc; }
        
        .reg-table { width: 100%; max-width: 600px; border-collapse: collapse; margin-bottom: 20px; }
        .reg-table th, .reg-table td { border: 1px solid #ddd; padding: 12px; }
        .reg-table th { background-color: #f9f9f9; width: 100px; text-align: center; font-weight: bold; }
        .form-control { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <h2>메시지 등록 (게시판 번호: <span th:text="${boardId}">0</span>)</h2>
    
    <form th:action="@{/messages/insert	}" 
           method="post" 
           enctype="multipart/form-data" >
        <input type="hidden" name="boardId" th:value="${message.boardId}" />
        
        <table class="reg-table">
            <tr>
                <th><label for="title">제목</label></th>
                <td><input type="text" id="title" name="title" class="form-control" placeholder="제목을 입력하세요." required /></td>
            </tr>
            <tr>
                <th><label for="content">내용</label></th>
                <td><textarea id="content" name="content" class="form-control" rows="12" placeholder="내용을 입력하세요." required></textarea></td>
            </tr>
            <tr>
            	<th><label for="title">첨부파일</label></th>
            	<td><input type="file" name="attachments" class="form-control border-secondary-subtle" multiple="multiple"></td>
            </tr>
        </table>
        
        <div>
            <button type="button" class="btn" th:onclick="|location.href='/messages/list?boardId=' + ${boardId}|">취소</button>
            <button type="submit" class="btn btn-submit">등록</button>
        </div>
    </form>
</div>
</body>
</html>
