<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>게시글 등록</title>
<th:block layout:fragment="head-content">
	<link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
	<link rel="stylesheet" th:href="@{/css/project/issue.css}" />
	<link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
</th:block>
</head>
<body>
	<div layout:fragment="content">
		<div class="issue-shell">
			<div id="wrapper">
				<div class="issue-page-head">
					<a class="issue-page-back" th:href="@{/project/messages/list(boardId=${boardId})}">← 게시글 목록</a>
					<h1 class="issue-page-head__title"
						th:text="${parentId != null} ? '게시글 답글 등록' : (${message?.id != null} ? '게시글 수정' : '게시글 등록')">
						게시글 등록
					</h1>
				</div>

				<form
					th:action="${message?.id != null} ? @{/project/messages/update} : @{/project/messages/insert}"
					method="post"
					enctype="multipart/form-data"
				>
					<input type="hidden" name="id" th:value="${message?.id}" />
					<input type="hidden" name="boardId" th:value="${boardId}" />
					<input type="hidden" name="fieldparentId" th:value="${parentId != null ? parentId : (message?.fieldparentId != null ? message.fieldparentId : '')}" />

					<div class="issue-page-section">
						<div class="issue-form-row">
							<div class="search-item search-item--grow">
								<label for="title">게시글 제목 <span class="req">*</span></label>
								<div class="field-wrap">
									<th:block th:if="${parentId != null}">
										<input type="text" class="form-control" th:value="'[RE] ' + ${parentTitle}" disabled />
										<input type="hidden" name="title" th:value="'[RE] ' + ${parentTitle}" />
									</th:block>
									<th:block th:if="${parentId == null}">
										<input type="text" id="title" name="title" class="form-control"
											th:value="${message?.title}" placeholder="게시글 제목을 입력하세요." required />
									</th:block>
								</div>
							</div>
						</div>

						<div class="issue-form-row">
							<div class="search-item search-item--grow">
								<label for="content">내용</label>
								<div class="field-wrap">
									<textarea id="content" name="content" class="form-control" rows="8"
										placeholder="내용을 입력하세요." required th:text="${message?.content}"></textarea>
								</div>
							</div>
						</div>
					</div>

					<div class="issue-register-actions">
						<button type="button" class="btn btn-secondary"
							th:onclick="|location.href='/project/messages/list?boardId=' + ${boardId}|">취소</button>
						<button type="submit" class="btn btn-primary" th:text="${message?.id != null} ? '수정' : '등록'">등록</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
