<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/projectLayout}">
<head>
    <meta charset="UTF-8">
    <title>게시글 관리</title>
    <th:block layout:fragment="head-content">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
        <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
        <link rel="stylesheet" th:href="@{/css/project/issue.css}" />
        <link rel="stylesheet" th:href="@{/css/project/projectAdmin.css}" />
    </th:block>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        function updateEmptyReplyMessage() {
            var emptyMsg = document.getElementById("emptyReplyMessage");
            if (!emptyMsg) return;
            var hasReplies = document.querySelectorAll(".messages-reply-item").length > 0;
            var form = document.getElementById("answerFormSection");
            var formOpen = form && form.classList.contains("is-open");
            emptyMsg.classList.toggle("is-hidden", hasReplies || formOpen);
        }

        function toggleAnswerForm() {
            var form = document.getElementById("answerFormSection");
            if (!form) return;
            form.classList.toggle("is-open");
            updateEmptyReplyMessage();
            if (form.classList.contains("is-open")) {
                form.scrollIntoView({ behavior: "smooth", block: "nearest" });
                var textarea = form.querySelector(".messages-answer-content");
                if (textarea) textarea.focus();
            }
        }

        function submitAnswer() {
            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");
            $.ajax({
                type: "POST",
                url: "/project/messages/insert",
                data: $("#answerForm").serialize(),
                beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
                success: function() { location.reload(); },
                error: function() { alert("답글 등록에 실패했습니다."); }
            });
        }

        function deleteReply(replyId, boardId) {
            if (!confirm("정말 삭제하시겠습니까?")) return;
            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");
            $.ajax({
                type: "POST",
                url: "/project/messages/delete",
                data: { id: replyId, boardId: boardId },
                beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
                success: function() { location.reload(); },
                error: function() { alert("삭제에 실패했습니다."); }
            });
        }

        $(document).ready(function() {
            $(".row-number").each(function(index) { $(this).text(index + 1); });
            updateEmptyReplyMessage();
        });
    </script>
</head>
<body>
<div layout:fragment="content">
    <div class="issue-shell issue-shell--list">
        <div id="wrapper" class="issue-list">
            <header class="issue-list__header">
                <a th:href="@{/project/boards/list}" class="issue-page-back">← 게시판 목록</a>
                <h1 class="issue-list__title" th:text="${board.name}">게시판 이름</h1>
            </header>

            <section class="issue-section issue-section--grid" aria-label="게시글 목록">
                <div class="messages-table-wrap">
                    <table class="data-table messages-table">
                        <thead>
                            <tr>
                                <th class="messages-table__col-no">번호</th>
                                <th class="messages-table__col-title">제목</th>
                                <th class="messages-table__col-date">작성일</th>
                                <th class="messages-table__col-actions">관리</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="msg : ${list}" th:if="${msg.fieldparentId == null}">
                                <td class="messages-table__cell-no row-number"></td>
                                <td class="messages-table__cell-title">
                                    <a class="messages-title-link"
                                       th:href="@{/project/messages/list(boardId=${board.id}, id=${msg.id})}"
                                       th:text="${msg.title}">제목</a>
                                </td>
                                <td class="messages-table__cell-date" th:text="${#dates.format(msg.createdOn, 'yyyy-MM-dd')}"></td>
                                <td class="messages-table__cell-actions">
                                    <div class="messages-row-actions">
                                        <button type="button" class="btn btn-success"
                                            th:onclick="|location.href='/project/messages/modify?id=${msg.id}'|">수정</button>
                                        <button type="button" class="btn btn-danger"
                                            th:onclick="|if(confirm('정말 삭제하시겠습니까?')) { location.href='/project/messages/delete?id=${msg.id}&boardId=${board.id}' }|">삭제</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section th:if="${message == null}" class="issue-section issue-section--footer" aria-label="게시글 목록 하단">
                <div class="issue-list-footer">
                    <div class="issue-list-footer__pagination"></div>
                    <div class="issue-list-footer__actions">
                        <button type="button" class="btn btn-primary"
                            th:onclick="|location.href='/project/messages/register?boardId=' + ${board.id}|">작성</button>
                    </div>
                </div>
            </section>

            <div th:if="${message != null}" class="messages-detail">
                <div class="issue-page-head">
                    <a th:href="@{/project/messages/list(boardId=${board.id})}" class="issue-page-back">← 게시글 목록</a>
                    <h1 class="issue-page-head__title">게시글 상세</h1>
                </div>

                <section class="issue-page-section">
                    <div class="messages-detail__meta">
                        <div>작성자: <span class="messages-detail__meta-value" th:text="${message.userId != null ? message.userId : '익명'}"></span></div>
                        <div>작성일: <span class="messages-detail__meta-value" th:text="${#dates.format(message.createdOn, 'yyyy-MM-dd')}"></span></div>
                    </div>

                    <div class="messages-detail__field">
                        <span class="messages-detail__field-label">제목</span>
                        <div class="messages-detail__field-value" th:text="${message.title}"></div>
                    </div>
                    <div class="messages-detail__field">
                        <span class="messages-detail__field-label">내용</span>
                        <div class="messages-detail__field-value messages-detail__field-value--body" th:text="${message.content}"></div>
                    </div>
                </section>

                <div id="answerFormSection" class="messages-answer-section">
                    <form id="answerForm">
                        <input type="hidden" name="boardId" th:value="${board.id}" />
                        <input type="hidden" name="fieldparentId" th:value="${message.id}" />
                        <input type="text" class="messages-answer-title" th:value="${message.title}" disabled />
                        <input type="hidden" name="title" th:value="${message.title}" />
                        <textarea name="content" class="messages-answer-content" placeholder="답글을 입력하세요." required></textarea>
                        <div class="messages-answer-actions">
                            <button type="button" class="btn btn-secondary" onclick="toggleAnswerForm()">취소</button>
                            <button type="button" class="btn btn-primary" onclick="submitAnswer()">등록</button>
                        </div>
                    </form>
                </div>

                <section class="issue-page-section messages-reply-section">
                    <h2 class="messages-reply-section__title">답글</h2>
                    <th:block th:each="ans : ${replyList}">
                        <div class="messages-reply-item">
                            <button type="button" class="btn btn-danger messages-reply-item__delete"
                                th:onclick="|deleteReply(${ans.id}, ${board.id})|">삭제</button>
                            <div class="messages-reply-item__title">
                                <span class="messages-reply-item__label">제목:</span>
                                <span th:text="${ans.title}"></span>
                            </div>
                            <div class="messages-reply-item__content">
                                <span class="messages-reply-item__label">답글:</span>
                                <span th:text="${ans.content}"></span>
                            </div>
                        </div>
                    </th:block>
                    <div id="emptyReplyMessage" class="messages-reply-empty"
                         th:classappend="${#lists.isEmpty(replyList)} ? '' : ' is-hidden'">작성된 답글이 없습니다.</div>
                </section>

                <div class="messages-detail__footer">
                    <div class="issue-list-footer">
                        <div class="issue-list-footer__pagination"></div>
                        <div class="issue-list-footer__actions">
                            <button type="button" class="btn btn-primary" onclick="toggleAnswerForm()">작성</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
