<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="calenderAddModal">

    <!-- ===== 일정 수정 모달 ===== -->
    <div class="modal fade" id="updateModalOverlay" tabindex="-1"
        aria-labelledby="updateModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="updateModalLabel">일정변경/삭제</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="upd_id" />

                    <div class="row mb-3">
                        <div class="col">
                            <label for="upd_startDate" class="form-label">시작 날짜</label>
                            <input type="date" id="upd_startDate" class="form-control">
                        </div>
                        <div class="col">
                            <label for="upd_endDate" class="form-label">종료 날짜</label>
                            <input type="date" id="upd_endDate" class="form-control">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="upd_calStart" class="form-label">시작 시간</label>
                            <select class="form-select" id="upd_calStart">
                                <option value="">선택</option>
                                <option value="09:00:00">오전 09:00</option>
                                <option value="09:15:00">오전 09:15</option>
                                <option value="09:30:00">오전 09:30</option>
                                <option value="10:00:00">오전 10:00</option>
                                <option value="10:15:00">오전 10:15</option>
                                <option value="10:30:00">오전 10:30</option>
                                <option value="11:00:00">오전 11:00</option>
                                <option value="12:00:00">오후 12:00</option>
                                <option value="13:00:00">오후 01:00</option>
                                <option value="14:00:00">오후 02:00</option>
                                <option value="15:00:00">오후 03:00</option>
                                <option value="16:00:00">오후 04:00</option>
                                <option value="17:00:00">오후 05:00</option>
                                <option value="18:00:00">오후 06:00</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="upd_calEnd" class="form-label">종료 시간</label>
                            <select class="form-select" id="upd_calEnd">
                                <option value="">선택</option>
                                <option value="09:00:00">오전 09:00</option>
                                <option value="09:15:00">오전 09:15</option>
                                <option value="09:30:00">오전 09:30</option>
                                <option value="10:00:00">오전 10:00</option>
                                <option value="10:15:00">오전 10:15</option>
                                <option value="10:30:00">오전 10:30</option>
                                <option value="11:00:00">오전 11:00</option>
                                <option value="12:00:00">오후 12:00</option>
                                <option value="13:00:00">오후 01:00</option>
                                <option value="14:00:00">오후 02:00</option>
                                <option value="15:00:00">오후 03:00</option>
                                <option value="16:00:00">오후 04:00</option>
                                <option value="17:00:00">오후 05:00</option>
                                <option value="18:00:00">오후 06:00</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="upd_place" class="form-label">일정 장소</label>
                        <input type="text" class="form-control" id="upd_place" placeholder="텍스트를 입력해 주세요.">
                    </div>

                    <div class="mb-3">
                        <label for="upd_calText" class="form-label">일정 내용</label>
                        <input type="text" class="form-control" id="upd_calText" placeholder="텍스트를 입력해 주세요.">
                    </div>

                    <!-- 공유 유형 + 공유여부 한 줄 -->
                    <div class="mb-3">
                        <div class="d-flex align-items-center gap-3 flex-wrap">
                            <div class="d-flex align-items-center gap-2">
                                <label class="form-label mb-0">공유 유형</label>
                                <select class="form-select" id="upd_typeCd" style="width: auto;">
                                    <option value="">선택</option>
                                    <option value="01CALTYPE">개인일정</option>
                                    <option value="02CALTYPE">그룹일정</option>
                                    <option value="03CALTYPE">회사일정</option>
                                </select>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <label class="form-label mb-0">공유여부</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="upd_sharingCd"
                                        id="upd_sharingMe" value="02CALSHARE" checked>
                                    <label class="form-check-label" for="upd_sharingMe">나만보기</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="upd_sharingCd"
                                        id="upd_sharingAll" value="01CALSHARE">
                                    <label class="form-check-label" for="upd_sharingAll">전체 공유</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 일정 유형 -->
                    <div class="mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <label class="form-label mb-0">일정 유형</label> <select class="form-select"
								id="upd_calType" style="width: auto;">
								<option value="">선택</option>
								<option value="01CALDETAIL">회의</option>
								<option value="02CALDETAIL">행사</option>
								<option value="03CALDETAIL">휴가/휴일</option>
								<option value="04CALDETAIL">교육</option>
								<option value="05CALDETAIL">기타</option>
							</select>
						</div>
                    </div>
                </div>  <!-- modal-body 끝 -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button class="btn btn-danger" onclick="confirmDelete()">삭제</button>
                    <button class="btn btn-primary" onclick="updateEvent()">확인</button>
                </div>
            </div>  <!-- modal-content 끝 -->
        </div>      <!-- modal-dialog 끝 -->
    </div>          <!-- modal fade 끝 -->

    <!-- 안내 메시지 모달 -->
    <div class="modal fade" id="alertModalOverlay" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">안내 메시지</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-3">
                    <span id="alertMsg"></span>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal fade" id="deleteConfirmOverlay" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">안내 메시지</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="mb-0">일정을 삭제 하시겠습니까?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-danger" onclick="deleteEvent()">삭제</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 검색 결과 모달 -->
    <div class="modal fade" id="resultModalOverlay" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">검색 결과</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="searchResultList"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
