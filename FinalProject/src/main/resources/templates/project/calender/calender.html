<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/userLayout}">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캘린더</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
	<div layout:fragment="content">

		<div class="calendar-wrapper">
			<!-- 일정 표시버튼 (월간, 주간, 일간) -->
			<div class="toolbar">
				<div class="view-btn-group">
					<button class="view-btn" onclick="changeView('month')">월간</button>
					<button class="view-btn" onclick="changeView('week')">주간</button>
					<button class="view-btn active" onclick="changeView('day')">일간</button>
				</div>
				<!-- 달 (이전달, 다음달, 시스탬 기준 년/월) -->
				<button class="nav-btn" onclick="calendar.prev()">이전달</button>
				<div class="current-date" id="currentDate">년 월</div>
				<button class="nav-btn" onclick="calendar.next()">다음달</button>

				<!-- 검색 영역 -->
				<div class="search-area">
					<select class="filter-select" id="typeCd" onchange="filterEvents()">
						<option value="">전체</option>
						<option value="personal">개인일정</option>
						<option value="group">그룹일정</option>
						<option value="company">회사일정</option>
					</select> <input type="text" class="search-input" id="searchInput"
						placeholder="검색어를 입력해주세요." />
					<button  type ="button" class="search-btn" onclick="searchEvents()">검색</button>
				</div>
			</div>
			<!-- 캘린더 -->
			<div id="calendar" style="height:500px"></div>
		</div>



		<!-- ===== 일정 등록 모달 ===== -->

		<div class="modal fade" id="insertModalOverlay" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">일정 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
            <!-- <input id="test01"/> -->
						<div class="row mb-3">
							<div class="col">
								<label class="form-label">시작 날짜</label> <input type="date"
									id="ins_startDate" class="form-control bg-light" readonly>
								<div class="form-text">시작일은 선택한 날짜로 고정됩니다.</div>
							</div>

							<div class="col">
								<label class="form-label">종료 날짜</label> <input type="date"
									id="ins_endDate" class="form-control" min="">
							</div>
						</div>
						<div class="form-row">
					<label class="form-label">일정장소 <span></span></label> <input
						type="text" class="form-input" id="ins_place"
						placeholder="텍스트를 입력해 주세요." />
				</div>
						
						<div class="form-row">
					<label class="form-label">일정 내용</label> <input type="text"
						class="form-input" id="ins_calText" placeholder="텍스트를 입력해 주세요." />
				</div>
				<div class="form-row">
					<div class="checkbox-row">
					    <label class="form-label" style="margin: 0;">일정유형</label> 
						<select name="typeCd"
							class="form-select" id="ins_typeCd" style="width: auto;">
							<option value="">선택</option>
							<option value="01CALTYPE">개인일정</option>
							<option value="02CALTYPE">그룹일정</option>
							<option value="03CALTYPE">회사일정</option>
						</select>
					     <label class="form-label" style="margin: 0;">공유여부</label> 
						 <label class="checkbox-label"> 
						 <input type="radio"
						 	name="sharingCd" 
						 	value="02CALSHARE"
							id="ins_sharingMe" checked/> 나만보기
						</label> 
						<label class="checkbox-label"> 
						<input type="radio" 
						    name="sharingCd"
						    value="01CALSHARE"
							id="ins_sharingAll"  /> 전체 공유
						</label>
					</div>
				</div>

				<!-- 일정 등록 모달창 -->
				
				<input type="hidden" id="ins_selectedStartDate">
				<input type="hidden" id="ins_selectedEndDate">
				
				<div class="form-row">
					<div class="time-row">
						<span class="time-label">시작시간</span> <select class="form-select"
							id="ins_calStart">
							<option value="">선택</option>
							<option value="09:00:00">오전 09:00</option>
							<option value="09:15:00">오전 09:15</option>
        				    <option value="09:30:00">오전 09:30</option>
						    <option value="10:00:00">오전 10:00</option>
						    <option value="10:00:00">오전 10:15</option>
						    <option value="10:00:00">오전 10:30</option>
						    <option value="11:00:00">오전 11:00</option>
							<option value="12:00:00">오후 12:00</option>
							<option value="13:00:00">오후 01:00</option>
							<option value="13:00:00">오후 02:00</option>
							<option value="13:00:00">오후 03:00</option>
							<option value="13:00:00">오후 04:00</option>
							<option value="13:00:00">오후 05:00</option>
							<option value="13:00:00">오후 06:00</option>

								</select> <span class="time-label">종료시간</span> <select class="form-select"
							id="ins_calEnd">
							<option value="">선택</option>
							<option value="09:00:00">오전 09:00</option>
							<option value="09:15:00">오전 09:15</option>
        				    <option value="09:30:00">오전 09:30</option>
						    <option value="10:00:00">오전 10:00</option>
						    <option value="10:00:00">오전 10:15</option>
						    <option value="10:00:00">오전 10:30</option>
						    <option value="11:00:00">오전 11:00</option>
							<option value="12:00:00">오후 12:00</option>
							<option value="13:00:00">오후 01:00</option>
							<option value="13:00:00">오후 02:00</option>
							<option value="13:00:00">오후 03:00</option>
							<option value="13:00:00">오후 04:00</option>
							<option value="13:00:00">오후 05:00</option>
							<option value="13:00:00">오후 06:00</option>
							
						</select>
					</div>
				</div>
            
            </div>
            
            <div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
					<button class="btn btn-primary" onclick="insertEvent()">확인</button>
			</div>
          </div>
		</div>
		
		</div>


		<div th:replace="~{project/calender/modal/calenderAdd}"></div>
    
	<script src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>
	<script>
    const Calendar = tui.Calendar;
	
    const calendar = new Calendar('#calendar', {
        defaultView: 'month',
        language: 'ko',
        usageStatistics: false,
        
        week: {
		  dayNames: ['일', '월', '화', '수', '목', '금', '토'],
        },
        month: {
		  dayNames: ['일', '월', '화', '수', '목', '금', '토'],
		  visibleEventCount: 3,
        },
        calendars: [
        	{ id: 'holiday', name: '공휴일', color: '#fff', backgroundColor: '#ff4d4d', borderColor: '#ff4d4d' },
            { id: 'personal', name: '개인일정', color: '#fff', backgroundColor: '#ff6b6b', borderColor: '#ff6b6b' },
            { id: 'group',    name: '그룹일정', color: '#fff', backgroundColor: '#51cf66', borderColor: '#51cf66' },
            { id: 'company',  name: '회사일정', color: '#fff', backgroundColor: '#339af0', borderColor: '#339af0' },
        ],
        template: {
            time(event) {
                return `<span>${event.title}</span>`;
            }
        }
    });

    // 날짜 표시 업데이트
    function updateDateLabel() {
        const date = calendar.getDate();
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        document.getElementById('currentDate').textContent = `${year}년 ${month}월`;
    }
    updateDateLabel();
    
    
    // 1. 캘린더 등록 부분 
    
 // 날짜/시간 클릭 시 모달 띄우기
    calendar.on('selectDateTime', (event) => {

    	// 일정 등록 시 날짜 가져오는 부분 
    	const startDate = event.start;
    	const year = startDate.getFullYear();
    	const month = String(startDate.getMonth() + 1).padStart(2, '0');
    	const day = String(startDate.getDate()).padStart(2, '0');
    	const formattedDate = `${year}-${month}-${day}`;
    	
    	// 날짜 선택 드롭 박스 
    	document.getElementById('ins_selectedStartDate').value = formattedDate;
    	document.getElementById('ins_selectedEndDate').value = formattedDate;
		
    	 document.getElementById('ins_calStart').value = '';
    	 document.getElementById('ins_calEnd').value = '';

    	// 입력폼 초기화 + 등록 모달창에 시작날짜 넣기 
        document.getElementById('ins_place').value = '';
        document.getElementById('ins_calText').value = '';
        document.getElementById('ins_typeCd').value = '';
        
        // 시작날짜에 값 넣기 + 시작일 변경 불가 설정 부분 (읽기전용)
        const startInput = document.getElementById('ins_startDate');
        if(startInput) {
	      startInput.value = formattedDate;
	      // 사용자 날짜 변경 방지 
	      startInput.readOnly = true; 
        }
        
        // 종료날짜에 값 넣기
        const endInput = document.getElementById('ins_endDate');
        if(endInput) {
		  endInput.value = formattedDate;
        }
        
        // 개인일정 선택 시 (공유여부 선택)체크박스 나타나게하기 
        const checkBox = document.getElementById('sharingCd');
        if(checkBox) checkBox.classList.add('d-none');

        // 부트스트랩 모달 인스턴스 생성 및 표시
        openModal('insertModalOverlay');
    });
 
 
    // 뷰 전환
    function changeView(view) {
        calendar.changeView(view);
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        const map = { month: 0, week: 1, day: 2 };
        document.querySelectorAll('.view-btn')[map[view]].classList.add('active');
        updateDateLabel();
    }

    // 이전/다음 클릭 시 날짜 업데이트
    document.querySelector('.nav-btn').addEventListener('click', () => setTimeout(updateDateLabel, 0));

    // 서버에서 일정 불러오기
    function loadEvents(typeCd = '') {
        fetch(`/calender/listJson?typeCd=${typeCd}`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(res => res.json())
            .then(data => {
                calendar.clear(); // 화면 초기화
                
                const events = data.map(item => ({
                    id: String(item.id),
                    calendarId: item.typeCd || 'personal',
                    title: item.place || '제목없음',
                    start: new Date(item.calStart),
                    end: new Date(item.calEnd),
                    extendedProps: {
                    	calStart: item.calStart,
                        calEnd: item.calEnd,
                        calText: item.calText,
                        typeCd: item.typeCd,
                        sharingCd: item.sharingCd,
                        stateCd: item.stateCd,
                        memId: item.memId
                    } 
                }));
                calendar.createEvents(events);
            })
            .catch(() => {
                // 개발 중 샘플 데이터
            	calendar.createEvents([
                    { id: '1', calendarId: 'company', title: '총무팀 회의 00관련', start: new Date(), end: new Date(Date.now() + 7200000) },
                    { id: '2', calendarId: 'personal', title: '어버이날 5', start: new Date(Date.now() - 86400000), end: new Date(Date.now() - 82800000) },
                ]);
            });
    }
    loadEvents();

    // 일정 유형 필터
    function filterEvents() {
        const typeCd = document.getElementById('typeCd').value;
        loadEvents(typeCd);
    }

    // 일정검색
    function searchEvents() {
        const keyword = document.getElementById('searchInput').value.trim();
        const typeCd = document.getElementById('typeCd').value;
        if (!keyword) { showAlert('검색어를 입력해 주세요.'); return; }
        fetch(`/calender/search?keyword=${keyword}&typeCd=${typeCd}`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) { 
					showAlert('검색 결과가 없습니다.'); 
                    return; 
                }
                const item = data[0];
                document.getElementById('res_date').textContent = item.calStart?.split('T')[0] || '';
                document.getElementById('res_time').textContent = `${item.calStart} ~ ${item.calEnd}`;
                document.getElementById('res_place').textContent = item.place || '';
                document.getElementById('res_calText').textContent = item.calText || '';
                document.getElementById('res_typeCd').textContent = item.typeCd || '';
                document.getElementById('res_sharing').textContent = item.sharingCd || '';
                document.getElementById('res_state').textContent = item.stateCd || '';
                openModal('resultModalOverlay');
            });
    }


    // 일정 클릭 → 수정 모달
   calendar.on('clickEvent', ({event}) => {
	   const p = event.extendedProps || {};
	   
	 /*   
	   document.getElementById('upd_id').value = event.id;
	   document.getElementById('upd_place').value = event.title || '';
	   document.getElementById('upd_calText').value = p.calText || '';
	   document.getElementById('upd_typeCd').value = p.typeCd || '';
 */
        // 날짜 형태로 바꿔서 띄우기 
        const parseDate = (val) => {
		 if(!val) return '';
		 return new Date(String(val).replace(' ', 'T'));
	
        };
        
        const start = parseDate(p.calStart);
        const end = parseDate(p.calEnd);
        
        // 시작날짜 종료날짜 세팅   
        if(start) {
        	const yyyy = start.getFullYear();
            const MM = String(start.getMonth() + 1).padStart(2, '0');
            const dd = String(start.getDate()).padStart(2, '0');
            const HH = String(start.getHours()).padStart(2, '0');
            const mm = String(start.getMinutes()).padStart(2, '0');
            document.getElementById('upd_startDate').value = `${yyyy}-${MM}-${dd}`;
            document.getElementById('upd_calStart').value = `${HH}:${mm}:00`;
        }
        
        if(end) {
        	   const yyyy = end.getFullYear();
               const MM = String(end.getMonth() + 1).padStart(2, '0');
               const dd = String(end.getDate()).padStart(2, '0');
               const HH = String(end.getHours()).padStart(2, '0');
               const mm = String(end.getMinutes()).padStart(2, '0');
               document.getElementById('upd_endDate').value = `${yyyy}-${MM}-${dd}`;
               document.getElementById('upd_calEnd').value = `${HH}:${mm}:00`;
        }
        
        openModal('updateModalOverlay');
    });
    // 등록
    function insertEvent() {
        const place = document.getElementById('ins_place').value.trim();
        const calText = document.getElementById('ins_calText').value.trim();
        const typeCd = document.getElementById('ins_typeCd').value;
        
        // 시작/종료시간 드롭 박스에서 선택 한 날짜 가져오기 
        const startDate = document.getElementById('ins_startDate').value;
        const endDate = document.getElementById('ins_endDate').value;
        const startTime = document.getElementById('ins_calStart').value;
        const endTime = document.getElementById('ins_calEnd').value;
		const sharingCd = document.querySelector('input[name="sharingCd"]').value;
        // 등록 시 시간 표시 (선택한 날짜 + 시간)
        const calStart = `${startDate} ${startTime}`;
        const calEnd = `${endDate} ${endTime}`;

       
        
        if (!place || !typeCd || !calStart || !calEnd) {
            showAlert('필수값 모두 입력해 주세요');
            return;
        }
 
        // 등록 시 입력 받은 데이터 하나로 묶기 
        const sendParams = `place=${encodeURIComponent(place)}`
            + `&calText=${encodeURIComponent(calText)}`
            + `&typeCd=${typeCd}`
            + `&calStart=${calStart}`
            + `&calEnd=${calEnd}`
            + `&sharingCd=${sharingCd}`;

            fetch('/calender/insert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: sendParams
        })
        .then(res => res.text())
        .then(() => {
            closeModal('insertModalOverlay');
            showAlert('등록이 완료 되었습니다');
            loadEvents();
        });
    }
    
    
    // 등록 시 공유여부 설정 부분 
    
	document.getElementById('ins_typeCd').addEventListener('change', function() {
   		const selectBox = this.value;
   		
   	    // 라디오 버튼 활성화(초기화) 
   	    const radios = document.getElementsByName('sharingCd');
   	    
   	    // 선택 값에 따라 특정 라디오버튼 비활성화 
   	    // 개인일정 선택 시 => 나만보기, 전체공유 둘다 보이기 
   	    // 그룹일정, 회사일정 선택 시 => 전체공유만 활성화 나만보기 비활성화 
   	    
   	    // 1. 개인일정 => 나만보기, 전체공유 둘다 보기
   	    if(selectBox == 'personal') {
   	        document.getElementById('ins_sharingMe').disabled = false;
   	        document.getElementById('ins_sharingAll').disabled = false;
		} else if (selectBox == 'group'|| selectBox == 'company') {
			document.getElementById('ins_sharingAll').disabled = false;
		}

	});

    // 시작/종료 

    // 일정수정
    function updateEvent() {

    	const id = document.getElementById('upd_id').value;
    	const place = document.getElementById('upd_place').value.trim();
    	const calText = document.getElementById('upd_calText').value.trim();
    	const typeCd = document.getElementById('upd_typeCd').value;
    	const startDate = document.getElementById('upd_startDate').value;
    	const endDate = document.getElementById('upd_endDate').value;  
    	const startTime = document.getElementById('upd_calStart').value;
    	const endTime = document.getElementById('upd_calEnd').value;
    	const calStart = `${startDate} ${startTime}`;
    	const calEnd = `${endDate} ${endTime}`;  
        
        if(!id || !place || !calStart || !calEnd) {
			showAlert('내용을 모두 입력해주세요')
			return;
        }
        
        
 
        fetch('/calender/update', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `id=${id}&place=${encodeURIComponent(place)}&calText=${encodeURIComponent(calText)}&typeCd=${typeCd}&calStart=${encodeURIComponent(calStart)}&calEnd=${encodeURIComponent(calEnd)}`
        })
        .then(res => res.text())
        .then(() => {
            closeModal('updateModalOverlay');
            loadEvents();
            showAlert('변경이 완료 되었습니다');
        });
    }

    // 삭제 확인
    function confirmDelete() {
        closeModal('updateModalOverlay');
        openModal('deleteConfirmOverlay');
    }

    // 삭제 실행
    function deleteEvent() {
        const id = document.getElementById('upd_id').value;
        fetch('/calender/delete', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `id=${id}`
        })
        .then(res => res.text())
        .then(() => {
            closeModal('deleteConfirmOverlay');
            showAlert('일정이 삭제 되었습니다');
            loadEvents();
        });
    }

    // 모달 열기/닫기
    function openModal(id) {
        new bootstrap.Modal(document.getElementById(id)).show();
    }
    
    function closeModal(modalId) {
    	// 1. 해당 ID를 가진 HTML 요소를 찾습니다.
        const modalElement = document.getElementById(modalId);
        
        // 2. 부트스트랩 모달 인스턴스를 가져옵니다.
        const modalInstance = bootstrap.Modal.getOrCreateInstance(modalElement);
        
        // 3. 인스턴스가 존재하면 닫습니다.
        if (modalInstance) {
            modalInstance.hide();
        }
    }

    // 안내 메시지
    function showAlert(msg) {
        document.getElementById('alertMsg').textContent = msg;
        openModal('alertModalOverlay');
    }
     </script>
  </div>
</body>
</html>
