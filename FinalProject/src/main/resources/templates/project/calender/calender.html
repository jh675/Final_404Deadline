<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캘린더</title>


<link rel="stylesheet"
	href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />

<style>
.toolbar {
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 12px 16px;
	flex-wrap: wrap;
}

.view-group {
	display: flex;
	border: 1px solid #dee2e6;
	border-radius: 6px;
	overflow: hidden;
}

.view-btn {
	padding: 6px 14px;
	font-size: 13px;
	border: none;
	background: transparent;
	color: #6c757d;
	cursor: pointer;
}

.view-btn.active {
	background: #185FA5;
	color: #fff;
}

.view-btn:hover:not(.active) {
	background: #f8f9fa;
}

.nav-area {
	display: flex;
	align-items: center;
	gap: 6px;
}

.nav-btn {
	width: 30px;
	height: 30px;
	border: 1px solid #dee2e6;
	border-radius: 6px;
	background: transparent;
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
}

.nav-btn:hover {
	background: #f8f9fa;
}

.current-date {
	font-size: 14px;
	font-weight: 500;
	min-width: 80px;
	text-align: center;
}

.search-area {
	display: flex;
	align-items: center;
	gap: 6px;
	margin-left: auto;
}

.filter-select, .search-input {
	height: 34px;
	font-size: 13px;
	border: 1px solid #dee2e6;
	border-radius: 6px;
	padding: 0 10px;
}

.search-input {
	width: 180px;
}

.search-btn {
	height: 34px;
	padding: 0 14px;
	font-size: 13px;
	background: #185FA5;
	color: #fff;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	display: flex;
	align-items: center;
	gap: 5px;
}

.search-btn:hover {
	background: #0C447C;
}

.form-row {
	display: flex;
	align-items: center;
	gap: 8px;
	margin-bottom: 12px;
	flex-wrap: wrap;
}

.toastui-calendar-daygrid-cell.holiday .toastui-calendar-date {
	color: #ff4d4d !important;
}

.toastui-calendar-more-events {
	font-size: 0 !important;
}

.toastui-calendar-weekday-grid-more-events {
	font-size: 0 !important;
	display: block;
	text-align: left;
}

.toastui-calendar-weekday-grid-more-events::before {
	content: '+일정 더보기';
	font-size: 11px;
	color: #333;
	display: block;
	text-align: left;
}

.toastui-calendar-see-more-container {
	height: 200px !important;
}
</style>


</head>
<body>
	<div layout:fragment="content">

		<div class="calendar-wrapper">
			<div
				class="d-flex align-items-center gap-2 p-3 border rounded-3 mb-3 bg-white">
				<div class="btn-group" role="group">
					<button type="button"

						id="searchInput" placeholder="검색어를 입력해주세요." style="width: 180px;">
					<button type="button" class="btn btn-primary btn-sm"
						onclick="searchEvents()">검색</button>

			<div id="calendar" style="height: 500px"></div>
		</div>
		<!-- calendar-wrapper 끝 -->

		<!-- ===== 일정 등록 모달 ===== -->

					</div>

							</div>

									id="ins_endDate" class="form-control" min="">

						<!-- 시간 선택 -->
						<div class="form-row">
							<label class="form-label mb-0">시작시간</label> <select
								class="form-select" id="ins_calStart" style="width: auto;">
								<option value="">선택</option>
								<option value="09:00:00">오전 09:00</option>
								<option value="09:15:00">오전 09:15</option>

								<option value="11:00:00">오전 11:00</option>
								<option value="12:00:00">오후 12:00</option>
								<option value="13:00:00">오후 01:00</option>
								<option value="14:00:00">오후 02:00</option>
								<option value="15:00:00">오후 03:00</option>
								<option value="16:00:00">오후 04:00</option>
								<option value="17:00:00">오후 05:00</option>

							</select> <label class="form-label mb-0 ms-2">종료시간</label> <select
								class="form-select" id="ins_calEnd" style="width: auto;">
								<option value="">선택</option>
								<option value="09:00:00">오전 09:00</option>
								<option value="09:15:00">오전 09:15</option>
								<option value="09:30:00">오전 09:30</option>
								<option value="10:00:00">오전 10:00</option>
								<option value="10:15:00">오전 10:15</option>
								<option value="10:30:00">오전 10:30</option>
								<option value="11:00:00">오전 11:00</option>
								<option value="12:00:00">오후 12:00</option>

								<option value="14:00:00">오후 02:00</option>

						<!-- 공유 유형 + 공유여부 한 줄 -->

								style="width: auto;">
								<option value="">선택</option>

								<option value="02CALDETAIL">행사</option>

		<div th:replace="~{project/calender/modal/calenderAdd}"></div>

		<script
			src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>
		<script th:inline="javascript">

	//=========================================================================================
	// 1. 캘린더 기본 설정 부분
	//=========================================================================================	    
	
    const Calendar = tui.Calendar;
	
    const calendar = new Calendar('#calendar', {
        defaultView: 'month',
        language: 'ko',
        useFormPopup: false,   
        useDetailPopup: false,
        
        week: {
		  dayNames: ['일', '월', '화', '수', '목', '금', '토'],
        },
        month: {
		  dayNames: ['일', '월', '화', '수', '목', '금', '토'],
		  visibleEventCount: 5,
        },
        calendars: [
        	{ id: 'holiday', name: '공휴일', color: '#fff', backgroundColor: '#ff4d4d', borderColor: '#ff4d4d' },
            { id: 'personal', name: '개인일정', color: '#fff', backgroundColor: '#ff6b6b', borderColor: '#ff6b6b' },
            { id: 'group',    name: '그룹일정', color: '#fff', backgroundColor: '#51cf66', borderColor: '#51cf66' },
            { id: 'company',  name: '회사일정', color: '#fff', backgroundColor: '#339af0', borderColor: '#339af0' },
        ],
        template: {
            time(event) {
                return `<span>${event.title}</span>`;
            }     
        }
    });

	//=========================================================================================
	// 2. 서버에서 일정 불러오기
	//=========================================================================================   
    
			// 종료일 하루 추가 
	
		function addDay(dateStr) {
			const day = new Date(dateStr);
			day.setDate(day.getDate() + 1);
			return day.toISOString().split('T')[0];
		
		}
		function loadEvents(typeCd = '') {
    	csrfFetch(`/calendar/listJson?typeCd=${typeCd}`, { 
            headers: { 'X-Requested-With': 'XMLHttpRequest' } 
        })
        .then(res => res.json())
        .then(data => {
            calendar.clear(); // 캘린더 초기화 
            
            const events = data.map(item => ({
                id: String(item.id),
                calendarId: item.typeCd === '01CALTYPE' ? 'personal' 
                          : item.typeCd === '02CALTYPE' ? 'group' 
                          : item.typeCd === '03CALTYPE' ? 'company' : 'personal',
                title: item.calText || '제목없음',
                start: item.calStart.replace('T', ' ').split('.')[0],          
                end: item.calEnd.replace('T', ' ').split('.')[0],
                extendedProps: {
                    calStart: item.calStart,
                    calEnd: item.calEnd,
                    calText: item.calText,
                    typeCd: item.typeCd,
                    sharingCd: item.sharingCd,
                    stateCd: item.stateCd,
                    memId: item.memId,
                    calType: item.calType,          
                    colorTagCd: item.colorTagCd     
                } 
            }));
            calendar.createEvents(events);
            
            // 캘린더에 공휴일 일정 불러오기 
            return loadHoliday(calendar.getDate().getFullYear());
 
        });
    }
    

	//=========================================================================================
	// 3. 등록기능 
	//========================================================================================= 
	
    // 1) 날짜/시간 클릭 시 등록 모달 띄우기
    calendar.on('selectDateTime', (event) => {

    	// 일정 클릭 시 등록 모달창 나오는 부분 수정 
    	if(event.event) return;

    	// 일정 등록 시 날짜 가져오는 부분 
    	const startDate = event.start;
    	const year = startDate.getFullYear();
    	const month = String(startDate.getMonth() + 1).padStart(2, '0');
    	const day = String(startDate.getDate()).padStart(2, '0');
    	const formattedDate = `${year}-${month}-${day}`;
    	
    	// 날짜 선택 드롭 박스 
    	document.getElementById('ins_selectedStartDate').value = formattedDate;
    	document.getElementById('ins_selectedEndDate').value = formattedDate;
    	document.getElementById('ins_calStart').value = '';
    	document.getElementById('ins_calEnd').value = '';

    	// 입력폼 초기화 + 등록 모달창에 시작날짜 넣기 
        document.getElementById('ins_place').value = '';
        document.getElementById('ins_calText').value = '';
        document.getElementById('ins_typeCd').value = '';
        
        // 시작날짜에 값 넣기 + 시작일 변경 불가 설정 부분 (읽기전용)
        const startInput = document.getElementById('ins_startDate');
        if(startInput) {
	      startInput.value = formattedDate;
	      // 사용자 날짜 변경 방지 
	      startInput.readOnly = true; 
        }
        
        // 종료날짜에 값 넣기
        const endInput = document.getElementById('ins_endDate');
        if(endInput) {
		  endInput.value = formattedDate;
        }
        
        // 개인일정 선택 시 (공유여부 선택)체크박스 나타나게하기 
        const checkBox = document.getElementById('sharingCd');
        if(checkBox) checkBox.classList.add('d-none');

        // 부트스트랩 모달 인스턴스 생성 및 표시
        openModal('insertModalOverlay');
        
    });

    
    
    // 2) 등록 시 공유여부 설정 부분    
	document.getElementById('ins_typeCd').addEventListener('change', function() {
   		const selectBox = this.value;
   		
   	    // 라디오 버튼 활성화(초기화) 
   	    const radios = document.getElementsByName('sharingCd');
   	    
   	    // 선택 값에 따라 특정 라디오버튼 비활성화 
   	    // 개인일정 선택 시 => 나만보기, 전체공유 둘다 보이기 
   	    // 그룹일정, 회사일정 선택 시 => 전체공유만 활성화 나만보기 비활성화 
   	    
   	    // 1. 개인일정 => 나만보기, 전체공유 둘다 보기
   	    if(selectBox == '01CALTYPE') {
   	        document.getElementById('ins_sharingMe').disabled = false;
   	        document.getElementById('ins_sharingAll').disabled = false;
		} else if (selectBox == '02CALTYPE'|| selectBox == '03CALTYPE') {
			document.getElementById('ins_sharingAll').disabled = false;
		}

	});    
    
	// 등록 모달 닫힐 때 캘린더 선택 영역 초기화
	document.getElementById('insertModalOverlay').addEventListener('hidden.bs.modal', function() {
	    calendar.clearGridSelections();
	});

    
    // 3) 일정 등록
    function insertEvent() {
        const place = document.getElementById('ins_place').value.trim();
        const calText = document.getElementById('ins_calText').value.trim();
        const typeCd = document.getElementById('ins_typeCd').value;
        const calType = document.getElementById('ins_calType').value;

        // 시작/종료시간 드롭 박스에서 선택 한 날짜 가져오기 
        const startDate = document.getElementById('ins_startDate').value;
        const endDate = document.getElementById('ins_endDate').value;
        const startTime = document.getElementById('ins_calStart').value || '09:00:00';
        const endTime = document.getElementById('ins_calEnd').value || '18:00:00';
		const checkedRadio = document.querySelector('input[name="sharingCd"]:checked');
        const sharingCd = checkedRadio ? checkedRadio.value : '02CALSHARE';
        // 등록 시 시간 표시 (선택한 날짜 + 시간)
        const calStart = `${startDate} ${startTime}`;
        const calEnd = `${endDate} ${endTime}`;

       
        // 일정 유형에 따라 색상 지정 부분 
        const colortag = {

			'01CALTYPE': '01COLOR',  // 개인 → 핑크
			'02CALTYPE': '02COLOR',  // 그룹 → 초록
			'03CALTYPE': '03COLOR'   // 회사 → 파랑
        } 
        
        const colorTagCd = colortag[typeCd] || '';
 
        // 필수값 모두 입력 안내 
        if (!place || !typeCd || !calStart || !calEnd) {
            showAlert('필수값 모두 입력해 주세요');
            return;
        }
 
        // 등록 시 입력 받은 데이터 하나로 묶기 
        const sendParams = `place=${encodeURIComponent(place)}`
            + `&calText=${encodeURIComponent(calText)}`
            + `&typeCd=${typeCd}`
            + `&calType=${calType}`
            + `&colorTagCd=${colorTagCd}`
            + `&calStart=${encodeURIComponent(calStart)}`
            + `&calEnd=${encodeURIComponent(calEnd)}`
            + `&sharingCd=${sharingCd}`;

            csrfFetch('/calendar/insert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: sendParams
        })
        .then(res => res.text())
        .then(() => {
            closeModal('insertModalOverlay');
            showAlert('등록이 완료 되었습니다');
            loadEvents();
        });
    }

  

	//=========================================================================================
	// 4. 수정기능 
	//========================================================================================= 
	
   // 💡 [독립 선언] 타임존 영향 없이 문자열을 순수하게 쪼개주는 안전한 함수
	function parseDateTimeString(rawDateTime) {
	    if (!rawDateTime) return null;
	    
	    // "T" 분리 및 밀리초(.0) 제거 후 공백 기준 분리
	  	let cleanStr = rawDateTime
        .replace(/\+09:00$/, '')   // 뒤에 +09:00 제거
        .replace(/\.000$/, '')      // .000 제거
        .replace('T', ' ')          // T를 공백으로
        .trim();
	    let parts = cleanStr.split(' '); // 예: ['2026-05-06', '18:00:00']
	    
	    if (parts.length < 2) return null;
	    
	    let datePart = parts[0]; // "YYYY-MM-DD"
	    let timePart = parts[1]; // "HH:mm:ss"
	    
	    // 초 단위가 누락되었다면 ":00" 보정
	    let timeTokens = timePart.split(':');
	    if (timeTokens.length === 2) {
	        timePart = `${timePart}:00`;
	    }
	    
	    return { date: datePart, time: timePart };
	}

	// 💡 [독립 선언] 드롭다운 옵션 검사 및 동적 추가 함수 (ReferenceError 완전 방지)
	function matchOrAddOption(selectElement, timeValue) {
	    if (!selectElement || !timeValue) return;
	    
	    // select 박스에 이미 해당 시간 value가 있는지 검사
	    let exists = Array.from(selectElement.options).some(option => option.value === timeValue);
	    
	    // 일치하는 옵션이 없으면 새로 맹글어서 넣어줌 (빈칸 방지)
	    if (!exists) {
	        const timeParts = timeValue.split(':');
	        const hour = parseInt(timeParts[0]);
	        const min = timeParts[1];
	        const ampm = hour >= 12 ? '오후' : '오전';
	        const displayHour = hour % 12 === 0 ? 12 : hour % 12;
	        const displayHourStr = String(displayHour).padStart(2, '0');
	        
	        const optionText = `${ampm} ${displayHourStr}:${min}`;
	        const newOption = new Option(optionText, timeValue);
	        selectElement.add(newOption);
	    }
	    
	    // 값 강제 세팅
	    selectElement.value = timeValue;
	}
	


    // 1) 일정 클릭 시 수정 모달 띄우기
    calendar.on('clickEvent', ({event}) => {
        if(event.calendarId == 'holiday') return;
        
        if (event && event.id) {
            getEventDetail(event.id);
        }
    });

    // 2) 서버에서 수정 할 일정 불러오기 및 폼 입력 매핑
    function getEventDetail(id) {
        // 모달 열기
        openModal('updateModalOverlay');        
        
        fetch(`/calendar/detail?id=${id}`, {
            method: 'GET',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(res => {
            if (!res.ok) throw new Error('단건 조회 실패');
            return res.json();
        })
        .then(data => {
            // 기본 텍스트 바인딩
            document.getElementById('upd_id').value = data.id || '';
            document.getElementById('upd_place').value = data.place || ''; 
            document.getElementById('upd_calText').value = data.calText || '';
            
            
            // 전체 공유 시 본인 일정 아닌 경우 삭제/수정 안되게 
             const loginMemId = /*[[${#authentication.principal.id}]]*/ null;
			 const deleteBtn = document.querySelector('#updateModalOverlay .btn-danger');
			 const updateBtn = document.querySelector('#updateModalOverlay .btn-primary');
			
			    if (data.memId != loginMemId) {
			        // 타인 일정 → 삭제/수정 버튼 숨기기
			        if (deleteBtn) deleteBtn.style.display = 'none';
			        if (updateBtn) updateBtn.style.display = 'none';
			    } else {
			        // 본인 일정 → 삭제/수정 버튼 보이기
			        if (deleteBtn) deleteBtn.style.display = '';
			        if (updateBtn) updateBtn.style.display = '';
			    }
            
            // 공유유형
            if (data.typeCd) {
                const typeSelect = document.getElementById('upd_typeCd');
                if (typeSelect) typeSelect.value = data.typeCd;
            }
            
            // 일정유형 
            if(data.calType) {
                const calType = document.getElementById('upd_calType');
                if (calType) calType.value = data.calType;
            }
            
            // 공유여부
            if (data.sharingCd) {
                const radioBtn = document.querySelector(`input[name="upd_sharingCd"][value="${data.sharingCd}"]`);
                if (radioBtn) radioBtn.checked = true;
            }

            // 시작 날짜 및 시간 처리 (순수 문자열 파싱 함수 호출)
            if (data.calStart) {
                const startData = parseDateTimeString(data.calStart);
                if (startData) {
                    document.getElementById('upd_startDate').value = startData.date;
                    matchOrAddOption(document.getElementById('upd_calStart'), startData.time);
                }
            }
            
            // 종료 날짜 및 시간 처리 (순수 문자열 파싱 함수 호출)
            if (data.calEnd) {
                const endData = parseDateTimeString(data.calEnd);
                if (endData) {
                    document.getElementById('upd_endDate').value = endData.date;
                    matchOrAddOption(document.getElementById('upd_calEnd'), endData.time);
                }
            }
        })
        .catch(err => {
            console.error(err);
            showAlert('일정 데이터를 불러오는 중 오류가 발생했습니다.');
        });
    }
  
    // 3) 수정 처리 
    function updateEvent() {
        const id = document.getElementById('upd_id').value;
        const place = document.getElementById('upd_place').value.trim();
        const calText = document.getElementById('upd_calText').value.trim();
        const typeCd = document.getElementById('upd_typeCd').value;
        const calType = document.getElementById('upd_calType').value;
        
        const startDate = document.getElementById('upd_startDate').value;
        const endDate = document.getElementById('upd_endDate').value;  
        const startTime = document.getElementById('upd_calStart').value; 
        const endTime = document.getElementById('upd_calEnd').value;     
        
        const checkedRadio = document.querySelector('input[name="upd_sharingCd"]:checked');
        const sharingCd = checkedRadio ? checkedRadio.value : ''; 
        
        if(!id || !place || !startDate || !endDate || !startTime || !endTime || !typeCd ||!calType) {
            showAlert('내용을 모두 입력해주세요(일정 유형 및 시/분 선택 포함)');
            return;
        }
    
        const finalStart = startTime.split(':').length === 2 ? `${startTime}:00` : startTime;
        const finalEnd = endTime.split(':').length === 2 ? `${endTime}:00` : endTime;
    
        const calStart = `${startDate} ${finalStart}`;  
        const calEnd = `${endDate} ${finalEnd}`;
    
        csrfFetch('/calendar/update', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `id=${id}&place=${encodeURIComponent(place)}&calText=${encodeURIComponent(calText)}&typeCd=${typeCd}&calType=${calType}&calStart=${encodeURIComponent(calStart)}&calEnd=${encodeURIComponent(calEnd)}&sharingCd=${sharingCd}`
        })
        .then(res => {
            if(!res.ok) throw new Error('수정 처리 실패');
            return res.text();
        })
        .then(() => {
            closeModal('updateModalOverlay');
            showAlert('변경이 완료 되었습니다');
            loadEvents(); 
        })
        .catch(err => {
            console.error(err);
            showAlert('수정 처리 실패 (서버 에러)');
        });
    }
	//=========================================================================================
	// 5. 일정 삭제
	//=========================================================================================    
		function deleteEvent() {
		    const id = document.getElementById('upd_id').value;
		
		    if (!id) {
		        showAlert('삭제할 일정의 식별자(ID)가 없습니다.');
		        return;
		    }
		
		    csrfFetch('/calendar/delete', {
		        method: 'DELETE',
		        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
		        body: `id=${id}`
		    })
		    .then(res => {
		        if(!res.ok) {
		            return csrfFetch('/calendar/delete', {
		                method: 'POST',
		                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
		                body: `id=${id}`
		            }).then(res => res.text());
		        }
		        return res.text();
		    })
		    .then(() => {
		    	  setTimeout(() => {
		    	        // 모든 모달 강제 닫기
		    	        document.querySelectorAll('.modal').forEach(modal => {
		    	            const instance = bootstrap.Modal.getInstance(modal);
		    	            if (instance) instance.hide();
		    	            modal.classList.remove('show');
		    	            modal.style.display = 'none';
		    	            modal.setAttribute('aria-hidden', 'true');
		    	            modal.removeAttribute('aria-modal');
		    	        });
		    	        // backdrop 강제 제거
		    	        document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
		    	        document.body.classList.remove('modal-open');
		    	        document.body.style.removeProperty('padding-right');

		    	        showAlert('일정이 삭제되었습니다.');
		    	        loadEvents();
		    	    }, 400);
		    })
		    .catch(err => {
		        console.error(err);
		        showAlert('삭제 처리 중 오류가 발생했습니다.');
		    });
		}
    
    
	//=========================================================================================
	// 6. 일정 검색 부분 
	//=========================================================================================
    function searchEvents() {
        const keyword = document.getElementById('searchInput').value.trim();
        const typeCd = document.getElementById('typeCd').value;
        
        if (!keyword) { showAlert('검색어를 입력해 주세요.');
			 return;
		}
        
        csrfFetch(`/calendar/search?keyword=${keyword}&typeCd=${typeCd}`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(res => res.json())
        .then(data => {
          	console.log('검색 결과:', data);
            if (!data || data.length === 0) { 
				showAlert('검색 결과가 없습니다.'); 
				return; 
            }
             
              // 검색 결과 목록 동적 생성
              const list = document.getElementById('searchResultList');
              list.innerHTML = '';  // 초기화

              data.forEach(item => {
                  const start = item.calStart ? item.calStart.split('T')[0] : '';
                  const end = item.calEnd ? item.calEnd.split('T')[0] : '';

                  const card = `
                	    <div class="card mb-2">
                	        <div class="card-body">
                	            <h6 class="card-title fw-bold">${item.calText || '제목없음'}</h6>
                	            <p class="card-text mb-1">
                	                <small class="text-muted">날짜: ${start} ~ ${end}</small>
                	            </p>
                	            <p class="card-text mb-1">일정 장소: ${item.place || '장소없음'}</p>
                	            <p class="card-text mb-1">일정 내용: ${item.calText || '-'}</p>
                	            <p class="card-text mb-0">
                	                <span class="badge bg-primary">${
                	                    item.typeCd === '01CALTYPE' ? '개인일정' :
                	                    item.typeCd === '02CALTYPE' ? '그룹일정' :
                	                    item.typeCd === '03CALTYPE' ? '회사일정' : item.typeCd
                	                }</span>
                	                <span class="badge bg-secondary">${
                	                    item.sharingCd === '01CALSHARE' ? '전체공유' :
                	                    item.sharingCd === '02CALSHARE' ? '나만보기' : item.sharingCd
                	                }</span>
                	            </p>
                	        </div>
                	    </div>
                	`;
                  list.innerHTML += card;
              });
             
              openModal('resultModalOverlay');
          });
        
    }

	//=========================================================================================
	// 7. 모달창 제어 부분
	//=========================================================================================	
		
    // 1) 모달 열기
    function openModal(id) {
       const el = document.getElementById(id);
       const modal = bootstrap.Modal.getOrCreateInstance(el);
       modal.show();
    }
       
       
    // 2) 모달 닫기
	function closeModal(modalId) {
		// 1. 해당 ID를 가진 HTML 요소를 찾습니다.
	    const modalElement = document.getElementById(modalId);
		if (!modalElement) return;

	    try {
	    // 2. 부트스트랩 모달 인스턴스를 가져옵니다.
	    const modalInstance = bootstrap.Modal.getOrCreateInstance(modalElement);
	    modalInstance.hide();

	    // 모달창 뒤 배경 제거 
	    
	    modalElement.addEventListener('hidden.bs.modal', function handler() {
	        // 열린 모달이 없을 때만 backdrop 제거
	        const openModals = document.querySelectorAll('.modal.show');
	        if (openModals.length === 0) {
	            document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
	                backdrop.remove();
	            });
	            document.body.classList.remove('modal-open');
	            document.body.style.removeProperty('padding-right');
	        }
	        // 이벤트 리스너 한번만 실행 후 제거
	        modalElement.removeEventListener('hidden.bs.modal', handler);
	    });
	  } catch(e) {
		 console.error('모달 닫기 오류: ', e);
	  }
	    
	}
 
	// 3) 일정 등록, 수정, 삭제 시 안내 매세지 모달창 
		function showAlert(msg) {
	    const alertTarget = document.getElementById('alertMsg');
	    
	    if (alertTarget) {
	        // 태그가 정상적으로 존재하면 모달창 텍스트 세팅 후 모달 오픈
	        alertTarget.textContent = msg;
	        
	        // 프로젝트에서 사용하는 부트스트랩 모달 오픈 방식 적용
	        // 예: openModal('alertModalOverlay'); 또는 새 부트스트랩 인스턴스 생성
	        const alertModal = new bootstrap.Modal(document.getElementById('alertModalOverlay'));
	        alertModal.show();
	    } else {
	        // [안전 장치] 만약 HTML 구조 문제로 alertMsg를 못 찾으면 기본 브라우저 알림창을 띄웁니다.
	        alert(msg);
	    }
	}
       

    // 4) 일정 삭제 시 확인 모달창  
    function confirmDelete() {
    // closeModal 대신 그냥 숨기기만 하고 backdrop은 유지
    const updateModal = bootstrap.Modal.getInstance(document.getElementById('updateModalOverlay'));
    if (updateModal) updateModal.hide();
    
    // 수정 모달 닫힌 후 삭제 확인 모달 열기
    document.getElementById('updateModalOverlay').addEventListener('hidden.bs.modal', function handler() {
        document.getElementById('updateModalOverlay').removeEventListener('hidden.bs.modal', handler);
        openModal('deleteConfirmOverlay');
    });
}
    
    
    //=========================================================================================
    // 8. 공휴일 불러오기
	//=========================================================================================	

	  function loadHoliday(year) {
		
    	csrfFetch(`/holiday/list?year=${year}`, {
    		 headers: { 'X-Requested-With': 'XMLHttpRequest' }   	
    	})
    	.then(res => res.json())
    	.then(data => {

		  const holiday = data.map(h => ({
				id: 'holiday_' + h.id,
				calendarId: 'holiday',
				title: h.holidayName,
				start: `${h.year}-${String(h.month).padStart(2,'0')}-${String(h.day).padStart(2,'0')}`,
	            end:   `${h.year}-${String(h.month).padStart(2,'0')}-${String(h.day).padStart(2,'0')}`,
	            isAllday:true,
	            category: 'allday',
	            isReadOnly: true,
	            color: '#ff4d4d',            
	            backgroundColor: 'transparent', 
	            borderColor: 'transparent'   
		  }));
    		calendar.createEvents(holiday);
    	});
    	
      }

	//=========================================================================================
	//9. 기타 함수 
	//=========================================================================================	
	
    // 날짜 표시 업데이트
    function updateDateLabel() {
        const date = calendar.getDate();
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        document.getElementById('currentDate').textContent = `${year}년 ${month}월`;
    }
	
    
    // 뷰 전환
    function changeView(view) {
        calendar.changeView(view);
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        const map = { month: 0, week: 1, day: 2 };
        document.querySelectorAll('.view-btn')[map[view]].classList.add('active');
        updateDateLabel();
        loadEvents();
    }



    // 일정 유형 필터
    function filterEvents() {
        const typeCd = document.getElementById('typeCd').value;
        loadEvents(typeCd);
    }
    
 
	
	
	//=========================================================================================
	// 10. 초기화
	//=========================================================================================	    
    loadEvents();        // 데이터 로드
    updateDateLabel();
    
           
     </script>
