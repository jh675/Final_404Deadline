<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>문서목록</title>
<style>
.tui-grid-cell-content .doc-title, .doc-title {
	cursor: pointer !important;
	text-decoration: none;
	color: #212529;
	font-weight: 500;
}

.tui-grid-cell-content .doc-title:hover, .doc-title:hover {
	color: #0d6efd;
	text-decoration: underline;
}
</style>
<link rel="stylesheet"
	href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<script
	src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
</head>
<body>
	<div layout:fragment="content">

		<div id="grid"></div>

		<script th:inline="javascript">
		const docsData = /*[[${list}]]*/ [];
		// Thymeleaf를 이용해 권한 여부를 Javascript boolean 변수로 저장
		const hasUpdateRole = /*[[${@prjAuth.hasRole('ROLE_DOCS_UPDATE')}]]*/ false;
		const hasDeleteRole = /*[[${@prjAuth.hasRole('ROLE_DOCS_DELETE')}]]*/ false;
		 
		// 기본 컬럼 배열 세팅 
		const gridColumns = [
			{ 
			    header: '제목', 
			    name: 'title', 
			    width: 150, align:'center', sortable: true,
			    formatter: ({ row, value }) => {
			        return `
			            <a href="javascript:void(0)"
			               class="doc-title"
			               data-id="${row.id}">
			                ${value}
			            </a>
			        `;
			    }
			},
			{ 
				header: '첨부파일', 
				name: 'fileCount', 
				width: 100, 
				align: 'center',
				formatter: ({ row }) => {
				    if (row.fileCount > 0) {
				        return '<span style="font-size: 16px; cursor: default;" title="첨부파일 있음">📎</span>';
				    }
				    return ''; 
				}
			},
			{ header: '작성자', name: 'memName', width: 150, align:'center', sortable: true },
			{ header: '작성일', name: 'createdOn', width: 150, align:'left', sortable: true, formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD HH:mm') }
		];

		// 수정 권한이 있을 경우에만 컬럼 배열에 추가
		if (hasUpdateRole) {
			gridColumns.push({ 
		    	header: '수정',
		    	name: 'edit',
		    	width: 100,
		    	align:'center',
		    	sortable: true,
		    	formatter: ({ row }) => {
		    		return `
		    			<button
		    				class="btn btn-secondary btn-sm "
		    				data-bs-toggle="modal"
		    				data-bs-target="#editModal"
		    				data-id="${row.id}"
		    				data-title="${row.title}"
		    				data-description="${row.description}"
		    				data-prjid="${row.prjId}">
		    				수정
		    			</button>
		    		`;
		    	}
		    });
		}

		// 삭제 권한이 있을 경우에만 컬럼 배열에 추가
		if (hasDeleteRole) {
			gridColumns.push({ 
				header: '삭제',
				name: 'deleteBtn',
				width: 100,
				align:'center',
				sortable: true,
				formatter: ({ row }) => {
					return '<button class="btn btn-danger btn-sm" ' +
					       'data-bs-toggle="modal" ' +
					       'data-bs-target="#deleteModal" ' +
					       'data-id="' + row.id + '">' +
					       '삭제</button>';
				}
			});
		}

		// 그리드 생성
		const grid = new tui.Grid({
			el: document.getElementById('grid'), 
			autowidth: true,
			scrollX: false,
			scrollY: false,
			bodyHeight: 'auto',
			rowHeight: 36,
			minBodyHeight: 100,
			data: docsData,
			
			// 조립된 컬럼 배열을 여기에 넣습니다.
			columns: gridColumns, 
			
			rowHeaders: ['rowNum'],
			pageOptions: {
				useClient: true,
				perPage: 10
			}
		});
		
        grid.on('click', (ev) => {
            const row = grid.getRow(ev.rowKey);
            if (!row) return;

            // [삭제] 기존에 잘 작동하던 삭제 모달 주소 주입 코드는 그대로 유지합니다.
            if (ev.columnName === 'deleteBtn') {
                const buttonEl = ev.nativeEvent.target;
                const docId = buttonEl.getAttribute('data-id');
                if (docId) {
                	document.getElementById('deleteDocId').value = docId;
                }
            }
        });
        
        document.addEventListener('click', function (e) {

            const target = e.target.closest('.doc-title');
            if (!target) return;

            const id = target.getAttribute('data-id');

            const fileListEl = document.getElementById('view-files');
            if (fileListEl) {
                fileListEl.innerHTML = '<li class="text-muted small">첨부파일을 불러오는 중입니다.</li>';
            }

            fetch('/project/docs/detail?id=' + id)
                .then(res => res.json())
                .then(data => {

                    const idEl = document.getElementById('view-id');
                    const titleEl = document.getElementById('view-title');
                    const descEl = document.getElementById('view-description');
                    const memEl = document.getElementById('view-memId');
                    const dateEl = document.getElementById('view-createdOn');

                    if (idEl) idEl.value = data.id;
                    if (titleEl) titleEl.innerText = data.title;
                    if (descEl) descEl.innerText = data.description;
                    if (memEl) memEl.innerText = data.memName;
                    if (dateEl) {
                        dateEl.innerText = data.createdOn
                            ? dateUtils.format(data.createdOn, 'YYYY-MM-DD HH:mm')
                            : '';
                    }

                    const modalEl = document.getElementById('viewModal');
                    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modal.show();

                    return fetch('/project/docs/files?id=' + id);
                })
                .then(res => res && res.json())
                .then(files => {
                    if (!fileListEl) return;

                    fileListEl.innerHTML = '';

                    if (!files || files.length === 0) {
                        fileListEl.innerHTML = '<li class="text-muted small">첨부된 파일이 없습니다.</li>';
                        return;
                    }

                    files.forEach(file => {
                        const fileName = file.fileName || '이름 없음';
                        const sizeKB = file.fileSize ? (file.fileSize / 1024).toFixed(1) : '0.0';

                        const li = document.createElement('li');
                        li.className = 'd-flex align-items-center gap-2 mb-2';
                        li.innerHTML = `
                            <span>📎</span>
                            <a href="/download/${file.id}">${fileName}</a>
                            <span class="text-muted small">(${sizeKB} KB)</span>
                        `;
                        fileListEl.appendChild(li);
                    });
                })
                .catch(err => {
                    console.error('detail fetch 실패:', err);
                    if (fileListEl) {
                        fileListEl.innerHTML = '<li class="text-danger small">첨부파일을 불러오지 못했습니다.</li>';
                    }
                });
        });


</script>
		<div class="d-flex justify-content-end my-3">

			<button class="btn btn-primary" data-bs-toggle="modal" 
				data-bs-target="#registerModal" th:if="${@prjAuth.hasRole('ROLE_DOCS_CREATE')}">등록</button>

		</div>

		<div th:replace="~{project/docs/modal/delete :: deleteModal}"></div>
		<div th:replace="~{project/docs/modal/register :: registerModal}"></div>
		<div th:replace="~{project/docs/modal/edit :: editModal}"></div>
		<div th:replace="~{project/docs/modal/view :: viewModal}"></div>

		<div th:if="${msg != null}" id="successNotify"
			class="alert alert-success shadow"
			style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 25px; border-radius: 8px; font-weight: 600; background-color: #d1e7dd; color: #0f5132; border-color: #badbcc;">
			<span th:text="${msg}">성공 메시지</span>
		</div>

		<script>
		
			// 화면이 로드되고 2.5초 뒤에 알림창을 화면에서 부드럽게 지워버립니다.
			document.addEventListener("DOMContentLoaded", function() {
				const notify = document.getElementById("successNotify");
				if (notify) {
					setTimeout(function() {
						notify.style.transition = "opacity 0.5s ease";
						notify.style.opacity = "0";
						setTimeout(function() { notify.remove(); }, 500); 
					}, 2500);
				}
			});
		</script>

		<script>

			const editModal = document.getElementById('editModal');

				editModal.addEventListener('show.bs.modal', function(event) {

			const button = event.relatedTarget;

				document.getElementById('edit-id').value =
				button.getAttribute('data-id');

				document.getElementById('edit-title').value =
				button.getAttribute('data-title');
				
				document.getElementById('edit-description').value = 
				button.getAttribute('data-description');

				const docId = button.getAttribute('data-id');

				fetch('/project/docs/files?id=' + docId)
					.then(response => response.json())
					.then(files => {

						const fileArea =
							document.getElementById('existing-files');

						fileArea.innerHTML = '';

						if(files.length > 0){

							files.forEach(file => {

								fileArea.innerHTML += `
									<div class="d-flex justify-content-between align-items-center border rounded p-2 mb-2">

										<a href="/download/${file.id}">
											${file.fileName}
										</a>

										<button
											type="button"
											class="btn btn-sm btn-outline-danger delete-file-btn"
											data-file-id="${file.id}">
											삭제
										</button>

									</div>
								`;
							});
						}

			});
				document.getElementById('edit-prjid').value =
				button.getAttribute('data-prjid');
				});
			
				document.addEventListener('click', function(e){

					if(e.target.classList.contains('delete-file-btn')){

						const fileId =
							e.target.getAttribute('data-file-id');

						if(confirm('첨부파일을 삭제하시겠습니까?')){

							fetch('/project/attach/delete?id=' + fileId)
							.then(response => response.text())
							.then(result => {

								if(result === 'success'){

									e.target.closest('.d-flex').remove();
								}
							});
						}
					}
				});

</script>
	</div>
</body>
</html>
