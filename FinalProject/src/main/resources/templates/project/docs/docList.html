<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>문서목록</title>
<link rel="stylesheet"
	href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet"
	href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<script
	src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
</head>
<body>
	<div layout:fragment="content">

		<div id="grid"></div>

		<script th:inline="javascript">
		const docsData = /*[[${list}]]*/ [];
		 
		const grid = new tui.Grid({
			el: document.getElementById('grid'), 
			autowidth: true,
			scrollX: false,        // 가로 스크롤바 숨김
			scrollY: false,        // 세로 스크롤바 숨김 (rowHeight × 행수 만큼 자동 확장)
			bodyHeight: 'auto',    // 본문 높이를 데이터 양에 맞춰 자동 조절
			rowHeight: 36,         // 한 행의 높이(px)
			minBodyHeight: 100,    // 데이터 0건일 때 최소 높이(px)

			data: docsData,
			columns: [
				    { header: '제목', 
					  name: 'title', 
					  width: 150, align:'center', sortable: true,
					  formatter: ({ row, value }) => {

							return `
								<a href="/project/docs/form?id=${row.id}">
									${value}
								</a>
							`;
						}},
						{ header: '첨부파일', 
							  name: 'fileCount', 
							  width: 100, 
							  align: 'center',
							  formatter: ({ row }) => {
							      // 마이바티스 selectAll 쿼리에서 새로 생성한 file_count(자바 필드명 fileCount) 값을 검사합니다.
							      if (row.fileCount > 0) {
							          return '<span style="font-size: 16px; cursor: default;" title="첨부파일 있음">📎</span>';
							      }
							      return ''; // 첨부파일이 없으면 빈칸으로 표시
							  }
							},

				    { header: '작성자', name: 'memId', width: 150, align:'center', sortable: true },
				    { header: '작성일', name: 'createdOn', width: 150, align:'left', sortable: true, formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD HH:mm') },
				    { 
				    	header: '수정',
				    	name: 'edit',
				    	width: 100,
				    	align:'center',
				    	sortable: true,

				    	formatter: ({ row }) => {

				    		return `
				    			<button
				    				class="btn btn-secondary btn-sm"
				    				data-bs-toggle="modal"
				    				data-bs-target="#editModal"
				    				data-id="${row.id}"
				    				data-title="${row.title}"
				    				data-description="${row.description}"
				    				data-prjid="${row.prjId}">
				    				수정
				    			</button>
				    		`;
				    	}
				    },

	               { header: '삭제',
	                  name: 'deleteBtn',
	                  width: 100,
	                  align:'center',
	                  sortable: true,
	                  formatter: ({ row }) => {
	                      return '<button class="btn btn-danger btn-sm" ' +
	                             'data-bs-toggle="modal" ' +
	                             'data-bs-target="#deleteModal" ' +
	                             'data-id="' + row.id + '">' +
	                             '삭제</button>';
	                         }
                      }

			],
			rowHeaders: ['rowNum'],
			
			pageOptions: {
				useClient: true,
				perPage: 10
			}

		});
		
        grid.on('click', (ev) => {
            const row = grid.getRow(ev.rowKey);
            if (!row) return;

            // [삭제] 기존에 잘 작동하던 삭제 모달 주소 주입 코드는 그대로 유지합니다.
            if (ev.columnName === 'deleteBtn') {
                const buttonEl = ev.nativeEvent.target;
                const docId = buttonEl.getAttribute('data-id');
                if (docId) {
                    document.getElementById('confirmDeleteLink').setAttribute(
                        'onclick', 
                        "location.href='/project/docs/delete?id=" + docId + "'"
                    );
                }
            }
        });


</script>
		<div class="d-flex justify-content-end my-3">

			<button class="btn btn-primary" data-bs-toggle="modal"
				data-bs-target="#registerModal">등록</button>

		</div>

		<div th:replace="~{project/docs/modal/delete :: deleteModal}"></div>
		<div th:replace="~{project/docs/modal/register :: registerModal}"></div>
		<div th:replace="~{project/docs/modal/edit :: editModal}"></div>

		<div th:if="${msg != null}" id="successNotify"
			class="alert alert-success shadow"
			style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 25px; border-radius: 8px; font-weight: 600; background-color: #d1e7dd; color: #0f5132; border-color: #badbcc;">
			<span th:text="${msg}">성공 메시지</span>
		</div>

		<script>
		
			// 화면이 로드되고 2.5초 뒤에 알림창을 화면에서 부드럽게 지워버립니다.
			document.addEventListener("DOMContentLoaded", function() {
				const notify = document.getElementById("successNotify");
				if (notify) {
					setTimeout(function() {
						notify.style.transition = "opacity 0.5s ease";
						notify.style.opacity = "0";
						setTimeout(function() { notify.remove(); }, 500); 
					}, 2500);
				}
			});
		</script>

		<script>

			const editModal = document.getElementById('editModal');

				editModal.addEventListener('show.bs.modal', function(event) {

			const button = event.relatedTarget;

				document.getElementById('edit-id').value =
				button.getAttribute('data-id');

				document.getElementById('edit-title').value =
				button.getAttribute('data-title');

				const docId = button.getAttribute('data-id');

				fetch('/project/docs/files?id=' + docId)
					.then(response => response.json())
					.then(files => {

						const fileArea =
							document.getElementById('existing-files');

						fileArea.innerHTML = '';

						if(files.length > 0){

							files.forEach(file => {

								fileArea.innerHTML += `
									<div class="d-flex justify-content-between align-items-center border rounded p-2 mb-2">

										<a href="/download/${file.id}">
											${file.fileName}
										</a>

										<button
											type="button"
											class="btn btn-sm btn-outline-danger delete-file-btn"
											data-file-id="${file.id}">
											삭제
										</button>

									</div>
								`;
							});
						}

			});
				document.getElementById('edit-prjid').value =
				button.getAttribute('data-prjid');
				});
			
				document.addEventListener('click', function(e){

					if(e.target.classList.contains('delete-file-btn')){

						const fileId =
							e.target.getAttribute('data-file-id');

						if(confirm('첨부파일을 삭제하시겠습니까?')){

							fetch('/project/attach/delete?id=' + fileId)
								.then(response => response.text())
								.then(result => {

									if(result === 'success'){

										e.target.closest('.d-flex').remove();
									}
								});
						}
					}
				});

</script>
	</div>
</body>
</html>
