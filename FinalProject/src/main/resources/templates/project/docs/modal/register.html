<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<div th:fragment="registerModal">

	<div class="modal fade" id="registerModal" tabindex="-1"
		aria-hidden="true">

		<div class="modal-dialog modal-lg">

			<div class="modal-content">

				<form th:action="@{/project/docs/register}" method="post"
					enctype="multipart/form-data">

					<div class="modal-header">

						<h5 class="modal-title">문서 등록</h5>

						<button type="button" class="btn-close" data-bs-dismiss="modal">
						</button>

					</div>

					<div class="modal-body">

						<input type="hidden" name="prjId" th:value="${prjId}">

						<div class="mb-3">

							<label class="form-label">제목</label> <input type="text"
								name="title" class="form-control form-control-lg w-100">

						</div>

						<div class="mb-3">

							<label class="form-label">내용</label>

							<textarea name="description"
								class="form-control form-control-lg w-100" rows="6"></textarea>

						</div>

						<div class="mb-3">

							<label class="form-label">첨부파일</label> <input type="file"
								name="attachments" class="form-control" multiple>

						</div>

					</div>

					<div class="modal-footer">

						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">취소</button>

						<button type="submit" class="btn btn-primary">작성</button>

					</div>

				</form>

			</div>

		</div>

	</div>

</div>

</html>
