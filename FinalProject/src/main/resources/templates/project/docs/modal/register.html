<!DOCTYPE html>
<html xmlns:th="https://thymeleaf.org">

<div th:fragment="registerModal">

	<div class="modal fade" id="registerModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">

				<div class="modal-body"
					style="text-align: center; padding: 2rem 1rem; font-size: 1.1rem;">
					새로운 문서를 등록하시겠습니까?</div>

				<div class="modal-footer"
					style="justify-content: center; gap: 0.5rem;">

					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">취소</button>

					<a class="btn btn-primary" id="confirmRegBtn"
						th:href="@{/docs/register}"> 등록 </a>

				</div>

			</div>
		</div>
	</div>

</div>
</html>
