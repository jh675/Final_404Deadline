<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/projectLayout}">
<head>
    <meta charset="UTF-8">
    <title>위키 작성</title>
    <th:block layout:fragment="head-content">
        <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
        <link rel="stylesheet" th:href="@{/css/project/wiki.css}" />
    </th:block>
</head>
<body>
<div layout:fragment="content">
<div class="wiki-shell">
<div id="wrapper">
    <div class="wiki-layout">
        <div class="wiki-main">
            <div class="wiki-page-head">
                <h1 class="wiki-page-head__title"
                    th:text="${page != null and page.id != null} ? '위키 수정' : '위키 작성'">위키 작성</h1>
            </div>

            <form id="wikiForm" method="post" enctype="multipart/form-data"
                  th:action="${page != null and page.id != null} ? @{/project/wiki/update} : @{/project/wiki/save}">
                <input type="hidden" name="id" th:value="${page != null ? page.id : ''}">
                <input type="hidden" name="pageId" th:if="${page != null and page.pageId != null}"
                       th:value="${page.pageId}">
                <input type="hidden" name="content" id="wikiContentHidden">

                <div class="search-item search-item--grow">
                    <label for="wikiTitle">제목 <span class="req">*</span></label>
                    <div class="wiki-title-row">
                        <input type="text" id="wikiTitle" name="title" required
                               placeholder="제목 입력"
                               th:value="${page != null ? page.title : ''}"
                               th:readonly="${page != null and page.id != null}">
                        <button type="button" class="btn-title-check" id="btnTitleCheck"
                                th:if="${page == null or page.id == null}">중복 확인</button>
                    </div>
                    <p class="wiki-title-msg" id="wikiTitleMsg" aria-live="polite"></p>
                    <button type="button" class="btn-title-reset" id="btnTitleReset"
                            th:if="${page == null or page.id == null}" hidden>제목 변경</button>
                </div>

                <div class="search-item search-item--grow">
                    <label>내용</label>
                    <p class="wiki-link-hint" th:inline="none">
                        위키: <code>[[제목]]</code> · 이슈: <code>[[#번호 제목]]</code>
                        (선택 시 제목과 번호가 함께 저장됩니다)
                    </p>
                    <div id="wikiEditor"></div>
                </div>

                <div class="search-item">
                    <label for="parentWiki">상위 위키</label>
                    <select id="parentWiki" name="parentId">
                        <option value="" th:selected="${selectedParentId == null}">(없음)</option>
                        <option th:each="p : ${pageList}"
                                th:value="${p.id}"
                                th:text="${p.title}"
                                th:selected="${selectedParentId != null and selectedParentId == p.id}">
                        </option>
                    </select>
                </div>

                <div class="search-item">
                    <label for="wikiDescribe">설명</label>
                    <input type="text" id="wikiDescribe" name="describe" placeholder="변경 요약 (비워두면 자동 저장)"
                           th:value="${page != null ? page.describe : ''}">
                    <p class="form-hint">설명을 비워두면 시스템이 기본값으로 저장합니다.</p>
                </div>

                <div class="search-item attach-section" th:unless="${page != null and page.id != null}">
                    <div class="attach-head">
                        <span>첨부파일 (최대 5개, 합계 50MB 이하)</span>
                        <button type="button" class="btn btn-secondary btn-sm" id="btnAddFile">파일추가</button>
                    </div>
                    <ul class="attachment-list" id="newAttachmentList"></ul>
                    <input type="file" id="fileInput" name="files" class="attach-hidden-input" multiple accept="*/*" />
                </div>

                <div class="search-item attach-section" th:if="${page != null and page.id != null}">
                    <div class="attach-subsection">
                        <div class="attach-head">
                            <span>등록된 첨부</span>
                        </div>
                        <p class="attachment-empty"
                           th:if="${existingFiles == null or existingFiles.isEmpty()}">
                            등록된 첨부파일이 없습니다.
                        </p>
                        <ul class="attachment-list" id="existingAttachmentList"
                            th:if="${existingFiles != null and !existingFiles.isEmpty()}">
                            <li th:each="file : ${existingFiles}"
                                class="attach-row attach-row-existing"
                                th:attr="data-attach-id=${file.id}, data-file-size=${file.fileSize != null ? file.fileSize : 0}">
                                <div class="attach-file-name"
                                     th:text="${file.fileName != null ? file.fileName : file.diskFileName}">파일명</div>
                                <button type="button" class="btn btn-secondary btn-sm btn-remove-existing"
                                        th:if="${@prjAuth.hasRole('ROLE_WIKI_UPDATE')}">첨부삭제</button>
                            </li>
                        </ul>
                    </div>

                    <div class="attach-subsection">
                        <div class="attach-head">
                            <span>추가할 파일</span>
                            <button type="button" class="btn btn-secondary btn-sm" id="btnAddFileEdit">파일추가</button>
                        </div>
                        <ul class="attachment-list" id="newAttachmentListEdit"></ul>
                        <input type="file" id="fileInputEdit" name="files" class="attach-hidden-input" multiple accept="*/*" />
                    </div>

                    <p class="form-hint">등록된 첨부와 추가할 파일 합산 최대 5개, 총 50MB까지 가능합니다.</p>
                </div>

                <div class="wiki-form-actions">
                    <button type="submit"
                            th:class="${page != null and page.id != null} ? 'btn btn-success' : 'btn btn-primary'"
                            th:text="${page != null and page.id != null} ? '수정' : '작성'">작성</button>
                    <a class="btn btn-danger"
                       th:if="${page != null and page.id != null and page.title != null}"
                       th:href="@{/project/wiki/view/{name}(name=${page.title})}">취소</a>
                    <a class="btn btn-danger"
                       th:unless="${page != null and page.id != null}" th:href="@{/project/wiki}">취소</a>
                </div>
            </form>
        </div>

        <aside class="wiki-aside">
            <h3 class="wiki-aside__title">색인</h3>
            <ul>
                <li><a th:href="@{/project/wiki}">첫페이지</a></li>
                <li><a th:href="@{/project/wiki/index(type='title')}">제목별</a></li>
                <li><a th:href="@{/project/wiki/index(type='date')}">날짜별</a></li>
            </ul>
        </aside>
    </div>
</div>
</div>

    <script th:src="@{/js/wiki/wiki-link-autocomplete.js}"></script>
    <script th:inline="javascript">
        var wikiEditorInstance = null;

        function syncWikiContent() {
            var hidden = document.getElementById('wikiContentHidden');
            if (hidden && wikiEditorInstance) {
                hidden.value = wikiEditorInstance.getMarkdown();
            }
        }
        window.syncWikiContent = syncWikiContent;

        function initWikiLinkAutocomplete() {
            if (!wikiEditorInstance || !window.WikiLinkAutocomplete) return;
            WikiLinkAutocomplete.init(wikiEditorInstance, '#wikiEditor');
        }

        function initWikiEditor() {
            if (wikiEditorInstance) return true;
            if (!window.toastui || !window.toastui.Editor) return false;

            var el = document.querySelector('#wikiEditor');
            if (!el) return false;

            el.style.height = '420px';
            el.style.minHeight = '420px';

            var initialContent = /*[[${page != null ? page.content : ''}]]*/ '';

            /* placeholder + previewStyle:'vertical' 조합은 미리보기에 로딩 스피너가 무한 표시되는 버그 (#2669) */
            wikiEditorInstance = new toastui.Editor({
                el: el,
                height: '420px',
                initialEditType: 'markdown',
                previewStyle: 'vertical',
                previewHighlight: false,
                usageStatistics: false,
                plugins: []
            });

            wikiEditorInstance.on('change', syncWikiContent);
            /* load는 생성 직후 이미 발생할 수 있어, 등록 직후 즉시 init + load fallback 둘 다 사용 */
            initWikiLinkAutocomplete();
            wikiEditorInstance.on('load', initWikiLinkAutocomplete);

            if (initialContent) {
                wikiEditorInstance.setMarkdown(initialContent);
                syncWikiContent();
            }
            return true;
        }

        document.addEventListener('DOMContentLoaded', function () {
            initWikiEditor();
        });
        (function () {
            var MAX_FILES = 5;
            var MAX_TOTAL_BYTES = 50 * 1024 * 1024;
            var isEditMode = /*[[${page != null and page.id != null}]]*/ false;
            var titleInput = document.getElementById('wikiTitle');
            var btnTitleCheck = document.getElementById('btnTitleCheck');
            var btnTitleReset = document.getElementById('btnTitleReset');
            var titleMsgEl = document.getElementById('wikiTitleMsg');
            var titleChecked = isEditMode;
            var checkedTitle = isEditMode && titleInput ? titleInput.value.trim() : '';
            var selectedFiles = [];

            function setTitleMsg(text, type) {
                if (!titleMsgEl) return;
                titleMsgEl.textContent = text || '';
                titleMsgEl.className = 'wiki-title-msg'
                    + (type === 'success' ? ' is-success' : '')
                    + (type === 'error' ? ' is-error' : '');
            }

            function resetTitleCheck() {
                titleChecked = false;
                checkedTitle = '';
                if (titleInput) titleInput.readOnly = false;
                if (btnTitleCheck) btnTitleCheck.disabled = false;
                if (btnTitleReset) btnTitleReset.hidden = true;
                setTitleMsg('', null);
            }

            if (btnTitleCheck && titleInput) {
                btnTitleCheck.addEventListener('click', function () {
                    var title = titleInput.value.trim();
                    if (!title) {
                        alert('제목을 입력해 주세요.');
                        titleInput.focus();
                        return;
                    }
                    btnTitleCheck.disabled = true;
                    setTitleMsg('확인 중...', null);

                    fetch('/project/wiki/check?name=' + encodeURIComponent(title))
                        .then(function (res) {
                            if (res.ok) {
                                titleChecked = true;
                                checkedTitle = title;
                                titleInput.readOnly = true;
                                btnTitleCheck.disabled = true;
                                if (btnTitleReset) btnTitleReset.hidden = false;
                                setTitleMsg('사용 가능한 제목입니다.', 'success');
                            } else {
                                resetTitleCheck();
                                setTitleMsg('이미 사용 중인 제목입니다. 다른 제목을 입력해 주세요.', 'error');
                                titleInput.focus();
                            }
                        })
                        .catch(function () {
                            resetTitleCheck();
                            setTitleMsg('중복 확인에 실패했습니다. 잠시 후 다시 시도해 주세요.', 'error');
                        });
                });

            }

            if (btnTitleReset) {
                btnTitleReset.addEventListener('click', function () {
                    resetTitleCheck();
                    if (titleInput) titleInput.focus();
                });
            }

            var fileInput = document.getElementById(isEditMode ? 'fileInputEdit' : 'fileInput');
            var newListEl = document.getElementById(isEditMode ? 'newAttachmentListEdit' : 'newAttachmentList');
            var btnAddFile = document.getElementById(isEditMode ? 'btnAddFileEdit' : 'btnAddFile');
            var existingListEl = document.getElementById('existingAttachmentList');

            function countExisting() {
                if (!existingListEl) return 0;
                return existingListEl.querySelectorAll('.attach-row-existing').length;
            }

            function sumExistingBytes() {
                if (!existingListEl) return 0;
                var sum = 0;
                existingListEl.querySelectorAll('.attach-row-existing').forEach(function (li) {
                    var size = parseInt(li.getAttribute('data-file-size'), 10);
                    if (!isNaN(size)) sum += size;
                });
                return sum;
            }

            function countTotal() {
                return countExisting() + selectedFiles.length;
            }

            function sumNewBytes() {
                return selectedFiles.reduce(function (s, f) { return s + f.size; }, 0);
            }

            function sumTotalBytes() {
                return sumExistingBytes() + sumNewBytes();
            }

            function formatBytes(bytes) {
                if (!bytes) return '0B';
                if (bytes < 1024) return bytes + 'B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
                return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
            }

            function updateAddButtonState() {
                if (btnAddFile) {
                    btnAddFile.disabled = countTotal() >= MAX_FILES;
                }
            }

            function renderSelectedFiles() {
                if (!newListEl) return;
                newListEl.innerHTML = '';
                selectedFiles.forEach(function (file, index) {
                    var row = document.createElement('li');
                    row.className = 'attach-row attach-row-new';

                    var nameWrap = document.createElement('div');
                    nameWrap.className = 'attach-file-name';
                    nameWrap.textContent = file.name;

                    var meta = document.createElement('span');
                    meta.className = 'attach-file-meta';
                    meta.textContent = ' (' + formatBytes(file.size) + ')';
                    nameWrap.appendChild(meta);

                    var del = document.createElement('button');
                    del.type = 'button';
                    del.className = 'btn btn-secondary btn-sm';
                    del.textContent = '첨부삭제';
                    del.addEventListener('click', function () {
                        selectedFiles.splice(index, 1);
                        renderSelectedFiles();
                        syncFileInput();
                        updateAddButtonState();
                    });

                    row.appendChild(nameWrap);
                    row.appendChild(del);
                    newListEl.appendChild(row);
                });
            }

            if (btnAddFile && fileInput) {
                btnAddFile.addEventListener('click', function () {
                    if (!btnAddFile.disabled) {
                        fileInput.click();
                    }
                });
            }

            if (fileInput) {
                fileInput.addEventListener('change', function (e) {
                    var incoming = Array.from(e.target.files || []);

                    for (var i = 0; i < incoming.length; i++) {
                        if (countTotal() >= MAX_FILES) {
                            alert('첨부파일은 최대 ' + MAX_FILES + '개까지 등록할 수 있습니다.');
                            break;
                        }
                        if (sumTotalBytes() + incoming[i].size > MAX_TOTAL_BYTES) {
                            alert('첨부파일 총 용량은 50MB를 초과할 수 없습니다.');
                            break;
                        }
                        selectedFiles.push(incoming[i]);
                    }
                    e.target.value = '';
                    renderSelectedFiles();
                    syncFileInput();
                    updateAddButtonState();
                });
            }

            function syncFileInput() {
                if (!fileInput) return;
                var dt = new DataTransfer();
                selectedFiles.forEach(function (f) { dt.items.add(f); });
                fileInput.files = dt.files;
            }

            updateAddButtonState();

            if (existingListEl) {
                existingListEl.addEventListener('click', function (e) {
                    var btn = e.target.closest('.btn-remove-existing');
                    if (!btn) return;

                    var li = btn.closest('.attach-row-existing');
                    var id = li && li.getAttribute('data-attach-id');
                    if (!id) return;
                    var tokenMeta = document.querySelector('meta[name="_csrf"]');
                    var headerMeta = document.querySelector('meta[name="_csrf_header"]');
                    var headers = {};
                    if (tokenMeta && headerMeta) {
                        headers[headerMeta.content] = tokenMeta.content;
                    }

                    fetch('/delete/' + encodeURIComponent(id), { method: 'DELETE', headers: headers })
                        .then(function (res) {
                            if (!res.ok) throw new Error('delete failed');
                            alert('첨부파일이 삭제되었습니다.');
                            li.remove();
                            if (countExisting() === 0) {
                                var subsection = existingListEl.closest('.attach-subsection');
                                if (subsection && !subsection.querySelector('.attachment-empty')) {
                                    var emptyMsg = document.createElement('p');
                                    emptyMsg.className = 'attachment-empty';
                                    emptyMsg.textContent = '등록된 첨부파일이 없습니다.';
                                    subsection.appendChild(emptyMsg);
                                }
                            }
                        })
                        .catch(function () {
                            alert('첨부파일 삭제에 실패했습니다.');
                        });
                });
            }

            var wikiForm = document.getElementById('wikiForm');
            if (wikiForm) {
                wikiForm.addEventListener('submit', function (e) {
                    e.preventDefault();

                    var title = titleInput ? titleInput.value.trim() : '';
                    if (!title) {
                        alert('제목을 입력해 주세요.');
                        return;
                    }
                    if (!isEditMode && !titleChecked) {
                        alert('제목 중복 확인을 해 주세요.');
                        if (btnTitleCheck) btnTitleCheck.focus();
                        return;
                    }
                    if (!isEditMode && title !== checkedTitle) {
                        alert('제목이 변경되었습니다. 중복 확인을 다시 해 주세요.');
                        resetTitleCheck();
                        return;
                    }
                    if (!wikiEditorInstance) {
                        alert('에디터가 아직 로드되지 않았습니다.');
                        return;
                    }

                    syncWikiContent();
                    wikiForm.submit();
                });
            }
        })();
    </script>
</div>
</body>
</html>
