<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/projectLayout}">
<head>
    <meta charset="UTF-8">
    <title>위키 작성</title>
    <th:block layout:fragment="head-content">
        <link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/toastui-editor.min.css" />
        <style>
            .wiki-write-page {
                font-family: "Malgun Gothic", "맑은 고딕", -apple-system, sans-serif;
                color: #333;
            }

            .wiki-write-layout {
                display: flex;
                gap: 24px;
                align-items: flex-start;
            }

            .wiki-write-main {
                flex: 1;
                min-width: 0;
            }

            .wiki-write-sidebar {
                width: 220px;
                flex-shrink: 0;
                border: 1px solid #ddd;
                border-radius: 6px;
                background: #fafafa;
                padding: 16px 18px;
            }

            .wiki-write-sidebar h3 {
                font-size: 14px;
                font-weight: 700;
                margin: 0 0 12px;
                padding-bottom: 8px;
                border-bottom: 1px solid #e0e0e0;
            }

            .wiki-write-sidebar .index-title {
                font-size: 12px;
                font-weight: 600;
                color: #666;
                margin-bottom: 8px;
            }

            .wiki-write-sidebar ul {
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .wiki-write-sidebar li + li {
                margin-top: 6px;
            }

            .wiki-write-sidebar a {
                font-size: 13px;
                color: #2e7d32;
                text-decoration: none;
            }

            .wiki-write-sidebar a:hover {
                text-decoration: underline;
            }

            .wiki-form-card {
                border: 1px solid #e0e0e0;
                border-radius: 6px;
                background: #fff;
                padding: 24px 28px 28px;
            }

            .wiki-form-group {
                margin-bottom: 20px;
            }

            .wiki-form-group label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: #495057;
                margin-bottom: 6px;
            }

            .wiki-form-group label .required {
                color: #dc3545;
            }

            .wiki-form-group input[type="text"],
            .wiki-form-group select {
                width: 100%;
                max-width: 480px;
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
            }

            .wiki-form-group input[type="text"]:focus,
            .wiki-form-group select:focus {
                outline: none;
                border-color: #66bb6a;
                box-shadow: 0 0 0 2px rgba(102, 187, 106, 0.2);
            }

            .wiki-title-row {
                display: flex;
                gap: 8px;
                align-items: stretch;
                max-width: 480px;
            }

            .wiki-title-row input[type="text"] {
                flex: 1;
                min-width: 0;
                max-width: none;
            }

            .btn-title-check {
                flex-shrink: 0;
                padding: 8px 16px;
                font-size: 13px;
                font-weight: 600;
                border: 1px solid #66bb6a;
                color: #2e7d32;
                background: #fff;
                border-radius: 4px;
                cursor: pointer;
                white-space: nowrap;
            }

            .btn-title-check:hover:not(:disabled) {
                background: #f1f8e9;
            }

            .btn-title-check:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .wiki-title-msg {
                font-size: 12px;
                margin: 6px 0 0;
            }

            .wiki-title-msg.is-success {
                color: #2e7d32;
            }

            .wiki-title-msg.is-error {
                color: #dc3545;
            }

            .btn-title-reset {
                margin-top: 6px;
                padding: 0;
                border: none;
                background: none;
                font-size: 12px;
                color: #666;
                text-decoration: underline;
                cursor: pointer;
            }

            .btn-title-reset:hover {
                color: #333;
            }

            /* TOAST UI Editor */
            #wikiEditor {
                min-height: 420px;
            }

            .toastui-editor-defaultUI {
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            .wiki-link-hint {
                font-size: 12px;
                color: #888;
                margin: 0 0 8px;
            }

            .wiki-link-hint code {
                background: #f5f5f5;
                padding: 1px 5px;
                border-radius: 3px;
                font-size: 11px;
            }

            .wiki-link-autocomplete {
                position: fixed;
                z-index: 10050;
                background: #fff;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
                overflow: hidden;
            }

            .wiki-link-autocomplete-header {
                padding: 8px 12px;
                font-size: 11px;
                color: #666;
                background: #fafafa;
                border-bottom: 1px solid #eee;
            }

            .wiki-link-autocomplete-list {
                max-height: 220px;
                overflow-y: auto;
            }

            .wiki-link-autocomplete-item {
                display: block;
                width: 100%;
                text-align: left;
                padding: 8px 12px;
                border: none;
                background: #fff;
                font-size: 13px;
                cursor: pointer;
            }

            .wiki-link-autocomplete-item:hover,
            .wiki-link-autocomplete-item.is-active {
                background: #f1f8e9;
            }

            .wiki-link-autocomplete-item.is-issue {
                color: #1565c0;
            }

            .wiki-link-autocomplete-item.is-wiki {
                color: #2e7d32;
            }

            .wiki-link-autocomplete-empty {
                padding: 10px 12px;
                font-size: 12px;
                color: #888;
            }

            /* 첨부파일 */
            .attachment-list {
                list-style: none;
                margin: 0 0 10px;
                padding: 0;
            }

            .attachment-list li {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 8px 12px;
                background: #f8f9fa;
                border: 1px solid #eee;
                border-radius: 4px;
                margin-bottom: 6px;
                font-size: 13px;
            }

            .attachment-list .btn-remove,
            .attachment-list .btn-remove-existing,
            .attachment-list .btn-remove-new {
                padding: 4px 12px;
                font-size: 12px;
                border: 1px solid #dc3545;
                color: #dc3545;
                background: #fff;
                border-radius: 4px;
                cursor: pointer;
            }

            .attachment-list .btn-remove:hover,
            .attachment-list .btn-remove-existing:hover,
            .attachment-list .btn-remove-new:hover {
                background: #fff5f5;
            }

            .btn-add-file {
                padding: 6px 16px;
                font-size: 13px;
                border: 1px solid #66bb6a;
                color: #2e7d32;
                background: #fff;
                border-radius: 4px;
                cursor: pointer;
            }

            .btn-add-file:hover {
                background: #f1f8e9;
            }

            .attachment-hint {
                font-size: 12px;
                color: #888;
                margin-top: 6px;
            }

            .attach-subsection {
                margin-bottom: 16px;
                padding-bottom: 16px;
                border-bottom: 1px dashed #e8e8e8;
            }

            .attach-subsection:last-of-type {
                border-bottom: none;
                padding-bottom: 0;
                margin-bottom: 0;
            }

            .attach-subsection > label {
                font-size: 12px;
                color: #666;
            }

            .attachment-empty {
                font-size: 13px;
                color: #888;
                margin: 0 0 8px;
            }

            .wiki-form-actions {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 24px;
                padding-top: 20px;
                border-top: 1px solid #eee;
            }

            .wiki-form-actions .btn-submit {
                padding: 10px 28px;
                background: #66bb6a;
                color: #fff;
                border: none;
                border-radius: 50px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
            }

            .wiki-form-actions .btn-submit:hover {
                background: #43a047;
            }

            .wiki-form-actions .btn-cancel {
                padding: 10px 24px;
                background: #fff;
                color: #555;
                border: 1px solid #ccc;
                border-radius: 50px;
                font-size: 14px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                line-height: 1.4;
            }

            .wiki-form-actions .btn-cancel:hover {
                background: #f5f5f5;
            }

            @media (max-width: 768px) {
                .wiki-write-layout {
                    flex-direction: column;
                }

                .wiki-write-sidebar {
                    width: 100%;
                }
            }
        </style>
    </th:block>
</head>
<body>

<div layout:fragment="content" class="wiki-write-page py-2">

    <div class="wiki-write-layout">
        <div class="wiki-write-main">
            <h4 class="fw-bold text-success mb-3" style="color:#2e7d32 !important;"
                th:if="${page != null and page.id != null}">위키 수정</h4>
            <h4 class="fw-bold text-success mb-3" style="color:#2e7d32 !important;"
                th:unless="${page != null and page.id != null}">위키 작성</h4>

            <form id="wikiForm" class="wiki-form-card" method="post" enctype="multipart/form-data"
                  th:action="${page != null and page.id != null} ? @{/project/wiki/update} : @{/project/wiki/save}">
                <input type="hidden" name="id" th:value="${page != null ? page.id : ''}">
                <input type="hidden" name="pageId" th:if="${page != null and page.pageId != null}"
                       th:value="${page.pageId}">
                <input type="hidden" name="content" id="wikiContentHidden">

                <!-- 1. 제목 (작성 시 중복 확인 후 readonly) -->
                <div class="wiki-form-group">
                    <label for="wikiTitle">제목 <span class="required">*</span></label>
                    <div class="wiki-title-row">
                        <input type="text" id="wikiTitle" name="title" required
                               placeholder="제목 입력"
                               th:value="${page != null ? page.title : ''}"
                               th:readonly="${page != null and page.id != null}">
                        <button type="button" class="btn-title-check" id="btnTitleCheck"
                                th:if="${page == null or page.id == null}">중복 확인</button>
                    </div>
                    <p class="wiki-title-msg" id="wikiTitleMsg" aria-live="polite"></p>
                    <button type="button" class="btn-title-reset" id="btnTitleReset"
                            th:if="${page == null or page.id == null}" hidden>제목 변경</button>
                </div>

                <!-- 2·3. 마크다운 에디터 (TOAST UI Editor) -->
                <div class="wiki-form-group">
                    <label>내용</label>
                    <p class="wiki-link-hint" th:inline="none">
                        위키: <code>[[제목]]</code> · 이슈: <code>[[#번호 제목]]</code>
                        (선택 시 제목과 번호가 함께 저장됩니다)
                    </p>
                    <div id="wikiEditor"></div>
                    <p id="wikiEditorError" class="text-danger small mt-2" style="display:none" role="alert"></p>
                    <!-- 수정 시 본문: JS 문자열 깨짐 방지용 (Thymeleaf 인라인 대신 value 사용) -->
                    <textarea id="wikiInitialContentHolder" hidden
                              th:text="${page != null and page.content != null ? page.content : ''}"></textarea>
                </div>

                <!-- 4. 상위 위키 -->
                <div class="wiki-form-group">
                    <label for="parentWiki">상위 위키</label>
                    <select id="parentWiki" name="parentId">
                        <option value="" th:selected="${selectedParentId == null}">(없음)</option>
                        <option th:each="p : ${pageList}"
                                th:value="${p.id}"
                                th:text="${p.title}"
                                th:selected="${selectedParentId != null and selectedParentId == p.id}">
                        </option>
                    </select>
                </div>

                <!-- 5. 설명 -->
                <div class="wiki-form-group">
                    <label for="wikiDescribe">설명</label>
                    <input type="text" id="wikiDescribe" name="describe" placeholder="변경 요약 또는 페이지 설명"
                           th:value="${page != null ? page.describe : ''}">
                </div>

                <!-- 6. 첨부파일 (작성) -->
                <div class="wiki-form-group" th:unless="${page != null and page.id != null}">
                    <label>첨부파일</label>
                    <ul class="attachment-list" id="newAttachmentList"></ul>
                    <input type="file" id="fileInput" name="files" multiple accept="*/*" style="display:none">
                    <button type="button" class="btn-add-file" id="btnAddFile">파일추가</button>
                    <p class="attachment-hint">최대 5개, 총 50MB까지 업로드 가능합니다.</p>
                </div>

                <!-- 6. 첨부파일 (수정: 등록된 첨부 / 추가할 파일 분리) -->
                <div class="wiki-form-group" th:if="${page != null and page.id != null}">
                    <label>첨부파일</label>

                    <div class="attach-subsection">
                        <label>등록된 첨부</label>
                        <p class="attachment-empty"
                           th:if="${existingFiles == null or existingFiles.isEmpty()}">
                            등록된 첨부파일이 없습니다.
                        </p>
                        <ul class="attachment-list" id="existingAttachmentList"
                            th:if="${existingFiles != null and !existingFiles.isEmpty()}">
                            <li th:each="file : ${existingFiles}"
                                class="attach-row-existing"
                                th:attr="data-attach-id=${file.id}, data-file-size=${file.fileSize != null ? file.fileSize : 0}">
                                <span th:text="${file.fileName != null ? file.fileName : file.diskFileName}">파일명</span>
                                <button type="button" class="btn-remove-existing"
                                        th:if="${@prjAuth.hasRole('ROLE_WIKI_UPDATE')}">첨부삭제</button>
                            </li>
                        </ul>
                    </div>

                    <div class="attach-subsection">
                        <label>추가할 파일</label>
                        <ul class="attachment-list" id="newAttachmentListEdit"></ul>
                        <input type="file" id="fileInputEdit" name="files" multiple accept="*/*" style="display:none">
                        <button type="button" class="btn-add-file" id="btnAddFileEdit">파일추가</button>
                    </div>

                    <p class="attachment-hint">등록된 첨부와 추가할 파일 합산 최대 5개, 총 50MB까지 가능합니다.</p>
                </div>

                <!-- 7·8. 작성 / 취소 -->
                <div class="wiki-form-actions">
                    <a class="btn-cancel" th:if="${page != null and page.id != null and page.title != null}"
                       th:href="@{/project/wiki/view/{name}(name=${page.title})}">취소</a>
                    <a class="btn-cancel" th:unless="${page != null and page.id != null}" th:href="@{/project/wiki/view}">취소</a>
                    <button type="submit" class="btn-submit"
                            th:text="${page != null and page.id != null} ? '수정' : '작성'">작성</button>
                </div>
            </form>
        </div>

        <aside class="wiki-write-sidebar">
            <h3>사이드바</h3>
            <div class="index-title">색인</div>
            <ul>
                <li><a th:href="@{/project/wiki/view(start=true)}">첫페이지</a></li>
                <li><a th:href="@{/project/wiki/index(type='title')}">제목별</a></li>
                <li><a th:href="@{/project/wiki/index(type='date')}">날짜별</a></li>
            </ul>
        </aside>
    </div>

    <!-- JS: Toast UI → 자동완성 → 초기화 (순서 유지) -->
    <script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"
            id="wikiToastUiScript"></script>
    <!-- aiModal의 viewer 스크립트보다 먼저 Editor 생성자 보존 (viewer가 toastui.Editor를 덮어씀) -->
    <script>
        window.ToastUiMarkdownEditor = window.toastui && window.toastui.Editor;
    </script>
    <script th:src="@{/js/wiki/wiki-link-autocomplete.js}"></script>
    <script th:inline="javascript">
        var wikiEditorInstance = null;
        var wikiEditorBootDone = false;

        function getToastUiEditorClass() {
            return window.ToastUiMarkdownEditor
                || (window.toastui && window.toastui.Editor);
        }

        function showWikiEditorError(message) {
            var errEl = document.getElementById('wikiEditorError');
            if (errEl) {
                errEl.textContent = message;
                errEl.style.display = 'block';
            }
        }

        function syncWikiContent() {
            var hidden = document.getElementById('wikiContentHidden');
            if (!hidden || !wikiEditorInstance) return;
            if (typeof wikiEditorInstance.getMarkdown !== 'function') return;
            hidden.value = wikiEditorInstance.getMarkdown();
        }

        function getWikiInitialContent() {
            var holder = document.getElementById('wikiInitialContentHolder');
            return holder ? holder.value : '';
        }

        function initWikiLinkAutocomplete() {
            if (!wikiEditorInstance || !window.WikiLinkAutocomplete) return;
            WikiLinkAutocomplete.init(wikiEditorInstance, '#wikiEditor');
        }

        function isToastUiReady() {
            var EditorClass = getToastUiEditorClass();
            return typeof EditorClass === 'function'
                && typeof EditorClass.prototype.getMarkdown === 'function';
        }

        function initWikiEditor() {
            if (wikiEditorInstance) return true;

            var EditorClass = getToastUiEditorClass();
            if (!isToastUiReady()) return false;

            var el = document.getElementById('wikiEditor');
            if (!el) return false;

            var errEl = document.getElementById('wikiEditorError');
            if (errEl) errEl.style.display = 'none';

            try {
                var initialContent = getWikiInitialContent();

                /* vertical + placeholder 조합 시 미리보기 스피너 무한 로딩 (#2669) → tab 사용 */
                wikiEditorInstance = new EditorClass({
                    el: el,
                    height: '420px',
                    initialEditType: 'markdown',
                    previewStyle: 'tab',
                    previewHighlight: false,
                    usageStatistics: false,
                    initialValue: initialContent || '',
                    plugins: []
                });

                wikiEditorInstance.on('change', syncWikiContent);
                wikiEditorInstance.on('load', function () {
                    syncWikiContent();
                    initWikiLinkAutocomplete();
                });

                setTimeout(syncWikiContent, 0);
                setTimeout(initWikiLinkAutocomplete, 300);
                return true;
            } catch (e) {
                console.error('Wiki editor init failed:', e);
                showWikiEditorError('에디터 초기화에 실패했습니다. 새로고침 후 다시 시도해 주세요.');
                wikiEditorInstance = null;
                return false;
            }
        }

        function bootWikiEditor() {
            if (wikiEditorBootDone) return;
            if (initWikiEditor()) {
                wikiEditorBootDone = true;
                return;
            }
            var attempts = 0;
            var timer = setInterval(function () {
                if (initWikiEditor()) {
                    wikiEditorBootDone = true;
                    clearInterval(timer);
                } else if (++attempts >= 120) {
                    clearInterval(timer);
                    if (!isToastUiReady()) {
                        showWikiEditorError(
                            '에디터 라이브러리(Toast UI)를 불러오지 못했습니다. '
                            + '인터넷 연결 또는 uicdn.toast.com 차단 여부를 확인해 주세요.'
                        );
                    }
                }
            }, 50);
        }

        /** uicdn 실패 시 jsdelivr 대체 로드 */
        function loadToastUiFallback() {
            if (isToastUiReady()) {
                bootWikiEditor();
                return;
            }
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/toastui-editor-all.min.js';
            s.onload = function () {
                window.ToastUiMarkdownEditor = window.toastui && window.toastui.Editor;
                bootWikiEditor();
            };
            s.onerror = function () {
                showWikiEditorError('에디터 스크립트를 CDN에서 받아오지 못했습니다.');
            };
            document.head.appendChild(s);
        }

        (function scheduleWikiEditorBoot() {
            var primary = document.getElementById('wikiToastUiScript');
            if (primary) {
                primary.addEventListener('error', loadToastUiFallback);
            }

            function start() {
                if (isToastUiReady()) {
                    bootWikiEditor();
                    return;
                }
                var wait = 0;
                var waitTimer = setInterval(function () {
                    if (isToastUiReady()) {
                        clearInterval(waitTimer);
                        bootWikiEditor();
                    } else if (++wait >= 40) {
                        clearInterval(waitTimer);
                        loadToastUiFallback();
                    }
                }, 50);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', start);
            } else {
                start();
            }
            /* aiModal viewer 스크립트 이후에도 한 번 더 시도 */
            window.addEventListener('load', bootWikiEditor);
        })();

        (function () {
            var MAX_FILES = 5;
            var MAX_TOTAL_BYTES = 50 * 1024 * 1024;
            var isEditMode = /*[[${page != null and page.id != null}]]*/ false;
            var titleInput = document.getElementById('wikiTitle');
            var btnTitleCheck = document.getElementById('btnTitleCheck');
            var btnTitleReset = document.getElementById('btnTitleReset');
            var titleMsgEl = document.getElementById('wikiTitleMsg');
            var titleChecked = isEditMode;
            var checkedTitle = isEditMode && titleInput ? titleInput.value.trim() : '';
            var selectedFiles = [];

            function setTitleMsg(text, type) {
                if (!titleMsgEl) return;
                titleMsgEl.textContent = text || '';
                titleMsgEl.className = 'wiki-title-msg'
                    + (type === 'success' ? ' is-success' : '')
                    + (type === 'error' ? ' is-error' : '');
            }

            function resetTitleCheck() {
                titleChecked = false;
                checkedTitle = '';
                if (titleInput) titleInput.readOnly = false;
                if (btnTitleCheck) btnTitleCheck.disabled = false;
                if (btnTitleReset) btnTitleReset.hidden = true;
                setTitleMsg('', null);
            }

            if (btnTitleCheck && titleInput) {
                btnTitleCheck.addEventListener('click', function () {
                    var title = titleInput.value.trim();
                    if (!title) {
                        alert('제목을 입력해 주세요.');
                        titleInput.focus();
                        return;
                    }
                    btnTitleCheck.disabled = true;
                    setTitleMsg('확인 중...', null);

                    fetch('/project/wiki/check?name=' + encodeURIComponent(title))
                        .then(function (res) {
                            if (res.ok) {
                                titleChecked = true;
                                checkedTitle = title;
                                titleInput.readOnly = true;
                                btnTitleCheck.disabled = true;
                                if (btnTitleReset) btnTitleReset.hidden = false;
                                setTitleMsg('사용 가능한 제목입니다.', 'success');
                            } else {
                                resetTitleCheck();
                                setTitleMsg('이미 사용 중인 제목입니다. 다른 제목을 입력해 주세요.', 'error');
                                titleInput.focus();
                            }
                        })
                        .catch(function () {
                            resetTitleCheck();
                            setTitleMsg('중복 확인에 실패했습니다. 잠시 후 다시 시도해 주세요.', 'error');
                        });
                });

            }

            if (btnTitleReset) {
                btnTitleReset.addEventListener('click', function () {
                    resetTitleCheck();
                    if (titleInput) titleInput.focus();
                });
            }

            var fileInput = document.getElementById(isEditMode ? 'fileInputEdit' : 'fileInput');
            var newListEl = document.getElementById(isEditMode ? 'newAttachmentListEdit' : 'newAttachmentList');
            var btnAddFile = document.getElementById(isEditMode ? 'btnAddFileEdit' : 'btnAddFile');
            var existingListEl = document.getElementById('existingAttachmentList');

            function countExisting() {
                if (!existingListEl) return 0;
                return existingListEl.querySelectorAll('.attach-row-existing').length;
            }

            function sumExistingBytes() {
                if (!existingListEl) return 0;
                var sum = 0;
                existingListEl.querySelectorAll('.attach-row-existing').forEach(function (li) {
                    var size = parseInt(li.getAttribute('data-file-size'), 10);
                    if (!isNaN(size)) sum += size;
                });
                return sum;
            }

            function countTotal() {
                return countExisting() + selectedFiles.length;
            }

            function sumNewBytes() {
                return selectedFiles.reduce(function (s, f) { return s + f.size; }, 0);
            }

            function sumTotalBytes() {
                return sumExistingBytes() + sumNewBytes();
            }

            if (btnAddFile && fileInput) {
                btnAddFile.addEventListener('click', function () {
                    fileInput.click();
                });
            }

            if (fileInput) {
                fileInput.addEventListener('change', function (e) {
                    var incoming = Array.from(e.target.files || []);

                    for (var i = 0; i < incoming.length; i++) {
                        if (countTotal() >= MAX_FILES) {
                            alert('첨부파일은 최대 ' + MAX_FILES + '개까지 등록할 수 있습니다.');
                            break;
                        }
                        if (sumTotalBytes() + incoming[i].size > MAX_TOTAL_BYTES) {
                            alert('첨부파일 총 용량은 50MB를 초과할 수 없습니다.');
                            break;
                        }
                        selectedFiles.push(incoming[i]);
                        appendNewFileRow(incoming[i]);
                    }
                    e.target.value = '';
                    syncFileInput();
                });
            }

            function appendNewFileRow(file) {
                var li = document.createElement('li');
                li.className = 'attach-row-new';
                var name = document.createElement('span');
                name.textContent = file.name;
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn-remove-new';
                btn.textContent = '첨부삭제';
                btn.addEventListener('click', function () {
                    var idx = selectedFiles.indexOf(file);
                    if (idx > -1) selectedFiles.splice(idx, 1);
                    li.remove();
                    syncFileInput();
                });
                li.appendChild(name);
                li.appendChild(btn);
                if (newListEl) newListEl.appendChild(li);
            }

            function syncFileInput() {
                if (!fileInput) return;
                var dt = new DataTransfer();
                selectedFiles.forEach(function (f) { dt.items.add(f); });
                fileInput.files = dt.files;
            }

            if (existingListEl) {
                existingListEl.addEventListener('click', function (e) {
                    var btn = e.target.closest('.btn-remove-existing');
                    if (!btn) return;

                    var li = btn.closest('.attach-row-existing');
                    var id = li && li.getAttribute('data-attach-id');
                    if (!id) return;
                    if (!confirm('이 첨부파일을 삭제하시겠습니까?')) return;

                    var tokenMeta = document.querySelector('meta[name="_csrf"]');
                    var headerMeta = document.querySelector('meta[name="_csrf_header"]');
                    var headers = {};
                    if (tokenMeta && headerMeta) {
                        headers[headerMeta.content] = tokenMeta.content;
                    }

                    fetch('/delete/' + encodeURIComponent(id), { method: 'DELETE', headers: headers })
                        .then(function (res) {
                            if (!res.ok) throw new Error('delete failed');
                            li.remove();
                            if (countExisting() === 0) {
                                var subsection = existingListEl.closest('.attach-subsection');
                                if (subsection && !subsection.querySelector('.attachment-empty')) {
                                    var emptyMsg = document.createElement('p');
                                    emptyMsg.className = 'attachment-empty';
                                    emptyMsg.textContent = '등록된 첨부파일이 없습니다.';
                                    subsection.appendChild(emptyMsg);
                                }
                            }
                        })
                        .catch(function () {
                            alert('첨부파일 삭제에 실패했습니다.');
                        });
                });
            }

            var wikiForm = document.getElementById('wikiForm');
            if (wikiForm) {
                wikiForm.addEventListener('submit', function (e) {
                    e.preventDefault();

                    var title = titleInput ? titleInput.value.trim() : '';
                    if (!title) {
                        alert('제목을 입력해 주세요.');
                        return;
                    }
                    if (!isEditMode && !titleChecked) {
                        alert('제목 중복 확인을 해 주세요.');
                        if (btnTitleCheck) btnTitleCheck.focus();
                        return;
                    }
                    if (!isEditMode && title !== checkedTitle) {
                        alert('제목이 변경되었습니다. 중복 확인을 다시 해 주세요.');
                        resetTitleCheck();
                        return;
                    }
                    if (!wikiEditorInstance) {
                        alert('에디터가 아직 로드되지 않았습니다.');
                        return;
                    }

                    syncWikiContent();
                    wikiForm.submit();
                });
            }
        })();
    </script>
</div>
</body>
</html>
