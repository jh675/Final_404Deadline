<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>이슈 상세</title>
<th:block layout:fragment="head-content">
<meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
<meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
<link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
<style>
.issue-shell {
	font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
	color: #333;
}

.issue-shell .issue-inner {
	max-width: 960px;
	margin: 0 auto;
	background: #fff;
	border: 1px solid #ddd;
	border-radius: 8px;
	padding: 28px 32px 36px;
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}

.back-row {
	margin-bottom: 16px;
}

.back-row a {
	font-size: 13px;
	color: #5b6cff;
	text-decoration: none;
}

.back-row a:hover {
	text-decoration: underline;
}

.page-title-row {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 16px;
	flex-wrap: wrap;
	margin-bottom: 22px;
}

.page-title-row .page-title {
	margin-bottom: 0;
	flex: 1;
	min-width: 0;
}

.page-title {
	font-size: 22px;
	font-weight: 700;
	margin-bottom: 22px;
	line-height: 1.35;
}

.issue-register-btn {
	flex-shrink: 0;
	display: inline-block;
	padding: 10px 22px;
	background-color: #5b6cff;
	color: #fff;
	border: none;
	border-radius: 4px;
	font-size: 14px;
	font-weight: 600;
	text-decoration: none;
	cursor: pointer;
}

.issue-register-btn:hover {
	background-color: #4956d8;
	color: #fff;
	text-decoration: none;
}

.meta-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 14px 32px;
	margin-bottom: 24px;
}

.meta-item label {
	display: block;
	font-size: 12px;
	font-weight: 600;
	color: #555;
	margin-bottom: 4px;
}

.meta-item input,
.meta-item textarea {
	width: 100%;
	padding: 8px 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	font-size: 13px;
	background: #fafafa;
	color: #333;
}

.meta-item textarea {
	min-height: 72px;
	resize: vertical;
	font-family: inherit;
}

.meta-item input.short {
	max-width: 120px;
}

.meta-item .parent-issue-link {
	display: block;
	width: 100%;
	padding: 8px 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	font-size: 13px;
	background: #fafafa;
	color: #5b6cff;
	text-decoration: none;
}

.meta-item .parent-issue-link:hover {
	color: #4956d8;
	text-decoration: underline;
}

.meta-item .meta-empty {
	display: block;
	padding: 8px 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	font-size: 13px;
	background: #fafafa;
	color: #333;
}

.section-block {
	margin-bottom: 22px;
}

.section-head {
	display: flex;
	align-items: center;
	gap: 8px;
	margin-bottom: 10px;
	font-size: 14px;
	font-weight: 600;
	color: #333;
}

.badge-count {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-width: 22px;
	height: 22px;
	padding: 0 6px;
	font-size: 12px;
	font-weight: 600;
	background: #e8e9ef;
	color: #444;
	border-radius: 999px;
}

.attach-list {
	display: flex;
	flex-wrap: wrap;
	gap: 12px 20px;
	align-items: center;
}

.attach-item {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	font-size: 13px;
	color: #444;
}

.attach-item a {
	color: #5b6cff;
	text-decoration: none;
	font-size: 16px;
	line-height: 1;
}

.attach-item a:hover {
	color: #4956d8;
}

.attach-item-actions {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	flex-shrink: 0;
}

.attach-delete-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: 22px;
	height: 22px;
	padding: 0;
	border: none;
	border-radius: 4px;
	background: transparent;
	color: #999;
	font-size: 18px;
	line-height: 1;
	cursor: pointer;
}

.attach-delete-btn:hover {
	background: #fee;
	color: #c33;
}

/* 첨부: 3열 그리드, 2줄까지 노출 후 더보기/접기 */
.attach-list-scroll-wrap {
	overflow: hidden;
	min-height: 0;
}

.attach-list-scroll-wrap.is-expanded {
	max-height: none !important;
	overflow: visible;
}

.attach-list.attach-list--grid {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	gap: 10px 14px;
	align-items: start;
}

.attach-list.attach-list--grid .attach-item {
	min-width: 0;
	overflow-wrap: anywhere;
}

.attach-list-toggle {
	display: inline-flex;
	align-items: center;
	margin-top: 8px;
	padding: 0;
	border: none;
	background: none;
	color: #5b6cff;
	font-size: 13px;
	font-weight: 500;
	cursor: pointer;
}

.attach-list-toggle:hover {
	color: #4956d8;
	text-decoration: underline;
}

table.data-table {
	width: 100%;
	border-collapse: collapse;
	font-size: 13px;
}

table.data-table thead th {
	background: #f0f1f5;
	border: 1px solid #ddd;
	padding: 10px 12px;
	text-align: left;
	font-weight: 600;
	color: #444;
}

table.data-table tbody td {
	border: 1px solid #e5e5e5;
	padding: 10px 12px;
	background: #fff;
}

.tab-row {
	display: flex;
	gap: 8px;
	margin-top: 8px;
	margin-bottom: 12px;
}

.tab-btn {
	padding: 8px 18px;
	border: 1px solid #ccc;
	border-radius: 20px;
	background: #fff;
	font-size: 13px;
	font-weight: 600;
	color: #444;
	cursor: pointer;
	transition: background .15s, color .15s, border-color .15s;
}

.tab-btn:hover {
	border-color: #bbb;
}

.tab-btn.is-active {
	background: #4a4a4a;
	color: #fff;
	border-color: #4a4a4a;
}

.tab-panel-wrap {
	background: #e8e9ec;
	border-radius: 6px;
	padding: 16px;
	min-height: 220px;
}

.tab-panel {
	display: none;
}

.tab-panel.is-visible {
	display: block;
}

/* 댓글 스레드 */
.comment-thread .comment {
	background: #f4f4f6;
	border-radius: 4px;
	padding: 10px 12px;
	margin-bottom: 8px;
	font-size: 13px;
}

.comment-thread .comment .meta {
	font-size: 12px;
	color: #666;
	margin-bottom: 6px;
}

.comment-thread .comment .meta strong {
	color: #333;
	margin-right: 8px;
}

.comment-thread .comment .meta .comment-num {
	font-weight: 700;
	color: #5b6cff;
	margin-right: 10px;
}

.comment-thread .nested {
	margin-left: 20px;
	margin-top: 8px;
	padding-left: 12px;
	border-left: 2px solid #d0d0d8;
}

.comment-thread .nested .comment::before {
	content: "↳ ";
	color: #888;
}

.comment-thread .comment.is-reply {
	border-left: 2px solid #d0d0d8;
	padding-left: 12px;
}

.comment-thread-scroll {
	overflow-y: visible;
	scrollbar-gutter: stable;
}

.comment-form {
	display: flex;
	gap: 10px;
	margin-top: 14px;
	align-items: stretch;
}

.comment-form textarea {
	flex: 1;
	min-height: 80px;
	padding: 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	font-size: 13px;
	font-family: inherit;
	resize: vertical;
}

.comment-form button {
	align-self: flex-end;
	padding: 10px 22px;
	background: #7c5cff;
	color: #fff;
	border: none;
	border-radius: 4px;
	font-size: 13px;
	font-weight: 600;
	cursor: pointer;
	white-space: nowrap;
}

.comment-form button:hover {
	background: #6a4ae6;
}

.comment-actions {
	margin-top: 8px;
	display: flex;
	gap: 8px;
	align-items: center;
}

.history-detail-link {
	color: #1976d2;
	text-decoration: underline;
	cursor: pointer;
}

.history-detail-link:hover {
	color: #1565c0;
}

.comment-actions .btn-reply {
	padding: 4px 10px;
	font-size: 12px;
	font-weight: 600;
	color: #5b6cff;
	background: #fff;
	border: 1px solid #c8c9d8;
	border-radius: 4px;
	cursor: pointer;
}

.comment-actions .btn-reply:hover {
	border-color: #5b6cff;
	color: #4956d8;
}

.comment-form-wrap {
	margin-top: 14px;
}

.comment-form-wrap .comment-form {
	margin-top: 0;
}

.reply-hint-row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	font-size: 12px;
	color: #555;
	margin-bottom: 8px;
	padding: 8px 10px;
	background: #eef0ff;
	border: 1px solid #d8dcff;
	border-radius: 4px;
}

.reply-hint-row button {
	padding: 4px 12px;
	font-size: 12px;
	font-weight: 600;
	color: #444;
	background: #fff;
	border: 1px solid #ccc;
	border-radius: 4px;
	cursor: pointer;
}

.reply-hint-row button:hover {
	border-color: #999;
}

.inner-table-title {
	font-size: 13px;
	font-weight: 600;
	margin-bottom: 8px;
	display: flex;
	align-items: center;
	gap: 8px;
}

/* 그리드 본문 3행(40px×3) + 헤더는 그리드가 별도 처리 */
#childIssueList {
	width: 100%;
}
</style>
</th:block>
</head>
<body>
<div layout:fragment="content">
<div class="issue-shell">
<div class="issue-inner">
	<div class="back-row">
		<a th:href="@{/project/issue/list}">← 이슈 목록</a>
	</div>

	<p th:if="${issue == null}" style="padding:24px 0;color:#666;">이슈를 찾을 수 없습니다.</p>

	<th:block th:if="${issue != null}">
	<div class="page-title-row">
		<h1 class="page-title" th:text="${issue.subject != null and !#strings.isEmpty(issue.subject)} ? ${issue.subject} : '제목 없음'">제목명</h1>
		<a class="issue-register-btn" th:href="@{/project/issue/register(id=${issue.id})}"
			th:if="${@prjAuth.hasRole('ROLE_ISSUE_UPDATE')}">이슈 수정</a>
	</div>

	<div class="meta-grid">
		<div class="meta-item">
			<label>설명</label>
			<textarea readonly th:text="${issue.description}">설명</textarea>
		</div>
		<div class="meta-item">
			<label>상위 이슈</label>
			<th:block th:if="${ParentIssue != null and ParentIssue.id != null}">
				<a class="parent-issue-link" th:href="@{/project/issue/detail(id=${ParentIssue.id})}"
					th:text="${ParentIssue.subject != null and !#strings.isEmpty(ParentIssue.subject)} ? ${ParentIssue.subject} : '제목 없음'">상위 이슈</a>
			</th:block>
			<span class="meta-empty" th:unless="${ParentIssue != null and ParentIssue.id != null}">—</span>
		</div>
		<div class="meta-item">
			<label>상태</label>
			<input type="text" readonly th:value="${issue.statusCd ?: '—'}" />
		</div>
		<div class="meta-item">
			<label>담당자</label>
			<input type="text" readonly th:value="${issue.memName != null ? issue.memName : '—'}" />
		</div>
		<div class="meta-item">
			<label>시작 예정일</label>
			<input type="text" readonly
				th:value="${issue.estStartDate != null ? #dates.format(issue.estStartDate, 'yyyy-MM-dd') : '—'}" />
		</div>
		<div class="meta-item">
			<label>종료 예정일</label>
			<input type="text" readonly
				th:value="${issue.dueDate != null ? #dates.format(issue.dueDate, 'yyyy-MM-dd') : '—'}" />
		</div>
		<div class="meta-item">
			<label>시작일</label>
			<input type="text" readonly
				th:attr="data-server-date=${issue.startDate != null ? #dates.format(issue.startDate, 'yyyy-MM-dd''T''HH:mm:ss''Z''') : ''}" />
		</div>
		<div class="meta-item">
			<label>종료일</label>
			<input type="text" readonly
				th:attr="data-server-date=${issue.closedDate != null ? #dates.format(issue.closedDate, 'yyyy-MM-dd''T''HH:mm:ss''Z''') : ''}" />
		</div>
		<div class="meta-item">
			<label>우선순위</label>
			<input type="text" readonly class="short" th:value="${issue.priorityCd ?: '—'}" />
		</div>
		<div class="meta-item">
			<label>진척률</label>
			<input type="text" readonly class="short"
				th:value="${issue.doneRatio != null ? issue.doneRatio + '%' : '—'}" />
		</div>
	</div>

	<div class="section-block" id="attachSection">
		<div class="section-head">
			<span>첨부파일</span>
			<span class="badge-count" th:text="${attachments != null ? #lists.size(attachments) : 0}">0</span>
		</div>
		<div class="attach-list" th:if="${attachments == null or attachments.isEmpty()}">
			<p style="font-size:13px;color:#666;padding:8px 0;">첨부된 파일이 없습니다.</p>
		</div>
		<div id="attachListScroll" class="attach-list-scroll-wrap is-collapsed"
			th:if="${attachments != null and !attachments.isEmpty()}">
			<div class="attach-list attach-list--grid">
				<span class="attach-item" th:each="a : ${attachments}">
					<span class="attach-item-name" th:text="${a.fileName != null ? a.fileName : a.diskFileName}">파일명</span>
					<span class="attach-item-actions">
						<a th:href="@{/download/{id}(id=${a.id})}" title="다운로드">⬇</a>
						<button type="button" class="attach-delete-btn" title="삭제" aria-label="첨부 삭제"
							th:if="${@prjAuth.hasRole('ROLE_ISSUE_UPDATE')}"
							th:attr="data-attach-id=${a.id}">&times;</button>
					</span>
				</span>
			</div>
		</div>
		<button type="button" id="attachListToggle" class="attach-list-toggle" hidden
			aria-controls="attachListScroll" aria-expanded="false">더보기</button>
	</div>

	<div class="section-block">
		<div class="section-head">
			<span>하위이슈</span>
			<span class="badge-count" id="childIssueBadge" th:text="${childIssueTotal != null ? childIssueTotal : 0}">0</span>
		</div>
		<div id="childIssueList"></div>
	</div>

	<div class="tab-row" role="tablist">
		<button type="button" class="tab-btn is-active" role="tab" aria-selected="true" data-tab="comments">
			댓글 <span class="badge-count" id="commentCountBadge">0</span>
		</button>
		<button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="related">연관된 이슈</button>
		<button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="history" th:if="${@prjAuth.hasRole('ROLE_HISTORY_VIEW')}">히스토리</button>
	</div>

	<div class="tab-panel-wrap" id="tabPanels">
		<div class="tab-panel is-visible" id="panel-comments" role="tabpanel" data-panel="comments">
			<div class="comment-thread">
				<div class="comment-thread-scroll" id="commentThreadScroll">
					<p style="font-size:13px;color:#666;padding:8px 0;">댓글을 불러오는 중입니다.</p>
				</div>
			</div>
			<div class="comment-form-wrap">
				<div class="reply-hint-row" id="replyHintRow" hidden>
					<span id="replyHintText"></span>
					<button type="button" id="cancelReplyBtn">답글 취소</button>
				</div>
				<form class="comment-form" id="issueCommentForm" th:data-issue-id="${issue.id}">
					<input type="hidden" name="issueId" th:value="${issue.id}" />
					<input type="hidden" name="parentId" id="commentParentId" value="" />
					<textarea name="content" placeholder="댓글 내용" required></textarea>
					<button type="submit">등록</button>
				</form>
			</div>
		</div>

		<div class="tab-panel" id="panel-related" role="tabpanel" data-panel="related" hidden>
			<div class="inner-table-title">
				<span>연관된 이슈</span>
				<span class="badge-count" id="relatedIssueCountBadge">0</span>
			</div>
			<table class="data-table">
				<thead>
					<tr>
						<th>이슈명</th>
						<th>이슈상태</th>
						<th>담당자</th>
					</tr>
				</thead>
				<tbody id="relatedIssueTbody">
					<tr>
						<td colspan="3" style="color:#666;">연관 이슈를 불러오는 중입니다.</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="tab-panel" id="panel-history" role="tabpanel" data-panel="history" hidden th:if="${@prjAuth.hasRole('ROLE_HISTORY_VIEW')}">
			<div class="inner-table-title">
				<span>히스토리</span>
				<span class="badge-count" id="historyCountBadge">0</span>
			</div>
			<table class="data-table">
				<thead>
					<tr>
						<th>일시</th>
						<th>수정자</th>
						<th>내용</th>
					</tr>
				</thead>
				<tbody id="historyTbody">
					<tr>
						<td colspan="3" style="color:#666;">히스토리를 불러오는 중입니다.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
	</th:block>
</div>
</div>

<th:block th:replace="~{project/history/modal/historyDetail :: historyDetailModal}"></th:block>
<th:block th:replace="~{project/history/modal/historyDetail :: historyDetailModalScript}"></th:block>

<script th:inline="javascript">
(function () {
	// 서버에서 data-server-date 속성으로 내려준 날짜를 dateUtils.format 으로 일괄 변환
	// - input/textarea: value 에 세팅, 그 외 요소: textContent 에 세팅
	// - 기본 포맷은 'YYYY-MM-DD HH:mm', data-date-format 속성으로 개별 지정 가능
	function applyServerDates(scope) {
		var root = scope || document;
		root.querySelectorAll('[data-server-date]').forEach(function (el) {
			var raw = el.getAttribute('data-server-date');
			var fmt = el.getAttribute('data-date-format') || 'YYYY-MM-DD HH:mm';
			var out = raw ? dateUtils.format(raw, fmt) : '—';
			if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
				el.value = out;
			} else {
				el.textContent = out;
			}
		});
	}
	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', function () { applyServerDates(); });
	} else {
		applyServerDates();
	}
})();

(function () {
	var tabs = document.querySelectorAll('.tab-btn');
	var panels = document.querySelectorAll('.tab-panel');

	function activate(name) {
		tabs.forEach(function (btn) {
			var on = btn.getAttribute('data-tab') === name;
			btn.classList.toggle('is-active', on);
			btn.setAttribute('aria-selected', on ? 'true' : 'false');
		});
		panels.forEach(function (panel) {
			var on = panel.getAttribute('data-panel') === name;
			panel.classList.toggle('is-visible', on);
			if (on) {
				panel.removeAttribute('hidden');
			} else {
				panel.setAttribute('hidden', 'hidden');
			}
		});
	}

	tabs.forEach(function (btn) {
		btn.addEventListener('click', function () {
			activate(btn.getAttribute('data-tab'));
		});
	});

})();

(function () {
	var panel = document.getElementById('panel-related');
	var tbody = document.getElementById('relatedIssueTbody');
	var countBadge = document.getElementById('relatedIssueCountBadge');
	var form = document.getElementById('issueCommentForm');
	if (!panel || !tbody || !form) return;

	var issueId = form.getAttribute('data-issue-id');
	var loaded = false;
	var tokenMeta = document.querySelector('meta[name="_csrf"]');
	var headerMeta = document.querySelector('meta[name="_csrf_header"]');

	function getCsrfHeaders() {
		var headers = {};
		if (tokenMeta && headerMeta) {
			headers[headerMeta.content] = tokenMeta.content;
		}
		return headers;
	}

	function escapeHtml(value) {
		return String(value == null ? '' : value)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#39;');
	}

	function renderEmpty(message) {

(function () {
	var panel = document.getElementById('panel-history');

	var form = document.getElementById('issueCommentForm');
	if (!panel || !tbody || !form) return;

	var issueId = form.getAttribute('data-issue-id');
	var loaded = false;
	var historyRows = [];
	var tokenMeta = document.querySelector('meta[name="_csrf"]');
	var headerMeta = document.querySelector('meta[name="_csrf_header"]');

	function getCsrfHeaders() {
		var headers = {};
		if (tokenMeta && headerMeta) {
			headers[headerMeta.content] = tokenMeta.content;
		}
		return headers;
	}

	function escapeHtml(value) {
		return String(value == null ? '' : value)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#39;');
	}

	function formatHistoryDate(value) {
		return value ? dateUtils.format(value, 'YYYY-MM-DD HH:mm') : '—';
	}

	function resolveHistoryId(row) {
		if (!row) return null;
		var raw = row.historyId != null ? row.historyId : row.id;
		if (raw == null || raw === '') return null;
		var n = Number(raw);
		return Number.isFinite(n) ? n : null;
	}

	function openHistoryDetailModal(historyId, row) {
		if (historyId == null) return;
		var summaryParts = [];
		if (row && row.updatedOn) summaryParts.push(formatHistoryDate(row.updatedOn));
		if (row && row.modifierName) {
			summaryParts.push(row.modifierName);
		} else if (row && row.userId != null) {
			summaryParts.push('사용자 #' + row.userId);
		}
		if (row && row.detail) summaryParts.push(row.detail);
		if (window.HistoryDetailModal && typeof window.HistoryDetailModal.open === 'function') {
			window.HistoryDetailModal.open({
				historyId: historyId,
				summary: summaryParts.join(' · ')
			});
		}
	}

	function renderDetailCell(row) {
		var text = row.detail == null ? '' : String(row.detail);
		var historyId = resolveHistoryId(row);
		if (!text || historyId == null) {
			return escapeHtml(text || '—');
		}
		return '<span class="history-detail-link" role="button" tabindex="0" data-history-id="'
			+ historyId + '">' + escapeHtml(text) + '</span>';
	}

	function renderEmpty(message) {
		tbody.innerHTML = '<tr><td colspan="3" style="color:#666;">' + escapeHtml(message) + '</td></tr>';
		if (countBadge) {
			countBadge.textContent = '0';
		}
	}

	function renderHistory(rows) {
		historyRows = Array.isArray(rows) ? rows : [];
		if (historyRows.length === 0) {
			renderEmpty('등록된 히스토리가 없습니다.');
			return;
		}

		tbody.innerHTML = historyRows.map(function (row) {
			var updatedOn = escapeHtml(formatHistoryDate(row.updatedOn));
			var modifier = escapeHtml(row.modifierName || (row.userId != null ? ('사용자 #' + row.userId) : '—'));
			return '<tr>'
				+ '<td>' + updatedOn + '</td>'
				+ '<td>' + modifier + '</td>'
				+ '<td>' + renderDetailCell(row) + '</td>'
				+ '</tr>';
		}).join('');

		if (countBadge) {
			countBadge.textContent = String(historyRows.length);
		}
	}

	function handleHistoryDetailActivate(linkEl) {
		if (!linkEl) return;
		var historyId = Number(linkEl.getAttribute('data-history-id'));
		if (!Number.isFinite(historyId) || historyId <= 0) return;
		var row = historyRows.find(function (item) {
			return resolveHistoryId(item) === historyId;
		});
		openHistoryDetailModal(historyId, row);
	}

	tbody.addEventListener('click', function (e) {
		var linkEl = e.target.closest('[data-history-id]');
		if (!linkEl) return;
		handleHistoryDetailActivate(linkEl);
	});

	tbody.addEventListener('keydown', function (e) {
		if (e.key !== 'Enter' && e.key !== ' ') return;
		var linkEl = e.target.closest('[data-history-id]');
		if (!linkEl) return;
		e.preventDefault();
		handleHistoryDetailActivate(linkEl);
	});

	function parseError(res) {
		return res.text().then(function (text) {
			if (!text) {
				return '히스토리 조회에 실패했습니다.';
			}
			try {
				var data = JSON.parse(text);
				return data.message || '히스토리 조회에 실패했습니다.';
			} catch (e) {
				return text;
			}
		});
	}

	function loadHistory() {
		if (!issueId) {
			renderEmpty('이슈 정보를 확인할 수 없습니다.');
			return;
		}
		if (loaded) {
			return;
		}
		loaded = true;

		tbody.innerHTML = '<tr><td colspan="3" style="color:#666;">히스토리를 불러오는 중입니다.</td></tr>';

		fetch('/project/issue/api/' + encodeURIComponent(issueId) + '/history', {
			method: 'GET',
			headers: getCsrfHeaders()
		})
			.then(function (res) {
				if (!res.ok) {
					loaded = false;
					return parseError(res).then(function (message) {
						throw new Error(message);
					});
				}
				return res.json();
			})
			.then(renderHistory)
			.catch(function (err) {
				renderEmpty(err && err.message ? err.message : '히스토리 조회에 실패했습니다.');
			});
	}

	document.querySelectorAll('.tab-btn[data-tab="history"]').forEach(function (btn) {
		btn.addEventListener('click', loadHistory);
	});

	if (panel.classList.contains('is-visible')) {
		loadHistory();
	}
})();

(function () {
	var panel = document.getElementById('panel-comments');
	if (!panel) return;

	var form = document.getElementById('issueCommentForm');
	var threadScroll = document.getElementById('commentThreadScroll');
	var parentInput = document.getElementById('commentParentId');
	var hintRow = document.getElementById('replyHintRow');
	var hintText = document.getElementById('replyHintText');
	var cancelBtn = document.getElementById('cancelReplyBtn');
	var countBadge = document.getElementById('commentCountBadge');
	if (!form || !threadScroll || !parentInput) return;

	var issueId = form.getAttribute('data-issue-id');
	var textarea = form.querySelector('textarea[name="content"]');
	var tokenMeta = document.querySelector('meta[name="_csrf"]');
	var headerMeta = document.querySelector('meta[name="_csrf_header"]');

	function getCsrfHeaders() {
		var headers = {};
		if (tokenMeta && headerMeta) {
			headers[headerMeta.content] = tokenMeta.content;
		}
		return headers;
	}

	function escapeHtml(value) {
		return String(value == null ? '' : value)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#39;');
	}

	function layoutCommentThreadScroll() {
		var items = threadScroll.querySelectorAll(':scope > .comment');
		if (items.length <= 3) {
			threadScroll.style.maxHeight = '';
			threadScroll.style.overflowY = '';
			return;
		}
		var r0 = items[0].getBoundingClientRect();
		var r2 = items[2].getBoundingClientRect();
		var h = r2.bottom - r0.top;
		threadScroll.style.maxHeight = Math.ceil(h) + 'px';
		threadScroll.style.overflowY = 'auto';
	}

	function clearReplyTarget() {
		parentInput.value = '';
		if (hintText) {
			hintText.textContent = '';
		}
		if (hintRow) {
			hintRow.hidden = true;
		}
	}

	function setReplyTarget(commentId, commentNum) {
		parentInput.value = commentId;
		if (hintText) {
			if (commentNum != null && String(commentNum).length) {
				hintText.textContent = commentNum + '번 댓글에 댓글 작성중';
			} else {
				hintText.textContent = '선택한 댓글에 댓글 작성중';
			}
		}
		if (hintRow) {
			hintRow.hidden = false;
		}
		if (textarea) {
			textarea.focus();
		}
	}

	function renderEmpty(message) {
		threadScroll.innerHTML = '<p style="font-size:13px;color:#666;padding:8px 0;">'
			+ escapeHtml(message) + '</p>';
		if (countBadge) {
			countBadge.textContent = '0';
		}
		layoutCommentThreadScroll();
	}

	function formatCommentDate(value) {
		return value ? dateUtils.format(value, 'YYYY-MM-DD HH:mm') : '—';
	}

	function renderComments(comments) {
		if (!Array.isArray(comments) || comments.length === 0) {
			renderEmpty('등록된 댓글이 없습니다.');
			return;
		}

		var html = comments.map(function (comment, index) {
			var depth = Number(comment.depth || 1);
			var indent = depth > 1 ? (depth - 1) * 16 : 0;
			var className = 'comment' + (depth > 1 ? ' is-reply' : '');
			var author = escapeHtml(comment.memId || '—');
			var writeDate = escapeHtml(formatCommentDate(comment.writeDate));
			var content = escapeHtml(comment.content || '').replace(/\r?\n/g, '<br>');
			var replyButton = comment.id != null
				? '<div class="comment-actions">'
					+ '<button type="button" class="btn-reply" data-comment-id="' + escapeHtml(comment.id)
					+ '" data-comment-num="' + (index + 1) + '">댓글달기</button>'
				+ '</div>'
				: '';

			return '<div class="' + className + '" style="margin-left:' + indent + 'px">'
				+ '<div class="meta">'
				+ '<span class="comment-num">' + (index + 1) + '번 댓글</span>'
				+ '<strong>' + author + '</strong>'
				+ '<span>' + writeDate + '</span>'
				+ '</div>'
				+ '<div>' + content + '</div>'
				+ replyButton
				+ '</div>';
		}).join('');

		threadScroll.innerHTML = html;
		if (countBadge) {
			countBadge.textContent = String(comments.length);
		}
		layoutCommentThreadScroll();
	}

	function parseError(res) {
		return res.text().then(function (text) {
			if (!text) {
				return '요청 처리에 실패했습니다.';
			}
			try {
				var data = JSON.parse(text);
				return data.message || '요청 처리에 실패했습니다.';
			} catch (e) {
				return text;
			}
		});
	}

	function loadComments() {
		if (!issueId) {
			renderEmpty('이슈 정보를 확인할 수 없습니다.');
			return Promise.resolve();
		}

		threadScroll.innerHTML = '<p style="font-size:13px;color:#666;padding:8px 0;">댓글을 불러오는 중입니다.</p>';

		return fetch('/project/issue/api/' + encodeURIComponent(issueId) + '/comments', {
			method: 'GET',
			headers: getCsrfHeaders()
		})
			.then(function (res) {
				if (!res.ok) {
					return parseError(res).then(function (message) {
						throw new Error(message);
					});
				}
				return res.json();
			})
			.then(renderComments)
			.catch(function (err) {
				renderEmpty(err && err.message ? err.message : '댓글 조회에 실패했습니다.');
			});
	}

	panel.addEventListener('click', function (e) {
		var btn = e.target.closest('.btn-reply');
		if (!btn) return;
		var cid = btn.getAttribute('data-comment-id');
		if (!cid) return;
		setReplyTarget(cid, btn.getAttribute('data-comment-num'));
	});

	if (cancelBtn) {
		cancelBtn.addEventListener('click', clearReplyTarget);
	}

	form.addEventListener('submit', function (e) {
		e.preventDefault();

		var content = textarea ? textarea.value.trim() : '';
		if (!content) {
			alert('댓글 내용을 입력해주세요.');
			if (textarea) {
				textarea.focus();
			}
			return;
		}

		var headers = getCsrfHeaders();
		headers['Content-Type'] = 'application/json';

		fetch('/project/issue/api/' + encodeURIComponent(issueId) + '/comments', {
			method: 'POST',
			headers: headers,
			body: JSON.stringify({
				parentId: parentInput.value ? Number(parentInput.value) : null,
				content: content
			})
		})
			.then(function (res) {
				if (!res.ok) {
					return parseError(res).then(function (message) {
						throw new Error(message);
					});
				}
				return res.json();
			})
			.then(function () {
				if (textarea) {
					textarea.value = '';
				}
				clearReplyTarget();
				return loadComments();
			})
			.catch(function (err) {
				alert(err && err.message ? err.message : '댓글 등록에 실패했습니다.');
			});
	});

	window.addEventListener('resize', layoutCommentThreadScroll);
	loadComments();
})();

(function () {
	var ATTACH_COLS = 3;
	var ATTACH_VISIBLE_ROWS = 2;
	var ATTACH_MAX_VISIBLE = ATTACH_COLS * ATTACH_VISIBLE_ROWS;

	function getCollapsedHeight(wrap) {
		var items = wrap.querySelectorAll('.attach-item');
		if (items.length <= ATTACH_MAX_VISIBLE) return null;
		var top = items[0].getBoundingClientRect().top;
		var bottom = items[0].getBoundingClientRect().bottom;
		var limit = Math.min(ATTACH_MAX_VISIBLE, items.length);
		for (var i = 1; i < limit; i++) {
			bottom = Math.max(bottom, items[i].getBoundingClientRect().bottom);
		}
		return Math.ceil(bottom - top);
	}

	function updateToggleLabel(btn, total, expanded) {
		if (expanded) {
			btn.textContent = '접기';
			btn.setAttribute('aria-expanded', 'true');
			return;
		}
		var hidden = total - ATTACH_MAX_VISIBLE;
		btn.textContent = '+' + hidden + '개 더보기';
		btn.setAttribute('aria-expanded', 'false');
	}

	function layoutAttachList() {
		var wrap = document.getElementById('attachListScroll');
		var btn = document.getElementById('attachListToggle');
		if (!wrap) return;

		var items = wrap.querySelectorAll('.attach-item');
		var total = items.length;
		var expanded = wrap.classList.contains('is-expanded');

		if (total <= ATTACH_MAX_VISIBLE) {
			wrap.classList.remove('is-collapsed', 'is-expanded');
			wrap.style.maxHeight = '';
			if (btn) btn.hidden = true;
			return;
		}

		if (btn) {
			btn.hidden = false;
			updateToggleLabel(btn, total, expanded);
		}

		if (expanded) {
			wrap.style.maxHeight = '';
			return;
		}

		wrap.classList.add('is-collapsed');
		var h = getCollapsedHeight(wrap);
		if (h) wrap.style.maxHeight = h + 'px';
	}

	function initAttachListToggle() {
		var wrap = document.getElementById('attachListScroll');
		var btn = document.getElementById('attachListToggle');
		if (!wrap) return;

		if (btn) {
			btn.addEventListener('click', function () {
				var expanded = !wrap.classList.contains('is-expanded');
				wrap.classList.toggle('is-expanded', expanded);
				wrap.classList.toggle('is-collapsed', !expanded);
				layoutAttachList();
			});
		}

		layoutAttachList();
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', initAttachListToggle);
	} else {
		initAttachListToggle();
	}
	window.addEventListener('resize', layoutAttachList);
})();

(function () {
	function initAttachDelete() {
		var section = document.getElementById('attachSection');
		if (!section) return;

		var tokenMeta = document.querySelector('meta[name="_csrf"]');

		section.addEventListener('click', function (e) {
			var btn = e.target.closest('.attach-delete-btn');

			var id = btn.getAttribute('data-attach-id');
			if (!id) return;
			var headers = {};

			fetch('/delete/' + encodeURIComponent(id), { method: 'DELETE', headers: headers })

					if (!res.ok) throw new Error('delete failed');
					alert('첨부파일이 삭제되었습니다.');

				})
				.catch(function () {
					alert('첨부파일 삭제에 실패했습니다.');
				});
		});
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', initAttachDelete);
	} else {
		initAttachDelete();
	}
})();
