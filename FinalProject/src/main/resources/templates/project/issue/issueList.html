<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>이슈 목록</title>
<th:block layout:fragment="head-content">
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
  <!--
    TOAST UI Grid 페이징은 tui-pagination 에 의존합니다.
    CDN 사용 시 반드시 tui-pagination(.js) 을 tui-grid.js 보다 먼저 로드해야
    하단 페이지 네비게이션이 생성됩니다. (공식 pagination.md 참고)
  -->
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
  <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

<style>
/* 검색 영역 */
.search-area {
	display: flex;
	flex-wrap: nowrap;
	align-items: center;
	gap: 12px;
	padding-bottom: 20px;
	border-bottom: 1px solid #eee;
	margin-bottom: 20px;
	overflow-x: auto;
}

.search-item {
	display: flex;
	align-items: center;
	gap: 6px;
	flex-shrink: 0;
}

.search-item label {
	font-weight: 600;
	font-size: 13px;
	color: #555;
	white-space: nowrap;
}

.search-item select, .search-item input[type="text"] {
	height: 32px;
	padding: 0 8px;
	border: 1px solid #ccc;
	border-radius: 4px;
	font-size: 13px;
	background-color: #fff;
	min-width: 90px;
}

.search-item input[type="text"] {
	min-width: 160px;
}

.checkbox-item {
	display: flex;
	align-items: center;
	gap: 4px;
	font-size: 13px;
	white-space: nowrap;
	flex-shrink: 0;
}

.search-btn {
	height: 32px;
	padding: 0 16px;
	background-color: #5b6cff;
	color: #fff;
	border: none;
	border-radius: 4px;
	font-size: 13px;
	cursor: pointer;
	font-weight: 600;
	white-space: nowrap;
	flex-shrink: 0;
}

.search-btn:hover {
	background-color: #4956d8;
}

.search-cancel-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	height: 32px;
	padding: 0 16px;
	background-color: #fff;
	color: #555;
	border: 1px solid #ccc;
	border-radius: 4px;
	font-size: 13px;
	cursor: pointer;
	font-weight: 600;
	white-space: nowrap;
	flex-shrink: 0;
	text-decoration: none;
}

.search-cancel-btn:hover {
	background-color: #f5f5f5;
	color: #333;
}

.right-area {
	margin-left: auto;
	display: flex;
	align-items: center;
	gap: 10px;
	flex-shrink: 0;
}

/* TOAST UI Grid 컨테이너 */
#grid {
	margin-top: 8px;
}

.issue-register-actions {
	margin-top: 18px;
	text-align: right;
	display: flex;
	justify-content: flex-end;
	gap: 10px;
}

.issue-register-btn {
	display: inline-block;
	padding: 10px 22px;
	background-color: #5b6cff;
	color: #fff;
	border: none;
	border-radius: 4px;
	font-size: 14px;
	font-weight: 600;
	text-decoration: none;
	cursor: pointer;
}

.issue-register-btn:hover {
	background-color: #4956d8;
	color: #fff;
}

.issue-pivot-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: 10px 18px;
	background-color: #fff;
	color: #444;
	border: 1px solid #c8cce8;
	border-radius: 4px;
	font-size: 14px;
	font-weight: 700;
	text-decoration: none;
	cursor: pointer;
}

.issue-pivot-btn:hover {
	background-color: #f5f6ff;
	border-color: #5b6cff;
	color: #3d44a8;
}

.issue-date-actions {
	display: flex;
	justify-content: flex-end;
	align-items: center;
	gap: 4px;
}

.issue-date-btn {
	height: 26px;
	padding: 0 8px;
	border: 1px solid #c8cce8;
	border-radius: 4px;
	background-color: #f5f6ff;
	color: #4a5080;
	font-size: 11px;
	font-weight: 600;
	cursor: pointer;
	white-space: nowrap;
}

.issue-date-btn:hover {
	background-color: #e8ebff;
	border-color: #5b6cff;
	color: #3d44a8;
}

.issue-date-btn:disabled {
	background-color: #f0f0f0;
	border-color: #ddd;
	color: #999;
	cursor: not-allowed;
	opacity: 0.75;
}

.issue-date-btn:disabled:hover {
	background-color: #f0f0f0;
	border-color: #ddd;
	color: #999;
}

/* 일괄 선택 · 빠른수정 */
.issue-bulk-bar {
	display: none;
	align-items: center;
	gap: 12px;
	flex-wrap: wrap;
	margin: 12px 0 8px;
	padding: 10px 14px;
	background: #eef0ff;
	border: 1px solid #d8dcff;
	border-radius: 6px;
	font-size: 13px;
	color: #333;
}

.issue-bulk-bar.is-visible {
	display: flex;
}

.issue-bulk-bar .bulk-count {
	font-weight: 700;
	color: #3d44a8;
}

.issue-bulk-btn {
	height: 32px;
	padding: 0 16px;
	border: none;
	border-radius: 4px;
	font-size: 13px;
	font-weight: 600;
	cursor: pointer;
	white-space: nowrap;
}

.issue-bulk-btn-primary {
	background: #5b6cff;
	color: #fff;
}

.issue-bulk-btn-primary:hover:not(:disabled) {
	background: #4956d8;
}

.issue-bulk-btn-primary:disabled {
	background: #b8bdf5;
	cursor: not-allowed;
}

.issue-bulk-btn-ghost {
	background: #fff;
	color: #555;
	border: 1px solid #ccc;
}

.issue-bulk-btn-ghost:hover {
	background: #f5f5f5;
}

.issue-quick-btn {
	height: 26px;
	padding: 0 10px;
	border: 1px solid #c8cce8;
	border-radius: 4px;
	background: #fff;
	color: #4a5080;
	font-size: 11px;
	font-weight: 600;
	cursor: pointer;
	white-space: nowrap;
}

.issue-quick-btn:hover {
	background: #f5f6ff;
	border-color: #5b6cff;
	color: #3d44a8;
}

.issue-row-check {
	width: 16px;
	height: 16px;
	cursor: pointer;
	accent-color: #5b6cff;
}

/* 빠른수정 모달 */
.issue-quick-modal-backdrop {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 1200;
	background: rgba(0, 0, 0, 0.4);
	align-items: center;
	justify-content: center;
	padding: 16px;
}

.issue-quick-modal-backdrop.is-open {
	display: flex;
}

.issue-quick-modal {
	width: 100%;
	max-width: 440px;
	background: #fff;
	border-radius: 8px;
	box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
	overflow: hidden;
}

.issue-quick-modal-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 16px 20px;
	border-bottom: 1px solid #eee;
}

.issue-quick-modal-head h2 {
	margin: 0;
	font-size: 17px;
	font-weight: 700;
	color: #222;
}

.issue-quick-modal-close {
	border: none;
	background: transparent;
	font-size: 22px;
	line-height: 1;
	color: #888;
	cursor: pointer;
	padding: 0 4px;
}

.issue-quick-modal-close:hover {
	color: #333;
}

.issue-quick-modal-body {
	padding: 18px 20px 8px;
}

.issue-quick-field {
	margin-bottom: 14px;
}

.issue-quick-field label {
	display: block;
	font-size: 12px;
	font-weight: 600;
	color: #555;
	margin-bottom: 6px;
}

.issue-quick-field select {
	width: 100%;
	height: 36px;
	padding: 0 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	font-size: 13px;
	background: #fff;
}

.issue-quick-hint {
	font-size: 12px;
	color: #666;
	line-height: 1.5;
	margin: 0 0 12px;
	padding: 10px 12px;
	background: #f7f8fc;
	border-radius: 4px;
	border: 1px solid #e8e9ef;
}

.issue-quick-hint.is-warn {
	background: #fff8e6;
	border-color: #f0e0b0;
	color: #7a5c00;
}

.issue-quick-target-block {
	margin-bottom: 16px;
	padding: 12px 14px;
	background: #f7f8fc;
	border: 1px solid #e8e9ef;
	border-radius: 6px;
}

.issue-quick-target-head {
	display: flex;
	align-items: center;
	gap: 6px;
	margin-bottom: 8px;
	font-size: 12px;
	font-weight: 600;
	color: #555;
}

.issue-quick-target-count {
	color: #3d44a8;
	font-weight: 700;
}

.issue-quick-target-list {
	margin: 0;
	padding: 0 0 0 18px;
	max-height: 140px;
	overflow-y: auto;
	font-size: 13px;
	color: #333;
	line-height: 1.55;
}

.issue-quick-target-list li {
	margin-bottom: 4px;
	word-break: break-all;
}

.issue-quick-target-list li:last-child {
	margin-bottom: 0;
}

.issue-quick-date-panel {
	margin-bottom: 14px;
	padding: 12px 14px;
	background: #fff8e6;
	border: 1px solid #f0e0b0;
	border-radius: 6px;
	font-size: 12px;
	color: #444;
}

.issue-quick-date-summary {
	font-weight: 700;
	color: #7a5c00;
	margin-bottom: 10px;
}

.issue-quick-date-section {
	margin-top: 8px;
}

.issue-quick-date-section-title {
	font-weight: 600;
	font-size: 12px;
	color: #555;
	margin-bottom: 4px;
}

.issue-quick-date-section-title.is-ok {
	color: #2e7d32;
}

.issue-quick-date-section-title.is-skip {
	color: #c62828;
}

.issue-quick-date-detail-list {
	margin: 0;
	padding: 0 0 0 16px;
	max-height: 100px;
	overflow-y: auto;
	line-height: 1.5;
}

.issue-quick-date-detail-list li {
	margin-bottom: 6px;
	word-break: break-all;
}

.issue-quick-date-detail-list li.issue-quick-date-excluded-item {
	list-style: none;
	margin-left: -16px;
	padding-left: 0;
}

.issue-quick-date-issue {
	display: block;
	font-size: 13px;
	color: #333;
}

.issue-quick-date-reason {
	display: block;
	font-size: 11px;
	color: #c62828;
	margin-top: 2px;
}

.issue-quick-date-empty {
	list-style: none;
	margin-left: -16px;
	color: #888;
	font-size: 12px;
}

.issue-quick-modal-foot {
	display: flex;
	justify-content: flex-end;
	gap: 8px;
	padding: 12px 20px 18px;
}

.issue-quick-modal-foot .issue-bulk-btn {
	min-width: 72px;
}
</style>
</th:block>
</head>
<body>
<div layout:fragment="content">
	<div class="issue-shell">
	<div class="issue-inner">
		<!-- 1. 검색 영역 (form 으로 감싸서 GET submit) -->
		<form id="searchForm" th:action="@{/project/issue/list}" method="get"
			th:object="${filter}" class="search-area">
			<div class="search-item">
				<label for="categoryCd">유형</label>
				<select id="categoryCd" th:field="*{categoryCd}">
					<option value="">미선택</option>
					<option value="01ISSUECATE">버그</option>
					<option value="02ISSUECATE">기능</option>
					<option value="03ISSUECATE">작업</option>
					<option value="04ISSUECATE">개선</option>
				</select>
			</div>
			<div class="search-item">
				<label for="priorityCd">우선순위</label>
				<select id="priorityCd" th:field="*{priorityCd}">
					<option value="">미선택</option>
					<option value="01ISSUEPRI">최상</option>
					<option value="02ISSUEPRI">상</option>
					<option value="03ISSUEPRI">중</option>
					<option value="04ISSUEPRI">하</option>
				</select>
			</div>

			<div class="search-item">
				<label for="statusCd">상태</label>
				<select id="statusCd" th:field="*{statusCd}">
					<option value="">미선택</option>
					<option value="01ISSUESTAT">신규</option>
					<option value="02ISSUESTAT">진행중</option>
					<option value="03ISSUESTAT">검토</option>
					<option value="04ISSUESTAT">완료</option>
				</select>
			</div>

			<div class="search-item">
				<label for="memId">담당자</label>
				<select id="memId" th:field="*{memId}">
					<option value="">미선택</option>
					<option th:each="member : ${members}"
						th:value="${member.userId}"
						th:text="${member.userName}">담당자</option>
				</select>
			</div>

			<div class="right-area">
				<div class="search-item">
					<label for="subject">제목</label>
					<input type="text" id="subject" th:field="*{subject}"
						placeholder="텍스트를 입력해 주세요." />
				</div>

				<label class="checkbox-item">
					<input type="checkbox" id="myIssue" name="myIssue" value="Y"
						th:checked="*{myIssue == 'Y'}" /> 내가 맡은 이슈
				</label>

				<button type="submit" class="search-btn">검색</button>
				<a th:href="@{/project/issue/list}" class="search-cancel-btn">취소</a>
			</div>
		</form>

		<!-- 1건 이상 선택 시 표시 · 일괄 빠른수정 -->
		<div id="issueBulkBar" class="issue-bulk-bar" aria-live="polite"
			th:if="${@prjAuth.hasRole('ROLE_ISSUE_UPDATE')}">
			<span class="bulk-count" id="issueBulkCount">0건 선택</span>
			<button type="button" class="issue-bulk-btn issue-bulk-btn-primary" id="issueBulkQuickBtn" disabled>
				빠른수정
			</button>
			<button type="button" class="issue-bulk-btn issue-bulk-btn-ghost" id="issueBulkClearBtn">
				선택 해제
			</button>
		</div>

		<div id="grid"></div>
		<div class="issue-register-actions">
			<a th:href="@{/project/issue/pivot}" class="issue-pivot-btn"
				th:if="${@prjAuth.hasRole('ROLE_ISSUE_VIEW')}">통계</a>
			<a th:href="@{/project/issue/register}" class="issue-register-btn" th:if="${@prjAuth.hasRole('ROLE_ISSUE_CREATE')}">이슈 등록</a>
		</div>
	</div>
	</div>

	<div th:replace="~{project/issue/modal/issueQuickEditModal :: issueQuickEditModal}"></div>

	<!-- ====================================================
	     서버 데이터를 JS 로 주입 (Thymeleaf inline javascript)
	     - th:inline="javascript" : Thymeleaf 표현식을 JS 안에서 사용 가능하게 함
	     - /*[[${issueList}]]*/ [] : 서버에서 내려준 List<IssueVO>를
	       JS 배열(JSON)로 변환해서 issueData 변수에 담음
	     - /*<![CDATA[*/ ... /*]]>*/ : XML 파싱 오류 방지용 (HTML5 에선 권장 패턴)
	==================================================== -->
	<script th:inline="javascript">
		/*<![CDATA[*/
		const issueData = /*[[${issueList}]]*/ [];
		const LOGIN_MEM_ID = /*[[${(#authentication.principal instanceof T(com.example.demo.login.service.UserVO)) ? #strings.toString(#authentication.principal.id) : ''}]]*/ '';
		const canEdit = /*[[${@prjAuth.hasRole('ROLE_ISSUE_UPDATE')}]]*/ false;
		/*]]>*/
	</script>

	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const myIssueCheckbox = document.getElementById('myIssue');
			const memIdSelect = document.getElementById('memId');
			const searchForm = document.getElementById('searchForm');

			function applyMyIssueState() {
				if (myIssueCheckbox.checked) {
					memIdSelect.value = LOGIN_MEM_ID;
					memIdSelect.disabled = true;
				} else {
					memIdSelect.disabled = false;
				}
			}

			applyMyIssueState();
			myIssueCheckbox.addEventListener('change', applyMyIssueState);

			searchForm.addEventListener('submit', function () {
				if (memIdSelect.disabled) {
					memIdSelect.disabled = false;
				}
			});

			// ============================================================
			// TOAST UI Grid 초기화
			// 공식 문서: https://github.com/nhn/tui.grid
			// ============================================================

			function hasIssueDate(value) {
				if (value == null || value === '') return false;
				const d = new Date(value);
				return !isNaN(d.getTime());
			}

			/**
			 * 우선순위 컬럼 커스텀 정렬 (사전순 X → 업무 순서)
			 * - 화면에는 get_sub_code_name 결과(예: 최상, 상, 중, 하)가 올 수 있고,
			 *   원본 코드가 넘어오는 경우도 함께 처리
			 * - 오름차순: 최상 → 상 → 중 → 하 (긴급도 높은 순)
			 */
			function priorityRank(value) {
				if (value == null || value === '') return 999;
				const key = String(value).trim();
				const order = {
					최상: 1,
					상: 2,
					중: 3,
					하: 4
				};
				// order에 직접 정의된 키인지(hasOwnProperty)만 순위를 부여한다.
				// → 예: 키가 "toString" 등 Object.prototype 이름과 겹치면 잘못된 순위가 되는 것을 방지.
				// 매핑에 없는 값은 999로 두어 오름차순 정렬 시 맨 뒤로 보낸다.
				return order.hasOwnProperty(key) ? order[key] : 999;
			}

			function priorityComparator(valueA, valueB) {
				return priorityRank(valueA) - priorityRank(valueB);
			}

			const QUICK_VALUE_OPTIONS = {
				status: [
					{ code: '01ISSUESTAT', label: '신규' },
					{ code: '02ISSUESTAT', label: '진행중' },
					{ code: '03ISSUESTAT', label: '검토' },
					{ code: '04ISSUESTAT', label: '완료' }
				],
				priority: [
					{ code: '01ISSUEPRI', label: '최상' },
					{ code: '02ISSUEPRI', label: '상' },
					{ code: '03ISSUEPRI', label: '중' },
					{ code: '04ISSUEPRI', label: '하' }
				],
				category: [
					{ code: '01ISSUECATE', label: '버그' },
					{ code: '02ISSUECATE', label: '기능' },
					{ code: '03ISSUECATE', label: '작업' },
					{ code: '04ISSUECATE', label: '개선' }
				]
			};

			const GRID_PER_PAGE = 10;
			const selectedIds = new Set();
			let grid;

			const bulkBar = document.getElementById('issueBulkBar');
			const bulkCountEl = document.getElementById('issueBulkCount');
			const bulkQuickBtn = document.getElementById('issueBulkQuickBtn');
			const bulkClearBtn = document.getElementById('issueBulkClearBtn');

			function syncBulkBar() {
				const n = selectedIds.size;
				bulkBar.classList.toggle('is-visible', n > 0);
				bulkCountEl.textContent = n + '건 선택';
				bulkQuickBtn.disabled = n === 0;
			}

			function refreshSelectColumn() {
				if (!grid) return;
				const currentData = grid.getData();
				const pagination = grid.getPagination();
				const currentPage = pagination ? pagination.getCurrentPage() : 1;
				grid.resetData(currentData, {
					pageState: {
						page: currentPage
					}
				});
			}

			function getCurrentPageRows() {
				if (!grid) return [];
				const all = grid.getData();
				const pagination = grid.getPagination();
				if (!pagination) return all;
				const page = pagination.getCurrentPage();
				const start = (page - 1) * GRID_PER_PAGE;
				return all.slice(start, start + GRID_PER_PAGE);
			}

			function isCurrentPageAllSelected() {
				const pageRows = getCurrentPageRows().filter(function (row) {
					return row.id != null;
				});
				return pageRows.length > 0 && pageRows.every(function (row) {
					return selectedIds.has(row.id);
				});
			}

			function bindSelectHeaderClick() {
				const selectHeaderCell = gridEl.querySelector('th[data-column-name="_select"]');
				if (!selectHeaderCell || selectHeaderCell.dataset.boundClick === 'Y') return;
				selectHeaderCell.style.cursor = 'pointer';
				selectHeaderCell.title = '클릭 시 현재 페이지 전체선택/해제';
				selectHeaderCell.dataset.boundClick = 'Y';
			}

			function getRowByIssueId(id) {
				const rows = grid.getData();
				for (let i = 0; i < rows.length; i++) {
					if (rows[i].id === id) return rows[i];
				}
				return null;
			}

			function formatIssueLabel(id) {
				const row = getRowByIssueId(id);
				const subject = row && row.subject != null && String(row.subject).trim() !== ''
					? String(row.subject).trim()
					: '제목 없음';
				return subject + ' #' + id;
			}

			/**
			 * tui.Grid 인스턴스 생성
			 * - new tui.Grid({ ...옵션 }) 한 번 호출로 그리드가 그려짐
			 */
			const gridColumns = [
				canEdit ? {
					header: '선택',
					name: '_select',
					width: 44,
					align: 'center',
					sortable: false,
					formatter: function (props) {
						const row = props.row;
						const id = row == null ? null : row.id;
						if (id == null) return '';
						const checked = selectedIds.has(id) ? ' checked' : '';
						return '<input type="checkbox" class="issue-row-check" data-id="' + id + '"'
							+ checked + ' aria-label="이슈 선택" />';
					}
				} : null,
				{
					// 제목 컬럼: 클릭 시 상세 페이지로 이동하도록 <a> 태그를 직접 렌더링
					header: '이슈명',
					name: 'subject',
					sortable: true,
					formatter: ({ row, value }) => {
						const id = row.id;                              // 같은 행의 id 값 참조
						const text = value == null ? '' : value + "#" + id;
						return '<a href="/project/issue/detail?id=' + id + '">' + text + '</a>';
					}
				},
				{
					header: '유형',
					name: 'categoryCd',
					width: 72,
					align: 'center',
					sortable: true
				},
				{
					header: '담당자',
					name: 'memName',
					width: 100,
					align: 'center',
					sortable: true
				},
				{
					header: '상태',
					name: 'statusCd',
					width: 100,
					align: 'center',
					sortable: true
				},
				{
					header: '우선순위',
					name: 'priorityCd',
					width: 100,
					align: 'center',
					sortable: true,
					comparator: priorityComparator
				},
				{
					header: '예상시작일',
					name: 'estStartDate',
					width: 120,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
				},
				{
					header: '마감일',
					name: 'dueDate',
					width: 120,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
				},
				{
					header: '시작일',
					name: 'startDate',
					width: 120,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
				},
				{
					header: '종료일',
					name: 'closedDate',
					width: 120,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
				},
				{
					// 수정일: 공통 dateUtils.format 으로 yyyy-MM-dd HH:mm 포맷 출력
					header: '수정일',
					name: 'updatedOn',
					width: 160,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD HH:mm')
				},
				{
					// 진척도: 숫자 뒤에 % 자동 추가
					header: '진척도',
					name: 'doneRatio',
					width: 100,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => (value == null ? '' : value + '%')
				},
				canEdit ? {
					header: '수정',
					name: 'quickActions',
					width: 88,
					align: 'center',
					sortable: false,
					formatter: function (props) {
						const id = props.row == null ? '' : props.row.id;
						if (id == null || id === '') return '';
						return '<button type="button" class="issue-quick-btn" data-id="' + id + '">빠른수정</button>';
					}
				} : null
			].filter(Boolean);

			grid = new tui.Grid({
				// ── 기본 설정 ──────────────────────────────────────────
				el: document.getElementById('grid'), // 그리드를 그릴 DOM 요소 (필수)
				data: issueData,                     // 그리드에 표시할 데이터 배열 (위에서 주입한 issueData)

				// ── 레이아웃 / 스크롤 옵션 ────────────────────────────
				scrollX: false,        // 가로 스크롤바 숨김
				scrollY: false,        // 세로 스크롤바 숨김 (rowHeight × 행수 만큼 자동 확장)
				bodyHeight: 'auto',    // 본문 높이를 데이터 양에 맞춰 자동 조절
				rowHeight: 36,         // 한 행의 높이(px)
				minBodyHeight: 100,    // 데이터 0건일 때 최소 높이(px)

				// ── 컬럼 정의 (가장 핵심) ─────────────────────────────
				// 배열 순서대로 왼쪽부터 표시됨
				// header  : 헤더에 표시되는 한글 라벨
				// name    : data 객체의 어떤 key 와 매핑할지 (예: row.subject)
				// width   : 컬럼 너비(px) — 생략 시 자동 분배
				// align   : 셀 텍스트 정렬 ('left' | 'center' | 'right')
				// sortable: true 면 헤더 클릭으로 정렬 가능 (기본 false)
				// comparator: 정렬 시 사용할 비교 함수 (생략 시 문자/숫자 기본 규칙 = 사전순 등)
				// formatter: 셀 표시값을 가공하는 함수.
				//            ({ row, value, column }) 인자에서
				//              - value  : 해당 셀의 원본 값
				//              - row    : 해당 행 전체 객체 (다른 컬럼 값 접근 가능)
				//            return 문자열(또는 HTML)이 셀에 그대로 렌더링됨
				columns: gridColumns,

				// ═══════════════════════════════════════════════════════════
				// 페이지네이션 (그리드 하단의 페이지 번호 영역 = tui-pagination)
				// - 스크립트: head 에서 tui-pagination.js 를 tui-grid.js 보다 먼저 로드해야
				//   하단 네비게이션 바가 생성됨.
				// - 동작: useClient 가 true 이면 서버에서 내려준 issueData 전체를 메모리에 두고,
				//   그리드는 한 페이지(perPage 행)만 그림. 페이지 클릭 시 서버 재요청 없이
				//   클라이언트에서만 행을 바꿔 보여 줌.
				// - 서버 페이징: useClient 를 끄고 data 대신 dataSource + readData API 를 쓰는
				//   방식(예: tutorial-example10-data-source)은 이 화면에서는 사용하지 않음.
				// ═══════════════════════════════════════════════════════════
				pageOptions: {
					useClient: true,
					perPage: GRID_PER_PAGE

					// ---- 아래는 pageOptions 에서 지원하지만 여기서는 쓰지 않는 옵션 예시 ----
					// page: 1,
					//   초기 활성 페이지 번호(1부터). 생략 시 1.
					// visiblePages: 10,
					//   페이지 번호 버튼을 한 번에 최대 몇 개까지 보일지 (Grid v4.14.0 이상).
					// position: 'bottom',
					//   페이징 바 위치. 'bottom'(기본값) | 'top'(그리드 상단).
				}
			});

			// 참고 (위 pageOptions 와는 별개): 서버 페이징(DataSource)이면 readData 응답의
			// pagination.totalCount 등과 연동하고, resetData 시 pageState 로 페이지를 맞추는
			// 패턴이 있다. 이 목록은 클라이언트 페이징(useClient: true)만 사용한다.

			// ---- 페이징 관련 Grid API / 이벤트 (현재 코드에서는 호출하지 않음, 필요 시 사용) ----
			// const pagination = grid.getPagination(); // 내부 tui-pagination 인스턴스, 없으면 null
			// pagination?.getCurrentPage();
			// pagination?.movePageTo(2);
			// grid.setPerPage(20); // 페이지당 행 수만 변경
			// grid.setTotalCount(100); // 서버 페이징 등 전체 건수 동기화 시 (클라이언트 페이징만 쓸 때는 보통 불필요)
			// grid.on('beforePageMove', (ev) => { /* 페이지 이동 직전 */ });
			// grid.on('afterPageMove', (ev) => { /* 페이지 이동 직후 */ });

			const gridEl = document.getElementById('grid');
			const quickModalApi = window.IssueQuickEditModal
				? window.IssueQuickEditModal.init({
					getRowByIssueId: getRowByIssueId,
					formatIssueLabel: formatIssueLabel,
					hasIssueDate: hasIssueDate,
					quickValueOptions: QUICK_VALUE_OPTIONS
				})
				: null;

			function togglePageSelectAll(checked) {
				getCurrentPageRows().forEach(function (row) {
					if (row.id != null) {
						if (checked) selectedIds.add(row.id);
						else selectedIds.delete(row.id);
					}
				});
				refreshSelectColumn();
				syncBulkBar();
			}

			if (canEdit) {
				gridEl.addEventListener('click', function (e) {
				const headerCell = e.target && e.target.closest
					? e.target.closest('th[data-column-name="_select"]')
					: null;
				if (headerCell) {
					togglePageSelectAll(!isCurrentPageAllSelected());
				}
			});

				gridEl.addEventListener('change', function (e) {
				const target = e.target;
				if (target.classList.contains('issue-row-check') && target.dataset.id) {
					const id = Number(target.dataset.id);
					if (target.checked) selectedIds.add(id);
					else selectedIds.delete(id);
					syncBulkBar();
				}
			});

				bulkQuickBtn.addEventListener('click', function () {
				if (selectedIds.size === 0) return;
				if (quickModalApi && typeof quickModalApi.open === 'function') {
					quickModalApi.open(Array.from(selectedIds));
				}
			});
				bulkClearBtn.addEventListener('click', function () {
				selectedIds.clear();
				refreshSelectColumn();
				syncBulkBar();
			});
			}

			if (canEdit) {
				grid.on('afterPageMove', function () {
					refreshSelectColumn();
					bindSelectHeaderClick();
				});
			}

			/**
			 * 행 클릭: 선택/빠른수정 컬럼은 상세 이동 안 함
			 */
			grid.on('click', (ev) => {
				if (ev.rowKey == null) return;

				const nativeTarget = ev.nativeEvent && ev.nativeEvent.target;

				if (ev.columnName === '_select') {
					return;
				}

				if (ev.columnName === 'quickActions') {
					const btn = nativeTarget && nativeTarget.closest
						? nativeTarget.closest('.issue-quick-btn')
						: null;
					if (btn && btn.dataset.id) {
						const rowId = Number(btn.dataset.id);
						/* 체크된 항목이 있으면 선택 목록 전체, 없으면 해당 행만 */
						const ids = selectedIds.size > 0
							? Array.from(selectedIds)
							: [rowId];
						if (quickModalApi && typeof quickModalApi.open === 'function') {
							quickModalApi.open(ids);
						}
					}
					return;
				}

				if (ev.columnName === 'subject') return;

				const row = grid.getRow(ev.rowKey);
				if (row && row.id) {
					location.href = '/project/issue/detail?id=' + row.id;
				}
			});

			if (canEdit) {
				bindSelectHeaderClick();
			}
		});
	</script>
</div>
</body>
</html>
