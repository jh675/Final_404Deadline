<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>이슈 목록</title>
<th:block layout:fragment="head-content">
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
  <!--
    TOAST UI Grid 페이징은 tui-pagination 에 의존합니다.
    CDN 사용 시 반드시 tui-pagination(.js) 을 tui-grid.js 보다 먼저 로드해야
    하단 페이지 네비게이션이 생성됩니다. (공식 pagination.md 참고)
  -->
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
  <link rel="stylesheet" th:href="@{/css/common/containerSize.css}" />
  <link rel="stylesheet" th:href="@{/css/project/issue.css}" />
  <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
  <script th:src="@{/js/common/gridTheme.js}"></script>
</th:block>
</head>
<body>
<div layout:fragment="content">
	<div class="issue-shell issue-shell--list">
	<div id="wrapper" class="issue-list">
		<header class="issue-list__header">
			<h1 class="issue-list__title">이슈 목록</h1>
		</header>

		<!-- 검색 조건 -->
		<section class="issue-section issue-section--filter" aria-label="검색 조건">
		<form id="searchForm" th:action="@{/project/issue/list}" method="get"
			th:object="${filter}" class="issue-filter-form">
			<div class="issue-field">
				<label for="categoryCd">유형</label>
				<select id="categoryCd" th:field="*{categoryCd}">
					<option value="">전체</option>
					<option value="01ISSUECATE">버그</option>
					<option value="02ISSUECATE">기능</option>
					<option value="03ISSUECATE">작업</option>
					<option value="04ISSUECATE">개선</option>
				</select>
			</div>
			<div class="issue-field">
				<label for="priorityCd">우선순위</label>
				<select id="priorityCd" th:field="*{priorityCd}">
					<option value="">전체</option>
					<option value="01ISSUEPRI">최상</option>
					<option value="02ISSUEPRI">상</option>
					<option value="03ISSUEPRI">중</option>
					<option value="04ISSUEPRI">하</option>
				</select>
			</div>
			<div class="issue-field">
				<label for="statusCd">상태</label>
				<select id="statusCd" th:field="*{statusCd}">
					<option value="">전체</option>
					<option value="01ISSUESTAT">신규</option>
					<option value="02ISSUESTAT">진행중</option>
					<option value="03ISSUESTAT">검토</option>
					<option value="04ISSUESTAT">완료</option>
				</select>
			</div>
			<div class="issue-field">
				<label for="memId">담당자</label>
				<select id="memId" th:field="*{memId}">
					<option value="">전체</option>
					<option th:each="member : ${members}"
						th:value="${member.userId}"
						th:text="${member.userName + '(' + member.login + ')'}">담당자</option>
				</select>
			</div>
			<div class="issue-field issue-field--subject">
				<label for="subject">이슈명</label>
				<input type="text" id="subject" th:field="*{subject}"
					placeholder="텍스트를 입력해 주세요." />
			</div>
			<div class="issue-field issue-field--my-issue">
				<label class="issue-filter-check" for="myIssue">
					<input type="checkbox" id="myIssue" name="myIssue" value="Y"
						th:checked="*{myIssue == 'Y'}" />
					<span class="issue-filter-check__text">내 담당 이슈</span>
				</label>
			</div>
			<div class="issue-filter-buttons">
				<button type="submit" class="btn btn-primary">검색</button>
				<a th:href="@{/project/issue/list}" class="btn btn-secondary">초기화</a>
			</div>
		</form>
		</section>

		<!-- 일괄 빠른수정 -->
		<section class="issue-section issue-section--bulk" aria-label="일괄 작업">
		<div id="issueBulkBar" class="issue-bulk-bar" aria-live="polite"
			th:if="${@prjAuth.hasRole('ROLE_ISSUE_UPDATE')}">
			<span class="bulk-count" id="issueBulkCount">0건 선택</span>
			<button type="button" class="btn btn-success" id="issueBulkQuickBtn" disabled>
				빠른수정
			</button>
			<button type="button" class="btn btn-secondary" id="issueBulkClearBtn">
				선택 해제
			</button>
		</div>
		</section>

		<!-- 목록 -->
		<section class="issue-section issue-section--grid" aria-label="이슈 목록">
		<div id="grid"></div>
		</section>

		<!-- 하단: 페이징 · 액션 -->
		<section class="issue-section issue-section--footer">
		<div class="issue-list-footer">
			<div id="issuePaginationSlot" class="issue-list-footer__pagination"></div>
			<div class="issue-list-footer__actions">
			<a th:href="@{/project/issue/pivot}" class="btn btn-secondary"
				th:if="${@prjAuth.hasRole('ROLE_ISSUE_VIEW')}">통계</a>
				<a th:href="@{/project/issue/register}" class="btn btn-primary"
					th:if="${@prjAuth.hasRole('ROLE_ISSUE_CREATE')}">등록</a>
			</div>
		</div>
		</section>
	</div>
	</div>

	<div th:replace="~{project/issue/modal/issueQuickEditModal :: issueQuickEditModal}"></div>

	<!-- ====================================================
	     서버 데이터를 JS 로 주입 (Thymeleaf inline javascript)
	     - th:inline="javascript" : Thymeleaf 표현식을 JS 안에서 사용 가능하게 함
	     - /*[[${issueList}]]*/ [] : 서버에서 내려준 List<IssueVO>를
	       JS 배열(JSON)로 변환해서 issueData 변수에 담음
	     - /*<![CDATA[*/ ... /*]]>*/ : XML 파싱 오류 방지용 (HTML5 에선 권장 패턴)
	==================================================== -->
	<script th:inline="javascript">
		/*<![CDATA[*/
		const issueData = /*[[${issueList}]]*/ [];
		const LOGIN_MEM_ID = /*[[${(#authentication.principal instanceof T(com.example.demo.login.service.UserVO)) ? #strings.toString(#authentication.principal.id) : ''}]]*/ '';
		const canEdit = /*[[${@prjAuth.hasRole('ROLE_ISSUE_UPDATE')}]]*/ false;
		/*]]>*/
	</script>

	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const myIssueCheckbox = document.getElementById('myIssue');
			const memIdSelect = document.getElementById('memId');
			const searchForm = document.getElementById('searchForm');

			function applyMyIssueState() {
				const on = myIssueCheckbox.checked;
				searchForm.classList.toggle('is-my-issue-active', on);
				if (on) {
					memIdSelect.value = LOGIN_MEM_ID;
					memIdSelect.disabled = true;
				} else {
					memIdSelect.disabled = false;
				}
			}

			applyMyIssueState();
			myIssueCheckbox.addEventListener('change', applyMyIssueState);

			searchForm.addEventListener('submit', function () {
				if (memIdSelect.disabled) {
					memIdSelect.disabled = false;
				}
			});

			// ============================================================
			// TOAST UI Grid 초기화
			// 공식 문서: https://github.com/nhn/tui.grid
			// ============================================================

			function hasIssueDate(value) {
				if (value == null || value === '') return false;
				const d = new Date(value);
				return !isNaN(d.getTime());
			}
			function hasIssueAssignee(row) {
				if (!row) return false;
				if (row.memId != null && row.memId !== '') return true;
				const name = row.memName;
				if (name == null || name === '') return false;
				const trimmed = String(name).trim();
				return trimmed !== '' && trimmed !== '—' && trimmed !== '-' && trimmed !== '미정';
			}
			/**
			 * 우선순위 컬럼 커스텀 정렬 (사전순 X → 업무 순서)
			 * - 화면에는 get_sub_code_name 결과(예: 최상, 상, 중, 하)가 올 수 있고,
			 *   원본 코드가 넘어오는 경우도 함께 처리
			 * - 오름차순: 최상 → 상 → 중 → 하 (긴급도 높은 순)
			 */
			function priorityRank(value) {
				if (value == null || value === '') return 999;
				const key = String(value).trim();
				const order = {
					최상: 1,
					상: 2,
					중: 3,
					하: 4
				};
				// order에 직접 정의된 키인지(hasOwnProperty)만 순위를 부여한다.
				// → 예: 키가 "toString" 등 Object.prototype 이름과 겹치면 잘못된 순위가 되는 것을 방지.
				// 매핑에 없는 값은 999로 두어 오름차순 정렬 시 맨 뒤로 보낸다.
				return order.hasOwnProperty(key) ? order[key] : 999;
			}

			function priorityComparator(valueA, valueB) {
				return priorityRank(valueA) - priorityRank(valueB);
			}

			const QUICK_VALUE_OPTIONS = {
				status: [
					{ code: '01ISSUESTAT', label: '신규' },
					{ code: '02ISSUESTAT', label: '진행중' },
					{ code: '03ISSUESTAT', label: '검토' }
				],
				priority: [
					{ code: '01ISSUEPRI', label: '최상' },
					{ code: '02ISSUEPRI', label: '상' },
					{ code: '03ISSUEPRI', label: '중' },
					{ code: '04ISSUEPRI', label: '하' }
				],
				category: [
					{ code: '01ISSUECATE', label: '버그' },
					{ code: '02ISSUECATE', label: '기능' },
					{ code: '03ISSUECATE', label: '작업' },
					{ code: '04ISSUECATE', label: '개선' }
				]
			};

			const GRID_PER_PAGE = 10;
			const selectedIds = new Set();
			let grid;

			const bulkBar = document.getElementById('issueBulkBar');
			const bulkCountEl = document.getElementById('issueBulkCount');
			const bulkQuickBtn = document.getElementById('issueBulkQuickBtn');
			const bulkClearBtn = document.getElementById('issueBulkClearBtn');

			function syncBulkBar() {
				const n = selectedIds.size;
				bulkBar.classList.toggle('is-visible', n > 0);
				bulkCountEl.textContent = n + '건 선택';
				bulkQuickBtn.disabled = n === 0;
			}

			function refreshSelectColumn() {
				if (!grid) return;
				const currentData = grid.getData();
				const pagination = grid.getPagination();
				const currentPage = pagination ? pagination.getCurrentPage() : 1;
				grid.resetData(currentData, {
					pageState: {
						page: currentPage
					}
				});
			}

			function getCurrentPageRows() {
				if (!grid) return [];
				const all = grid.getData();
				const pagination = grid.getPagination();
				if (!pagination) return all;
				const page = pagination.getCurrentPage();
				const start = (page - 1) * GRID_PER_PAGE;
				return all.slice(start, start + GRID_PER_PAGE);
			}

			function isCurrentPageAllSelected() {
				const pageRows = getCurrentPageRows().filter(function (row) {
					return row.id != null;
				});
				return pageRows.length > 0 && pageRows.every(function (row) {
					return selectedIds.has(row.id);
				});
			}

			function bindSelectHeaderClick() {
				const selectHeaderCell = gridEl.querySelector('th[data-column-name="_select"]');
				if (!selectHeaderCell || selectHeaderCell.dataset.boundClick === 'Y') return;
				selectHeaderCell.style.cursor = 'pointer';
				selectHeaderCell.title = '클릭 시 현재 페이지 전체선택/해제';
				selectHeaderCell.dataset.boundClick = 'Y';
			}

			function getRowByIssueId(id) {
				const rows = grid.getData();
				for (let i = 0; i < rows.length; i++) {
					if (rows[i].id === id) return rows[i];
				}
				return null;
			}

			function formatIssueLabel(id) {
				const row = getRowByIssueId(id);
				const subject = row && row.subject != null && String(row.subject).trim() !== ''
					? String(row.subject).trim()
					: '이슈명 없음';
				return subject + ' #' + id;
			}

			/**
			 * tui.Grid 인스턴스 생성
			 * - new tui.Grid({ ...옵션 }) 한 번 호출로 그리드가 그려짐
			 */
			const gridColumns = [
				canEdit ? {
					header: '선택',
					name: '_select',
					width: 44,
					align: 'center',
					sortable: false,
					formatter: function (props) {
						const row = props.row;
						const id = row == null ? null : row.id;
						if (id == null) return '';
						const checked = selectedIds.has(id) ? ' checked' : '';
						return '<input type="checkbox" class="issue-row-check" data-id="' + id + '"'
							+ checked + ' aria-label="이슈 선택" />';
					}
				} : null,
				{
					// 이슈명 컬럼: 클릭 시 상세 페이지로 이동하도록 <a> 태그를 직접 렌더링
					header: '이슈명',
					name: 'subject',
					sortable: true,
				formatter: ({ row, value }) => {
					const id = row.id;
					const subject = value == null ? '' : value;
					const text = subject + "#" + id;
					return '<a href="/project/issue/detail?id=' + id + '" title="' + subject.replace(/"/g, '&quot;') + '">' + text + '</a>';
				}
				},
				{
					header: '유형',
					name: 'categoryCd',
					width: 72,
					align: 'center',
					sortable: true
				},
			{
				header: '담당자',
				name: 'memName',
				width: 80,
				align: 'center',
				sortable: true,
					formatter: function (props) {
						const name = props.value;
						if (name == null || String(name).trim() === '' || String(name).trim() === '미정') {
							return '-';
						}
						return name;
					}
				},
			{
				header: '상태',
				name: 'statusCd',
				width: 80,
				align: 'center',
				sortable: true
			},
			{
				header: '우선순위',
				name: 'priorityCd',
				width: 80,
					align: 'center',
					sortable: true,
					comparator: priorityComparator
				},
				{
					header: '시작예정일',
					name: 'estStartDate',
					width: 120,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
				},
				{
					header: '완료예정일',
					name: 'dueDate',
					width: 120,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
				},
			{
				header: '시작일',
				name: 'startDate',
				width: 90,
				align: 'center',
				sortable: true,
				formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
			},
			{
				header: '완료일',
				name: 'closedDate',
				width: 90,
				align: 'center',
				sortable: true,
				formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
			},
			{
				header: '수정일',
				name: 'updatedOn',
				width: 90,
				align: 'center',
				sortable: true,
				formatter: ({ value }) => dateUtils.format(value, 'YYYY-MM-DD')
			},
				{
					// 진척율(%): 숫자 뒤에 % 자동 추가
					header: '진척율(%)',
					name: 'doneRatio',
					width: 100,
					align: 'center',
					sortable: true,
					formatter: ({ value }) => (value == null ? '' : value + '%')
				},
				canEdit ? {
					header: '수정',
					name: 'quickActions',
					width: 88,
					align: 'center',
					sortable: false,
					formatter: function (props) {
						const id = props.row == null ? '' : props.row.id;
						if (id == null || id === '') return '';
						return '<button type="button" class="btn btn-success issue-quick-btn" data-id="' + id + '">빠른수정</button>';
					}
				} : null
			].filter(Boolean);

			grid = new tui.Grid({
				// ── 기본 설정 ──────────────────────────────────────────
				el: document.getElementById('grid'), // 그리드를 그릴 DOM 요소 (필수)
				data: issueData,                     // 그리드에 표시할 데이터 배열 (위에서 주입한 issueData)

				// ── 레이아웃 / 스크롤 옵션 ────────────────────────────
				scrollX: false,        // 가로 스크롤바 숨김
				scrollY: false,        // 세로 스크롤바 숨김 (rowHeight × 행수 만큼 자동 확장)
				bodyHeight: 'auto',    // 본문 높이를 데이터 양에 맞춰 자동 조절
				rowHeight: 40,         // 회원/기업 목록 그리드와 동일 행 높이
				minBodyHeight: 200,    // 데이터 0건일 때 최소 높이(px)

				// ── 컬럼 정의 (가장 핵심) ─────────────────────────────
				// 배열 순서대로 왼쪽부터 표시됨
				// header  : 헤더에 표시되는 한글 라벨
				// name    : data 객체의 어떤 key 와 매핑할지 (예: row.subject)
				// width   : 컬럼 너비(px) — 생략 시 자동 분배
				// align   : 셀 텍스트 정렬 ('left' | 'center' | 'right')
				// sortable: true 면 헤더 클릭으로 정렬 가능 (기본 false)
				// comparator: 정렬 시 사용할 비교 함수 (생략 시 문자/숫자 기본 규칙 = 사전순 등)
				// formatter: 셀 표시값을 가공하는 함수.
				//            ({ row, value, column }) 인자에서
				//              - value  : 해당 셀의 원본 값
				//              - row    : 해당 행 전체 객체 (다른 컬럼 값 접근 가능)
				//            return 문자열(또는 HTML)이 셀에 그대로 렌더링됨
				columns: gridColumns,

				// ═══════════════════════════════════════════════════════════
				// 페이지네이션 (그리드 하단의 페이지 번호 영역 = tui-pagination)
				// - 스크립트: head 에서 tui-pagination.js 를 tui-grid.js 보다 먼저 로드해야
				//   하단 네비게이션 바가 생성됨.
				// - 동작: useClient 가 true 이면 서버에서 내려준 issueData 전체를 메모리에 두고,
				//   그리드는 한 페이지(perPage 행)만 그림. 페이지 클릭 시 서버 재요청 없이
				//   클라이언트에서만 행을 바꿔 보여 줌.
				// - 서버 페이징: useClient 를 끄고 data 대신 dataSource + readData API 를 쓰는
				//   방식(예: tutorial-example10-data-source)은 이 화면에서는 사용하지 않음.
				// ═══════════════════════════════════════════════════════════
				pageOptions: {
					useClient: true,
					perPage: GRID_PER_PAGE

					// ---- 아래는 pageOptions 에서 지원하지만 여기서는 쓰지 않는 옵션 예시 ----
					// page: 1,
					//   초기 활성 페이지 번호(1부터). 생략 시 1.
					// visiblePages: 10,
					//   페이지 번호 버튼을 한 번에 최대 몇 개까지 보일지 (Grid v4.14.0 이상).
					// position: 'bottom',
					//   페이징 바 위치. 'bottom'(기본값) | 'top'(그리드 상단).
				}
			});

			function syncPaginationToFooter() {
				const slot = document.getElementById('issuePaginationSlot');
				if (!slot) return;
				const paginationEl = gridEl.querySelector('.tui-pagination');
				if (!paginationEl) return;
				slot.appendChild(paginationEl);
			}

			// 초기 렌더 시 폭 계산이 살짝 어긋나 가로 스크롤이 생기는 케이스를 보정
			requestAnimationFrame(function () {
				if (grid && typeof grid.refreshLayout === 'function') {
					grid.refreshLayout();
				}
				syncPaginationToFooter();
			});
			window.addEventListener('resize', function () {
				if (grid && typeof grid.refreshLayout === 'function') {
					grid.refreshLayout();
				}
			});

			// 참고 (위 pageOptions 와는 별개): 서버 페이징(DataSource)이면 readData 응답의
			// pagination.totalCount 등과 연동하고, resetData 시 pageState 로 페이지를 맞추는
			// 패턴이 있다. 이 목록은 클라이언트 페이징(useClient: true)만 사용한다.

			// ---- 페이징 관련 Grid API / 이벤트 (현재 코드에서는 호출하지 않음, 필요 시 사용) ----
			// const pagination = grid.getPagination(); // 내부 tui-pagination 인스턴스, 없으면 null
			// pagination?.getCurrentPage();
			// pagination?.movePageTo(2);
			// grid.setPerPage(20); // 페이지당 행 수만 변경
			// grid.setTotalCount(100); // 서버 페이징 등 전체 건수 동기화 시 (클라이언트 페이징만 쓸 때는 보통 불필요)
			// grid.on('beforePageMove', (ev) => { /* 페이지 이동 직전 */ });
			// grid.on('afterPageMove', (ev) => { /* 페이지 이동 직후 */ });

			const gridEl = document.getElementById('grid');
			const quickModalApi = window.IssueQuickEditModal
				? window.IssueQuickEditModal.init({
					getRowByIssueId: getRowByIssueId,
					formatIssueLabel: formatIssueLabel,
					hasIssueDate: hasIssueDate,
					hasIssueAssignee: hasIssueAssignee,
					quickValueOptions: QUICK_VALUE_OPTIONS
				})
				: null;

			function togglePageSelectAll(checked) {
				getCurrentPageRows().forEach(function (row) {
					if (row.id != null) {
						if (checked) selectedIds.add(row.id);
						else selectedIds.delete(row.id);
					}
				});
				refreshSelectColumn();
				syncBulkBar();
			}

			if (canEdit) {
				gridEl.addEventListener('click', function (e) {
				const headerCell = e.target && e.target.closest
					? e.target.closest('th[data-column-name="_select"]')
					: null;
				if (headerCell) {
					togglePageSelectAll(!isCurrentPageAllSelected());
				}
			});

				gridEl.addEventListener('change', function (e) {
				const target = e.target;
				if (target.classList.contains('issue-row-check') && target.dataset.id) {
					const id = Number(target.dataset.id);
					if (target.checked) selectedIds.add(id);
					else selectedIds.delete(id);
					syncBulkBar();
				}
			});

				bulkQuickBtn.addEventListener('click', function () {
				if (selectedIds.size === 0) return;
				if (quickModalApi && typeof quickModalApi.open === 'function') {
					quickModalApi.open(Array.from(selectedIds));
				}
			});
				bulkClearBtn.addEventListener('click', function () {
				selectedIds.clear();
				refreshSelectColumn();
				syncBulkBar();
			});
			}

			if (canEdit) {
				grid.on('afterPageMove', function () {
					refreshSelectColumn();
					bindSelectHeaderClick();
					syncPaginationToFooter();
				});
			}

			grid.on('sort', function () {
				syncPaginationToFooter();
			});

			/**
			 * 행 클릭: 선택/빠른수정 컬럼은 상세 이동 안 함
			 */
			grid.on('click', (ev) => {
				if (ev.rowKey == null) return;

				const nativeTarget = ev.nativeEvent && ev.nativeEvent.target;

				if (ev.columnName === '_select') {
					return;
				}

				if (ev.columnName === 'quickActions') {
					const btn = nativeTarget && nativeTarget.closest
						? nativeTarget.closest('.issue-quick-btn')
						: null;
					if (btn && btn.dataset.id) {
						const rowId = Number(btn.dataset.id);
						/* 체크된 항목이 있으면 선택 목록 전체, 없으면 해당 행만 */
						const ids = selectedIds.size > 0
							? Array.from(selectedIds)
							: [rowId];
						if (quickModalApi && typeof quickModalApi.open === 'function') {
							quickModalApi.open(ids);
						}
					}
					return;
				}

				if (ev.columnName === 'subject') return;

				const row = grid.getRow(ev.rowKey);
				if (row && row.id) {
					location.href = '/project/issue/detail?id=' + row.id;
				}
			});

			if (canEdit) {
				bindSelectHeaderClick();
			}
		});
	</script>
</div>
</body>
</html>
