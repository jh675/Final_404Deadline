<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/projectLayout}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
	  rel="stylesheet" 
	  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
	  crossorigin="anonymous">
</head>

<body>
<div layout:fragment="content">

	<table>	
		<thead>
			<tr>
				<th></th>			
				<th>진행중인 이슈</th>
				<th>완료된 이슈</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<th>버그</th>
				<td th:text="${count.bGoCount}"></td>
				<td th:text="${count.bEndCount}"></td>
			</tr>
			<tr>
				<th>기능</th>
				<td th:text="${count.fGoCount}"></td>
				<td th:text="${count.fEndCount}"> </td>
			</tr>
			<tr>
				<th>작업</th>
				<td th:text="${count.wGoCount}"></td>
				<td th:text="${count.wEndCount}"></td>
			</tr>
			<tr>
				<th>개선</th>
				<td th:text="${count.iGoCount}"></td>
				<td th:text="${count.iEndCount}"></td>
			</tr>
		</tbody>
	</table>
	<table>
		<thead>
			<tr>
				<th></th>			
				<th>오늘의 일정</th>
				<th>시간</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each= "ca : ${calender}">
				<th th:text="${ca.calType}"></th>
				<td th:text="${ca.place}"></td>
				<td th:text="${#dates.format(ca.calStart,'HH:mm')}"></td>
			</tr>
		</tbody>
	</table>
	<table>
		<thead>
			<tr>
				<th>No</th>			
				<th>공지사항</th>
				<th>날짜</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each=" nt, stat : ${notice}" th:if="${stat.index < 3}">
				<th th:text="${stat.count}"></th>
				<td th:text="${nt.title}"></td>
				<td th:text="${#dates.format(nt.createdOn,'yyyy-MM-dd')}"></td>
			</tr>
		</tbody>
	</table>
	<table>
		<thead>
			<tr>
				<th>그룹명</th>			
				<th>인원</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each=" g : ${selectgroup}">
				<th th:text="${g.grpName}"></th>
				<td th:text="${g.count}"></td>
			</tr>
		</tbody>
	</table>
	</div>
</body>
</html>
