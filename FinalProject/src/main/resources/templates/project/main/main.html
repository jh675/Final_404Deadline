<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
		layout:decorate="~{layout/compAdminLayout}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

	  crossorigin="anonymous">
</head>
<body>

			<tr>
				<th></th>

			</tr>

				<td th:text="${count.fEndCount}"> </td>

				<td th:text="${count.wGoCount}"></td>

				<th>개선</th>
				<td th:text="${count.iGoCount}"></td>

	</table>
	<table>
		<thead>
			<tr>
				<th></th>
