<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<title>비밀번호 재설정</title>
</head>
<body>
<div layout:fragment="content">
	<h1>비밀번호 재설정 안내</h1>
	<p>보안을 위해 비밀번호를 변경해야 시스템을 이용할 수 있습니다.</p>
	
	<div style="border: 1px solid #ccc; padding: 20px; width: 400px; margin-top: 20px;">
		<div>
			<label>새 비밀번호:</label><br>
			<input type="password" id="newPassword" placeholder="새 비밀번호 입력">
		</div>
		<div style="margin-top: 10px;">
			<label>새 비밀번호 확인:</label><br>
			<input type="password" id="confirmPassword" placeholder="새 비밀번호 확인">
		</div>
		<div style="margin-top: 20px;">
			<button type="button" onclick="changePassword()">비밀번호 변경</button>
		</div>
	</div>

	<script th:src="@{/js/login/mustChangePW.js}"></script>
</div>
</body>
</html>
