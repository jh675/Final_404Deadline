<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">
<head>
<meta charset="UTF-8">
<title>비밀번호 재설정</title>
</head>
<body>
<div layout:fragment="content">
	<div class="d-flex justify-content-center align-items-center py-5">
		<div class="card border-0 shadow-sm" style="width: 100%; max-width: 450px;">
			<div class="card-body p-4 p-md-5">
				
				<div class="text-center mb-4">
					<h4 class="fw-bold mb-2">비밀번호 변경 안내</h4>
					<p class="text-muted small mb-0">보안을 위해 비밀번호를 변경해야<br>시스템을 정상적으로 이용할 수 있습니다.</p>
				</div>
				
				<div class="mb-3">
					<label class="form-label fw-semibold text-muted small">새 비밀번호</label>
					<input type="password" id="newPassword" class="form-control" placeholder="새 비밀번호 입력">
					<div class="invalid-feedback" id="newPasswordError">새 비밀번호를 입력해주세요.</div>
				</div>
				
				<div class="mb-4">
					<label class="form-label fw-semibold text-muted small">새 비밀번호 확인</label>
					<input type="password" id="confirmPassword" class="form-control" placeholder="새 비밀번호 확인">
					<div class="invalid-feedback" id="confirmPasswordError">비밀번호가 일치하지 않습니다.</div>
				</div>
				
				<div class="mt-4 pt-2">
					<button type="button" class="btn btn-success w-100 fw-bold py-2" onclick="changePassword()">비밀번호 변경</button>
					<div id="generalFeedback" class="small mt-2 text-danger text-center fw-bold"></div>
				</div>
				
			</div>
		</div>
	</div>

	<script th:src="@{/js/login/mustChangePW.js}"></script>
</div>
</body>
</html>
