<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/defaultLayout}">

<head>
<title>로그인</title>
<link rel="stylesheet" th:href="@{/css/login/login.css}">
<link rel="stylesheet" th:href="@{/css/common/containerSize.css}">
</head>

<body>

<div layout:fragment="content">
	<div class="d-flex justify-content-center align-items-center py-2 rounded-4 my-1">
		
		<div class="card border-0 shadow-lg" style="width: 100%; max-width: 450px; border-radius: 1.25rem;">
			<div class="card-body p-2 p-md-3 bg-white" style="border-radius: 1.25rem;">
				
				<h3 class="fw-bold text-center mb-4">로그인</h3>

				<div th:if="${param.logout}" class="alert alert-success text-center small py-2">
					로그아웃 되었습니다.
				</div>
				
				<div th:if="${param.error}" class="alert alert-danger text-center small py-2" th:text="${param.exception}">
				</div>

				<form th:action="@{/login}" method="post" id="loginForm" novalidate>

					<input type="hidden" id="loginType" name="loginType" value="USER">

					<ul class="nav nav-tabs nav-justified mb-4" id="loginTab" role="tablist">
					    <li class="nav-item" role="presentation">
					        <button class="nav-link active fw-bold" id="user-tab" type="button" onclick="changeLoginType('USER')">회원</button>
					    </li>
					    <li class="nav-item" role="presentation">
					        <button class="nav-link" id="admin-tab" type="button" onclick="changeLoginType('ADMIN')">시스템 관리자</button>
					    </li>
					</ul>

					<div class="mb-3 position-relative" id="companyInputArea">
				        <label for="companyNameInput" class="form-label fw-semibold text-muted small">소속 기업명</label>
				        <input type="text" id="companyNameInput" class="form-control bg-light" placeholder="기업명을 입력하세요" autocomplete="off">
				        <input type="hidden" id="bizNo" name="bizNo">
				        <ul id="companyDropdown" class="list-group position-absolute w-100 shadow-sm" 
				            style="display: none; z-index: 1000; max-height: 200px; overflow-y: auto;">
				        </ul>
				        <div class="invalid-feedback">기업을 검색하여 선택해주세요.</div>
			    	</div>

					<div class="mb-3">
						<label class="form-label fw-semibold text-muted small">아이디</label>
						<input type="text" name="username" id="username" class="form-control">
						<div class="invalid-feedback">아이디를 입력해주세요.</div>
					</div>

					<div class="mb-4">
						<label class="form-label fw-semibold text-muted small">비밀번호</label>
						<input type="password" name="password" id="password" class="form-control">
						<div class="invalid-feedback">비밀번호를 입력해주세요.</div>
					</div>
					
					<div class="mb-4 form-check">
					   <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me" checked>
					   <label class="form-check-label text-muted small" for="rememberMe" style="cursor: pointer;">
					        자동 로그인
					    </label>
					</div>
					
					<button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">
						로그인
					</button>

				</form>

				<div class="d-flex justify-content-center gap-3 small mt-2">
					<a th:href="@{/}" class="text-decoration-none text-muted">홈으로</a>
					<span class="text-light">|</span>
					<a href="#" data-bs-toggle="modal" data-bs-target="#resetPwModal" class="text-decoration-none text-muted">
						비밀번호 재설정
					</a>
					<span class="text-light">|</span>
					<a href="#" data-bs-toggle="modal" data-bs-target="#companyRequestModal" class="text-decoration-none text-success fw-bold">
						기업 등록 요청
					</a>
				</div>
				
				<div class="mt-4 p-3 bg-light rounded text-muted border" style="font-size: 12px; line-height: 1.6;">
					<strong>📌 테스트 계정 안내</strong><br>
					<span class="d-inline-block mt-1">기업명 : 미래소프트웨어</span><br>
					시스템 관리자 : admin<br>
					기업 관리자 : cadmin<br>
					일반 유저 : user1, user2 ...<br>
					<span class="text-danger mt-1 d-block">* 비밀번호는 아이디와 동일합니다.</span>
				</div>
				
			</div>
		</div>
	</div>

	<div th:replace="~{login/modal/resetPw :: resetPwModal}"></div>
	<div th:replace="~{login/modal/companyRequest :: companyRequestModal}"></div>

	<script th:src="@{/js/login/login.js}"></script>
	<script th:src="@{/js/login/resetPw.js}"></script>
</div>
</body>
</html>
