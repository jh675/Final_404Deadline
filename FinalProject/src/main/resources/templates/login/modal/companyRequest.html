<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="companyRequestModal">
        <div class="modal fade" id="companyRequestModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header bg-light">
                        <h5 class="modal-title fw-bold">기업 등록 요청</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    
                    <form th:action="@{/login/company/request}" method="post" id="companyRequestForm">
                        <div class="modal-body p-4">
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">사업자번호 <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" id="reqBizNo" name="bizNo" class="form-control" placeholder="123-45-67890" maxlength="12" required>
                                    <button class="btn btn-outline-primary" type="button" id="btnCheckBizNo">중복확인</button>
                                </div>
                                <div id="bizNoFeedback" class="small mt-1"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">기업명 <span class="text-danger">*</span></label>
                                <input type="text" name="companyName" class="form-control" placeholder="기업명을 입력해 주세요" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">전화번호 <span class="text-danger">*</span></label>
                                <input type="text" name="tel" class="form-control" maxlength="13" placeholder="대표 전화번호를 입력해 주세요" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">주소 <span class="text-danger">*</span></label>
                                <input type="text" name="address" class="form-control" placeholder="회사 주소를 입력해 주세요" required>
                            </div>
                            
                            <hr class="my-4">
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">관리자 아이디 <span class="text-danger">*</span></label>
                                <input type="text" name="login" class="form-control" placeholder="사용할 관리자 아이디" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">관리자 이메일 <span class="text-danger">*</span></label>
                                <input type="email" name="email" class="form-control" placeholder="관리자 이메일을 입력해 주세요" required>
                            </div>
                        </div>
                        <div class="modal-footer flex-column bg-light">
						    <div class="w-100 text-center mb-1">
						        <span id="requestFeedback" class="small fw-bold"></span>
						    </div>
						    <div class="d-flex justify-content-center w-100 gap-2">
							    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">취소</button>
							    <button type="submit" id="requestSubmitBtn" class="btn btn-success px-4 fw-bold">등록 요청</button>
						    </div>
						</div>
                    </form>
                </div>
            </div>
        </div>
    <script th:src="@{/js/login/companyRequest.js}"></script>
    </div>
</body>
</html>
