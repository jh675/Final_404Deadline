<!doctype html>
<html xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"

	th:with="
		roleName=${#authorization.expression('isAuthenticated()') 
			? #authentication.principal.adminNm 
			: '게스트'}
	">

<head>

	<th:block
		th:replace="~{layout/fragments/head :: commonHead(${roleName})}">
	</th:block>

	<th:block layout:fragment="head-content"></th:block>

</head>

<body class="layout-app">
	<div class="container-fluid layout-app__shell">
		<div
			th:replace="~{layout/fragments/navbar :: layoutNavbar('에러페이지')}">
		</div>
		<div class="layout-app__main">
		<div class="card">
			<div class="card-body">
				<div layout:fragment="content"></div>
			</div>
		</div>
		</div>
		<div th:replace="~{layout/fragments/footer :: yedam}"></div>
	</div>

</body>

</html>
