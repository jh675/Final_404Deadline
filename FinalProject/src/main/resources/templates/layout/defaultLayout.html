<head>
<th:block th:replace="~{layout/fragments/head :: commonHead('default')}"></th:block>

</head>

<body>
	<div class="container-fluid px-4">
		<div
			th:replace="~{layout/fragments/navbar :: layoutNavbar('비로그인', ~{layout/fragments/navbar-menu :: defaultMenu})}">

		<div class="card mt-3">
			<div class="card-body">
				<div layout:fragment="content"></div>
			</div>
		</div>
		<div th:replace="~{layout/fragments/footer :: yedam}"></div>
	</div>

</html>
