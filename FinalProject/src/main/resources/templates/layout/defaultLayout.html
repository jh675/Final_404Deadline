<!doctype html>
<html xmlns:th="https://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"

	th:with="
		roleName=${#authorization.expression('isAuthenticated()') 
			? #authentication.principal.adminNm 
			: '게스트'}
	">

<head>

	<th:block
		th:replace="~{layout/fragments/head :: commonHead(${roleName})}">
	</th:block>

	<th:block layout:fragment="head-content"></th:block>

</head>

<body>

	<div class="container-fluid px-4">

		<div
			th:replace="~{layout/fragments/navbar :: layoutNavbar(${roleName})}">
		</div>

		<div class="card mt-3">
			<div class="card-body">
				<div layout:fragment="content"></div>
			</div>
		</div>

		<div th:replace="~{layout/fragments/footer :: yedam}"></div>

	</div>

</body>

</html>
