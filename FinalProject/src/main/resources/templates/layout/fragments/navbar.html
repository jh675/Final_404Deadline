<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="layoutNavbar(title)"
     class="navbar navbar-expand-lg bg-body-tertiary border-top border-5"
     th:classappend="${
        title == '시스템관리자' ? 'border-danger' : 
        (title == '기업관리자' ? 'border-primary' : 'border-secondary')
     }">

	<div class="container-fluid">

		<a class="navbar-brand" th:text="${title}"></a>

		<div class="collapse navbar-collapse">

			<ul class="navbar-nav me-auto">

				<!-- 공통 메뉴 -->
				<li class="nav-item">
					<a class="nav-link" th:href="@{/}">
						홈화면
					</a>
				</li>

				<!-- 비로그인 -->
				<th:block sec:authorize="isAnonymous()">

					<li class="nav-item">
						<a class="nav-link" th:href="@{/login}">
							로그인
						</a>
					</li>

				</th:block>

				<!-- 관리자 -->
				<th:block sec:authorize="hasRole('ADMIN')">

					<li class="nav-item">
						<a class="nav-link" th:href="@{/admin/userList}">
							회원관리
						</a>
					</li>

				</th:block>

				<!-- 일반회원 -->
				<th:block sec:authorize="hasRole('USER')">

					<li class="nav-item">
						<a class="nav-link" th:href="@{/mypage}">
							마이페이지
						</a>
					</li>

				</th:block>

				<!-- 기업회원 -->
				<th:block sec:authorize="hasRole('CADMIN')">

					<li class="nav-item">
						<a class="nav-link" th:href="@{/company/member}">
							기업회원관리
						</a>
					</li>

				</th:block>

			</ul>

			<!-- 로그인 영역 -->
			<div class="d-flex align-items-center gap-2"
				sec:authorize="isAuthenticated()">

				<span>
					<strong sec:authentication="principal.name"></strong>님
				</span>

				<form th:action="@{/logout}" method="post">
					<button type="submit"
						class="btn btn-outline-danger btn-sm">
						로그아웃
					</button>
				</form>

			</div>

		</div>
	</div>
</nav>

</body>
</html>
