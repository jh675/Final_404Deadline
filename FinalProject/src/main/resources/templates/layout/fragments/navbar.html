<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="layoutNavbar(title)"
     class="navbar navbar-expand-lg bg-body-tertiary border-top border-5"
     th:classappend="${
        title == '시스템관리자' ? 'border-danger' : 
        (title == '기업관리자' ? 'border-primary' : 'border-secondary')
     }">

	<div class="container-fluid">

		<a class="navbar-brand" th:text="${title}"></a>

		<div class="collapse navbar-collapse">

			<ul class="navbar-nav me-auto">

				<!-- 공통 메뉴 -->
				<li class="nav-item">
					<a class="nav-link" th:href="@{/}">
						홈화면
					</a>
				</li>
				<li class="nav-item"  sec:authorize="isAuthenticated()" >
					<a class="nav-link" th:href="@{/calender/list}">
						일정
					</a>
				</li>

				<!-- 비로그인 -->
				<th:block sec:authorize="isAnonymous()">

					<li class="nav-item">
						<a class="nav-link" th:href="@{/login}">
							로그인
						</a>
					</li>

				</th:block>

				<!-- 관리자 -->
				<th:block sec:authorize="hasRole('ADMIN')">

					<li class="nav-item">
						<a class="nav-link" th:href="@{/admin/company/list}">
							기업관리
						</a>
					</li>
					
					<li class="nav-item">
						<a class="nav-link" th:href="@{/admin/userList}">
							회원관리
						</a>
					</li>
					

				</th:block>

				<!-- 일반회원 -->
				<th:block sec:authorize="hasRole('USER')">
					
					<li class="nav-item">
						<a class="nav-link" th:href="@{/management/project}">
							프로젝트 목록
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{#}">
							마이페이지(미연결)
						</a>
					</li>

				</th:block>

				<!-- 기업관리자 -->
				<th:block sec:authorize="hasRole('CADMIN')">

					<li class="nav-item">
						<a class="nav-link" th:href="@{/cadmin/userList}">
							회원 관리
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/management/project}">
							프로젝트관리
						</a>
					</li>

				</th:block>

			</ul>

			<!-- 로그인 영역 -->
			<div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
			    <div class="position-relative me-2" style="width: 300px;">
			        <div class="input-group input-group-sm">
			            <span class="input-group-text bg-gradient text-white" style="background-color: #5b6cff;">✨ AI</span>
			            <input type="text" id="aiSearchInput" class="form-control" placeholder="지금 내가 해야할 일은?">
			            <button class="btn btn-outline-primary" type="button" id="aiSearchBtn">묻기</button>
			        </div>
			    </div>
				
				<input type="hidden" id="loginUserId" 
       				   th:value="${#authentication != null and #authentication.principal != 'anonymousUser' ? #authentication.principal.username : 0}"/>
				<!-- 🔔 알림 버튼 드롭다운 -->
				<div class="dropdown me-2">
				    <button class="btn btn-outline-secondary btn-sm position-relative" 
				            type="button" 
				            id="notificationBtn"
				            data-bs-toggle="dropdown" 
				            data-bs-auto-close="outside"
				            aria-expanded="false">
				        🔔
				        <!-- 읽지 않은 알림 개수 뱃지 -->
				        <span id="notificationBadge" 
				              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
				              style="display:none; font-size:10px;">
				            0
				        </span>
				    </button>
				
				    <!-- 드롭다운 알림 목록 -->
				    <ul class="dropdown-menu dropdown-menu-end p-0"
				        style="width:350px; max-height:400px; overflow-y:auto;">
				
				        <!-- 헤더 -->
				        <li class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom bg-light">
				            <strong>🔔 알림</strong>
				            <button class="btn btn-sm btn-link text-muted p-0" id="clearAllBtn">
				                전체 삭제
				            </button>
				        </li>
				
				        <!-- 알림 목록 -->
				        <div id="notificationList">
				            <li class="text-center text-muted py-4" id="emptyNoti">
				                새로운 알림이 없습니다
				            </li>
				        </div>
				
				    </ul>
				</div>
				
			    <span>
			        <strong sec:authentication="principal.name"></strong>님
			    </span>
				
			    <form th:action="@{/logout}" method="post">
			        <button type="submit" class="btn btn-outline-danger btn-sm">
			            로그아웃
			        </button>
			    </form>
			</div>
			
			<!-- TOAST UI Viewer (AI 답변 마크다운 렌더링용) -->
			<link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/toastui-editor-viewer.min.css" />

			<div class="modal fade" id="aiResultModal" tabindex="-1" aria-hidden="true">
			  <div class="modal-dialog modal-dialog-centered modal-lg">
			    <div class="modal-content">
			      <div class="modal-header bg-light">
			        <h5 class="modal-title fw-bold">✨ AI 프로젝트 비서 답변</h5>
			        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			      </div>
			      <div class="modal-body">
			        <div id="aiLoading" class="text-center my-4">
			            <div class="spinner-border text-primary" role="status"></div>
			            <p class="mt-2 text-muted">프로젝트 데이터를 분석 중입니다. 잠시만 기다려주세요...</p>
			        </div>
			        <!-- 본문 (마크다운 → TOAST UI Viewer 렌더) -->
			        <article id="aiAnswerContent" class="wiki-body"
			                 style="display:none; line-height:1.7; font-size:14px;">
			            <div id="aiAnswerViewer"></div>
			            <p id="aiAnswerEmpty" class="wiki-body-empty"
			               style="display:none; color:#888; margin:0;">
			                내용이 없습니다.
			            </p>
			        </article>
			      </div>
			    </div>
			  </div>
			</div>

			<script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-viewer.min.js"></script>

			<script th:inline="javascript">
				document.addEventListener('DOMContentLoaded', function() {
				    const searchBtn = document.getElementById('aiSearchBtn');
				    const searchInput = document.getElementById('aiSearchInput');
				    const modal = new bootstrap.Modal(document.getElementById('aiResultModal'));
				    const loadingDiv = document.getElementById('aiLoading');
				    const contentDiv = document.getElementById('aiAnswerContent');
				    const viewerEl = document.getElementById('aiAnswerViewer');
				    const emptyEl = document.getElementById('aiAnswerEmpty');

				    let aiAnswerViewer = null;

				    function renderAiAnswer(markdown) {
				        if (aiAnswerViewer) {
				            try { aiAnswerViewer.destroy(); } catch (e) {}
				            aiAnswerViewer = null;
				        }
				        viewerEl.innerHTML = '';

				        const md = (markdown || '').toString().trim();
				        if (!md) {
				            viewerEl.style.display = 'none';
				            emptyEl.style.display = 'block';
				            return;
				        }

				        emptyEl.style.display = 'none';
				        viewerEl.style.display = '';

				        if (window.toastui && window.toastui.Editor) {
				            aiAnswerViewer = new toastui.Editor({
				                el: viewerEl,
				                viewer: true,
				                height: 'auto',
				                initialValue: md
				            });
				        } else {
				            viewerEl.style.whiteSpace = 'pre-wrap';
				            viewerEl.textContent = md;
				        }
				    }

				    function executeAiSearch() {
				        const query = searchInput.value.trim();
				        if(!query) {
				            alert('질문을 입력해주세요!');
				            return;
				        }

				        // 모달 열고 로딩 상태로 초기화
				        contentDiv.style.display = 'none';
				        loadingDiv.style.display = 'block';
				        modal.show();

				        csrfFetch('/ai/assistant', {
				            method: 'POST',
				            headers: { 'Content-Type': 'application/json' },
				            body: JSON.stringify({ message: query })
				        })
				        .then(res => {
				            if(!res.ok) throw new Error('AI 응답을 가져오지 못했습니다.');
				            return res.text();
				        })
				        .then(data => {
				            loadingDiv.style.display = 'none';
				            renderAiAnswer(data);
				            contentDiv.style.display = 'block';
				        })
				        .catch(err => {
				            loadingDiv.style.display = 'none';
				            renderAiAnswer('오류가 발생했습니다: ' + err.message);
				            contentDiv.style.display = 'block';
				        });
				    }

				    searchBtn.addEventListener('click', executeAiSearch);
				    searchInput.addEventListener('keypress', function(e) {
				        if(e.key === 'Enter') executeAiSearch();
				    });
				});
			</script>
			<!-- SSE 연결 스크립트 -->
			<script th:inline="javascript">
			document.addEventListener('DOMContentLoaded', function () {
			
				const userId = String(document.getElementById('loginUserId').value);
				if (!userId || userId === "0") return;
			
			    // 비로그인이면 SSE 연결 안 함
			    if (!userId) return;
			
			    const badge       = document.getElementById('notificationBadge');
			    const list        = document.getElementById('notificationList');
			    const emptyNoti   = document.getElementById('emptyNoti');
			    const clearAllBtn = document.getElementById('clearAllBtn');
			
			    let unreadCount = 0;
			
			    function getIcon(message) {
			        if (message.includes('이슈가 등록'))        return '🐛';
			        if (message.includes('이슈 상태가 변경'))   return '🔄';
			        if (message.includes('프로젝트 그룹'))      return '👥';
			        if (message.includes('공지사항'))           return '📢';
			        if (message.includes('프로젝트 진행상태')) return '📊';
			        if (message.includes('회사 일정이 등록'))   return '📅';
			        if (message.includes('1시간 후 일정'))      return '⏰';
			        return '🔔';
			    }
			
			    function addNotification(message) {
			        emptyNoti.style.display = 'none';
			
			        const icon = getIcon(message);
			        const time = new Date().toLocaleTimeString();
			
			        const item = document.createElement('li');
			        item.className = 'dropdown-item border-bottom py-2 px-3';
			        item.style.whiteSpace = 'normal';
			        item.style.cursor = 'default';
			        item.innerHTML = `
			            <div class="d-flex justify-content-between align-items-start">
			                <div>
			                    <span>${icon}</span>
			                    <small class="ms-1">${message}</small>
			                </div>
			                <button class="btn btn-sm btn-link text-muted p-0 ms-2 delete-btn" 
			                        style="font-size:12px; flex-shrink:0;">✕</button>
			            </div>
			            <div class="text-muted mt-1" style="font-size:11px;">${time}</div>
			        `;
			
			        item.querySelector('.delete-btn').addEventListener('click', function () {
			            item.remove();
			            unreadCount = Math.max(0, unreadCount - 1);
			            updateBadge();
			            checkEmpty();
			        });
			
			        list.prepend(item);
			        unreadCount++;
			        updateBadge();
			
			        if (Notification.permission === 'granted') {
			            new Notification(`${icon} 회사 알림`, { body: message });
			        }
			    }
			
			    function updateBadge() {
			        if (unreadCount > 0) {
			            badge.style.display = 'block';
			            badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
			        } else {
			            badge.style.display = 'none';
			        }
			    }
			
			    function checkEmpty() {
			        const items = list.querySelectorAll('.dropdown-item');
			        if (items.length === 0) {
			            emptyNoti.style.display = 'block';
			        }
			    }
			
			    clearAllBtn.addEventListener('click', function () {
			        list.querySelectorAll('.dropdown-item').forEach(item => item.remove());
			        unreadCount = 0;
			        updateBadge();
			        checkEmpty();
			    });
			
			    document.getElementById('notificationBtn').addEventListener('click', function () {
			        unreadCount = 0;
			        updateBadge();
			    });
			
			    if (Notification.permission === 'default') {
			        Notification.requestPermission();
			    }
			
			    // SSE 연결
			    let sseClosing = false;
			    const eventSource = new EventSource(
			        `/api/notifications/subscribe?userId=${encodeURIComponent(userId)}`
			    );
			
			    eventSource.addEventListener('notification', function (event) {
			        addNotification(event.data);
			    });
			
			    eventSource.onerror = function () {
			        if (sseClosing) return;
			        console.warn('SSE 연결이 끊겼습니다. 재연결 시도 중...');
			    };
			
			    function closeEventSource() {
			        sseClosing = true;
			        if (eventSource.readyState !== EventSource.CLOSED) {
			            eventSource.close();
			        }
			    }
			
			    window.addEventListener('pagehide', closeEventSource);
			    window.addEventListener('beforeunload', closeEventSource);
			});
			</script>
		</div>
	</div>
</nav>

</body>
</html>
